<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Carrom</title>
<style>
  /* Page fills the phone screen: scores on top, board in the middle, buttons at the bottom */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1220;
    background: radial-gradient(circle at 50% 35%, #16223f 0%, #0b1220 70%);
    color: #ffffff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 10px 10px 12px;
    gap: 8px;
  }

  /* Top bar: points for each side (pill cards), whose turn it is, and the sound button */
  #top { display: flex; align-items: center; justify-content: space-between; gap: 6px; height: 40px; }
  .side {
    display: flex; align-items: center; gap: 8px;
    font-size: 18px; font-weight: 700; min-width: 64px; height: 36px;
    padding: 0 12px 0 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.10);
    font-variant-numeric: tabular-nums;          /* numbers keep the same width when they change */
    transition: border-color 0.2s, background 0.2s;
  }
  .side.right { justify-content: flex-end; padding: 0 8px 0 12px; }
  /* The pill of the side whose turn it is lights up */
  .side.active { border-color: #5eead4; background: rgba(94,234,212,0.14); box-shadow: 0 0 10px rgba(94,234,212,0.35); }
  .dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.5); flex: none; }
  .dot.white { background: radial-gradient(circle at 35% 30%, #ffffff, #e9dfc8 60%, #b8ad96); }
  .dot.black { background: radial-gradient(circle at 35% 30%, #6a6a6a, #2b2b2b 60%, #111111); }
  .dot.red   { background: radial-gradient(circle at 35% 30%, #ff9aa8, #d6455d 60%, #8e2237); }
  #status {
    font-size: 13px; line-height: 1.25; color: rgba(255,255,255,0.9); text-align: center; flex: 1;
    max-height: 40px; overflow: hidden; min-width: 0;
  }
  /* Small phones: smaller words so a long message still fits between the pills */
  @media (max-width: 360px) { #status { font-size: 11px; line-height: 1.2; } }
  /* Sound on/off button (top corner, far away from the striker and the finger strip) */
  #sound {
    width: 38px; height: 38px; flex: none;
    border: 0; border-radius: 10px;
    background: rgba(255,255,255,0.10);
    color: #fff; font-size: 18px; line-height: 1; padding: 0;
    touch-action: manipulation;
    position: relative; z-index: 3;              /* stays on top of the start and result screens */
  }
  #sound.off { opacity: .45; }

  #stage { flex: 1; min-height: 0; }
  #game { display: block; width: 100%; height: 100%; }

  #controls { display: flex; gap: 10px; }
  #controls button, #modes button {
    flex: 1;
    height: 46px;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;
    background: linear-gradient(#24325a, #1a2440);
    color: #ffffff;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    box-shadow: 0 2px 0 rgba(0,0,0,0.35);
    touch-action: manipulation;
  }
  #controls button:active, #modes button:active { background: #2c3a60; transform: translateY(1px); }

  /* Start screen and result screen */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: radial-gradient(circle at 50% 30%, rgba(26,40,74,0.96), rgba(11,18,32,0.96) 70%);
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 32px; letter-spacing: 0.5px; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  #overlay.win h1  { color: #ffd76a; animation: pop 0.5s ease-out; }
  #overlay.lose h1 { color: #b9c4dc; }
  #overlay p  { margin: 0 0 6px; font-size: 16px; color: rgba(255,255,255,0.8); max-width: 320px; }
  /* Three little coins above the title (decoration only) */
  #logo { display: flex; gap: 8px; }
  #logo .dot { width: 30px; height: 30px; border-width: 3px; box-shadow: 0 3px 5px rgba(0,0,0,0.45); }
  #modes { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  #modes button { flex: none; height: 54px; font-size: 16px; }
  #modes button.main { background: linear-gradient(#34896f, #256452); }
  @keyframes pop { 0% { transform: scale(0.6); } 60% { transform: scale(1.12); } 100% { transform: scale(1); } }

  /* See-through layer on top of everything, only used for the winning confetti */
  #confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="side" id="pillW"><span class="dot white"></span><span id="scoreW">0</span></div>
    <div id="status">Carrom</div>
    <div class="side right" id="pillB"><span id="scoreB">0</span><span class="dot black"></span></div>
    <button id="sound" aria-label="Sound on or off"></button>
  </div>

  <div id="stage"><canvas id="game"></canvas></div>

  <div id="controls">
    <button id="btnNew">New game</button>
    <button id="btnMode">Change mode</button>
  </div>

  <div id="overlay">
    <div id="logo"><span class="dot white"></span><span class="dot red"></span><span class="dot black"></span></div>
    <h1 id="msgTitle">Carrom</h1>
    <p id="msgLine">You are white. Pocket your coins before the other side does.</p>
    <div id="modes">
      <button data-mode="easy" class="main">Computer: Easy</button>
      <button data-mode="medium">Computer: Medium</button>
      <button data-mode="hard">Computer: Hard</button>
      <button data-mode="two">2 players, one phone</button>
    </div>
  </div>

  <canvas id="confetti"></canvas>
</div>

<script>
// =====================================================
// CARROM - flick the striker to pocket your coins
// You are white and shoot from the bottom line. The other side is black and shoots from the top.
//
// How to shoot:
//   1. Slide in the strip under the board to move the striker along your line.
//   2. Touch the board, pull your finger BACK (away from where you want to shoot), and let go.
//      The arrow shows the direction and strength of the shot.
//
// Rules used in this version (simplified):
// - Every coin is worth 1 point to its own colour, whoever pockets it.
// - The red queen is worth 3 points to the side that pockets it.
// - Pocket one of your own coins (or the queen) and you shoot again.
// - If the striker goes into a pocket, that is a foul: one of your coins comes back to the board.
// - The game ends when all coins of one colour are pocketed. Most points wins.
//
// Looks and sound:
// - The board, the coins and the striker are painted once into hidden canvases ("sprites") and then
//   stamped onto the screen every frame. That keeps the game fast on cheap phones.
// - All sounds are made by code. The speaker button in the top corner turns them on or off.
// =====================================================

// ---------- Settings (change these to experiment) ----------
const BOARD = 600;               // size of the playing surface in game units
const FRAME = 24;                // width of the wooden frame around it
const STRIP = 110;               // height of the finger strip under the board
const COIN_R = 13, STRIKER_R = 18, POCKET_R = 27;
const POCKET_IN = 23;            // how far the pocket centres are from the corner
const BASE_Y = { W: BOARD - 95, B: 95 };     // the line each side shoots from
const BASE_X1 = 150, BASE_X2 = 450;          // how far along the line the striker may go
const MAX_PULL = 150;            // pull length for a full-power shot (game units)
const MAX_SPEED = 1500;          // striker speed at full power
const FRICTION = 520;            // how quickly pieces slow down
const WALL_BOUNCE = 0.75;        // speed kept after hitting the frame
const COIN_BOUNCE = 0.92;        // speed kept when pieces hit each other
const STRIKER_MASS = 2;          // the striker is heavier than a coin (coin = 1)
const QUEEN_POINTS = 3;
// How accurately the computer aims: smaller = better
const AI_ERROR = { easy: 0.07, medium: 0.035, hard: 0.012 };
// Looks and sound (these do not change how the game plays)
const SOUND_VOLUME = 0.25;       // 0 = silent, 1 = very loud
const MAX_PARTICLES = 150;       // most dust specks / confetti pieces alive at one time
const SINK_TIME = 0.25;          // seconds a coin takes to shrink into a pocket
const HARD_HIT = 450;            // hit speed that makes dust fly
const SHAKE_HIT = 900;           // hit speed that shakes the screen a little
const SHAKE_SIZE = 3;            // how far the screen shakes (screen pixels)
const SHAKE_TIME = 0.14;         // how long the screen shakes (seconds)
const SPRITE_PAD = 8;            // empty room around a coin picture, for its shadow

const POCKETS = [
  { x: POCKET_IN, y: POCKET_IN }, { x: BOARD - POCKET_IN, y: POCKET_IN },
  { x: POCKET_IN, y: BOARD - POCKET_IN }, { x: BOARD - POCKET_IN, y: BOARD - POCKET_IN }
];

// ---------- Page elements ----------
const stage   = document.getElementById('stage');
const canvas  = document.getElementById('game');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const msgTitle = document.getElementById('msgTitle');
const msgLine  = document.getElementById('msgLine');
const elStatus = document.getElementById('status');
const elW = document.getElementById('scoreW');
const elB = document.getElementById('scoreB');
const pillW = document.getElementById('pillW');
const pillB = document.getElementById('pillB');
const app   = document.getElementById('app');
const confettiCanvas = document.getElementById('confetti');
const confettiCtx    = confettiCanvas.getContext('2d');

// ---------- Game state ----------
let mode = 'easy';               // 'easy' | 'medium' | 'hard' | 'two'
let coins = [];                  // pieces on the board: { kind: 'W' | 'B' | 'Q', x, y, vx, vy, r, mass }
let striker = null;              // { x, y, vx, vy, r, mass, on } (on = false after it was pocketed)
let turn = 'W';                  // whose shot it is: 'W' (white, bottom) or 'B' (black, top)
let phase = 'aim';               // 'aim' | 'moving' | 'think' | 'over'
let points = { W: 0, B: 0 };
let pocketedOwn = { W: 0, B: 0 };  // coins of each colour that are in the pockets
let shotLog = [];                // what went into the pockets during the current shot
let note = '';                   // short message shown after a shot
let pull = null;                 // aiming: { x, y } pull vector in game units
let pullStart = null;
let thinkTimer = 0, aiShot = null;
let playing = false;

// Screen fitting
let dpr = 1, scale = 1, offX = 0, offY = 0, screenW = 0, screenH = 0;
const WORLD_W = BOARD + FRAME * 2, WORLD_H = BOARD + FRAME * 2 + STRIP;

// ---------- Sound ----------
// All sounds are made by code (short notes), so there are no sound files to upload.
// Phones only allow sound after a touch, so the sound engine starts on the first touch.
// The on/off choice is remembered, and is shared by all the games on this site.
const btnSound = document.getElementById('sound');
let audio = null;                // the sound engine (created on first touch)
let muted = false;
try { muted = localStorage.getItem('gamesMuted') === '1'; } catch (e) { /* storage blocked: start with sound on */ }

function showSoundButton() {
  btnSound.textContent = muted ? '\u{1F507}' : '\u{1F50A}';      // speaker off / speaker on
  btnSound.classList.toggle('off', muted);
}
showSoundButton();

function startAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }                                  // no sound support: the game still works
}
// Different phones accept different kinds of touch for this, so listen for all of them
for (const type of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(type, startAudio, true);
}

// Play one note.
//   freq  = pitch in Hz (higher number = higher note)
//   dur   = length in seconds
//   type  = 'sine' (soft), 'triangle' (round), 'square' (retro), 'sawtooth' (buzzy)
//   delay = seconds to wait before it starts (used to build little tunes)
//   slide = pitch to glide to by the end (optional)
//   volume = 0 to 1, share of SOUND_VOLUME
function beep(freq, dur, type = 'sine', delay = 0, slide = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(SOUND_VOLUME * volume, t + 0.01);   // quick fade in (no click)
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);                   // fade out
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// Play a burst of hiss (for explosions, crashes, whooshes).
//   dur = length in seconds, tone = how bright it is in Hz (300 = deep boom, 4000 = sharp crack)
let noiseBuffer = null;
function noise(dur, tone = 1000, delay = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  if (!noiseBuffer) {                                            // one second of random hiss, made once
    noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const t = audio.currentTime + delay;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = noiseBuffer;
  src.loop = true;
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(tone, t);
  filter.frequency.exponentialRampToValueAtTime(Math.max(60, tone * 0.25), t + dur);
  gain.gain.setValueAtTime(SOUND_VOLUME * volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

// Short buzz on Android phones (iPhone does not allow this from a web page)
function buzz(ms) {
  if (!muted && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

btnSound.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('gamesMuted', muted ? '1' : '0'); } catch (e) {}
  showSoundButton();
  startAudio();
  if (!muted) setTimeout(() => beep(740, 0.05, 'sine', 0, 0, 0.6), 60);   // small note to confirm sound is on
});

// A break shot makes many hits in the same instant. This helper stops them all sounding at once:
// it remembers when a sound was last played and says "yes" at most `most` times in any 60 ms.
function notTooMany(times, most) {
  const now = performance.now();
  while (times.length > 0 && now - times[0] > 60) times.shift();     // forget plays older than 60 ms
  if (times.length >= most) return false;
  times.push(now);
  return true;
}
const clackTimes = [], wallTimes = [], pocketTimes = [];

// The game's own sounds, one per event
const sfx = {
  // A button was pressed
  tap() { beep(520, 0.05, 'sine', 0, 0, 0.4); },
  // The striker is flicked: a click and a short hiss, louder with more power (power = 0 to 1)
  shot(power) {
    const loud = 0.35 + 0.65 * power;
    beep(900, 0.04, 'square', 0, 500, 0.35 * loud);
    noise(0.06 + 0.05 * power, 2500, 0, 0.7 * loud);
  },
  // Two pieces knock together: a wooden "clack" (strength = 0 to 1). At most 3 per 60 ms.
  clack(strength) {
    if (!notTooMany(clackTimes, 3)) return;
    const loud = 0.12 + 0.4 * strength;
    noise(0.03, 5000, 0, loud);
    beep(1100 + Math.random() * 250, 0.045, 'triangle', 0, 800, loud);
  },
  // A piece bounces off the frame: a softer, lower thud
  wall(strength) {
    if (!notTooMany(wallTimes, 2)) return;
    const loud = 0.1 + 0.3 * strength;
    noise(0.05, 500, 0, loud);
    beep(170, 0.07, 'sine', 0, 110, loud);
  },
  // A coin drops into a pocket: hollow drop, then a pleasant note
  pocket() {
    if (!notTooMany(pocketTimes, 1)) return;
    beep(330, 0.16, 'sine', 0, 120, 0.7);
    noise(0.08, 700, 0, 0.4);
    beep(784, 0.16, 'triangle', 0.09, 0, 0.45);
  },
  // The red queen drops: a special little chime
  queen() {
    beep(330, 0.16, 'sine', 0, 120, 0.6);
    beep(784, 0.14, 'sine', 0.06, 0, 0.6);
    beep(988, 0.14, 'sine', 0.16, 0, 0.6);
    beep(1175, 0.14, 'sine', 0.26, 0, 0.6);
    beep(1568, 0.35, 'sine', 0.36, 0, 0.55);
  },
  // The striker itself drops into a pocket: just the hollow drop
  strikerIn() {
    beep(260, 0.2, 'sine', 0, 90, 0.7);
    noise(0.1, 600, 0, 0.4);
  },
  // Foul: two low notes going down
  foul() {
    beep(220, 0.16, 'triangle', 0, 0, 0.6);
    beep(165, 0.26, 'triangle', 0.17, 0, 0.6);
  },
  // The turn passes to the other side: very soft
  turn() { beep(600, 0.07, 'sine', 0, 0, 0.18); },
  // Winning tune: short and rising
  win() {
    beep(523, 0.12, 'triangle', 0, 0, 0.7);
    beep(659, 0.12, 'triangle', 0.12, 0, 0.7);
    beep(784, 0.12, 'triangle', 0.24, 0, 0.7);
    beep(1047, 0.3, 'triangle', 0.36, 0, 0.7);
    beep(1319, 0.35, 'sine', 0.5, 0, 0.4);
  },
  // Losing tune: short and falling
  lose() {
    beep(392, 0.16, 'triangle', 0, 0, 0.6);
    beep(330, 0.16, 'triangle', 0.17, 0, 0.6);
    beep(262, 0.16, 'triangle', 0.34, 0, 0.6);
    beep(196, 0.4, 'triangle', 0.51, 0, 0.6);
  }
};

// ---------- Effects (looks only: nothing here changes the rules or the physics) ----------
let particles = [];              // dust specks: { x, y, vx, vy, life, maxLife, size, colour }
let sinkers = [];                // pieces shrinking into a pocket: { kind, x, y, px, py, t }
let floaters = [];               // floating words like "+1": { text, x, y, life, colour }
let confetti = [];               // winning confetti (screen pixels): { x, y, vx, vy, w, h, spin, colour, life }
let shakeLeft = 0;               // seconds of screen shake still to go
let clock = 0;                   // seconds since the page opened (used for gentle pulsing)

function clearEffects() {
  particles = [];
  sinkers = [];
  floaters = [];
  confetti = [];
  shakeLeft = 0;
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
}

// Throw a few specks out from a point
function addDust(x, y, count, speed, colour) {
  for (let i = 0; i < count; i++) {
    if (particles.length >= MAX_PARTICLES) return;
    const angle = Math.random() * Math.PI * 2;
    const v = speed * (0.3 + Math.random() * 0.7);
    const life = 0.25 + Math.random() * 0.25;
    particles.push({ x, y, vx: Math.cos(angle) * v, vy: Math.sin(angle) * v, life, maxLife: life, size: 2 + Math.random() * 3, colour });
  }
}

// Called by the physics when two pieces knock together. hitSpeed = how fast they came together.
function pieceHit(x, y, hitSpeed) {
  if (hitSpeed < 20) return;                               // barely touching: stay quiet
  sfx.clack(Math.min(1, hitSpeed / 1000));
  if (hitSpeed > HARD_HIT) addDust(x, y, 5, 60 + hitSpeed * 0.08, Math.random() < 0.5 ? '#fff6dc' : '#c9a25e');
  if (hitSpeed > SHAKE_HIT) { shakeLeft = SHAKE_TIME; buzz(10); }
}

// Called by the physics when a piece bounces off the frame
function wallHit(speed) {
  if (speed < 30) return;
  sfx.wall(Math.min(1, speed / 1000));
}

// Called by the physics when a piece falls into a pocket. kind = 'W', 'B', 'Q' or 'S' (striker).
function piecePocketed(piece, kind) {
  // Find which pocket it fell into (the nearest one)
  let pocket = POCKETS[0];
  for (const pk of POCKETS) {
    if (Math.hypot(piece.x - pk.x, piece.y - pk.y) < Math.hypot(piece.x - pocket.x, piece.y - pocket.y)) pocket = pk;
  }
  sinkers.push({ kind, x: piece.x, y: piece.y, px: pocket.x, py: pocket.y, t: 0 });
  addDust(pocket.x, pocket.y, 6, 70, kind === 'Q' ? '#ff9aa8' : '#fff6dc');

  // Floating words, moved a little towards the middle so they are not cut off by the frame
  const tx = pocket.x < BOARD / 2 ? pocket.x + 40 : pocket.x - 40;
  const ty = pocket.y < BOARD / 2 ? pocket.y + 50 : pocket.y - 30;
  if (kind === 'S') {
    floaters.push({ text: 'Foul!', x: tx, y: ty, life: 1, colour: '#ff6b6b' });
    sfx.strikerIn();
  } else if (kind === 'Q') {
    floaters.push({ text: '+' + QUEEN_POINTS, x: tx, y: ty, life: 1.2, colour: '#ffd76a' });
    sfx.queen();
    buzz(30);
  } else {
    floaters.push({ text: '+1', x: tx, y: ty, life: 1, colour: kind === 'W' ? '#ffffff' : '#1a1a1a' });
    sfx.pocket();
    buzz(12);
  }
}

// Start the winning confetti (falls from the top of the screen)
function throwConfetti() {
  const colours = ['#ffd76a', '#5eead4', '#ff6b8a', '#8fd0ff', '#b9f27c', '#ffffff'];
  const w = app.clientWidth;
  for (let i = 0; i < 110; i++) {
    confetti.push({
      x: Math.random() * w, y: -20 - Math.random() * 260,
      vx: (Math.random() - 0.5) * 80, vy: 90 + Math.random() * 140,
      w: 6 + Math.random() * 6, h: 8 + Math.random() * 8,
      spin: Math.random() * 6, colour: colours[i % colours.length], life: 5
    });
  }
}

// Move all the effects forward by dt seconds
function updateEffects(dt) {
  clock += dt;
  if (shakeLeft > 0) shakeLeft -= dt;

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vx *= 0.92;                                           // dust slows down quickly
    p.vy *= 0.92;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const s of sinkers) s.t += dt;
  sinkers = sinkers.filter(s => s.t < SINK_TIME);

  for (const f of floaters) { f.y -= 28 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);

  for (const c of confetti) {
    c.x += c.vx * dt;
    c.y += c.vy * dt;
    c.spin += 7 * dt;
    c.life -= dt;
  }
  confetti = confetti.filter(c => c.life > 0 && c.y < app.clientHeight + 30);
}

// ---------- Setting up ----------
function makeCoin(kind, x, y) {
  return { kind, x, y, vx: 0, vy: 0, r: COIN_R, mass: 1 };
}

function setUpBoard() {
  coins = [];
  const c = BOARD / 2;
  coins.push(makeCoin('Q', c, c));
  // Inner ring of 6 and outer ring of 12, colours alternating
  const d1 = COIN_R * 2 + 1;
  for (let i = 0; i < 6; i++) {
    const a = Math.PI / 3 * i + Math.PI / 6;
    coins.push(makeCoin(i % 2 ? 'B' : 'W', c + Math.cos(a) * d1, c + Math.sin(a) * d1));
  }
  for (let i = 0; i < 12; i++) {
    const a = Math.PI / 6 * i + Math.PI / 6;
    const d = i % 2 ? d1 * 1.75 : d1 * 2;       // the 12 outer coins sit in a hexagon shape
    coins.push(makeCoin(i % 2 ? 'B' : 'W', c + Math.cos(a) * d, c + Math.sin(a) * d));
  }
}

function startGame(newMode) {
  if (newMode) mode = newMode;
  setUpBoard();
  points = { W: 0, B: 0 };
  pocketedOwn = { W: 0, B: 0 };
  turn = 'W';
  note = '';
  playing = true;
  clearEffects();                  // no left-over sparks or confetti from the last game
  overlay.classList.add('hidden');
  overlay.classList.remove('win', 'lose');
  beginTurn();
}

// Put the striker on the shooter's line, ready to aim
function beginTurn() {
  striker = { x: BOARD / 2, y: BASE_Y[turn], vx: 0, vy: 0, r: STRIKER_R, mass: STRIKER_MASS, on: true };
  nudgeStrikerClear();
  pull = null;
  pullStart = null;
  if (mode !== 'two' && turn === 'B') {
    phase = 'think';
    thinkTimer = 0.9;
    aiShot = null;
  } else {
    phase = 'aim';
  }
  updateHud();
}

// True if the striker is not sitting on top of a coin
function strikerClear(x) {
  return coins.every(c => Math.hypot(c.x - x, c.y - BASE_Y[turn]) >= c.r + STRIKER_R + 1);
}
// If the middle of the line is blocked, start at the nearest free spot
function nudgeStrikerClear() {
  if (strikerClear(striker.x)) return;
  for (let d = 5; d <= 150; d += 5) {
    for (const x of [BOARD / 2 - d, BOARD / 2 + d]) {
      if (x >= BASE_X1 && x <= BASE_X2 && strikerClear(x)) { striker.x = x; return; }
    }
  }
}

function countOnBoard(kind) { return coins.filter(c => c.kind === kind).length; }

function updateHud() {
  elW.textContent = points.W;
  elB.textContent = points.B;
  // Light up the score pill of the side whose turn it is
  pillW.classList.toggle('active', playing && turn === 'W');
  pillB.classList.toggle('active', playing && turn === 'B');
  if (!playing) return;
  let text;
  if (phase === 'moving') text = '';
  else if (mode === 'two') text = (turn === 'W' ? 'White' : 'Black') + ' to shoot';
  else text = turn === 'W' ? 'Your shot' : 'Computer is aiming';
  elStatus.textContent = note ? note + (text ? ' · ' + text : '') : text;
}

// ---------- Shooting ----------
function shoot(dirX, dirY, power) {
  const len = Math.hypot(dirX, dirY) || 1;
  striker.vx = dirX / len * MAX_SPEED * power;
  striker.vy = dirY / len * MAX_SPEED * power;
  shotLog = [];
  note = '';
  phase = 'moving';
  pull = null;
  sfx.shot(power);                 // click of the flick, louder for a harder shot
  updateHud();
}

// ---------- Physics ----------
function allPieces() { return striker && striker.on ? coins.concat(striker) : coins; }

// Move everything forward by a small step
function step(dt) {
  const pieces = allPieces();

  for (const p of pieces) {
    const speed = Math.hypot(p.vx, p.vy);
    if (speed > 0) {
      // Friction slows the piece down at a steady rate
      const slower = Math.max(0, speed - FRICTION * dt);
      p.vx *= slower / speed;
      p.vy *= slower / speed;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }
  }

  // Pieces hitting each other
  for (let i = 0; i < pieces.length; i++) {
    for (let j = i + 1; j < pieces.length; j++) {
      const a = pieces[i], b = pieces[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy), minDist = a.r + b.r;
      if (dist >= minDist || dist === 0) continue;
      const nx = dx / dist, ny = dy / dist;
      // Push them apart so they do not overlap (the lighter piece moves more)
      const overlap = minDist - dist, total = a.mass + b.mass;
      a.x -= nx * overlap * (b.mass / total); a.y -= ny * overlap * (b.mass / total);
      b.x += nx * overlap * (a.mass / total); b.y += ny * overlap * (a.mass / total);
      // Exchange speed along the line between their centres
      const closing = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
      if (closing <= 0) continue;
      pieceHit(a.x + nx * a.r, a.y + ny * a.r, closing);       // sound and dust (does not change the physics)
      const impulse = (1 + COIN_BOUNCE) * closing / (1 / a.mass + 1 / b.mass);
      a.vx -= impulse / a.mass * nx; a.vy -= impulse / a.mass * ny;
      b.vx += impulse / b.mass * nx; b.vy += impulse / b.mass * ny;
    }
  }

  for (const p of pieces) {
    // Into a pocket?
    for (const pk of POCKETS) {
      if (Math.hypot(p.x - pk.x, p.y - pk.y) < POCKET_R) { p.pocketed = true; break; }
    }
    if (p.pocketed) continue;
    // Bounce off the frame
    // (wallHit only makes the thud sound; it is called with the speed just before the bounce)
    if (p.x < p.r) { wallHit(Math.abs(p.vx)); p.x = p.r; p.vx = Math.abs(p.vx) * WALL_BOUNCE; }
    if (p.x > BOARD - p.r) { wallHit(Math.abs(p.vx)); p.x = BOARD - p.r; p.vx = -Math.abs(p.vx) * WALL_BOUNCE; }
    if (p.y < p.r) { wallHit(Math.abs(p.vy)); p.y = p.r; p.vy = Math.abs(p.vy) * WALL_BOUNCE; }
    if (p.y > BOARD - p.r) { wallHit(Math.abs(p.vy)); p.y = BOARD - p.r; p.vy = -Math.abs(p.vy) * WALL_BOUNCE; }
  }

  // Take pocketed pieces off the board
  if (striker.on && striker.pocketed) { striker.on = false; shotLog.push('S'); piecePocketed(striker, 'S'); }
  for (const c of coins) if (c.pocketed) { shotLog.push(c.kind); piecePocketed(c, c.kind); }
  coins = coins.filter(c => !c.pocketed);
}

function anythingMoving() {
  return allPieces().some(p => Math.hypot(p.vx, p.vy) > 0);
}

// ---------- Rules: what happens after a shot ----------
function endShot() {
  const me = turn, other = turn === 'W' ? 'B' : 'W';
  let again = false;
  const parts = [];

  for (const k of shotLog) {
    if (k === 'W' || k === 'B') {
      points[k]++;
      pocketedOwn[k]++;
      if (k === me) again = true;
    } else if (k === 'Q') {
      points[me] += QUEEN_POINTS;
      again = true;
      parts.push('Queen! +' + QUEEN_POINTS);
    }
  }

  if (shotLog.includes('S')) {
    // Foul: the striker went in. One of the shooter's coins comes back, and the turn passes.
    again = false;
    sfx.foul();
    buzz(30);
    if (pocketedOwn[me] > 0) {
      pocketedOwn[me]--;
      points[me]--;
      returnCoin(me);
      parts.push('Foul: a coin comes back');
    } else {
      parts.push('Foul');
    }
  }
  note = parts.join(', ');

  // Game over when one colour is completely pocketed
  if (countOnBoard('W') === 0 || countOnBoard('B') === 0) { finishGame(); return; }

  if (!again) {
    turn = other;
    if (!shotLog.includes('S')) sfx.turn();      // very soft note: the other side shoots now
  }
  beginTurn();
}

// Put a coin back near the centre of the board, in a free spot
function returnCoin(kind) {
  const c = BOARD / 2;
  for (let d = 0; d < 200; d += 6) {
    for (let a = 0; a < Math.PI * 2; a += Math.PI / 6) {
      const x = c + Math.cos(a) * d, y = c + Math.sin(a) * d;
      if (coins.every(o => Math.hypot(o.x - x, o.y - y) >= COIN_R * 2 + 1)) {
        coins.push(makeCoin(kind, x, y));
        return;
      }
    }
  }
}

function finishGame() {
  playing = false;
  phase = 'over';
  // Most points wins; on a tie, the side that cleared its coins wins
  let winner;
  if (points.W !== points.B) winner = points.W > points.B ? 'W' : 'B';
  else winner = countOnBoard('W') === 0 ? 'W' : 'B';

  if (mode === 'two') msgTitle.textContent = (winner === 'W' ? 'White' : 'Black') + ' wins!';
  else msgTitle.textContent = winner === 'W' ? 'You win!' : 'Computer wins';
  msgLine.textContent = 'White ' + points.W + '  ·  Black ' + points.B + '.  Play again?';
  elW.textContent = points.W;
  elB.textContent = points.B;
  elStatus.textContent = 'Game over';
  updateHud();                                   // switches off the "whose turn" highlight
  // A happy ending unless the computer won
  const happy = mode === 'two' || winner === 'W';
  setTimeout(() => {
    if (phase !== 'over') return;                // a new game was started in the meantime
    overlay.classList.toggle('win', happy);
    overlay.classList.toggle('lose', !happy);
    overlay.classList.remove('hidden');
    if (happy) { sfx.win(); throwConfetti(); buzz(40); }
    else sfx.lose();
  }, 900);
}

// ---------- Computer player ----------
// Shortest distance from point (px, py) to the line from (ax, ay) to (bx, by)
function distToLine(px, py, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy || 1;
  const t = Math.max(0, Math.min(1, ((px - ax) * dx + (py - ay) * dy) / len2));
  return Math.hypot(px - (ax + dx * t), py - (ay + dy * t));
}

// Choose where to put the striker, which way to shoot and how hard
function planShot(side, error) {
  const y = BASE_Y[side];
  let best = null;

  for (const coin of coins) {
    if (coin.kind !== side && coin.kind !== 'Q') continue;
    for (const pk of POCKETS) {
      // Direction the coin must travel to reach the pocket
      const toPocket = Math.hypot(pk.x - coin.x, pk.y - coin.y);
      const ux = (pk.x - coin.x) / toPocket, uy = (pk.y - coin.y) / toPocket;
      // Nothing may be in the coin's way
      if (coins.some(o => o !== coin && distToLine(o.x, o.y, coin.x, coin.y, pk.x, pk.y) < COIN_R * 2)) continue;
      // Where the striker's centre must be at the moment it hits the coin
      const gx = coin.x - ux * (STRIKER_R + COIN_R), gy = coin.y - uy * (STRIKER_R + COIN_R);

      for (let x = BASE_X1; x <= BASE_X2; x += 15) {
        if (!coins.every(o => Math.hypot(o.x - x, o.y - y) >= o.r + STRIKER_R + 1)) continue;
        const dx = gx - x, dy = gy - y, dist = Math.hypot(dx, dy);
        if (dist < 5) continue;
        const straight = (dx * ux + dy * uy) / dist;        // 1 = a dead-straight shot
        if (straight < 0.35) continue;
        // Nothing may be in the striker's way
        if (coins.some(o => o !== coin && distToLine(o.x, o.y, x, y, gx, gy) < STRIKER_R + COIN_R)) continue;

        const value = straight * 2 - dist / 900 - toPocket / 700 + (coin.kind === 'Q' ? 0.3 : 0);
        if (!best || value > best.value) {
          const speed = Math.min(MAX_SPEED, (560 + dist * 0.75 + toPocket * 1.5) / Math.max(0.5, straight));
          best = { value, x, dx, dy, power: speed / MAX_SPEED };
        }
      }
    }
  }

  if (!best) {
    // No clean shot: hit the nearest own coin and hope
    let target = null, td = Infinity;
    for (const coin of coins) {
      if (coin.kind !== side) continue;
      const d = Math.hypot(coin.x - BOARD / 2, coin.y - y);
      if (d < td) { td = d; target = coin; }
    }
    let x = BOARD / 2;
    for (let d = 0; d <= 150; d += 15) {
      const free = [BOARD / 2 - d, BOARD / 2 + d].find(px => coins.every(o => Math.hypot(o.x - px, o.y - y) >= o.r + STRIKER_R + 1));
      if (free !== undefined) { x = free; break; }
    }
    target = target || { x: BOARD / 2, y: BOARD / 2 };
    best = { x, dx: target.x - x, dy: target.y - y, power: 0.6 };
  }

  // Add a little aiming error (bigger on easier levels)
  const wobble = (Math.random() + Math.random() + Math.random() - 1.5) * 2 * error;
  const ang = Math.atan2(best.dy, best.dx) + wobble;
  return { x: best.x, dirX: Math.cos(ang), dirY: Math.sin(ang), power: Math.max(0.25, Math.min(1, best.power)) };
}

// ---------- Update: move the whole game forward by dt seconds ----------
function update(dt) {
  if (!playing) return;

  if (phase === 'think') {
    thinkTimer -= dt;
    // Halfway through: place the striker and show the aim; at the end: shoot
    if (!aiShot && thinkTimer < 0.5) {
      aiShot = planShot('B', AI_ERROR[mode]);
      striker.x = aiShot.x;
    }
    if (thinkTimer <= 0) shoot(aiShot.dirX, aiShot.dirY, aiShot.power);
    return;
  }

  if (phase === 'moving') {
    // Many small steps per frame, so fast pieces cannot jump through each other
    const steps = Math.max(1, Math.ceil(dt / (1 / 240)));
    for (let i = 0; i < steps; i++) step(dt / steps);
    if (!anythingMoving()) endShot();
  }
}

// ---------- Pictures made once (sprites) ----------
// Painting wood grain, gradients and soft shadows is slow, so it is done ONCE into hidden canvases.
// Every frame the game just stamps these ready-made pictures onto the screen with drawImage.
// They are rebuilt whenever the screen size changes, so they always stay sharp.
let boardArt = null;             // the whole board with its frame, plus the finger strip under it
let sprites = {};                // coin pictures: W, B, Q, S (striker), X (blocked striker), K (strip knob)

function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.ceil(w));
  c.height = Math.max(1, Math.ceil(h));
  return c;
}

// A simple "dice" that always gives the same numbers in the same order,
// so the wood grain looks the same every time the board is rebuilt
let seed = 1;
function grainRandom() {
  seed = (seed * 16807) % 2147483647;
  return seed / 2147483647;
}

// Path for a box with rounded corners (works on old phones too)
function roundBox(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}

// Wavy thin lines across a box: this is the wood grain
function paintGrain(g, x, y, w, h, lines, colour) {
  g.strokeStyle = colour;
  for (let i = 0; i < lines; i++) {
    const ly = y + grainRandom() * h;
    const wave = 1 + grainRandom() * 3, shift = grainRandom() * 6;
    g.globalAlpha = 0.04 + grainRandom() * 0.09;
    g.lineWidth = 0.5 + grainRandom() * 1.3;
    g.beginPath();
    for (let lx = x; lx <= x + w; lx += 20) {
      const yy = ly + Math.sin(lx / 70 + shift) * wave;
      if (lx === x) g.moveTo(lx, yy); else g.lineTo(lx, yy);
    }
    g.stroke();
  }
  g.globalAlpha = 1;
}

// One of the four shooting lines: two lines with a red circle at each end.
// (Only the top and bottom ones are used for shooting; the side ones are decoration, as on a real board.)
function paintBaseLine(g, x1, y1, x2, y2, strong) {
  const sideways = y1 === y2;                               // true for the top and bottom lines
  g.strokeStyle = '#5b3520';
  g.globalAlpha = strong ? 1 : 0.55;
  for (const off of [-14, 14]) {
    g.lineWidth = off < 0 ? 2.4 : 1.2;
    g.beginPath();
    if (sideways) { g.moveTo(x1, y1 + off); g.lineTo(x2, y2 + off); }
    else          { g.moveTo(x1 + off, y1); g.lineTo(x2 + off, y2); }
    g.stroke();
  }
  for (const end of [{ x: x1, y: y1 }, { x: x2, y: y2 }]) {
    g.fillStyle = '#c9402f';
    g.beginPath(); g.arc(end.x, end.y, 14, 0, Math.PI * 2); g.fill();
    g.lineWidth = 1.6;
    g.beginPath(); g.arc(end.x, end.y, 14, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(255,255,255,0.35)';
    g.lineWidth = 1;
    g.beginPath(); g.arc(end.x, end.y, 9, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = '#5b3520';
  }
  g.globalAlpha = 1;
}

// Paint the whole board once
function buildBoardArt() {
  const px = scale * dpr;                                   // screen dots per game unit
  boardArt = makeCanvas(WORLD_W * px, WORLD_H * px);
  const g = boardArt.getContext('2d');
  // Draw in game units; (0, 0) is the top-left corner of the playing surface
  g.setTransform(px, 0, 0, px, FRAME * px, FRAME * px);
  seed = 12345;
  const full = BOARD + FRAME * 2;

  // --- Dark wooden frame with a bevel: each of the four sides gets its own shade ---
  g.save();
  roundBox(g, -FRAME, -FRAME, full, full, 12);
  g.clip();
  const sides = [
    { colour: '#6b4226', pts: [[-FRAME, -FRAME], [BOARD + FRAME, -FRAME], [BOARD, 0], [0, 0]] },                 // top (catches the light)
    { colour: '#5a371f', pts: [[-FRAME, -FRAME], [0, 0], [0, BOARD], [-FRAME, BOARD + FRAME]] },                 // left
    { colour: '#492b17', pts: [[BOARD + FRAME, -FRAME], [BOARD + FRAME, BOARD + FRAME], [BOARD, BOARD], [BOARD, 0]] },   // right
    { colour: '#3d2312', pts: [[-FRAME, BOARD + FRAME], [0, BOARD], [BOARD, BOARD], [BOARD + FRAME, BOARD + FRAME]] }    // bottom (in shade)
  ];
  for (const s of sides) {
    g.fillStyle = s.colour;
    g.beginPath();
    g.moveTo(s.pts[0][0], s.pts[0][1]);
    for (let i = 1; i < 4; i++) g.lineTo(s.pts[i][0], s.pts[i][1]);
    g.closePath();
    g.fill();
  }
  paintGrain(g, -FRAME, -FRAME, full, full, 90, '#1e0f05');
  // A light line along the outer edge and a dark one along the inner edge make the frame look raised
  g.strokeStyle = 'rgba(255,220,170,0.22)';
  g.lineWidth = 2;
  roundBox(g, -FRAME + 1.5, -FRAME + 1.5, full - 3, full - 3, 11);
  g.stroke();
  g.restore();

  // --- Polished plywood playing surface ---
  const wood = g.createRadialGradient(BOARD / 2, BOARD / 2, 60, BOARD / 2, BOARD / 2, BOARD * 0.75);
  wood.addColorStop(0, '#f3dfb0');
  wood.addColorStop(1, '#dcc086');
  g.fillStyle = wood;
  g.fillRect(0, 0, BOARD, BOARD);
  g.save();
  g.beginPath(); g.rect(0, 0, BOARD, BOARD); g.clip();
  // A few wide, faint bands, then many thin grain lines
  for (let i = 0; i < 9; i++) {
    g.fillStyle = 'rgba(140,95,45,' + (0.02 + grainRandom() * 0.04) + ')';
    g.fillRect(0, grainRandom() * BOARD, BOARD, 12 + grainRandom() * 40);
  }
  paintGrain(g, 0, 0, BOARD, BOARD, 130, '#8a5a2a');
  // The frame throws a soft shadow onto the edge of the surface
  const edge = 16;
  const shades = [
    [0, 0, 0, edge, 0, 0, BOARD, edge], [0, BOARD, 0, BOARD - edge, 0, BOARD - edge, BOARD, edge],
    [0, 0, edge, 0, 0, 0, edge, BOARD], [BOARD, 0, BOARD - edge, 0, BOARD - edge, 0, edge, BOARD]
  ];
  for (const s of shades) {
    const shade = g.createLinearGradient(s[0], s[1], s[2], s[3]);
    shade.addColorStop(0, 'rgba(40,20,5,0.38)');
    shade.addColorStop(1, 'rgba(40,20,5,0)');
    g.fillStyle = shade;
    g.fillRect(s[4], s[5], s[6], s[7]);
  }
  g.restore();

  // --- Markings ---
  const c = BOARD / 2;
  // Diagonal arrows pointing at each pocket, with a small arc at the inner end
  g.strokeStyle = '#5b3520';
  g.fillStyle = '#5b3520';
  for (const pk of POCKETS) {
    const dx = pk.x < c ? 1 : -1, dy = pk.y < c ? 1 : -1;  // direction from the corner towards the middle
    const cornerX = pk.x < c ? 0 : BOARD, cornerY = pk.y < c ? 0 : BOARD;
    const x1 = cornerX + dx * 62, y1 = cornerY + dy * 62;   // end near the pocket
    const x2 = cornerX + dx * 128, y2 = cornerY + dy * 128; // end near the middle
    g.lineWidth = 1.8;
    g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
    // Arrow head
    g.beginPath();
    g.moveTo(x1 - dx * 9, y1 - dy * 9);
    g.lineTo(x1 + dx * 5 - dy * 6, y1 + dy * 5 + dx * 6);
    g.lineTo(x1 + dx * 5 + dy * 6, y1 + dy * 5 - dx * 6);
    g.closePath(); g.fill();
    // Arc at the inner end
    const mid = Math.atan2(dy, dx);
    g.lineWidth = 1.4;
    g.beginPath(); g.arc(x2, y2, 15, mid - 2.3, mid + 2.3); g.stroke();
  }

  // The four base lines with red end circles (top and bottom are the real shooting lines)
  paintBaseLine(g, BASE_X1, BASE_Y.B, BASE_X2, BASE_Y.B, true);
  paintBaseLine(g, BASE_X1, BASE_Y.W, BASE_X2, BASE_Y.W, true);
  paintBaseLine(g, BASE_Y.B, BASE_X1, BASE_Y.B, BASE_X2, false);
  paintBaseLine(g, BASE_Y.W, BASE_X1, BASE_Y.W, BASE_X2, false);

  // Centre circle with an eight-point star (red and black petals)
  for (let i = 0; i < 8; i++) {
    const a = Math.PI / 4 * i;
    g.fillStyle = i % 2 ? '#2d2420' : '#b8402f';
    g.globalAlpha = 0.85;
    g.beginPath();
    g.moveTo(c + Math.cos(a) * 16, c + Math.sin(a) * 16);
    g.lineTo(c + Math.cos(a - 0.26) * 36, c + Math.sin(a - 0.26) * 36);
    g.lineTo(c + Math.cos(a) * 68, c + Math.sin(a) * 68);
    g.lineTo(c + Math.cos(a + 0.26) * 36, c + Math.sin(a + 0.26) * 36);
    g.closePath();
    g.fill();
  }
  g.globalAlpha = 1;
  g.strokeStyle = '#5b3520';
  g.lineWidth = 2.4;
  g.beginPath(); g.arc(c, c, 78, 0, Math.PI * 2); g.stroke();
  g.lineWidth = 1;
  g.beginPath(); g.arc(c, c, 72, 0, Math.PI * 2); g.stroke();
  g.fillStyle = '#c9402f';
  g.beginPath(); g.arc(c, c, 16, 0, Math.PI * 2); g.fill();
  g.lineWidth = 1.6;
  g.beginPath(); g.arc(c, c, 16, 0, Math.PI * 2); g.stroke();

  // --- Corner pockets: dark holes that look deep ---
  for (const pk of POCKETS) {
    const hole = g.createRadialGradient(pk.x + 4, pk.y + 5, 3, pk.x, pk.y, POCKET_R);
    hole.addColorStop(0, '#000000');
    hole.addColorStop(0.65, '#0d0704');
    hole.addColorStop(1, '#2c1b0e');
    g.fillStyle = hole;
    g.beginPath(); g.arc(pk.x, pk.y, POCKET_R, 0, Math.PI * 2); g.fill();
    // Dark rim, darker at the top-left (shadow), lighter at the bottom-right (light catches the lip)
    g.strokeStyle = '#24140a';
    g.lineWidth = 2.5;
    g.beginPath(); g.arc(pk.x, pk.y, POCKET_R - 1, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = 'rgba(255,225,170,0.45)';
    g.lineWidth = 1.6;
    g.beginPath(); g.arc(pk.x, pk.y, POCKET_R - 0.5, 0.15 * Math.PI, 0.6 * Math.PI); g.stroke();
  }

  // --- Finger strip under the board ---
  const top = BOARD + FRAME;
  const panel = g.createLinearGradient(0, top, 0, top + STRIP);
  panel.addColorStop(0, '#13203f');
  panel.addColorStop(1, '#0c1429');
  g.fillStyle = panel;
  roundBox(g, -FRAME, top + 6, full, STRIP - 6, 14);
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.08)';
  g.lineWidth = 1.5;
  g.stroke();
  // The groove the knob slides in
  g.fillStyle = '#070c1a';
  roundBox(g, BASE_X1 - 8, top + 34, BASE_X2 - BASE_X1 + 16, 14, 7);
  g.fill();
  g.fillStyle = '#26365f';
  roundBox(g, BASE_X1 - 5, top + 37, BASE_X2 - BASE_X1 + 10, 8, 4);
  g.fill();
}

// Make one round picture. `paint` draws it with (0, 0) as the middle.
function makeSprite(radius, paint) {
  const px = scale * dpr;
  const half = radius + SPRITE_PAD;                         // room around the disc for its shadow
  const c = makeCanvas(half * 2 * px, half * 2 * px);
  const g = c.getContext('2d');
  g.setTransform(px, 0, 0, px, half * px, half * px);
  paint(g, radius, px);
  return { canvas: c, half };
}

// A glossy disc with engraved rings. look = { light, mid, dark, rim, groove, shine }
function paintDisc(g, r, px, look) {
  // Soft shadow under the piece (blur is fine here because this runs only once)
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.5)';
  g.shadowBlur = 4 * px;
  g.shadowOffsetX = 1.5 * px;
  g.shadowOffsetY = 2.5 * px;
  g.fillStyle = look.dark;
  g.beginPath(); g.arc(0, 0, r - 0.5, 0, Math.PI * 2); g.fill();
  g.restore();
  // Body: lighter at the top-left, darker towards the edge
  const body = g.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
  body.addColorStop(0, look.light);
  body.addColorStop(0.6, look.mid);
  body.addColorStop(1, look.dark);
  g.fillStyle = body;
  g.beginPath(); g.arc(0, 0, r, 0, Math.PI * 2); g.fill();
  g.strokeStyle = look.rim;
  g.lineWidth = 1.2;
  g.beginPath(); g.arc(0, 0, r - 0.6, 0, Math.PI * 2); g.stroke();
  // Engraved rings: a dark line with a light line just under it looks cut into the surface
  for (const ring of [0.74, 0.46]) {
    g.strokeStyle = look.groove;
    g.lineWidth = 1.3;
    g.beginPath(); g.arc(0, 0, r * ring, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = look.shine;
    g.lineWidth = 0.6;
    g.beginPath(); g.arc(0, 0.7, r * ring, 0.1 * Math.PI, 0.9 * Math.PI); g.stroke();
  }
}

// The shiny highlight on top of a disc
function paintGloss(g, r) {
  g.save();
  g.rotate(-0.7);
  g.fillStyle = 'rgba(255,255,255,0.32)';
  g.beginPath(); g.ellipse(-r * 0.05, -r * 0.5, r * 0.5, r * 0.22, 0, 0, Math.PI * 2); g.fill();
  g.restore();
}

// A small star shape (used on the queen and the striker)
function paintStar(g, points, outer, inner, colour) {
  g.fillStyle = colour;
  g.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const a = Math.PI / points * i - Math.PI / 2;
    const d = i % 2 ? inner : outer;
    if (i === 0) g.moveTo(Math.cos(a) * d, Math.sin(a) * d); else g.lineTo(Math.cos(a) * d, Math.sin(a) * d);
  }
  g.closePath();
  g.fill();
}

function buildSprites() {
  // White coin: cream with brown-grey rings and a centre dot
  sprites.W = makeSprite(COIN_R, (g, r, px) => {
    paintDisc(g, r, px, { light: '#ffffff', mid: '#f1e9d6', dark: '#c9bd9f', rim: '#9c9078', groove: '#a89c82', shine: 'rgba(255,255,255,0.9)' });
    g.fillStyle = '#b8ad96';
    g.beginPath(); g.arc(0, 0, r * 0.16, 0, Math.PI * 2); g.fill();
    paintGloss(g, r);
  });
  // Black coin: dark with grey rings
  sprites.B = makeSprite(COIN_R, (g, r, px) => {
    paintDisc(g, r, px, { light: '#6e6e6e', mid: '#2e2e2e', dark: '#101010', rim: '#000000', groove: '#8a8a8a', shine: 'rgba(0,0,0,0.6)' });
    g.fillStyle = '#8a8a8a';
    g.beginPath(); g.arc(0, 0, r * 0.16, 0, Math.PI * 2); g.fill();
    paintGloss(g, r);
  });
  // Red queen: red with a gold star in the middle (different colour AND shape)
  sprites.Q = makeSprite(COIN_R, (g, r, px) => {
    paintDisc(g, r, px, { light: '#ff9aa8', mid: '#d6455d', dark: '#8e2237', rim: '#6d1527', groove: '#f7a8b5', shine: 'rgba(110,20,40,0.6)' });
    paintStar(g, 5, r * 0.42, r * 0.18, '#ffd76a');
    paintGloss(g, r);
  });
  // Striker: bigger, blue, with a white ring and a star pattern.  X = the red "blocked" striker.
  const strikerLooks = {
    S: { light: '#d9f0ff', mid: '#8fd0ff', dark: '#3f8fd0', rim: '#1f558c', groove: '#2a6aa8', shine: 'rgba(255,255,255,0.8)', star: '#2a6aa8' },
    X: { light: '#ffc9c9', mid: '#ff6b6b', dark: '#c23f3f', rim: '#7a2020', groove: '#a33b3b', shine: 'rgba(255,255,255,0.7)', star: '#a33b3b' }
  };
  for (const key of ['S', 'X']) {
    const look = strikerLooks[key];
    sprites[key] = makeSprite(STRIKER_R, (g, r, px) => {
      paintDisc(g, r, px, look);
      g.strokeStyle = 'rgba(255,255,255,0.85)';
      g.lineWidth = 1.6;
      g.beginPath(); g.arc(0, 0, r * 0.6, 0, Math.PI * 2); g.stroke();
      paintStar(g, 6, r * 0.42, r * 0.2, look.star);
      paintGloss(g, r);
    });
  }
  // Knob in the finger strip
  sprites.K = makeSprite(22, (g, r, px) => {
    paintDisc(g, r, px, { light: '#e6f5ff', mid: '#8fd0ff', dark: '#3f8fd0', rim: '#1f558c', groove: 'rgba(42,106,168,0.6)', shine: 'rgba(255,255,255,0.8)' });
    // Two small arrows: slide left / right
    g.fillStyle = '#1f558c';
    for (const dir of [-1, 1]) {
      g.beginPath();
      g.moveTo(dir * 9, 0); g.lineTo(dir * 3, -5); g.lineTo(dir * 3, 5);
      g.closePath(); g.fill();
    }
    paintGloss(g, r);
  });
}

// Stamp a ready-made picture with its middle at (x, y). size 1 = normal size.
function stamp(sprite, x, y, size = 1) {
  const half = sprite.half * size;
  ctx.drawImage(sprite.canvas, x - half, y - half, half * 2, half * 2);
}

// ---------- Drawing ----------
function draw() {
  if (!boardArt) return;                         // the screen has no size yet (hidden page)

  // Clear the whole canvas (the page's dark navy background shows through)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, screenW, screenH);

  // A short, small shake after a very hard hit
  let shakeX = 0, shakeY = 0;
  if (shakeLeft > 0) {
    const amount = SHAKE_SIZE * shakeLeft / SHAKE_TIME;
    shakeX = (Math.random() * 2 - 1) * amount;
    shakeY = (Math.random() * 2 - 1) * amount;
  }

  // The ready-made board picture (frame, surface, markings, pockets and finger strip)
  ctx.drawImage(boardArt, offX + shakeX, offY + shakeY, WORLD_W * scale, WORLD_H * scale);

  // From here on, draw in game units; (0, 0) is the top-left corner of the playing surface
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (offX + shakeX + FRAME * scale), dpr * (offY + shakeY + FRAME * scale));

  // Pieces that are dropping into a pocket: slide to the middle of the hole, shrink and fade
  for (const s of sinkers) {
    const k = s.t / SINK_TIME;                   // 0 = just fell in, 1 = gone
    ctx.globalAlpha = 1 - k;
    stamp(sprites[s.kind], s.x + (s.px - s.x) * k, s.y + (s.py - s.y) * k, 1 - 0.6 * k);
  }
  ctx.globalAlpha = 1;

  // Coins
  for (const c of coins) stamp(sprites[c.kind], c.x, c.y);

  if (striker && striker.on && playing) {
    const blocked = phase === 'aim' && !strikerClear(striker.x);

    // Aim guide while pulling back (or while the computer shows its aim)
    let aim = null;
    if (phase === 'aim' && pull) {
      const len = Math.hypot(pull.x, pull.y);
      if (len > 8) aim = { x: pull.x / len, y: pull.y / len, power: Math.min(1, len / MAX_PULL) };
    } else if (phase === 'think' && aiShot) {
      aim = { x: aiShot.dirX, y: aiShot.dirY, power: aiShot.power };
    }
    if (aim) {
      const reach = 60 + 200 * aim.power;
      const tx = striker.x + aim.x * reach, ty = striker.y + aim.y * reach;
      // Colour shows the power: green = soft, yellow = medium, red = hard
      const colour = aim.power < 0.4 ? '#4ade80' : aim.power < 0.75 ? '#facc15' : '#fb7185';
      const dark = 'rgba(11,18,32,0.8)';

      // Dotted line: drawn twice, a dark one underneath so the dots stand out on the light wood
      ctx.lineCap = 'round';
      ctx.setLineDash([0.1, 15]);
      for (const pass of [{ colour: dark, width: 10 }, { colour, width: 6 }]) {
        ctx.strokeStyle = pass.colour;
        ctx.lineWidth = pass.width;
        ctx.beginPath();
        ctx.moveTo(striker.x + aim.x * (striker.r + 10), striker.y + aim.y * (striker.r + 10));
        ctx.lineTo(tx, ty);
        ctx.stroke();
      }
      ctx.setLineDash([]);
      ctx.lineCap = 'butt';

      // Arrow head
      ctx.fillStyle = colour;
      ctx.strokeStyle = dark;
      ctx.lineWidth = 2.5;
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(tx + aim.x * 18, ty + aim.y * 18);
      ctx.lineTo(tx - aim.y * 11, ty + aim.x * 11);
      ctx.lineTo(tx + aim.y * 11, ty - aim.x * 11);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Power ring around the striker: fills up as the shot gets stronger
      ctx.strokeStyle = dark;
      ctx.lineWidth = 7;
      ctx.beginPath(); ctx.arc(striker.x, striker.y, striker.r + 7, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = colour;
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(striker.x, striker.y, striker.r + 7, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * aim.power);
      ctx.stroke();
    }
    stamp(blocked ? sprites.X : sprites.S, striker.x, striker.y);
  }

  // Dust specks from hard hits
  for (const p of particles) {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.colour;
    ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
  }
  ctx.globalAlpha = 1;

  // Floating words ("+1", "+3", "Foul!") that drift up and fade
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 30px system-ui, sans-serif';
  ctx.lineJoin = 'round';
  for (const f of floaters) {
    ctx.globalAlpha = Math.min(1, f.life * 2);
    ctx.lineWidth = 5;
    ctx.strokeStyle = f.colour === '#1a1a1a' ? 'rgba(255,255,255,0.9)' : 'rgba(11,18,32,0.85)';
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillStyle = f.colour;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  // Finger strip under the board: slide here to move the striker
  const top = BOARD + FRAME;
  const myTurn = humanTurn();
  if (striker && playing && phase === 'aim') stamp(sprites.K, striker.x, top + 41);
  // The hint pulses gently while it is a person's turn
  ctx.fillStyle = 'rgba(255,255,255,' + (myTurn ? 0.65 + 0.2 * Math.sin(clock * 3) : 0.3) + ')';
  ctx.font = '500 20px system-ui, sans-serif';
  ctx.fillText('◀  slide here to move the striker  ▶', BOARD / 2, top + 88);
}

// Winning confetti, drawn on its own see-through canvas that lies over the whole page
let confettiShown = false;
function drawConfetti() {
  if (confetti.length === 0 && !confettiShown) return;      // nothing to draw and nothing to wipe
  confettiCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  for (const c of confetti) {
    // Each piece gets thinner and wider as it "spins"
    const wide = c.w * Math.cos(c.spin);
    confettiCtx.globalAlpha = Math.min(1, c.life);
    confettiCtx.fillStyle = c.colour;
    confettiCtx.fillRect(c.x - wide / 2, c.y, wide, c.h);
  }
  confettiCtx.globalAlpha = 1;
  confettiShown = confetti.length > 0;
}

// ---------- Fit the board to the screen ----------
function resize() {
  dpr = window.devicePixelRatio || 1;            // keep drawing sharp on phone screens
  screenW = stage.clientWidth;
  screenH = stage.clientHeight;
  canvas.width  = Math.round(screenW * dpr);
  canvas.height = Math.round(screenH * dpr);
  scale = Math.min(screenW / WORLD_W, screenH / WORLD_H);
  offX = (screenW - WORLD_W * scale) / 2;
  offY = (screenH - WORLD_H * scale) / 2;
  // The confetti layer covers the whole page
  confettiCanvas.width  = Math.round(app.clientWidth * dpr);
  confettiCanvas.height = Math.round(app.clientHeight * dpr);
  // Repaint the ready-made pictures at the new size (skipped while the page is hidden and has no size)
  if (scale > 0) {
    buildBoardArt();
    buildSprites();
  }
}

// ---------- Input ----------
// Convert a touch position on screen to a position on the playing surface
function toBoard(e) {
  const rect = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - rect.left - offX) / scale - FRAME,
    y: (e.clientY - rect.top - offY) / scale - FRAME
  };
}

let sliding = false;
function humanTurn() { return playing && phase === 'aim' && (mode === 'two' || turn === 'W'); }

canvas.addEventListener('pointerdown', (e) => {
  if (!humanTurn()) return;
  const p = toBoard(e);
  canvas.setPointerCapture(e.pointerId);
  if (p.y > BOARD + FRAME) {
    // In the strip: move the striker along its line
    sliding = true;
    striker.x = Math.max(BASE_X1, Math.min(BASE_X2, p.x));
  } else {
    // On the board: start pulling back to aim
    pullStart = p;
    pull = { x: 0, y: 0 };
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!humanTurn()) return;
  const p = toBoard(e);
  if (sliding) striker.x = Math.max(BASE_X1, Math.min(BASE_X2, p.x));
  else if (pullStart) pull = { x: pullStart.x - p.x, y: pullStart.y - p.y };   // the shot goes opposite to the pull
});

function release() {
  if (sliding) { sliding = false; return; }
  if (!pullStart || !humanTurn()) { pullStart = null; pull = null; return; }
  const len = Math.hypot(pull.x, pull.y);
  const shot = pull;
  pullStart = null;
  pull = null;
  if (len < 18) return;                           // too small: treated as a cancel
  if (!strikerClear(striker.x)) {
    note = 'Move the striker off the coin';
    updateHud();
    return;
  }
  shoot(shot.x, shot.y, Math.min(1, len / MAX_PULL));
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', () => { sliding = false; pullStart = null; pull = null; });

document.getElementById('btnNew').addEventListener('click', () => { sfx.tap(); startGame(); });
document.getElementById('btnMode').addEventListener('click', () => {
  sfx.tap();
  playing = false;
  clearEffects();
  overlay.classList.remove('win', 'lose');
  updateHud();
  msgTitle.textContent = 'Carrom';
  msgLine.textContent = 'You are white. Pocket your coins before the other side does.';
  overlay.classList.remove('hidden');
});
for (const btn of document.querySelectorAll('#modes button')) {
  btn.addEventListener('click', () => { sfx.tap(); startGame(btn.dataset.mode); });
}

// ---------- Main loop ----------
let lastTime = 0;
function loop(time) {
  // dt = seconds since last frame, capped so a paused tab does not jump the game
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  update(dt);
  updateEffects(dt);               // sparks, sinking coins, floating text, confetti
  draw();
  drawConfetti();
  requestAnimationFrame(loop);
}

// ---------- Start ----------
window.addEventListener('resize', resize);
resize();
setUpBoard();
requestAnimationFrame(loop);
</script>
</body>
</html>
