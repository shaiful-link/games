// ---------- Backgrounds (sky, far hills or sea or city, near treeline) ----------
// Three layers, each painted once per circuit. They slide sideways with the bends (parallax).
let bgSky = null, bgFar = null, bgNear = null;
function buildBackgrounds(c) {
  if (!viewW || !viewH) return;
  horizonY = viewH * 0.5;
  const w = Math.ceil(viewW), h = Math.ceil(viewH);
  seed = 99 + CIRCUITS.indexOf(c) * 17;
  // sky: gradient, sun or moon, clouds or stars
  bgSky = document.createElement('canvas'); bgSky.width = w * dpr; bgSky.height = h * dpr;
  let g = bgSky.getContext('2d'); g.scale(dpr, dpr);
  const sky = g.createLinearGradient(0, 0, 0, h); sky.addColorStop(0, c.skyTop); sky.addColorStop(0.55, c.skyBot); sky.addColorStop(1, c.fog);
  g.fillStyle = sky; g.fillRect(0, 0, w, h);
  if (c.theme === 'night') {
    for (let i = 0; i < 90; i++) { g.fillStyle = 'rgba(255,255,255,' + (0.3 + seededRandom() * 0.7).toFixed(2) + ')'; g.fillRect(seededRandom() * w, seededRandom() * h * 0.5, 1.5, 1.5); }
    g.shadowBlur = 30; g.shadowColor = '#f3f0dc'; blob(g, w * 0.78, h * 0.14, 18, '#f3f0dc'); g.shadowBlur = 0;
    blob(g, w * 0.78 - 5, h * 0.14 + 4, 4, '#dcd9c4'); blob(g, w * 0.78 + 6, h * 0.14 - 5, 3, '#dcd9c4');   // moon's dark spots
  } else {
    const sx = w * (c.theme === 'desert' ? 0.5 : 0.7), sy = h * (c.theme === 'desert' ? 0.44 : 0.16);
    g.shadowBlur = 40; g.shadowColor = c.sun; blob(g, sx, sy, c.theme === 'desert' ? 30 : 20, c.sun); g.shadowBlur = 0;
    for (let i = 0; i < 7; i++) {                                        // soft clouds
      const x = seededRandom() * w, y = h * (0.06 + seededRandom() * 0.3), s = 14 + seededRandom() * 20;
      g.fillStyle = c.theme === 'desert' ? 'rgba(255,220,200,0.6)' : 'rgba(255,255,255,0.75)';
      blob(g, x, y, s, g.fillStyle); blob(g, x + s * 0.9, y + 4, s * 0.8, g.fillStyle); blob(g, x - s * 0.8, y + 5, s * 0.7, g.fillStyle); blob(g, x + s * 0.3, y - s * 0.4, s * 0.7, g.fillStyle);
    }
  }
  // far layer (twice the view width so it can slide and wrap): mountains, sea, skyline or dunes
  const fw = w * 2, fh = Math.ceil(h * 0.5);
  bgFar = document.createElement('canvas'); bgFar.width = fw * dpr; bgFar.height = fh * dpr;
  g = bgFar.getContext('2d'); g.scale(dpr, dpr);
  if (c.theme === 'coastal') {
    const sea = g.createLinearGradient(0, fh * 0.6, 0, fh); sea.addColorStop(0, '#2c7fb8'); sea.addColorStop(1, '#6fb7e0');
    g.fillStyle = sea; g.fillRect(0, fh * 0.6, fw, fh * 0.4);
    g.fillStyle = 'rgba(255,255,255,0.35)'; for (let i = 0; i < 60; i++) g.fillRect(seededRandom() * fw, fh * (0.62 + seededRandom() * 0.35), 6 + seededRandom() * 14, 1.5);
    g.fillStyle = '#4a6a7a'; g.beginPath(); g.moveTo(0, fh * 0.62);                // a headland on the left half
    for (let x = 0; x <= fw * 0.45; x += 30) g.lineTo(x, fh * 0.62 - Math.max(0, Math.sin(x / fw * 7) * fh * 0.25));
    g.lineTo(fw * 0.45, fh); g.lineTo(0, fh); g.closePath(); g.fill();
  } else if (c.theme === 'night') {
    for (let x = 0; x < fw; x += 14 + seededRandom() * 30) {
      const bh = fh * (0.2 + seededRandom() * 0.7), bw = 14 + seededRandom() * 30;
      g.fillStyle = seededRandom() < 0.5 ? '#141a2e' : '#1b2238'; g.fillRect(x, fh - bh, bw, bh);
      for (let y = fh - bh + 4; y < fh - 4; y += 7) for (let xx = x + 3; xx < x + bw - 3; xx += 6) if (seededRandom() < 0.4) { g.fillStyle = seededRandom() < 0.5 ? '#ffd166' : '#9fdcff'; g.fillRect(xx, y, 2.5, 3); }
      if (seededRandom() < 0.25) { g.shadowBlur = 10; g.shadowColor = '#ff2fa0'; g.fillStyle = seededRandom() < 0.5 ? '#ff2fa0' : '#2fe0ff'; g.fillRect(x, fh - bh - 3, bw, 3); g.shadowBlur = 0; }
    }
  } else if (c.theme === 'desert') {
    const dunes = g.createLinearGradient(0, fh * 0.4, 0, fh); dunes.addColorStop(0, '#c98a5a'); dunes.addColorStop(1, '#8a5a3a');
    g.fillStyle = dunes; g.beginPath(); g.moveTo(0, fh);
    for (let x = 0; x <= fw; x += 20) g.lineTo(x, fh * 0.75 - Math.sin(x / fw * 9) * fh * 0.18 - Math.sin(x / fw * 23) * fh * 0.06);
    g.lineTo(fw, fh); g.closePath(); g.fill();
  } else {
    // green hills (tropical, highland): two ranges, the far one paler
    for (const [shadeK, base, amp, freq] of [[0.55, 0.55, 0.3, 5], [0.3, 0.75, 0.2, 9]]) {
      g.fillStyle = c.theme === 'highland' ? shade('#4a7a8a', shadeK - 0.3) : shade('#2f7a4a', shadeK - 0.3);
      g.beginPath(); g.moveTo(0, fh);
      for (let x = 0; x <= fw; x += 16) g.lineTo(x, fh * base - Math.abs(Math.sin(x / fw * freq + shadeK)) * fh * amp - Math.sin(x / fw * freq * 4) * fh * 0.03);
      g.lineTo(fw, fh); g.closePath(); g.fill();
    }
  }
  // near layer: treeline, dunes, buildings, tea slopes
  const nh = Math.ceil(h * 0.22);
  bgNear = document.createElement('canvas'); bgNear.width = fw * dpr; bgNear.height = nh * dpr;
  g = bgNear.getContext('2d'); g.scale(dpr, dpr);
  if (c.theme === 'night') {
    for (let x = 0; x < fw; x += 24) { const bh = nh * (0.3 + seededRandom() * 0.7); g.fillStyle = '#0d1120'; g.fillRect(x, nh - bh, 22, bh); g.fillStyle = '#ffd166'; if (seededRandom() < 0.6) g.fillRect(x + 6, nh - bh + 6, 3, 3); }
  } else if (c.theme === 'desert') {
    g.fillStyle = '#b9834d'; g.beginPath(); g.moveTo(0, nh); for (let x = 0; x <= fw; x += 20) g.lineTo(x, nh * 0.7 - Math.sin(x / fw * 15) * nh * 0.25); g.lineTo(fw, nh); g.closePath(); g.fill();
  } else if (c.theme === 'coastal') {
    for (let x = 0; x < fw; x += 36) { const t = nh * (0.5 + seededRandom() * 0.4); g.fillStyle = '#2d7a3e'; blob(g, x, nh - t * 0.6, t * 0.45, '#2d7a3e'); g.fillRect(x - 2, nh - t * 0.6, 4, t * 0.6); }
  } else {
    for (let x = 0; x < fw; x += 18) { const t = nh * (0.5 + seededRandom() * 0.5); g.fillStyle = seededRandom() < 0.5 ? '#1f5a2e' : '#246a36'; g.beginPath(); g.moveTo(x - 10, nh); g.lineTo(x, nh - t); g.lineTo(x + 10, nh); g.closePath(); g.fill(); }
  }
}

// ---------- Drawing the road ----------
const cameraDepth = 1 / Math.tan((FOV / 2) * Math.PI / 180);
const playerZ = PLAYER_AHEAD;                    // same distance, used by the drawing code
let horizonY = 0;                                // where the far layers sit this frame

// Work out where a road point lands on the screen
function project(p, cameraX, cameraY, cameraZ) {
  p.camera.x = p.world.x - cameraX;
  p.camera.y = p.world.y - cameraY;
  p.camera.z = p.world.z - cameraZ;
  p.screen.scale = cameraDepth / p.camera.z;
  p.screen.x = Math.round(viewW / 2 + p.screen.scale * p.camera.x * viewW / 2);
  p.screen.y = Math.round(viewH / 2 - p.screen.scale * p.camera.y * viewH / 2);
  p.screen.w = Math.round(p.screen.scale * ROAD_W * viewW / 2);
}

function quad(x1, y1, w1, x2, y2, w2, color) {
  ctx.fillStyle = color;
  ctx.beginPath();
  ctx.moveTo(x1 - w1, y1); ctx.lineTo(x2 - w2, y2); ctx.lineTo(x2 + w2, y2); ctx.lineTo(x1 + w1, y1);
  ctx.closePath();
  ctx.fill();
}

// One strip of road: grass, shoulder, rumble strips, asphalt, edge lines, chequered line, night markers
function drawSegment(seg, c, x1, y1, w1, x2, y2, w2) {
  const r1 = w1 / 6, r2 = w2 / 6;                   // rumble strip width
  const s1 = w1 / 3, s2 = w2 / 3;                   // shoulder (sand or dirt) width
  const band = seg.band;
  ctx.fillStyle = c.grass[band];
  ctx.fillRect(0, y2, viewW, y1 - y2);
  if (c.shoulder) quad(x1, y1, w1 + r1 + s1, x2, y2, w2 + r2 + s2, c.shoulder);
  quad(x1, y1, w1 + r1, x2, y2, w2 + r2, c.rumble[band]);
  quad(x1, y1, w1, x2, y2, w2, c.road[band]);
  // white edge lines
  const e1 = Math.max(0.6, w1 * 0.02), e2 = Math.max(0.6, w2 * 0.02);
  quad(x1 - w1 + e1, y1, e1, x2 - w2 + e2, y2, e2, c.edge);
  quad(x1 + w1 - e1, y1, e1, x2 + w2 - e2, y2, e2, c.edge);
  // start/finish: a chequered band over the first two segments
  if (seg.index < 2) {
    const cols = 12;
    for (let i = 0; i < cols; i++) {
      const k1 = (i / cols) * 2 - 1, k2 = ((i + 1) / cols) * 2 - 1;
      ctx.fillStyle = (i + seg.index) % 2 ? '#15171c' : '#f4f4f2';
      ctx.beginPath();
      ctx.moveTo(x1 + w1 * k1, y1); ctx.lineTo(x2 + w2 * k1, y2); ctx.lineTo(x2 + w2 * k2, y2); ctx.lineTo(x1 + w1 * k2, y1);
      ctx.closePath(); ctx.fill();
    }
  }
  // glowing road markers along the edges at night
  if (c.theme === 'night' && seg.index % 4 === 0) {
    const r = Math.max(0.8, w1 * 0.012);
    ctx.fillStyle = '#9fdcff';
    ctx.beginPath(); ctx.arc(x1 - w1 + e1 * 3, y1, r, 0, Math.PI * 2); ctx.arc(x1 + w1 - e1 * 3, y1, r, 0, Math.PI * 2); ctx.fill();
  }
}

// Stamp a pre-painted picture onto the road, scaled by distance and cut off by nearer road (clipY)
function drawSprite(img, scale, destX, destY, clipY) {
  const destW = scale * (viewW / 2) * img.ww * ROAD_W;
  const destH = destW * img.height / img.width;
  const x = destX - destW / 2, y = destY - destH;
  const clipH = clipY ? Math.max(0, y + destH - clipY) : 0;
  if (clipH < destH && destW > 0.5) {
    ctx.drawImage(img, 0, 0, img.width, img.height - img.height * clipH / destH, x, y, destW, destH - clipH);
  }
}

// Choose which of the five angle pictures to show for a car
function carAngleIndex(car, relX) {
  const t = car.steer * 0.7 + relX * 0.6;          // turning plus how far off to one side of us it is
  if (t < -0.6) return 0;
  if (t < -0.2) return 1;
  if (t > 0.6) return 4;
  if (t > 0.2) return 3;
  return 2;
}

// The whole road view: sky, far layers, road segments, skid marks, scenery and cars, then your car
function drawRoad() {
  const c = CIRCUITS[circuitId];
  const baseSeg = segmentAt(player.z);
  const basePct = (player.z % SEG_LEN) / SEG_LEN;
  const playerY = lerp(baseSeg.p1.world.y, baseSeg.p2.world.y, basePct);
  const slope = (baseSeg.p2.world.y - baseSeg.p1.world.y) / SEG_LEN;

  // shake on a crash
  let shX = 0, shY = 0;
  if (shakeTime > 0) { shX = (Math.random() - 0.5) * 2 * shakeSize; shY = (Math.random() - 0.5) * 2 * shakeSize; }
  ctx.save();
  ctx.translate(viewX + shX, viewY + shY);
  ctx.beginPath(); ctx.rect(-8, -8, viewW + 16, viewH + 16); ctx.clip();

  // sky and the parallax layers (each one slides a different amount on the bends)
  ctx.drawImage(bgSky, 0, 0, viewW, viewH);
  const farH = bgFar.height / dpr, nearH = bgNear.height / dpr;
  const farOff = ((skyOffset * 0.3) % viewW + viewW) % viewW;
  const nearOff = ((skyOffset * 0.7) % viewW + viewW) % viewW;
  const farY = horizonY - farH * 0.8, nearY = horizonY - nearH * 0.72;
  ctx.drawImage(bgFar, -farOff, farY, viewW * 2, farH);
  ctx.drawImage(bgFar, -farOff + viewW * 2, farY, viewW * 2, farH);
  ctx.drawImage(bgNear, -nearOff, nearY, viewW * 2, nearH);
  ctx.drawImage(bgNear, -nearOff + viewW * 2, nearY, viewW * 2, nearH);
  // ground colour below the horizon (fills any gap before the first drawn segment)
  ctx.fillStyle = c.grass[0];
  ctx.fillRect(0, horizonY + nearH * 0.28, viewW, viewH);

  // project every segment ahead, drawing from far to near is not needed for the road itself:
  // the classic trick draws near to far and remembers the lowest y drawn so far (maxy) to skip hidden strips
  let maxy = viewH;
  let x = 0, dx = -(baseSeg.curve * basePct);
  const camX = player.x * ROAD_W, camY = playerY + CAM_HEIGHT;
  for (let n = 0; n < DRAW_DIST; n++) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    seg.looped = seg.index < baseSeg.index;
    seg.fog = 1 / Math.pow(Math.E, (n / DRAW_DIST) * (n / DRAW_DIST) * FOG_DENSITY);
    seg.clip = maxy;
    seg.cars.length = 0;
    project(seg.p1, camX - x, camY, player.z - (seg.looped ? trackLength : 0));
    project(seg.p2, camX - x - dx, camY, player.z - (seg.looped ? trackLength : 0));
    x += dx; dx += seg.curve;
    if (seg.p1.camera.z <= cameraDepth || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxy) continue;
    drawSegment(seg, c, seg.p1.screen.x, seg.p1.screen.y, seg.p1.screen.w, seg.p2.screen.x, seg.p2.screen.y, seg.p2.screen.w);
    // fog over the far strips
    if (seg.fog < 1) {
      ctx.globalAlpha = 1 - seg.fog;
      ctx.fillStyle = c.fog;
      ctx.fillRect(0, seg.p2.screen.y, viewW, seg.p1.screen.y - seg.p2.screen.y);
      ctx.globalAlpha = 1;
    }
    maxy = seg.p1.screen.y;
  }
  // the background layers sit where the road meets the sky (smoothed, used next frame)
  horizonY += (Math.min(maxy, viewH * 0.75) - horizonY) * 0.2;
  // skid marks lie flat on the road
  for (const m of marks) {
    const gap = trackGap(player.z, m.z);
    if (gap < 0 || gap > DRAW_DIST * SEG_LEN * 0.5) continue;
    const seg = segmentAt(m.z);
    if (seg.p1.camera.z <= cameraDepth) continue;
    const pct = (m.z % SEG_LEN) / SEG_LEN;
    const sc = lerp(seg.p1.screen.scale, seg.p2.screen.scale, pct);
    const sx = lerp(seg.p1.screen.x, seg.p2.screen.x, pct), sy = lerp(seg.p1.screen.y, seg.p2.screen.y, pct);
    const half = sc * ROAD_W * viewW / 2;
    ctx.fillStyle = 'rgba(20,20,24,' + (Math.min(1, m.life / 1.5) * 0.55).toFixed(2) + ')';
    for (const s of [-1, 1]) ctx.fillRect(sx + half * (m.x + s * CAR_HALF_W * 0.75) - half * 0.02, sy - half * 0.02, half * 0.04, half * 0.025);
  }
  // put each rival on its segment, then draw scenery and cars from far to near
  for (let i = 1; i < cars.length; i++) {
    const car = cars[i];
    const gap = trackGap(player.z, car.z);
    if (gap > -SEG_LEN && gap < DRAW_DIST * SEG_LEN) segmentAt(car.z).cars.push(car);
  }
  for (let n = DRAW_DIST - 1; n > 0; n--) {
    const seg = segments[(baseSeg.index + n) % segments.length];
    if (seg.p1.camera.z <= cameraDepth) continue;
    if (seg.p1.camera.z > playerZ * 0.7) for (const s of seg.sprites) {      // scenery level with your car is already past
      const sc = seg.p1.screen.scale;
      drawSprite(s.img, sc, seg.p1.screen.x + sc * s.x * ROAD_W * viewW / 2, seg.p1.screen.y, seg.clip);
    }
    for (const car of seg.cars) {
      const pct = (car.z % SEG_LEN) / SEG_LEN;
      const sc = lerp(seg.p1.screen.scale, seg.p2.screen.scale, pct);
      const sx = lerp(seg.p1.screen.x, seg.p2.screen.x, pct) + sc * car.x * ROAD_W * viewW / 2;
      const sy = lerp(seg.p1.screen.y, seg.p2.screen.y, pct);
      const img = carSprites[car.teamId][carAngleIndex(car, car.x - player.x)];
      drawSprite(img, sc, sx, sy, seg.clip);
      if (car.braking) {                                                     // rain light glows red
        const destW = sc * (viewW / 2) * img.ww * ROAD_W;
        ctx.fillStyle = '#ff2a2a';
        ctx.fillRect(sx - destW * 0.025, sy - destW * 0.08, destW * 0.05, destW * 0.03);
      }
    }
  }
  // mist bands in the highlands
  if (c.theme === 'highland') {
    for (let i = 0; i < 3; i++) {
      const y = horizonY - 10 + i * viewH * 0.06 + Math.sin(clock * 0.4 + i) * 4;
      const grad = ctx.createLinearGradient(0, y - 14, 0, y + 14);
      grad.addColorStop(0, 'rgba(230,236,240,0)'); grad.addColorStop(0.5, 'rgba(230,236,240,' + (0.28 - i * 0.07) + ')'); grad.addColorStop(1, 'rgba(230,236,240,0)');
      ctx.fillStyle = grad; ctx.fillRect(0, y - 14, viewW, 28);
    }
  }
  // your car, drawn big at the bottom
  drawPlayerCar(baseSeg, basePct, slope);
  // speed lines at high speed
  const share = player.speed / MAX_SPEED;
  if (share > 0.72 && !paused) {
    ctx.strokeStyle = 'rgba(255,255,255,' + ((share - 0.72) * 1.2).toFixed(2) + ')';
    ctx.lineWidth = 1;
    for (let i = 0; i < 12; i++) {
      // streaks that shoot out from the vanishing point towards the corners, staying outside the road
      const a = (i < 6 ? Math.PI * 0.55 : -Math.PI * 0.45) + (i % 6) * 0.17 + Math.sin(clock * 7 + i) * 0.05;
      const r0 = viewW * (0.45 + Math.random() * 0.15), len = viewW * 0.25 * (0.4 + Math.random() * 0.6);
      ctx.beginPath(); ctx.moveTo(viewW / 2 + Math.cos(a) * r0, horizonY + Math.sin(a) * r0 * 0.7); ctx.lineTo(viewW / 2 + Math.cos(a) * (r0 + len), horizonY + Math.sin(a) * (r0 + len) * 0.7); ctx.stroke();
    }
  }
  ctx.restore();
}

function drawPlayerCar(seg, pct, slope) {
  const set = playerSprites || carSprites[myTeamId];
  const img = set[carAngleIndex(player, 0)];
  const scale = cameraDepth / playerZ;
  const destW = scale * (viewW / 2) * img.ww * ROAD_W;
  const destH = destW * img.height / img.width;
  const camY = lerp(seg.p1.camera.y, seg.p2.camera.y, pct);
  const share = player.speed / MAX_SPEED;
  const bounce = (Math.random() - 0.5) * 1.5 * share + Math.sin(clock * 30) * share * 0.6;   // a tiny shake at speed
  const cx = viewW / 2, cy = viewH / 2 - (scale * camY * viewH / 2) - destH * 0.1 - slope * 18 + bounce;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(player.steer * 0.04);
  // smoke, dust and sparks live around the car
  for (const p of particles) {
    if (p.kind === 'confetti') continue;
    const left = 1 - p.t / p.life;
    ctx.globalAlpha = Math.min(1, left * 1.6) * (p.kind === 'spark' ? 1 : 0.55);
    ctx.fillStyle = p.color;
    ctx.beginPath(); ctx.arc(p.x * destW / 300, -destH * 0.1 + p.y * destW / 300, p.size * destW / 300 * (p.kind === 'spark' ? 1 : (0.6 + p.t / p.life)), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.drawImage(img, -destW / 2, -destH, destW, destH);
  if (player.braking) {                                                        // rain light
    ctx.shadowBlur = 12; ctx.shadowColor = '#ff2a2a'; ctx.fillStyle = '#ff3b3b';
    ctx.fillRect(-destW * 0.025, -destH * 0.2, destW * 0.05, destW * 0.028); ctx.shadowBlur = 0;
  }
  ctx.restore();
  if (player.slip && !fastForward) {                                            // slipstream: a faint tunnel of air from the car ahead
    const grad = ctx.createLinearGradient(0, horizonY, 0, cy - destH);
    grad.addColorStop(0, 'rgba(120,200,255,0)'); grad.addColorStop(1, 'rgba(120,200,255,0.16)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.moveTo(cx - destW * 0.42, cy - destH * 0.85); ctx.lineTo(cx - destW * 0.04, horizonY + 6); ctx.lineTo(cx + destW * 0.04, horizonY + 6); ctx.lineTo(cx + destW * 0.42, cy - destH * 0.85); ctx.closePath(); ctx.fill();
  }
}

// ---------- Drawing: HUD ----------
function hudPanel(x, y, w, h) {
  roundedRect(ctx, x, y, w, h, 8);
  ctx.fillStyle = 'rgba(10,14,28,0.62)';
  ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.14)'; ctx.stroke();
}

function drawHUD() {
  const s = Math.min(1.1, Math.max(0.72, viewW / 560));         // HUD size follows the road view width
  const share = player.speed / MAX_SPEED;
  ctx.save();
  ctx.translate(viewX, viewY);
  // top-left: lap, position, times
  ctx.save(); ctx.translate(8, 8); ctx.scale(s, s);
  hudPanel(0, 0, 148, 84);
  label('LAP ' + Math.min(LAPS, player.laps + 1) + '/' + LAPS, 10, 16, 16, '#ffffff', 900, 'left');
  label('P' + myPos + '/' + cars.length, 138, 16, 16, '#f5c518', 900, 'right');
  const cur = phase === 'racing' ? raceTime - player.lapStart : (phase === 'finished' ? lastLap : 0);
  label('LAP  ' + timeText(cur), 10, 42, 13, '#ffffff', 700, 'left');
  label('BEST ' + timeText(bestLap), 10, 64, 13, '#a8f0c8', 700, 'left');
  ctx.restore();
  // top-right: the little progress bar with a dot for every car
  const barW = Math.min(viewW * 0.42, 240 * s), barX = viewW - barW - 8, barY = 10;
  hudPanel(barX, barY, barW, 22 * s);
  ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(barX + 10, barY + 10 * s, barW - 20, 2 * s);
  ctx.fillStyle = '#f4f4f2'; ctx.fillRect(barX + 10, barY + 5 * s, 2, 12 * s);
  for (let i = cars.length - 1; i >= 0; i--) {
    const car = cars[i];
    let z = car.z; if (!car.armed && z > trackLength / 2) z = 0;
    const px = barX + 10 + (barW - 20) * (z / trackLength);
    ctx.beginPath(); ctx.arc(px, barY + 11 * s, (car.isPlayer ? 5.5 : 3.8) * s, 0, Math.PI * 2);
    ctx.fillStyle = car.team.main; ctx.fill();
    ctx.lineWidth = car.isPlayer ? 2 : 1; ctx.strokeStyle = car.isPlayer ? '#ffffff' : 'rgba(0,0,0,0.5)'; ctx.stroke();
  }
  // bottom-right: speedometer with an arc gauge and big digits
  const gx = viewW - 64 * s, gy = viewH - 50 * s, gr = 40 * s;
  ctx.beginPath(); ctx.arc(gx, gy, gr + 8 * s, Math.PI * 0.75, Math.PI * 2.25); ctx.lineTo(gx, gy); ctx.closePath();
  ctx.fillStyle = 'rgba(10,14,28,0.62)'; ctx.fill();
  ctx.lineWidth = 6 * s; ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,0.15)';
  ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI * 0.75, Math.PI * 2.25); ctx.stroke();
  const end = Math.PI * 0.75 + Math.PI * 1.5 * clamp(share, 0, 1);
  const grad = ctx.createLinearGradient(gx - gr, 0, gx + gr, 0); grad.addColorStop(0, '#4cc9f0'); grad.addColorStop(0.6, '#f5c518'); grad.addColorStop(1, '#ff4d4d');
  ctx.strokeStyle = grad;
  ctx.beginPath(); ctx.arc(gx, gy, gr, Math.PI * 0.75, end); ctx.stroke();
  ctx.lineCap = 'butt';
  for (let i = 0; i <= 6; i++) {
    const a = Math.PI * 0.75 + Math.PI * 1.5 * i / 6;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(gx + Math.cos(a) * (gr - 9 * s), gy + Math.sin(a) * (gr - 9 * s)); ctx.lineTo(gx + Math.cos(a) * (gr - 14 * s), gy + Math.sin(a) * (gr - 14 * s)); ctx.stroke();
  }
  label(String(Math.round(share * TOP_KMH)), gx, gy - 2 * s, 26 * s, '#ffffff', 900, 'center', 'rgba(0,0,0,0.5)');
  label('km/h', gx, gy + 16 * s, 10 * s, 'rgba(255,255,255,0.7)', 700);
  label(String((player.gear || 0) + 1), gx, gy + 32 * s, 12 * s, '#f5c518', 900);
  if (player.slip) label('SLIPSTREAM', gx, gy - gr - 18 * s, 10 * s, '#4cc9f0', 900, 'center', 'rgba(0,0,0,0.6)');
  // start lights: a panel of 5 x 2 lamps, top centre
  if (phase === 'grid' || phase === 'lights' || (phase === 'racing' && raceTime < 1.2)) {
    const lw = 190 * s, lh = 66 * s, lx = viewW / 2 - lw / 2, ly = 12;
    roundedRect(ctx, lx, ly, lw, lh, 10); ctx.fillStyle = 'rgba(12,12,16,0.92)'; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#3a3f4c'; ctx.stroke();
    for (let i = 0; i < 5; i++) for (let r = 0; r < 2; r++) {
      const on = phase === 'lights' && i < lightsOn;
      const px = lx + 24 * s + i * 35.5 * s, py = ly + 20 * s + r * 26 * s;
      if (on) { ctx.shadowBlur = 16; ctx.shadowColor = '#ff2a2a'; }
      ctx.beginPath(); ctx.arc(px, py, 9.5 * s, 0, Math.PI * 2); ctx.fillStyle = on ? '#ff2a2a' : '#3a0d0d'; ctx.fill();
      ctx.shadowBlur = 0;
      ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.stroke();
    }
    if (phase === 'racing') label('GO!', viewW / 2, ly + lh + 26 * s, 34 * s, '#4ade80', 900, 'center', 'rgba(0,0,0,0.6)');
    else if (phase === 'grid') label('Get ready', viewW / 2, ly + lh + 22 * s, 16 * s, '#ffffff', 800, 'center', 'rgba(0,0,0,0.6)');
  }
  // last lap time flashes in the middle for a moment
  if (lapFlash > 0 && phase === 'racing') {
    ctx.globalAlpha = Math.min(1, lapFlash);
    const isBest = lastLap === bestLap;
    label((isBest ? 'BEST LAP  ' : 'LAP  ') + timeText(lastLap), viewW / 2, viewH * 0.3, 22 * s, isBest ? '#a8f0c8' : '#ffffff', 900, 'center', 'rgba(0,0,0,0.7)');
    ctx.globalAlpha = 1;
  }
  if (phase === 'finished') {
    label('FINISH', viewW / 2, viewH * 0.3, 40 * s, '#f5c518', 900, 'center', 'rgba(0,0,0,0.7)');
    label('P' + myPos, viewW / 2, viewH * 0.3 + 38 * s, 26 * s, '#ffffff', 900, 'center', 'rgba(0,0,0,0.7)');
  }
  ctx.restore();
}

// ---------- Drawing helpers ----------
function roundedRect(c, x, y, w, h, r) { rr(c, x, y, w, h, r); }

// Text with an optional dark outline (keeps it readable over any background)
function label(text, x, y, size, color, weight, align, outline) {
  ctx.font = (weight || 700) + ' ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size * 0.2);
    ctx.strokeStyle = outline;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// ---------- Drawing: the four big buttons ----------
function drawPad(pad, text, sub, color, down) {
  const lift = down ? 1 : 4;
  ctx.globalAlpha = down ? 0.95 : 0.72;
  roundedRect(ctx, pad.x, pad.y + lift, pad.w, pad.h, 16); ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fill();   // dark lip
  roundedRect(ctx, pad.x, pad.y + (down ? 2 : 0), pad.w, pad.h, 16); ctx.fillStyle = down ? shade(color, 0.2) : color; ctx.fill();
  roundedRect(ctx, pad.x + 3, pad.y + (down ? 2 : 0) + pad.h * 0.5, pad.w - 6, pad.h * 0.5 - 3, 12); ctx.fillStyle = 'rgba(0,0,0,0.16)'; ctx.fill();
  roundedRect(ctx, pad.x, pad.y + (down ? 2 : 0), pad.w, pad.h, 16); ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.stroke();
  ctx.globalAlpha = 1;
  const cy = pad.y + (down ? 2 : 0) + pad.h / 2;
  label(text, pad.x + pad.w / 2, cy - (sub ? 8 : 0), Math.min(34, pad.w * 0.42), '#ffffff', 900, 'center', 'rgba(0,0,0,0.35)');
  if (sub) label(sub, pad.x + pad.w / 2, cy + 18, Math.min(12, pad.w * 0.15), 'rgba(255,255,255,0.85)', 800);
}
function drawControls() {
  drawPad(pads.left, '◀', 'LEFT', '#3b6fd6', held.left > 0 || keys.ArrowLeft);
  drawPad(pads.right, '▶', 'RIGHT', '#3b6fd6', held.right > 0 || keys.ArrowRight);
  drawPad(pads.accel, '▲', 'GO', '#2f9e68', held.accel > 0 || keys.ArrowUp || keys.z);
  drawPad(pads.brake, '▼', 'BRAKE', '#c4564a', held.brake > 0 || keys.ArrowDown || keys.x);
}

// ---------- Drawing: cards (title, car select, circuit, result, standings, trophy, pause) ----------
let uiButtons = [];              // { x, y, w, h, action } in screen pixels, rebuilt every frame
let uiFocus = 0;
let keyboardUsed = false;
let cardX = 0, cardY = 0;

function hitBox(x, y, w, h, action) {
  uiButtons.push({ x: cardX + (x - w / 2) * ui, y: cardY + (y - h / 2) * ui, w: w * ui, h: h * ui, action });
  return keyboardUsed && uiFocus === uiButtons.length - 1;
}
function drawKey(text, x, y, w, h, color, action, chosen) {
  const focused = hitBox(x, y, w, h, action);
  roundedRect(ctx, x - w / 2, y - h / 2 + 3, w, h, 12); ctx.fillStyle = 'rgba(0,0,0,0.4)'; ctx.fill();
  roundedRect(ctx, x - w / 2, y - h / 2, w, h, 12); ctx.fillStyle = color; ctx.fill();
  roundedRect(ctx, x - w / 2 + 2, y - h / 2 + h * 0.5, w - 4, h * 0.5 - 2, 10); ctx.fillStyle = 'rgba(0,0,0,0.14)'; ctx.fill();
  if (chosen || focused) {
    roundedRect(ctx, x - w / 2 - 2, y - h / 2 - 2, w + 4, h + 4, 14);
    ctx.lineWidth = 2.5; ctx.strokeStyle = chosen ? '#f4d35e' : '#ffffff'; ctx.stroke();
  }
  label(text, x, y + 1, Math.min(18, h * 0.42), '#ffffff', 800, 'center', 'rgba(0,0,0,0.3)');
}
function drawPanel(cx, cy, w, h, edgeColor, seeThrough) {
  roundedRect(ctx, cx - w / 2, cy - h / 2, w, h, 18);
  ctx.fillStyle = seeThrough ? 'rgba(13,22,44,0.74)' : 'rgba(13,22,44,0.93)'; ctx.fill();
  ctx.lineWidth = 2; ctx.strokeStyle = edgeColor; ctx.stroke();
  roundedRect(ctx, cx - w / 2 + 4, cy - h / 2 + 4, w - 8, h - 8, 14);
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.stroke();
}
function drawTapLine(text, x, y) {
  const beat = Math.sin(clock * 5);
  ctx.globalAlpha = 0.82 + beat * 0.18;
  label(text, x, y, 18 + beat * 1.2, '#fff3a6', 800, 'center', 'rgba(11,18,32,0.9)');
  ctx.globalAlpha = 1;
}
function levelRow(y) {
  const names = Object.keys(DIFFICULTY), colors = ['#3c9e82', '#4a72c4', '#c4564a'];
  label('Level', -200, y, 15, 'rgba(255,255,255,0.8)', 700);
  for (let i = 0; i < names.length; i++) drawKey(names[i], -86 + i * 112, y, 102, 36, colors[i], () => { sfx.tick(); levelName = names[i]; }, levelName === names[i]);
}

function drawCards() {
  uiButtons = [];
  const pauseCard = screen === 'race' && paused;
  if (screen === 'race' && !paused) return;
  const dim = clamp(screenAge / 0.25, 0, 1) * (screen === 'title' || screen === 'cars' || screen === 'circuit' ? 0.35 : 0.6);
  ctx.fillStyle = 'rgba(10,15,28,' + dim.toFixed(3) + ')';
  ctx.fillRect(0, 0, screenW, screenH);
  cardX = screenW / 2;
  cardY = portrait ? Math.min(screenH / 2, viewY + viewH / 2 + 60) : screenH / 2;
  const pop = 0.5 + 0.5 * popCurve(screenAge / 0.35);
  ctx.save();
  ctx.translate(cardX, cardY);
  ctx.scale(ui * pop, ui * pop);
  if (pauseCard) cardPause();
  else if (screen === 'title') cardTitle();
  else if (screen === 'cars') cardCars();
  else if (screen === 'circuit') cardCircuit();
  else if (screen === 'result') cardResult();
  else if (screen === 'standings') cardStandings();
  else if (screen === 'trophy') cardTrophy();
  else if (screen === 'consol') cardConsol();
  // confetti on the trophy card, on top of everything
  if (screen === 'trophy') {
    for (const p of particles) {
      if (p.kind !== 'confetti') continue;
      ctx.globalAlpha = Math.min(1, (1 - p.t / p.life) * 2.5);
      ctx.fillStyle = p.color;
      const turn = p.spin + p.t * 6, w = p.size * 1.3 * Math.abs(Math.cos(turn)) + 0.15;
      ctx.fillRect(p.x - w / 2, p.y - p.size / 2, w, p.size);
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (uiFocus >= uiButtons.length) uiFocus = 0;
}

// ---------- Drawing: everything ----------
function draw() {
  if (!screenW) return;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0a0f1c';
  ctx.fillRect(0, 0, screenW, screenH);
  ctx.fillStyle = stripGradient;
  ctx.fillRect(leftStrip.x, leftStrip.y, leftStrip.w, leftStrip.h);
  ctx.fillRect(rightStrip.x, rightStrip.y, rightStrip.w, rightStrip.h);
  if (segments.length && bgSky) {
    drawRoad();
    ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.10)';
    ctx.strokeRect(viewX + 0.5, viewY + 0.5, viewW - 1, viewH - 1);
    if (!demo) drawHUD();
  }
  if (screen === 'race') drawControls();
  if (portrait && screen === 'race' && !paused) label('Turn your phone sideways for a bigger view', screenW / 2, viewY + viewH + 15, 13, 'rgba(255,255,255,0.65)', 500);
  drawCards();
}

// ---------- Input: touch (several fingers at once) ----------
// Every finger has its own number (pointerId). We remember which button each finger is on, so you
// can hold Accelerate with the right thumb and tap steer with the left at the same time.
const held = { left: 0, right: 0, accel: 0, brake: 0 };   // how many fingers are on each button
const fingers = {};                                        // pointerId -> button name
const keys = {};

function resetInput() {
  held.left = 0; held.right = 0; held.accel = 0; held.brake = 0;
  for (const id in fingers) delete fingers[id];
  for (const k in keys) keys[k] = false;
  input.steer = 0; input.accel = false; input.brake = false;
}
function inRect(r, x, y) { return x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h; }
function padAt(x, y) {
  for (const name of ['left', 'right', 'accel', 'brake']) if (inRect(pads[name], x, y)) return name;
  // a finger a little outside a button still counts for the nearest button in that strip
  if (inRect(leftStrip, x, y) && y > pads.left.y) return y < pads.right.y ? 'left' : 'right';
  if (inRect(rightStrip, x, y) && y > pads.accel.y) return y < pads.brake.y ? 'accel' : 'brake';
  return null;
}
// Read the thumbs and the keyboard into "input" (done once per frame, before the race steps)
function readInput() {
  if (autoDrive && screen === 'race') return;                  // the robot driver fills "input" itself
  const left = held.left > 0 || keys.ArrowLeft, right = held.right > 0 || keys.ArrowRight;
  input.steer = (right ? 1 : 0) - (left ? 1 : 0);
  input.accel = held.accel > 0 || keys.ArrowUp || keys.z;
  input.brake = held.brake > 0 || keys.ArrowDown || keys.x;
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (screen !== 'race' || paused) { tapCard(x, y); return; }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* older browsers: still works */ }
  const name = padAt(x, y);
  if (name) { fingers[e.pointerId] = name; held[name]++; }
});
canvas.addEventListener('pointermove', (e) => {
  const name = fingers[e.pointerId];
  if (!name) return;
  // sliding the thumb from one steer button to the other (or accel to brake) swaps the press
  const rect = canvas.getBoundingClientRect();
  const now = padAt(e.clientX - rect.left, e.clientY - rect.top);
  if (now && now !== name) { held[name] = Math.max(0, held[name] - 1); fingers[e.pointerId] = now; held[now]++; }
});
function liftFinger(e) {
  const name = fingers[e.pointerId];
  if (!name) return;
  held[name] = Math.max(0, held[name] - 1);
  delete fingers[e.pointerId];
}
canvas.addEventListener('pointerup', liftFinger);
canvas.addEventListener('pointercancel', liftFinger);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function tapCard(x, y) {
  if (screenAge < 0.25) return;
  for (const b of uiButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.action(); return; }
  }
  if (!uiButtons.length) advance();
}

btnPause.addEventListener('click', () => {
  btnPause.blur();
  if (screen !== 'race') return;
  sfx.tick();
  setPaused(!paused);
});
// The game pauses by itself when you leave the page or the phone locks
document.addEventListener('visibilitychange', () => {
  if (document.hidden && screen === 'race' && !paused) setPaused(true);
});

// ---------- Input: keyboard (for testing on a laptop) ----------
window.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const inPlay = screen === 'race' && !paused;
  if (k === 'p') { if (screen === 'race' && !e.repeat) setPaused(!paused); return; }
  if (!inPlay) {
    keyboardUsed = true;
    if (e.repeat) return;
    if (k === ' ' || k === 'Enter') {
      if (uiButtons.length) { if (screenAge >= 0.25) uiButtons[uiFocus].action(); } else advance();
      e.preventDefault();
    } else if (uiButtons.length && (k === 'ArrowRight' || k === 'ArrowDown')) { uiFocus = (uiFocus + 1) % uiButtons.length; e.preventDefault(); }
    else if (uiButtons.length && (k === 'ArrowLeft' || k === 'ArrowUp')) { uiFocus = (uiFocus + uiButtons.length - 1) % uiButtons.length; e.preventDefault(); }
    return;
  }
  keys[k] = true;
  if (k.startsWith('Arrow') || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
});

// ---------- Main loop ----------
// The screen is redrawn as often as the phone likes, but the race always moves in equal steps
// of 1/60 second. "stepBank" holds the time that has not been played yet.
let lastTime = 0, stepBank = 0;
function loop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;
  clock += dt;
  screenAge += dt;
  stepBank += dt;
  readInput();
  let steps = 0;
  while (stepBank >= STEP && steps < 8) {
    stepGame(STEP);
    stepBank -= STEP;
    steps++;
  }
  if (steps === 8) stepBank = 0;
  updateEffects(dt);
  // the engine hum follows your speed while racing
  if (screen === 'race' && !paused && !demo) {
    if (!engine) startEngine();
    setEngine(player.speed / MAX_SPEED, player.gear || 0);
    skyOffset += segmentAt(player.z).curve * (player.speed / MAX_SPEED) * dt * 60;
  } else if (demo && segments.length) {
    skyOffset += segmentAt(player.z).curve * (player.speed / MAX_SPEED) * dt * 60;
  }
  draw();
  requestAnimationFrame(loop);
}

// ---------- Test hooks (used by the automated tests; harmless in normal play) ----------
window.GP = {
  get state() {
    return {
      screen, phase, paused, demo, mode, levelName, circuitId, champRound, myPos, raceTime, bestLap, lastLap,
      speed: player ? player.speed : 0, share: player ? player.speed / MAX_SPEED : 0, x: player ? player.x : 0, z: player ? player.z : 0,
      laps: player ? player.laps : 0, lightsOn, trackLength, segments: segments.length, screenAge, engine: !!engine, muted,
      champPoints: champPoints.slice(), results: lastResults.map(r => ({ team: r.team.short, pos: r.pos, time: r.time, best: r.best, points: r.points, isPlayer: r.isPlayer })),
      cars: cars.map(c => ({ team: c.team.short, z: c.z, x: c.x, speed: c.speed, laps: c.laps, pos: c.pos, finish: c.finishTime })),
      particles: particles.length, marks: marks.length
    };
  },
  get input() { return input; }, get held() { return held; }, get pads() { return pads; },
  get autoDrive() { return autoDrive; }, set autoDrive(v) { autoDrive = !!v; },
  get fast() { return fastForward; }, set fast(v) { fastForward = !!v; },
  setTeam(i) { myTeamId = i; },
  startRace(ci, level) { mode = 'quick'; demo = false; setupRace(ci, level); setScreen('race'); },
  startChampionship(level) { levelName = level; startChampionship(); },
  step(dt) { stepGame(dt); screenAge += dt; },
  // Run the current race to the result card as fast as possible (no drawing, no sound)
  runRace(maxSeconds = 600) {
    const keepFast = fastForward, keepAuto = autoDrive;
    fastForward = true; autoDrive = true;
    let t = 0;
    while (screen === 'race' && t < maxSeconds) { stepGame(STEP); t += STEP; }
    fastForward = keepFast; autoDrive = keepAuto;
    screenAge = TAP_GUARD + 1;
    return this.state;
  },
  advance() { screenAge = TAP_GUARD + 1; advance(); },
  setScreen(n) { setScreen(n); }, setPaused(v) { setPaused(v); }, goTitle() { goTitle(); },
  setPhase(p) { phase = p; },
  placeSprite(x) { addSprite(Math.floor(player.z / SEG_LEN) + 3, sprites.tyres, x, true); },
  nudgeRival(i, dz, dx) { cars[i].z = (posZ(player) + dz + trackLength) % trackLength; cars[i].x = player.x + dx; },
  clearSprites(fromSeg, toSeg) { for (let i = fromSeg; i < toSeg; i++) segments[i % segments.length].sprites.length = 0; },
  setSpeed(v) { player.speed = v; }, setX(v) { player.x = v; }, setZ(v) { player.z = v; },
  setChampPoints(list) { champPoints = list.slice(); }, hairpins() { return hairpinStarts(); },
  skipLights() { phase = 'racing'; raceTime = 0; },
  get constants() { return { MAX_SPEED, SEG_LEN, TAP_GUARD, LAPS }; }
};

// ---------- Start ----------
window.addEventListener('resize', resize);
buildSprites();
resize();
goTitle();
requestAnimationFrame(loop);
</script>
