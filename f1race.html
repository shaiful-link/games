<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Grand Prix</title>
<style>
  /* The page is one big canvas. The road, the cars, the HUD, the buttons and the cards are all
     drawn on it. Only the three small corner buttons (Pause, Sound, Say again) are real page buttons. */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0a0f1c;
    color: #ffffff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    touch-action: none;
  }
  #app {
    height: 100vh;
    height: 100dvh;
    /* keeps the game clear of the notch when the phone is sideways */
    padding: 0 env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px);
  }
  #stage { width: 100%; height: 100%; }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  /* Pause (top left corner of the left strip) and Sound (top right corner of the right strip) */
  #sound, #pause {
    position: fixed;
    top: calc(6px + env(safe-area-inset-top, 0px));
    width: 36px;
    height: 36px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,0.10);
    color: #ffffff;
    font-size: 17px;
    line-height: 36px;
    font-family: inherit;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #sound { right: calc(6px + env(safe-area-inset-right, 0px)); }
  #sound.off { opacity: .45; }
  #pause { left: calc(6px + env(safe-area-inset-left, 0px)); display: none; font-size: 13px; font-weight: 800; letter-spacing: 2px; text-indent: 2px; }
  #pause.show { display: block; }

  /* "Say again" repeats the spoken zikir on the result cards */
  #speak {
    position: fixed;
    display: none;
    left: 50%;
    bottom: calc(6px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    height: 34px;
    padding: 0 14px;
    border: 0;
    border-radius: 10px;
    background: rgba(28,39,66,0.9);
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
    font-family: inherit;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #speak.show { display: block; }
</style>
</head>
<body>
<div id="app">
  <div id="stage"><canvas id="game"></canvas></div>
</div>
<button id="pause" aria-label="Pause">II</button>
<button id="sound" aria-label="Sound on or off"></button>
<button id="speak" aria-label="Say again">&#x1F50A; Say again</button>

<script>
// =====================================================
// GRAND PRIX - a behind-the-car Formula-style racing game (OutRun / Top Gear style road)
// Turn the phone sideways. The road is in the middle, the buttons are on the two side strips.
// LEFT thumb:   ◀ steer left (upper button)   ▶ steer right (lower button)
// RIGHT thumb:  ▲ Accelerate (big upper button)   ▼ Brake (lower button)
//               You can hold Accelerate and steer at the same time.
// Stay on the dark road: grass and sand are slow. Brake for the hairpins (watch the 100 / 50 boards).
// Tuck in behind a car to get a slipstream boost, then pull out and pass it.
// Bumping a car or a barrier never breaks your car: you only lose speed and time.
// Quick race: one circuit, 3 laps, 7 rivals. Championship: 5 circuits, points 10-8-6-5-4-3-2-1.
// Keyboard (for laptop testing): arrows steer and accelerate/brake, Z = accelerate, X = brake,
//          P = pause, Space or Enter = OK on the cards.
// Sounds are made by code. The speaker button (top right) turns them on or off.
//
// How the game works inside: the road is a long list of short "segments", each with a curve value
// and a height. Every frame the segments in front of the car are projected onto the screen from
// far to near (classic pseudo-3D). The cars, trees and signs are small pictures painted ONCE onto
// hidden canvases and then stamped onto the road, scaled by their distance. The race itself moves
// in fixed steps (60 per second) so it plays the same on a slow phone and a fast phone.
// =====================================================

// ---------- Settings (change these to experiment) ----------
const LAPS = 3;                       // laps in every race
const RIVALS = 7;                     // computer cars (8 cars in total)
const SEG_LEN = 200;                  // length of one road segment (world units)
const TRACK_SCALE = 2.2;              // stretches every circuit (1 = the lengths written in CIRCUITS; 2.2 = about 35 s laps)
const ROAD_W = 2000;                  // half the width of the road (world units)
const RUMBLE_LEN = 3;                 // segments per light/dark road band
const CAM_HEIGHT = 1000;              // how high the camera floats above the road
const FOV = 100;                      // camera field of view in degrees (wider = faster feeling)
const DRAW_DIST = 300;                // segments drawn ahead (lower = faster on cheap phones)
const FOG_DENSITY = 5;                // how quickly the far road fades into the fog colour
const MAX_SPEED = SEG_LEN * 60;       // top speed in world units per second (one segment per step)
const TOP_KMH = 330;                  // what the speedometer shows at top speed
const ACCEL = MAX_SPEED / 3.4;        // how quickly you speed up
const BRAKING = -MAX_SPEED / 1.5;     // how quickly you slow with the brake
const COASTING = -MAX_SPEED / 6;      // slowing down when you press nothing
const OFFROAD_DECEL = -MAX_SPEED / 1.6; // slowing on grass or sand
const OFFROAD_LIMIT = MAX_SPEED * 0.3;  // the fastest you can go on grass or sand
const RUMBLE_EDGE = 1.0;              // road edge (x is -1 at the left edge, 1 at the right edge)
const GRASS_EDGE = 1.17;              // beyond this you are on the grass
const CENTRIFUGAL = 0.3;              // how hard a curve pushes you outwards
const STEER_RATE = 2.0;               // how fast you move across the road at top speed
const CAR_HALF_W = 0.16;              // half the width of a car in road units (road half-width = 1)
const CAR_LEN = SEG_LEN * 1.2;        // length of a car for collisions (world units)
const PLAYER_AHEAD = CAM_HEIGHT / Math.tan((FOV / 2) * Math.PI / 180);   // how far in front of the camera your car's picture sits
const SLIPSTREAM_DIST = SEG_LEN * 40; // how far behind a car the slipstream works
const SLIPSTREAM_BONUS = 0.06;        // extra top speed in the slipstream (6%)
const HAIRPIN_CURVE = 4.5;            // curves this sharp or sharper get warning boards
const TAP_GUARD = 0.8;                // seconds a result card ignores taps (so a busy thumb cannot skip it)
const SOUND_VOLUME = 0.25;            // 0 = silent, 1 = very loud (for the short sounds)
const ENGINE_VOLUME = 0.12;           // loudness of the continuous engine hum (keep it low)
const MAX_PARTICLES = 160;            // most smoke/dust/sparks/confetti bits at once
const SHAKE_PIXELS = 5;               // how far the picture shakes on a crash
const VIBRATE = true;                 // short buzzes on Android (iPhone does not allow it)
const POINTS = [10, 8, 6, 5, 4, 3, 2, 1];   // championship points for P1..P8
// Messages shown and spoken at the end (zikir)
const MSG_WIN  = 'Alhamdulillah';
const MSG_LOSE = 'Insya-Allah lain kali';
const MSG_DRAW = 'Seri · Alhamdulillah';

// The computer cars. top = share of your top speed (the fastest rival); spread = how much slower the
// slowest one is; corner = share of top speed they keep through a hairpin; accel = how quickly they
// speed up; react = seconds they wait after the lights go out; nerve = how close they drive to others.
const DIFFICULTY = {
  Easy:   { top: 0.80, spread: 0.08, corner: 0.50, accel: 0.70, react: 0.45, nerve: 0.4 },
  Medium: { top: 0.95, spread: 0.06, corner: 0.57, accel: 0.85, react: 0.30, nerve: 0.7 },
  Hard:   { top: 0.995, spread: 0.03, corner: 0.66, accel: 1.00, react: 0.15, nerve: 1.0 }
};

// ---------- Teams ----------
// Eight made-up teams. main = body colour, trim = second colour, helmet = driver's helmet colour.
const TEAMS = [
  { name: 'Harimau Racing', short: 'HAR', number: 1,  main: '#f5c518', trim: '#15171c', helmet: '#f4f4f2' },
  { name: 'Merah Motors',   short: 'MER', number: 7,  main: '#d1232a', trim: '#ffffff', helmet: '#ffd200' },
  { name: 'Biru Dynamics',  short: 'BIR', number: 11, main: '#1f4fd6', trim: '#f5c518', helmet: '#ffffff' },
  { name: 'Silver Arrow',   short: 'SIL', number: 44, main: '#c9ced6', trim: '#1aa7a1', helmet: '#101418' },
  { name: 'Hijau Power',    short: 'HIJ', number: 5,  main: '#13834a', trim: '#f5c518', helmet: '#f5c518' },
  { name: 'Oren Speed',     short: 'ORE', number: 4,  main: '#ff7a00', trim: '#1b3a8a', helmet: '#ffffff' },
  { name: 'Ungu Putih',     short: 'UNG', number: 22, main: '#f2f2f0', trim: '#7a2fd1', helmet: '#7a2fd1' },
  { name: 'Teal Marine',    short: 'TEA', number: 9,  main: '#0f9ea8', trim: '#ffffff', helmet: '#ff7a00' }
];

// ---------- Circuits ----------
// Each circuit lists its road in pieces. ['S', n] = straight of n segments.
// ['C', enter, hold, leave, curve, hill] = a bend that eases in over "enter" segments, holds for
// "hold", eases out over "leave"; curve: negative = left, positive = right (about 6 = hairpin);
// hill = height change over the whole piece (positive = uphill).
// Colours: sky top/bottom, fog, grass (two shades), rumble (two), road (two), lane line, sand shoulder.
const CIRCUITS = [
  { name: 'Kuala Circuit', sub: 'Long straights, two hairpins', theme: 'tropical',
    skyTop: '#2f6fc0', skyBot: '#b9dcf0', fog: '#c6dcd2', sun: '#fff1b8',
    grass: ['#4f9a3a', '#468d33'], shoulder: '#c9b47a', rumble: ['#d7262c', '#f4f4f2'], road: ['#5c5f66', '#55585f'], lane: '#e8e8e4', edge: '#f0f0ee',
    pieces: [['S', 60], ['C', 20, 30, 20, -2.5, 0], ['S', 40], ['C', 15, 24, 15, 6, 0], ['S', 30], ['C', 20, 30, 20, 3, 14], ['S', 50],
             ['C', 20, 20, 20, -3.5, -14], ['S', 20], ['C', 25, 40, 25, 2, 0], ['S', 70], ['C', 15, 24, 15, -6, 0], ['S', 40], ['C', 20, 30, 20, 1.5, 0], ['S', 40]] },
  { name: 'Coastal Run', sub: 'Sea on one side, lighthouse, palms', theme: 'coastal',
    skyTop: '#2a7fd0', skyBot: '#cfe9f7', fog: '#cfe3ee', sun: '#fff6cc',
    grass: ['#b7d06a', '#a9c45c'], shoulder: '#e6d59a', rumble: ['#d7262c', '#f4f4f2'], road: ['#5f6268', '#585b61'], lane: '#e8e8e4', edge: '#f0f0ee',
    pieces: [['S', 50], ['C', 25, 40, 25, 2, 8], ['C', 25, 40, 25, -2, -8], ['S', 40], ['C', 15, 24, 15, 5.5, 0], ['S', 30], ['C', 20, 50, 20, -1.5, 12],
             ['S', 40], ['C', 20, 30, 20, 3.5, -12], ['S', 30], ['C', 20, 40, 20, -3, 0], ['S', 60], ['C', 20, 20, 20, 2, 0], ['S', 40]] },
  { name: 'Highland Loop', sub: 'Hills, tea terraces, mist', theme: 'highland',
    skyTop: '#6f8fb0', skyBot: '#d9e4ea', fog: '#d6dfe3', sun: '#ffffff',
    grass: ['#3f8a3c', '#377f35'], shoulder: '#8a7a55', rumble: ['#d7262c', '#f4f4f2'], road: ['#5a5d63', '#53565c'], lane: '#e2e2de', edge: '#ececea',
    pieces: [['S', 40], ['C', 20, 30, 20, -3, 22], ['C', 20, 30, 20, 3, 18], ['S', 30], ['C', 15, 24, 15, -6, -8], ['S', 30], ['C', 20, 30, 20, 2.5, -20],
             ['S', 40], ['C', 25, 40, 25, -2, 16], ['S', 30], ['C', 15, 22, 15, 5.5, -10], ['S', 40], ['C', 20, 40, 20, 3, -18], ['S', 50]] },
  { name: 'Night City', sub: 'Street circuit under neon lights', theme: 'night',
    skyTop: '#05070f', skyBot: '#1a1f3a', fog: '#141a2e', sun: '#f3f0dc',
    grass: ['#2a2d35', '#262930'], shoulder: '#3a3d46', rumble: ['#c4262c', '#e9e9e7'], road: ['#3b3e45', '#35383f'], lane: '#d8d8d4', edge: '#e4e4e0',
    pieces: [['S', 50], ['C', 15, 25, 15, 3, 0], ['S', 30], ['C', 15, 25, 15, -3, 0], ['S', 40], ['C', 15, 24, 15, 6, 0], ['S', 50], ['C', 20, 30, 20, -2, 0],
             ['S', 30], ['C', 15, 20, 15, 4, 0], ['S', 30], ['C', 15, 20, 15, -4, 0], ['S', 60], ['C', 15, 24, 15, -5.5, 0], ['S', 40]] },
  { name: 'Desert Oval', sub: 'Dunes, oil derricks, sunset', theme: 'desert',
    skyTop: '#5a3a7a', skyBot: '#ffb36b', fog: '#e9b98a', sun: '#ffd27a',
    grass: ['#d9b878', '#cfae6c'], shoulder: '#e6c98a', rumble: ['#d7262c', '#f4f4f2'], road: ['#6a6460', '#625c58'], lane: '#efe8dc', edge: '#f4efe4',
    pieces: [['S', 80], ['C', 30, 60, 30, 2.2, 0], ['S', 90], ['C', 30, 60, 30, 2.2, 0], ['S', 50], ['C', 15, 24, 15, -6, 0], ['S', 60], ['C', 30, 50, 30, 2.5, 10], ['S', 40], ['C', 20, 30, 20, -1.5, -10], ['S', 50]] }
];

// ---------- Testing switches (leave false for normal play) ----------
// autoDrive = true makes a simple robot drive YOUR car (steer to the racing line, full throttle, brake
// for hairpins). fastForward = true skips sounds and effects so a test can call GP.step() in a loop.
let autoDrive = false;
let fastForward = false;

// ---------- Page elements ----------
const stage  = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const btnPause = document.getElementById('pause');
const btnSpeak = document.getElementById('speak');

// ---------- Sound ----------
// All sounds are made by code (short notes and bursts of hiss), so there are no sound files.
// Phones only allow sound after a touch, so the sound engine starts on the first touch.
// The on/off choice is remembered, and is shared by all the games on this site.
const btnSound = document.getElementById('sound');
let audio = null;                // the sound engine (created on first touch)
let muted = false;
try { muted = localStorage.getItem('gamesMuted') === '1'; } catch (e) { /* storage blocked: start with sound on */ }

function showSoundButton() {
  btnSound.textContent = muted ? '\u{1F507}' : '\u{1F50A}';      // speaker off / speaker on
  btnSound.classList.toggle('off', muted);
}
showSoundButton();

function startAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }                                  // no sound support: the game still works
}
for (const type of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(type, startAudio, true);
}

// Play one note.
//   freq = pitch in Hz, dur = seconds, type = 'sine' | 'triangle' | 'square' | 'sawtooth',
//   delay = seconds before it starts, slide = pitch to glide to, volume = share of SOUND_VOLUME
function beep(freq, dur, type = 'sine', delay = 0, slide = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(SOUND_VOLUME * volume, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// Play a burst of hiss (tyre screech, dust, crashes). tone = brightness in Hz.
let noiseBuffer = null;
function noise(dur, tone = 1000, delay = 0, volume = 1, kind = 'lowpass') {
  if (muted || !audio || audio.state !== 'running') return;
  if (!noiseBuffer) {                                            // one second of random hiss, made once
    noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const t = audio.currentTime + delay;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = noiseBuffer;
  src.loop = true;
  filter.type = kind;
  filter.Q.value = kind === 'bandpass' ? 6 : 1;
  filter.frequency.setValueAtTime(tone, t);
  if (kind === 'lowpass') filter.frequency.exponentialRampToValueAtTime(Math.max(60, tone * 0.25), t + dur);
  gain.gain.setValueAtTime(SOUND_VOLUME * volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

// The engine hum: ONE oscillator that runs all through the race. Its pitch follows the speed.
// It is the only continuous sound in the game, so it is kept quiet and stops on pause/result/menu.
let engine = null;               // { osc, filter, gain } while running
function startEngine() {
  if (engine || muted || !audio || audio.state !== 'running' || fastForward) return;
  try {
    const osc = audio.createOscillator();
    const filter = audio.createBiquadFilter();
    const gain = audio.createGain();
    osc.type = 'sawtooth';
    osc.frequency.value = 70;
    filter.type = 'lowpass';
    filter.frequency.value = 500;
    gain.gain.value = 0.0001;
    gain.gain.exponentialRampToValueAtTime(ENGINE_VOLUME, audio.currentTime + 0.2);
    osc.connect(filter).connect(gain).connect(audio.destination);
    osc.start();
    engine = { osc, filter, gain };
  } catch (e) { engine = null; }
}
function stopEngine() {
  if (!engine) return;
  try {
    const t = audio.currentTime;
    engine.gain.gain.cancelScheduledValues(t);
    engine.gain.gain.setValueAtTime(Math.max(0.0001, engine.gain.gain.value), t);
    engine.gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    engine.osc.stop(t + 0.15);
  } catch (e) {}
  engine = null;
}
// Called every frame with the speed share (0 to 1). The pitch climbs inside each "gear" and drops at a shift.
function setEngine(share, gear) {
  if (!engine) return;
  const inGear = Math.max(0, share * 7 - gear);                  // 0 at the start of the gear, 1 at the shift point
  const freq = 62 + gear * 9 + inGear * 95 + share * 25;
  engine.osc.frequency.setTargetAtTime(freq, audio.currentTime, 0.04);
  engine.filter.frequency.setTargetAtTime(350 + share * 1400, audio.currentTime, 0.05);
}

// Short buzz on Android phones (iPhone does not allow this from a web page)
function buzz(ms) {
  if (demo || fastForward) return;
  if (VIBRATE && !muted && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

btnSound.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('gamesMuted', muted ? '1' : '0'); } catch (e) {}
  showSoundButton();
  startAudio();
  btnSound.blur();
  if (muted) stopEngine();
  else setTimeout(() => beep(740, 0.05, 'sine', 0, 0, 0.6), 60);   // small note to confirm sound is on
});

// Some sounds can happen many times a second. This says "yes" only if the same sound has not played
// in the last few milliseconds.
const lastPlayed = {};
function notTooSoon(name, gapMs = 80) {
  const now = performance.now();
  if (lastPlayed[name] && now - lastPlayed[name] < gapMs) return false;
  lastPlayed[name] = now;
  return true;
}

// The game's sounds: one small function per event
const sfx = {
  tick() { beep(520, 0.05, 'triangle', 0, 0, 0.5); },
  select() { beep(660, 0.06, 'triangle', 0, 0, 0.5); beep(880, 0.08, 'triangle', 0.06, 0, 0.5); },
  // Start lights: one short beep per red light, then a longer higher one when they go out
  light() { beep(880, 0.12, 'square', 0, 0, 0.35); },
  lightsOut() { beep(1320, 0.5, 'square', 0, 0, 0.45); },
  // Gear change: a tiny blip
  shift() { if (notTooSoon('shift', 200)) beep(190, 0.05, 'sawtooth', 0, 120, 0.3); },
  // Tyres sliding on a fast corner: a thin whistle of hiss
  screech() { if (notTooSoon('screech', 220)) noise(0.25, 2600, 0, 0.3, 'bandpass'); },
  // Driving on grass or sand: a low rumble
  offroad() { if (notTooSoon('offroad', 160)) noise(0.2, 240, 0, 0.5); },
  // Running over a rumble strip: a quick tick
  rumble() { if (notTooSoon('rumble', 90)) noise(0.04, 900, 0, 0.25); },
  // Hitting a barrier or a car: a dull thud with a crack of hiss
  crash(power) {
    if (!notTooSoon('crash', 150)) return;
    beep(90, 0.18, 'sine', 0, 40, 0.9);
    noise(0.22, 700 + power * 1500, 0, 0.6);
    buzz(40);
  },
  // Scraping along another car: a short rasp
  scrape() { if (notTooSoon('scrape', 180)) noise(0.12, 1800, 0, 0.3); },
  // Passing a car: a swoosh (the hiss sweeps down)
  overtake() { if (notTooSoon('overtake', 400)) noise(0.3, 3200, 0, 0.45); },
  // Lap done: two rising notes. Best lap: three.
  lap() { beep(784, 0.1, 'triangle', 0, 0, 0.6); beep(1047, 0.16, 'triangle', 0.1, 0, 0.6); },
  bestLap() { beep(784, 0.1, 'triangle', 0, 0, 0.6); beep(1047, 0.1, 'triangle', 0.1, 0, 0.6); beep(1568, 0.22, 'triangle', 0.2, 0, 0.6); },
  // Finish: a short fanfare (win) or a soft falling tune (lose)
  fanfare() {
    const notes = [523, 523, 523, 659, 784, 659, 784, 1047];
    const times = [0, 0.14, 0.28, 0.42, 0.6, 0.78, 0.92, 1.1];
    for (let i = 0; i < notes.length; i++) beep(notes[i], i === notes.length - 1 ? 0.7 : 0.15, 'triangle', times[i], 0, 0.8);
    beep(659, 0.7, 'sine', 1.1, 0, 0.5);
    beep(784, 0.7, 'sine', 1.1, 0, 0.5);
  },
  win() { const n = [523, 659, 784, 1047]; for (let i = 0; i < n.length; i++) beep(n[i], 0.16, 'triangle', 0.3 + i * 0.12, 0, 0.8); },
  lose() { const n = [392, 330, 262, 196]; for (let i = 0; i < n.length; i++) beep(n[i], 0.22, 'triangle', 0.3 + i * 0.17, 0, 0.7); },
  pop() { if (notTooSoon('pop', 200)) noise(0.18, 1100, 0, 0.3); }
};
// Play a race sound by name. The demo race behind the title and fast test races stay silent.
function sound(name, value) {
  if (fastForward || demo) return;
  sfx[name](value);
}

// ---------- Speaking the zikir ----------
// Speak a short phrase with the phone's built-in voice (nothing to download).
// Uses an Arabic voice for the zikir if the phone has one, otherwise a Malay voice, otherwise the default.
const SPEAK = true;                // false = never speak
let lastSpoken = '';
function speak(text, delay = 0) {
  if (!SPEAK || muted || !('speechSynthesis' in window)) return;
  try {
    // Arabic spelling for the Arabic voice, so the pronunciation is right
    const ARABIC = {
      'Alhamdulillah': 'اَلْحَمْدُ لِلَّهِ',
      'Insya-Allah lain kali': 'إِنْشَاءَ اللّٰهُ',
      'Seri · Alhamdulillah': 'اَلْحَمْدُ لِلَّهِ'
    };
    const voices = window.speechSynthesis.getVoices();
    const arabic = voices.find(v => /^ar/i.test(v.lang));
    const u = new SpeechSynthesisUtterance(arabic && ARABIC[text] ? ARABIC[text] : text);
    if (arabic) { u.voice = arabic; u.lang = arabic.lang; }
    else {
      const malay = voices.find(v => /^ms/i.test(v.lang)) || voices.find(v => /^id/i.test(v.lang));
      if (malay) { u.voice = malay; u.lang = malay.lang; } else u.lang = 'ar-SA';
    }
    u.rate = 0.8;
    u.volume = 1;
    // iPhone: cancel() right before speak() can swallow the phrase when the game ends on its own.
    // Only clear if something is still talking, wake the engine up, and say it again if it did not
    // start within a second. Also step out of the drawing loop (setTimeout 0): iPhone can ignore
    // speak() from inside an animation frame. If it still has not started, say it on the next tap.
    let started = false;
    u.onstart = () => { started = true; pendingSpeech = null; };
    pendingSpeech = u;
    setTimeout(() => {
      try {
        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(u);
      } catch (e) {}
      setTimeout(() => { if (!started) { try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) {} } }, 1000);
    }, delay * 1000);
    lastSpoken = text;
  } catch (e) { /* no voice on this phone: the game still works */ }
}
if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); }
// iPhone only allows speech soon after a touch. Saying an empty phrase on the first touch unlocks
// the voice, so the zikir can still be spoken later when the race ends on its own.
let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try { window.speechSynthesis.resume(); const u = new SpeechSynthesisUtterance(' '); window.speechSynthesis.speak(u); } catch (e) {}
}
for (const type of ['pointerdown', 'touchend', 'click', 'keydown']) window.addEventListener(type, unlockSpeech, true);
let pendingSpeech = null;   // a zikir the phone has not said yet
function retryPendingSpeech() {
  if (!pendingSpeech) return;
  const u = pendingSpeech; pendingSpeech = null;
  try { window.speechSynthesis.cancel(); window.speechSynthesis.resume(); window.speechSynthesis.speak(u); } catch (e) {}
}
for (const type of ['pointerup', 'touchend', 'click']) window.addEventListener(type, retryPendingSpeech, true);
btnSpeak.addEventListener('click', () => { startAudio(); btnSpeak.blur(); if (lastSpoken) speak(lastSpoken); });

let levelName = 'Easy';          // chosen difficulty
let circuitId = 0;               // which line of CIRCUITS is being drawn/raced right now
let pickedCircuit = 0;           // the circuit chosen on the menu for a quick race
let champRound = 0;              // 0..4 in the championship
let champPoints = [];            // points per team in the championship

// The race
let segments = [];               // the road
let trackLength = 0;             // segments.length * SEG_LEN
let cars = [];                   // cars[0] = you, the rest are rivals
let player = null;               // = cars[0]
let phase = 'grid';              // 'grid' | 'lights' | 'racing' | 'finished'
let phaseT = 0;                  // seconds in the current phase
let lightsOn = 0;                // red lights lit (0 to 5)
let lightsGap = 0;               // seconds until the lights go out after the fifth
let raceTime = 0;                // seconds since the lights went out
let finishT = 0;                 // seconds since you crossed the line

let bestLap = 0;                 // your best lap this race (0 = none yet)
let lastLap = 0;                 // your last lap time
let lapFlash = 0;                // seconds left to flash the last lap time
let marks = [];                  // skid marks on the road: { seg, x, life }
let minimapOrder = [];           // cars sorted by progress (reused every step)

// What your thumbs are asking for right now
const input = { steer: 0, accel: false, brake: false };

// Effects (looks only)
let particles = [];              // smoke, dust, sparks, confetti: { x, y, vx, vy, t, life, size, color, kind, spin }
let shakeTime = 0;
let shakeSize = 0;

// ---------- Small helpers ----------
function clamp(v, low, high) { return v < low ? low : (v > high ? high : v); }
function lerp(a, b, k) { return a + (b - a) * k; }
function easeIn(a, b, k) { return a + (b - a) * k * k; }
function easeOut(a, b, k) { return a + (b - a) * (1 - (1 - k) * (1 - k)); }
function easeInOut(a, b, k) { return a + (b - a) * (-Math.cos(k * Math.PI) / 2 + 0.5); }
function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

// Make a colour darker (amount below 0) or lighter (amount above 0). amount goes from -1 to 1.
function shade(hex, amount) {
  const target = amount < 0 ? 0 : 255;
  const share = Math.abs(amount);
  let out = '#';
  for (let i = 1; i < 7; i += 2) {
    const part = parseInt(hex.slice(i, i + 2), 16);
    const mixed = Math.round(part + (target - part) * share);
    out += mixed.toString(16).padStart(2, '0');
  }
  return out;
}
// Is a colour light? (used to choose black or white writing on top of it)
function isLight(hex) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return r * 0.3 + g * 0.59 + b * 0.11 > 150;
}
// A "pop" curve: goes from 0 to 1, overshooting a little on the way
function popCurve(k) {
  const back = clamp(k, 0, 1) - 1;
  return 1 + 2.7 * back * back * back + 1.7 * back * back;
}
// Random numbers that come out the same every time (so scenery does not change on resize)
let seed = 1;
function seededRandom() {
  seed = (seed * 16807) % 2147483647;
  return seed / 2147483647;
}
// "1:23.456" for a lap time in seconds
function timeText(t) {
  if (!t) return '-:--.---';
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ':' + (s < 10 ? '0' : '') + s.toFixed(3);
}
// Distance between two track positions, going the short way round the loop (-L/2 .. L/2)
function trackGap(fromZ, toZ) {
  let d = toZ - fromZ;
  if (d > trackLength / 2) d -= trackLength;
  if (d < -trackLength / 2) d += trackLength;
  return d;
}
function segmentAt(z) {
  return segments[Math.floor(((z % trackLength) + trackLength) % trackLength / SEG_LEN)];
}
// Where a car really is on the track. Your car's picture sits a little in FRONT of the camera
// (player.z is the camera), so for collisions, laps and the AI we use the picture's position.
function posZ(c) {
  return c.isPlayer ? (c.z + PLAYER_AHEAD) % trackLength : c.z;
}

// ---------- Building the road ----------
// Each segment remembers its two end points (p1 near, p2 far) in world units, plus the curve
// value, the scenery sprites on it, and scratch space for the projection each frame.
function lastY() { return segments.length ? segments[segments.length - 1].p2.world.y : 0; }

function addSegment(curve, y) {
  const n = segments.length;
  segments.push({
    index: n,
    p1: { world: { x: 0, y: lastY(), z: n * SEG_LEN }, camera: { x: 0, y: 0, z: 0 }, screen: { x: 0, y: 0, w: 0, scale: 0 } },
    p2: { world: { x: 0, y: y, z: (n + 1) * SEG_LEN }, camera: { x: 0, y: 0, z: 0 }, screen: { x: 0, y: 0, w: 0, scale: 0 } },
    curve,
    band: Math.floor(n / RUMBLE_LEN) % 2,   // 0 or 1: light or dark road band
    sprites: [],                            // scenery: { img, x, collide }
    cars: [],                               // cars on this segment this frame (rebuilt every frame)
    clip: 0, fog: 0, looped: false
  });
}

// A piece of road: curve eases in, holds, eases out; the height changes smoothly over the whole piece
function addRoad(enter, hold, leave, curve, hill) {
  const startY = lastY(), endY = startY + hill * SEG_LEN;
  const total = enter + hold + leave;
  for (let n = 0; n < enter; n++) addSegment(easeIn(0, curve, n / enter), easeInOut(startY, endY, n / total));
  for (let n = 0; n < hold; n++) addSegment(curve, easeInOut(startY, endY, (enter + n) / total));
  for (let n = 0; n < leave; n++) addSegment(easeInOut(curve, 0, n / leave), easeInOut(startY, endY, (enter + hold + n) / total));
}

function buildTrack(circuit) {
  segments = [];
  const k = TRACK_SCALE;
  for (const piece of circuit.pieces) {
    if (piece[0] === 'S') addRoad(0, Math.round(piece[1] * k), 0, 0, 0);
    else addRoad(Math.round(piece[1] * k), Math.round(piece[2] * k), Math.round(piece[3] * k), piece[4], piece[5] * k);
  }
  // make the loop close: ease the last segments' height back to the start height
  const n = segments.length;
  const fixFrom = n - 40;
  for (let i = fixFrom; i < n; i++) {
    segments[i].p1.world.y = easeInOut(segments[fixFrom].p1.world.y, 0, (i - fixFrom) / 40);
    segments[i].p2.world.y = easeInOut(segments[fixFrom].p1.world.y, 0, (i + 1 - fixFrom) / 40);
  }
  trackLength = n * SEG_LEN;
  placeScenery(circuit);
}

// Put a sprite on a segment. x is in road units (1 = right road edge). collide = you bounce off it.
function addSprite(seg, img, x, collide) {
  segments[((seg % segments.length) + segments.length) % segments.length].sprites.push({ img, x, collide: !!collide });
}

// Where the hairpins are: the first segment of every run of very sharp curve
function hairpinStarts() {
  const out = [];
  for (let i = 0; i < segments.length; i++) {
    const c = segments[i].curve, prev = segments[(i + segments.length - 1) % segments.length].curve;
    if (Math.abs(c) >= HAIRPIN_CURVE && Math.abs(prev) < HAIRPIN_CURVE) out.push(i);
  }
  return out;
}

// Scenery for a circuit, chosen by its theme. Sprites are made once (see "Pre-painted pictures").
function placeScenery(c) {
  seed = 7 + CIRCUITS.indexOf(c) * 101;
  const S = sprites;
  const n = segments.length;
  // --- things every circuit has ---
  addSprite(1, S.gantry, 0, false);                                             // start/finish gantry over the road
  for (let i = 4; i < 60; i += 5) addSprite(i, S.pitwall, -1.45, true);         // pit wall on the left after the line
  for (let i = 6; i < 58; i += 13) addSprite(i, S.grandstand, 2.6, true);        // grandstands on the right
  for (let i = 18; i < 50; i += 16) addSprite(i, S.grandstand, -3.4, true);
  addSprite(Math.floor(n / 3), S.sector, -1.55, false);                          // sector boards
  addSprite(Math.floor(2 * n / 3), S.sector, 1.55, false);
  for (const h of hairpinStarts()) {
    const dir = Math.sign(segments[h + 1 < n ? h + 1 : 0].curve);              // +1 = right-hand hairpin
    const outside = -dir;                                                        // boards stand on the outside
    addSprite(h - 14, S.board100, outside * 1.5, true);                           // braking boards: 100 m then 50 m
    addSprite(h - 7, S.board50, outside * 1.5, true);
    for (let k = 2; k < 30; k += 4) addSprite(h + k, dir > 0 ? S.chevronR : S.chevronL, outside * 1.55, true);   // arrows round the bend
    for (let k = 0; k < 34; k += 3) addSprite(h + k, S.tyres, outside * 1.32, true);                             // tyre barrier on the outside
    for (let k = 6; k < 26; k += 5) addSprite(h + k, S.tyres, dir * 1.32, true);                                  // and a shorter one inside
  }
  // --- theme scenery ---
  for (let i = 60; i < n; i++) {
    if (segments[i].sprites.length) continue;                                    // keep hairpin furniture clear
    const r = seededRandom();
    if (c.theme === 'tropical') {
      if (r < 0.28) addSprite(i, S.palm, (r < 0.14 ? -1 : 1) * (1.6 + seededRandom() * 1.2), true);
      else if (r < 0.40) addSprite(i, S.tree, (r < 0.34 ? -1 : 1) * (1.8 + seededRandom() * 1.5), true);
      else if (r < 0.46) addSprite(i, S.bush, (r < 0.43 ? -1 : 1) * (1.35 + seededRandom() * 0.6), false);
      else if (r < 0.49) addSprite(i, S.flagpole, (r < 0.475 ? -1 : 1) * 1.5, true);
    } else if (c.theme === 'coastal') {
      if (r < 0.22) addSprite(i, S.palm, -(1.6 + seededRandom() * 1.4), true);  // land side (left) has the palms
      else if (r < 0.30) addSprite(i, S.bush, -(1.35 + seededRandom() * 0.6), false);
      else if (r < 0.36) addSprite(i, S.rock, (r < 0.33 ? -1 : 1) * (1.4 + seededRandom() * 0.8), true);
      else if (r < 0.40) addSprite(i, S.palm, 1.8 + seededRandom() * 0.8, true);
      else if (r < 0.43) addSprite(i, S.hut, (r < 0.415 ? -1 : 1) * 2.4, true);
    } else if (c.theme === 'highland') {
      if (r < 0.22) addSprite(i, S.terrace, (r < 0.11 ? -1 : 1) * (2.8 + seededRandom() * 1.5), true);
      else if (r < 0.40) addSprite(i, S.tree, (r < 0.31 ? -1 : 1) * (1.6 + seededRandom() * 1.6), true);
      else if (r < 0.46) addSprite(i, S.bush, (r < 0.43 ? -1 : 1) * (1.35 + seededRandom() * 0.5), false);
      else if (r < 0.48) addSprite(i, S.rock, (r < 0.47 ? -1 : 1) * 1.45, true);
    } else if (c.theme === 'night') {
      if (i % 9 === 0) addSprite(i, S.lamp, (i % 18 === 0 ? -1 : 1) * 1.4, true);
      if (r < 0.30) addSprite(i, pick([S.towerA, S.towerB, S.towerC]), (r < 0.15 ? -1 : 1) * (2.2 + seededRandom() * 1.6), true);
      else if (r < 0.36) addSprite(i, S.barrier, (r < 0.33 ? -1 : 1) * 1.3, true);
    } else if (c.theme === 'desert') {
      if (r < 0.18) addSprite(i, S.dune, (r < 0.09 ? -1 : 1) * (2.6 + seededRandom() * 2), true);
      else if (r < 0.24) addSprite(i, S.derrick, (r < 0.21 ? -1 : 1) * (2.4 + seededRandom() * 1.2), true);
      else if (r < 0.31) addSprite(i, S.datepalm, (r < 0.275 ? -1 : 1) * (1.6 + seededRandom() * 0.8), true);
      else if (r < 0.34) addSprite(i, S.rock, (r < 0.325 ? -1 : 1) * (1.4 + seededRandom() * 0.6), true);
    }
  }
  if (c.theme === 'coastal') addSprite(Math.floor(n * 0.55), S.lighthouse, 3.2, true);
  if (c.theme === 'tropical') for (let i = 70; i < n; i += 90) addSprite(i, S.grandstand, (i % 180 ? 1 : -1) * 2.8, true);
}

// ---------- Setting up a race ----------
function makeCar(teamId, isPlayer) {
  return {
    team: TEAMS[teamId], teamId, isPlayer,
    z: 0, x: 0,                  // position along the track (world units) and across it (-1..1)
    speed: 0,                    // world units per second
    laps: 0, armed: false,       // laps done; armed = past half way, so the next line crossing counts
    lapStart: 0,                 // raceTime when this lap started
    finishTime: 0,               // 0 = still racing
    best: 0,
    // rivals only
    topSpeed: 0, cornerShare: 0.55, accelShare: 1, react: 0, nerve: 0.5,
    wantX: 0,                    // the lane the rival is heading for
    steer: 0,                    // -1..1 how the car is turning (for the sprite angle)
    bounce: 0,                   // sideways push left over from a crash
    braking: false, slip: false, // for the brake light and the slipstream glow
    gear: 0,                     // the speed band (for the gear-shift blip and the HUD)
    bump: 0                      // seconds of "just hit something" (for sparks and smoke)
  };
}

function setupRace(cId, level) {
  circuitId = cId;
  levelName = level;
  const circuit = CIRCUITS[cId];
  buildTrack(circuit);
  buildBackgrounds(circuit);
  // your own car gets a bigger, crisper picture set (made once per team)
  if (!playerSprites || playerSprites.teamId !== myTeamId) { playerSprites = buildCarSet(myTeamId, 480); playerSprites.teamId = myTeamId; }
  const d = DIFFICULTY[level];
  cars = [makeCar(myTeamId, true)];
  const others = [];
  for (let i = 0; i < TEAMS.length; i++) if (i !== myTeamId) others.push(i);
  // a random grid order for the rivals; the fastest rival is on pole
  for (let i = others.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [others[i], others[j]] = [others[j], others[i]]; }
  for (let i = 0; i < RIVALS; i++) {
    const r = makeCar(others[i], false);
    r.topSpeed = MAX_SPEED * (d.top - d.spread * (i / (RIVALS - 1)));
    r.cornerShare = d.corner - 0.02 * (i / (RIVALS - 1));
    r.accelShare = d.accel * (1 - 0.05 * (i / (RIVALS - 1)));
    r.react = d.react + Math.random() * 0.25;
    r.nerve = d.nerve;
    cars.push(r);
  }
  player = cars[0];
  // the grid: pole on the right, then alternating, each row two segments further back. You are last.
  const n = segments.length;
  const order = cars.slice(1).concat([player]);
  for (let k = 0; k < order.length; k++) {
    const c = order[k];
    c.z = (n - 6 - k * 2) * SEG_LEN - (c.isPlayer ? PLAYER_AHEAD : 0);
    c.x = k % 2 === 0 ? 0.42 : -0.42;
    c.wantX = c.x;
  }
  phase = 'grid'; phaseT = 0; lightsOn = 0; lightsGap = 0;
  raceTime = 0; finishT = 0; myPos = cars.length; bestLap = 0; lastLap = 0; lapFlash = 0;
  marks = []; particles = []; shakeTime = 0; skyOffset = 0;
  lastResults = [];
}

// A quiet race drives itself behind the title and menu cards, so the screen is never empty.
// It starts already rolling (no grid, no lights) and restarts itself when it ends.
function startDemo() {
  demo = true;
  const keepLevel = levelName;                                   // the demo must not change the level you picked
  setupRace(Math.floor(Math.random() * CIRCUITS.length), 'Medium');
  levelName = keepLevel;
  phase = 'racing'; raceTime = 0;
  for (const c of cars) { c.speed = MAX_SPEED * 0.6; c.z = (c.z + SEG_LEN * 30) % trackLength; }
}

// ---------- Moving between screens ----------
function setScreen(name) {
  screen = name;
  screenAge = 0;
  paused = false;
  uiFocus = 0;
  resetInput();
  btnPause.classList.toggle('show', name === 'race');
  btnSpeak.classList.toggle('show', name === 'result' || name === 'trophy' || name === 'consol');
  if (name !== 'race') stopEngine();
  if (name === 'race') demo = false;
}

function goTitle() { startDemo(); setScreen('title'); }

function startQuickRace() {
  mode = 'quick';
  setupRace(pickedCircuit, levelName);
  setScreen('race');
}

function startChampionship() {
  mode = 'champ';
  champRound = 0;
  champPoints = TEAMS.map(() => 0);
  setupRace(0, levelName);
  setScreen('race');
}

// Result card -> standings -> next race / trophy / consoling card
function advance() {
  if (screenAge < TAP_GUARD) return;                             // a thumb still mashing buttons cannot skip a result
  if (screen === 'result') {
    sfx.tick();
    if (mode === 'quick') { goTitle(); return; }
    setScreen('standings');
  } else if (screen === 'standings') {
    sfx.select();
    if (champRound < CIRCUITS.length - 1) {
      champRound++;
      setupRace(champRound, levelName);
      setScreen('race');
    } else {
      const won = championWinner() === myTeamId;
      setScreen(won ? 'trophy' : 'consol');
      particles = [];
      fireworkTimer = 0;
      if (won) { sfx.fanfare(); buzz(40); speak(MSG_WIN, 0.4); }
      else { sfx.lose(); speak(MSG_LOSE, 0.4); }
    }
  } else if (screen === 'trophy' || screen === 'consol') { sfx.tick(); goTitle(); }
}

// Who leads the championship (ties go to the team listed first)
function championWinner() {
  let best = 0;
  for (let i = 1; i < champPoints.length; i++) if (champPoints[i] > champPoints[best]) best = i;
  return best;
}

function setPaused(on) {
  if (screen !== 'race') return;
  paused = on;
  screenAge = 0;
  uiFocus = 0;
  resetInput();
  if (on) stopEngine();
}

// ---------- The race, one step at a time ----------
const STEP = 1 / 60;

// The curve of the road a little way ahead of a car (used by the rivals and the auto-driver)
function curveAhead(z, segmentsAhead) {
  let sum = 0;
  const start = Math.floor(z / SEG_LEN);
  for (let i = 1; i <= segmentsAhead; i++) sum += segments[(start + i) % segments.length].curve;
  return sum / segmentsAhead;
}
// The sharpest curve in the next few segments
function sharpestAhead(z, segmentsAhead) {
  let worst = 0;
  const start = Math.floor(z / SEG_LEN);
  for (let i = 1; i <= segmentsAhead; i++) {
    const c = segments[(start + i) % segments.length].curve;
    if (Math.abs(c) > Math.abs(worst)) worst = c;
  }
  return worst;
}

// How far along the race a car is (for positions). Cars still behind the start line count as negative.
function progressOf(c) {
  if (c.finishTime) return LAPS * trackLength + 1e7 / c.finishTime;   // finished cars rank by their time
  let z = posZ(c);
  if (!c.armed && z > trackLength / 2) z -= trackLength;
  return c.laps * trackLength + z;
}

// Sort the cars by progress; set everybody's position number
function updatePositions() {
  minimapOrder.length = 0;
  for (const c of cars) minimapOrder.push(c);
  minimapOrder.sort((a, b) => progressOf(b) - progressOf(a));
  for (let i = 0; i < minimapOrder.length; i++) minimapOrder[i].pos = i + 1;
  const newPos = player.pos;
  if (phase === 'racing' && newPos < myPos) sound('overtake');
  myPos = newPos;
}

// The simple robot driver used for testing (and it also drives your car after the finish line)
function autoSteer(c) {
  const z = posZ(c);
  const curve = curveAhead(z, 12);
  let wantX = clamp(-curve * 0.22, -0.6, 0.6);                   // hug the inside of the bend
  // keep away from a car just ahead
  for (const o of cars) {
    if (o === c) continue;
    const gap = trackGap(z, posZ(o));
    if (gap > 0 && gap < SEG_LEN * 7 && Math.abs(o.x - c.x) < 0.4) wantX = o.x > 0 ? Math.min(wantX, o.x - 0.5) : Math.max(wantX, o.x + 0.5);
  }
  input.steer = clamp((wantX - c.x) * 4, -1, 1);
  const sharp = Math.abs(sharpestAhead(z, 28));
  const share = c.speed / MAX_SPEED;
  input.brake = sharp >= HAIRPIN_CURVE && share > 0.58;
  input.accel = !input.brake;
}

function stepRace(dt) {
  phaseT += dt;
  // --- the start: cars sit on the grid, five lights come on one per second, then go out ---
  if (phase === 'grid' && phaseT > 1.2) { phase = 'lights'; phaseT = 0; lightsOn = 0; lightsGap = 0.6 + Math.random() * 1.2; }
  if (phase === 'lights') {
    const wanted = Math.min(5, Math.floor(phaseT / 1.0) + 1);
    if (wanted > lightsOn) { lightsOn = wanted; sound('light'); }
    if (lightsOn === 5 && phaseT > 5 + lightsGap) {
      phase = 'racing'; phaseT = 0; lightsOn = 0; raceTime = 0;
      sound('lightsOut');
      for (const c of cars) c.lapStart = 0;
    }
  }
  const racing = phase === 'racing' || phase === 'finished';
  if (racing) raceTime += dt;
  if (phase === 'finished') finishT += dt;

  // --- your car ---
  if (autoDrive || demo || phase === 'finished') autoSteer(player);
  if (phase === 'finished') { input.accel = false; input.brake = false; }   // roll to a stop after the flag
  stepPlayer(dt, racing && phase !== 'finished');
  // --- the rivals ---
  for (let i = 1; i < cars.length; i++) stepRival(cars[i], dt, racing);
  // --- cars touching ---
  for (let i = 0; i < cars.length; i++) for (let j = i + 1; j < cars.length; j++) carsTouch(cars[i], cars[j], dt);
  // --- laps and positions ---
  for (const c of cars) stepLaps(c);
  updatePositions();
  // --- the finish: result card a moment after you cross the line ---
  if (phase === 'finished' && finishT > 2.2) finishRace();
  if (lapFlash > 0) lapFlash -= dt;
  for (let i = marks.length - 1; i >= 0; i--) { marks[i].life -= dt; if (marks[i].life <= 0) marks.splice(i, 1); }
}

// Move a car along the track, wrapping at the end of the loop
function moveCar(c, dt) {
  c.z += c.speed * dt;
  if (c.z >= trackLength) c.z -= trackLength;
  if (c.z < 0) c.z += trackLength;
}

function stepPlayer(dt, canDrive) {
  const p = player;
  const pz = posZ(p);
  const seg = segmentAt(pz);
  const share = p.speed / MAX_SPEED;
  const onGrass = Math.abs(p.x) > GRASS_EDGE;
  const onRumble = !onGrass && Math.abs(p.x) > RUMBLE_EDGE;
  const steer = canDrive ? input.steer : 0;
  // steering and the curve pushing outwards
  const dx = dt * STEER_RATE * share;
  p.x += steer * dx;
  p.x -= dx * share * seg.curve * CENTRIFUGAL;
  p.x += p.bounce * dt * 3;
  p.bounce *= Math.max(0, 1 - dt * 6);
  p.steer += (steer - p.steer) * Math.min(1, dt * 10);
  // speed: engine, brake, coasting, grass
  let accel = 0;
  if (canDrive && input.accel && !input.brake) accel = ACCEL * (1 - share * 0.35);
  else if (canDrive && input.brake) accel = BRAKING;
  else accel = COASTING;
  let top = MAX_SPEED;
  // slipstream: a car within 40 segments ahead and roughly in line gives a little extra speed
  p.slip = false;
  for (let i = 1; i < cars.length; i++) {
    const o = cars[i];
    const gap = trackGap(pz, o.z);
    if (gap > CAR_LEN && gap < SLIPSTREAM_DIST && Math.abs(o.x - p.x) < 0.3 && o.speed > MAX_SPEED * 0.4) { p.slip = true; break; }
  }
  if (p.slip) { top *= 1 + SLIPSTREAM_BONUS; if (accel > 0) accel *= 1.25; }
  if (onGrass) {
    if (p.speed > OFFROAD_LIMIT) accel = OFFROAD_DECEL;
    if (p.speed > MAX_SPEED * 0.15 && !fastForward) {
      sound('offroad');
      if (Math.random() < 0.6) dustPuff(p, CIRCUITS[circuitId].theme === 'desert' || CIRCUITS[circuitId].theme === 'coastal' ? '#d9c08c' : '#8a7a48');
    }
  } else if (onRumble) {
    accel -= MAX_SPEED * 0.12;                                   // the kerb scrubs a little speed
    if (p.speed > MAX_SPEED * 0.1) { sound('rumble'); if (notTooSoon('buzz', 150)) buzz(10); if (shakeTime <= 0) { shakeTime = 0.06; shakeSize = 1.5; } }
  }
  p.braking = canDrive && input.brake && p.speed > MAX_SPEED * 0.05;
  if (p.braking && share > 0.5 && !fastForward) {
    if (Math.random() < 0.5) tyreSmoke(p);
    if (notTooSoon('mark', 50)) addMark(p);
  }
  p.speed = clamp(p.speed + accel * dt, 0, top);
  if (p.speed < 0) p.speed = 0;
  if (!canDrive && phase !== 'finished') p.speed = 0;            // nobody moves before the lights go out
  // gear blips: the "gear" is just the speed split into 7 bands
  const gear = Math.min(6, Math.floor(share * 7));
  if (canDrive && gear !== p.gear) { if (gear > (p.gear || 0)) sound('shift'); p.gear = gear; }
  // tyre screech on a fast bend
  if (Math.abs(seg.curve) >= 2 && share > 0.6 && Math.abs(steer) > 0.5 && !fastForward) sound('screech');
  // roadside objects: bounce back onto the road and lose a lot of speed
  if (Math.abs(p.x) > 1.2) {
    for (const s of seg.sprites) {
      if (!s.collide) continue;
      const half = s.img.ww / 2;
      if (Math.abs(p.x - s.x) < half + CAR_HALF_W) {
        sound('crash', share);
        p.speed *= 0.25;
        p.bounce = -Math.sign(p.x) * 0.5;
        p.x = Math.sign(p.x) * Math.max(1.05, Math.abs(s.x) - half - CAR_HALF_W);
        p.bump = 0.4;
        shakeTime = 0.3; shakeSize = SHAKE_PIXELS;
        sparks(p, 12);
        break;
      }
    }
  }
  p.x = clamp(p.x, -3, 3);
  if (p.bump > 0) p.bump -= dt;
  moveCar(p, dt);
}

// A computer car: aims for a target speed and a lane, slows for bends and for cars ahead
function stepRival(r, dt, racing) {
  if (!racing || raceTime < r.react) { r.speed = 0; return; }
  const curve = curveAhead(r.z, 10);
  const sharp = sharpestAhead(r.z, 22);
  // target speed: top speed, lowered for sharp bends ahead
  let want = r.topSpeed;
  if (Math.abs(sharp) >= 2) want = Math.min(want, MAX_SPEED * clamp(1.25 - Math.abs(sharp) * (1.25 - r.cornerShare) / 6, r.cornerShare, 1));
  // racing line: toward the inside of the bend
  let wantX = clamp(-curve * 0.2, -0.55, 0.55);
  // look at the cars ahead: pull out to pass if there is room, otherwise wait behind
  let blocked = false;
  const look = SEG_LEN * (6 + r.nerve * 6);
  for (const o of cars) {
    if (o === r) continue;
    const gap = trackGap(r.z, posZ(o));
    if (gap > 0 && gap < look && Math.abs(o.x - r.x) < CAR_HALF_W * 2 + 0.08) {
      const roomLeft = laneFree(r, o.x - 0.5), roomRight = laneFree(r, o.x + 0.5);
      if (roomLeft || roomRight) {
        const goLeft = roomLeft && (!roomRight || (o.x > 0));
        wantX = clamp(o.x + (goLeft ? -0.5 : 0.5), -0.8, 0.8);
      }
      if (gap < SEG_LEN * (2.5 + (1 - r.nerve) * 3) && Math.abs(o.x - r.x) < CAR_HALF_W * 2 + 0.04) {
        want = Math.min(want, Math.max(o.speed * 0.98, MAX_SPEED * 0.1));
        blocked = true;
      }
    }
    // a car right beside us: do not steer into it
    if (Math.abs(gap) < CAR_LEN && Math.abs(o.x - r.x) < 0.5) wantX = r.x + (r.x > o.x ? 0.04 : -0.04);
  }
  // slipstream for rivals too
  if (!blocked) for (const o of cars) {
    if (o === r) continue;
    const gap = trackGap(r.z, posZ(o));
    if (gap > CAR_LEN && gap < SLIPSTREAM_DIST && Math.abs(o.x - r.x) < 0.3) { want *= 1 + SLIPSTREAM_BONUS * 0.7; break; }
  }
  r.wantX = wantX;
  // move toward the lane, limited by how fast a car can change lanes
  const steerMax = dt * 0.9 * (0.4 + r.speed / MAX_SPEED);
  const move = clamp(r.wantX - r.x, -steerMax, steerMax);
  r.x += move + r.bounce * dt * 3;
  r.bounce *= Math.max(0, 1 - dt * 6);
  r.steer += (clamp(move / (steerMax + 1e-9), -1, 1) - r.steer) * Math.min(1, dt * 8);
  r.x = clamp(r.x, -0.9, 0.9);
  // speed toward the target
  const a = ACCEL * r.accelShare;
  if (r.speed < want) r.speed = Math.min(want, r.speed + a * dt);
  else r.speed = Math.max(want, r.speed + BRAKING * 0.8 * dt);
  r.braking = r.speed > want + MAX_SPEED * 0.02;
  if (r.finishTime) r.speed = Math.min(r.speed, MAX_SPEED * 0.5);   // finished cars tour slowly
  if (r.bump > 0) r.bump -= dt;
  moveCar(r, dt);
}

// Is there room for car r to move into lane x (no other car close by in that lane)?
function laneFree(r, x) {
  if (Math.abs(x) > 0.85) return false;
  for (const o of cars) {
    if (o === r) continue;
    const gap = trackGap(r.z, posZ(o));
    if (Math.abs(gap) < SEG_LEN * 8 && Math.abs(o.x - x) < CAR_HALF_W * 2 + 0.1) return false;
  }
  return true;
}

// Two cars overlapping: a nudge from behind slows the one behind; side by side they push apart
function carsTouch(a, b, dt) {
  const gap = trackGap(posZ(a), posZ(b));                       // positive = b is ahead of a
  if (Math.abs(gap) > CAR_LEN || Math.abs(a.x - b.x) > CAR_HALF_W * 2) return;
  const behind = gap > 0 ? a : b, front = gap > 0 ? b : a;
  const withPlayer = a.isPlayer || b.isPlayer;
  if (Math.abs(gap) > CAR_LEN * 0.55 && behind.speed > front.speed) {
    // rear bump: the car behind drops to just under the speed of the car in front
    behind.speed = front.speed * 0.92;
    front.speed = Math.min(MAX_SPEED, front.speed * 1.01);
    if (withPlayer) { sound('crash', 0.3); shakeTime = 0.12; shakeSize = 2; if (behind.isPlayer) behind.bump = 0.3; }
  } else {
    // side contact: push apart, scrape some speed off both
    const push = (a.x < b.x ? -1 : 1) * 0.6;
    a.bounce = push; b.bounce = -push;
    a.speed *= 0.995; b.speed *= 0.995;
    if (withPlayer) { sound('scrape'); sparks(player, 3); if (notTooSoon('buzz', 150)) buzz(10); }
  }
}

// Count laps when a car crosses the start line going forwards
function stepLaps(c) {
  const z = posZ(c);
  if (!c.armed && z > trackLength * 0.5 && z < trackLength * 0.9) c.armed = true;
  if (c.armed && z < trackLength * 0.3) {
    c.armed = false;
    c.laps++;
    const lapTime = raceTime - c.lapStart;
    c.lapStart = raceTime;
    if (!c.best || lapTime < c.best) c.best = lapTime;
    if (c.isPlayer) {
      lastLap = lapTime; lapFlash = 3;
      if (!bestLap || lapTime < bestLap) { bestLap = lapTime; sound('bestLap'); } else sound('lap');
    }
    if (c.laps >= LAPS && !c.finishTime) {
      c.finishTime = raceTime;
      if (c.isPlayer) { phase = 'finished'; finishT = 0; }
    }
  }
}

// Build the result list, give out points and show the result card
function finishRace() {
  if (demo) { startDemo(); return; }                             // the demo just starts over
  updatePositions();
  lastResults = minimapOrder.map((c, i) => ({
    team: c.team, teamId: c.teamId, isPlayer: c.isPlayer, pos: i + 1,
    time: c.finishTime || 0, best: c.best, points: POINTS[i] || 0
  }));
  if (mode === 'champ') for (const r of lastResults) champPoints[r.teamId] += r.points;
  setScreen('result');
  if (myPos === 1) { sfx.win(); speak(MSG_WIN, 0.5); } else { sfx.lose(); speak(MSG_LOSE, 0.5); }
}

// Everything that moves in the race for one fixed step (nothing drawn here)
function stepGame(dt) {
  if (demo) { if (screen !== 'race') stepRace(dt); return; }   // the demo keeps rolling behind the cards
  if (screen !== 'race' || paused) return;
  stepRace(dt);
}

// ---------- Effects (looks only: they never change the race) ----------
// Particles live in "screen space around the player car": x,y in pixels relative to the car's spot
function addParticle(p) {
  if (particles.length >= MAX_PARTICLES) particles.shift();
  particles.push(p);
}
function tyreSmoke(c) {
  for (let side = -1; side <= 1; side += 2) {
    addParticle({ kind: 'smoke', x: side * 70, y: 0, vx: side * 40 + (Math.random() - 0.5) * 40, vy: 60 + Math.random() * 80,
      t: 0, life: 0.5 + Math.random() * 0.3, size: 10 + Math.random() * 10, color: 'rgba(230,230,230,0.5)' });
  }
}
function dustPuff(c, color) {
  const side = c.x > 0 ? 1 : -1;
  addParticle({ kind: 'dust', x: side * 60 + (Math.random() - 0.5) * 60, y: 0, vx: side * 50 + (Math.random() - 0.5) * 60, vy: 40 + Math.random() * 90,
    t: 0, life: 0.6 + Math.random() * 0.4, size: 12 + Math.random() * 14, color });
}
function sparks(c, count) {
  if (fastForward) return;
  const side = c.bounce > 0 ? -1 : 1;
  for (let i = 0; i < count; i++) {
    addParticle({ kind: 'spark', x: side * 80, y: -10 - Math.random() * 20, vx: side * (100 + Math.random() * 300), vy: -50 + Math.random() * 250,
      t: 0, life: 0.25 + Math.random() * 0.3, size: 2 + Math.random() * 2, color: Math.random() < 0.5 ? '#ffd27a' : '#ffffff' });
  }
}
function addMark(c) {
  if (marks.length > 40) marks.shift();
  marks.push({ z: posZ(c), x: c.x, life: 2.5 });
}
function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.kind === 'spark') p.vy += 500 * dt;
    if (p.kind === 'confetti') { p.vy += 120 * dt; p.vx *= 0.99; }
    if (p.kind === 'smoke' || p.kind === 'dust') { p.size += 30 * dt; p.vx *= 0.97; }
  }
  if (shakeTime > 0) shakeTime -= dt;
  // trophy card: confetti and fireworks
  if (screen === 'trophy') {
    fireworkTimer -= dt;
    if (fireworkTimer <= 0) {
      fireworkTimer = 0.35;
      const cx = (Math.random() - 0.5) * 500, cy = -150 - Math.random() * 100;
      const color = pick(['#ff5e5e', '#ffd166', '#06d6a0', '#4cc9f0', '#f72585', '#ffffff']);
      for (let i = 0; i < 14; i++) {
        const a = Math.random() * Math.PI * 2, v = 80 + Math.random() * 160;
        addParticle({ kind: 'confetti', x: cx, y: cy, vx: Math.cos(a) * v, vy: Math.sin(a) * v, t: 0, life: 1.6 + Math.random(), size: 5 + Math.random() * 5, color, spin: Math.random() * 6 });
      }
      sfx.pop();
    }
  }
}

// ---------- Screen layout ----------
let dpr = 1, screenW = 0, screenH = 0;
let viewX = 0, viewY = 0, viewW = 0, viewH = 0;   // where the road picture sits on the screen
let portrait = false;            // true when the phone is held upright
let ui = 1;                      // size of the cards and HUD (1 = designed size)
let stripGradient = null;
// The four big buttons: { x, y, w, h } in screen pixels
const pads = { left: { x: 0, y: 0, w: 0, h: 0 }, right: { x: 0, y: 0, w: 0, h: 0 }, accel: { x: 0, y: 0, w: 0, h: 0 }, brake: { x: 0, y: 0, w: 0, h: 0 } };
let leftStrip = { x: 0, y: 0, w: 0, h: 0 }, rightStrip = { x: 0, y: 0, w: 0, h: 0 };

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);     // sharp, but not more pixels than a phone can push every frame
  screenW = stage.clientWidth;
  screenH = stage.clientHeight;
  if (!screenW || !screenH) return;
  canvas.width  = Math.round(screenW * dpr);
  canvas.height = Math.round(screenH * dpr);
  portrait = screenH > screenW * 1.1;
  const topGap = 50;                                   // room for the Pause and Sound buttons
  if (!portrait) {
    // Sideways (the normal way): road in the middle, a button strip on each side
    const strip = clamp(Math.round(screenW * 0.165), 96, 150);
    viewX = strip; viewY = 0; viewW = screenW - strip * 2; viewH = screenH;
    leftStrip = { x: 0, y: 0, w: strip, h: screenH };
    rightStrip = { x: screenW - strip, y: 0, w: strip, h: screenH };
    const gap = 10, side = 8;
    const bw = strip - side * 2;
    const avail = screenH - topGap - 8 - gap;
    const bh = Math.max(72, Math.floor(avail / 2));
    pads.left  = { x: side, y: topGap, w: bw, h: bh };
    pads.right = { x: side, y: topGap + bh + gap, w: bw, h: bh };
    const accelH = Math.max(72, Math.floor(avail * 0.58)), brakeH = Math.max(72, avail - accelH);
    pads.accel = { x: screenW - strip + side, y: topGap, w: bw, h: accelH };
    pads.brake = { x: screenW - strip + side, y: topGap + accelH + gap, w: bw, h: brakeH };
  } else {
    // Upright: road across the top, buttons underneath (it works, but sideways is bigger)
    viewX = 0; viewY = topGap; viewW = screenW; viewH = Math.round(screenW * 0.62);
    const top = viewY + viewH + 30, h = screenH - top - 10;
    leftStrip = { x: 0, y: top - 30, w: screenW / 2, h: screenH - top + 30 };
    rightStrip = { x: screenW / 2, y: top - 30, w: screenW / 2, h: screenH - top + 30 };
    const bw = Math.floor(screenW / 4) - 12;
    pads.left  = { x: 8, y: top + h * 0.3, w: bw, h: Math.max(72, h * 0.5) };
    pads.right = { x: 8 + bw + 8, y: top + h * 0.3, w: bw, h: Math.max(72, h * 0.5) };
    const rw = Math.floor(screenW / 2) - 16;
    pads.accel = { x: screenW / 2 + 8, y: top, w: rw, h: Math.max(72, h * 0.6) };
    pads.brake = { x: screenW / 2 + 8, y: top + h * 0.6 + 10, w: rw, h: Math.max(72, h * 0.4 - 10) };
  }
  ui = Math.min(screenW / 600, screenH / 350, 1.5);
  stripGradient = ctx.createLinearGradient(0, 0, 0, screenH);
  stripGradient.addColorStop(0, '#121a33');
  stripGradient.addColorStop(1, '#0b1124');
  resetInput();
  buildTrophy();
  if (segments.length) buildBackgrounds(CIRCUITS[circuitId]);
}

// ---------- Pre-painted pictures ----------
// Every tree, sign and car is painted once onto its own small hidden canvas. "ww" is how wide the
// thing is on the road, in road units (the road is 2 units wide, so a car is about 0.3).
function makeSprite(w, h, ww, paint) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const g = c.getContext('2d');
  paint(g, w, h);
  c.ww = ww;
  return c;
}
function rr(g, x, y, w, h, r) {           // rounded rectangle path on any canvas
  g.beginPath();
  g.moveTo(x + r, y);
  g.lineTo(x + w - r, y); g.quadraticCurveTo(x + w, y, x + w, y + r);
  g.lineTo(x + w, y + h - r); g.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  g.lineTo(x + r, y + h); g.quadraticCurveTo(x, y + h, x, y + h - r);
  g.lineTo(x, y + r); g.quadraticCurveTo(x, y, x + r, y);
  g.closePath();
}
function blob(g, x, y, r, color) { g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fillStyle = color; g.fill(); }

// A post with a board on it (used by the braking boards and the sector boards)
function paintBoard(g, w, h, text, bg, fg, stripes) {
  g.fillStyle = '#6b6f78'; g.fillRect(w / 2 - 5, h * 0.55, 10, h * 0.45);
  g.fillStyle = '#4a4e57'; g.fillRect(w / 2 - 5, h * 0.55, 3, h * 0.45);
  rr(g, 4, 4, w - 8, h * 0.56, 6); g.fillStyle = '#202228'; g.fill();
  rr(g, 8, 8, w - 16, h * 0.56 - 8, 4); g.fillStyle = bg; g.fill();
  if (stripes) { g.fillStyle = '#d7262c'; g.fillRect(8, 8, w - 16, 12); g.fillRect(8, h * 0.56 - 12, w - 16, 12); }
  g.fillStyle = fg; g.font = '900 ' + Math.floor(w * 0.42) + 'px system-ui, sans-serif';
  g.textAlign = 'center'; g.textBaseline = 'middle';
  g.fillText(text, w / 2, h * 0.3);
}

// A palm tree: curved trunk with rings, fronds with leaflets, coconuts
function paintPalm(g, w, h, trunk, leaf, leaf2) {
  g.lineCap = 'round';
  g.strokeStyle = trunk; g.lineWidth = 16;
  g.beginPath(); g.moveTo(w * 0.5, h); g.quadraticCurveTo(w * 0.42, h * 0.55, w * 0.52, h * 0.22); g.stroke();
  g.strokeStyle = shade(trunk, -0.3); g.lineWidth = 3;
  for (let k = 0.25; k < 1; k += 0.07) {                          // rings
    const t = k, x = (1 - t) * (1 - t) * w * 0.5 + 2 * (1 - t) * t * w * 0.42 + t * t * w * 0.52;
    const y = (1 - t) * (1 - t) * h * 0.22 + 2 * (1 - t) * t * h * 0.55 + t * t * h;
    g.beginPath(); g.moveTo(x - 7, y); g.lineTo(x + 7, y - 2); g.stroke();
  }
  const cx = w * 0.52, cy = h * 0.2;
  for (let i = 0; i < 9; i++) {                                    // fronds
    const a = -Math.PI * 0.95 + i * (Math.PI * 0.9 / 8) + (i % 2) * 0.12;
    const len = h * 0.3 + (i % 3) * 8;
    g.save(); g.translate(cx, cy); g.rotate(a);
    g.fillStyle = i % 2 ? leaf : leaf2;
    g.beginPath(); g.moveTo(0, 0);
    g.quadraticCurveTo(len * 0.5, -18, len, 10);
    g.quadraticCurveTo(len * 0.5, 4, 0, 6); g.closePath(); g.fill();
    g.strokeStyle = shade(i % 2 ? leaf : leaf2, -0.25); g.lineWidth = 1.5;
    for (let s = 0.15; s < 1; s += 0.12) { g.beginPath(); g.moveTo(len * s, -6 + 12 * s); g.lineTo(len * s + 6, 14 * s + 2); g.stroke(); }
    g.restore();
  }
  for (let i = 0; i < 3; i++) blob(g, cx - 10 + i * 10, cy + 10 + (i % 2) * 6, 6, '#6b4a2a');
}

// A round leafy tree
function paintTree(g, w, h, trunk, dark, light) {
  g.fillStyle = trunk; g.fillRect(w * 0.46, h * 0.5, w * 0.08, h * 0.5);
  g.fillStyle = shade(trunk, -0.35); g.fillRect(w * 0.46, h * 0.5, w * 0.03, h * 0.5);
  const spots = [[0.5, 0.3, 0.26], [0.3, 0.42, 0.2], [0.7, 0.42, 0.2], [0.4, 0.2, 0.17], [0.62, 0.2, 0.17], [0.5, 0.5, 0.2]];
  for (const s of spots) blob(g, w * s[0], h * s[1], w * s[2], dark);
  for (const s of spots) blob(g, w * s[0] - w * 0.05, h * s[1] - w * 0.06, w * s[2] * 0.6, light);
  g.globalAlpha = 0.35; for (const s of spots) blob(g, w * s[0] + w * 0.06, h * s[1] + w * 0.07, w * s[2] * 0.55, shade(dark, -0.35)); g.globalAlpha = 1;
}

// A tall tower with lit windows and neon stripes (night city)
function paintTower(g, w, h, body, neonA, neonB, style) {
  const left = w * 0.1, top = h * 0.08, bw = w * 0.8, bh = h * 0.92;
  g.fillStyle = body; g.fillRect(left, top, bw, bh);
  g.fillStyle = shade(body, 0.12); g.fillRect(left, top, bw * 0.12, bh);
  // windows
  const cols = 6, rows = Math.floor(bh / 26);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
    const on = seededRandom() < 0.55;
    g.fillStyle = on ? (seededRandom() < 0.3 ? '#ffe9a8' : '#9fdcff') : '#171a26';
    g.fillRect(left + 8 + c * (bw - 16) / cols, top + 14 + r * 26, (bw - 16) / cols - 6, 14);
  }
  // neon stripes and a rooftop sign
  g.shadowBlur = 18; g.shadowColor = neonA;
  g.fillStyle = neonA; g.fillRect(left, top, bw, 5);
  if (style === 1) { g.fillRect(left, top, 5, bh); }
  if (style === 2) { g.fillStyle = neonB; g.shadowColor = neonB; g.fillRect(left + bw - 6, top + bh * 0.2, 6, bh * 0.8); }
  g.shadowColor = neonB; g.fillStyle = neonB;
  g.fillRect(left + bw * 0.25, top - h * 0.05, bw * 0.5, 10);
  g.shadowBlur = 0;
  g.fillStyle = '#20232f'; g.fillRect(left + bw * 0.45, 0, 4, top);  // aerial
  g.fillStyle = '#ff3b3b'; g.shadowBlur = 8; g.shadowColor = '#ff3b3b'; g.fillRect(left + bw * 0.44, 0, 6, 6); g.shadowBlur = 0;
}

// Five pictures of one team's car from behind, turning hard left .. straight .. hard right
function buildCarSet(teamId, width) {
  const set = [];
  for (const turn of [-1, -0.5, 0, 0.5, 1]) {
    set.push(makeSprite(width, Math.round(width * 0.62), 0.30, (g, w, h) => {
      g.save(); g.scale(w / 360, h / 223); paintCarRear(g, TEAMS[teamId], turn); g.restore();
    }));
  }
  return set;
}

// Paint a Formula-style car seen from behind in a 360 x 223 box. turn: -1 (hard left) .. 1 (hard right)
function paintCarRear(g, team, turn) {
  const cx = 180, ground = 206;
  const main = team.main, trim = team.trim, dark = '#15161a';
  g.save();
  g.translate(cx, ground); g.rotate(turn * 0.05); g.translate(-cx, -ground);   // the car leans a little into the turn
  // shadow
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(cx, ground - 4, 160, 13, 0, 0, Math.PI * 2); g.fill();
  const shift = turn * 12;                                      // the far (front) end swings sideways
  // front tyres: smaller and higher, mostly hidden; one peeks out when turning
  for (const s of [-1, 1]) {
    const x = cx + s * 92 + shift * 2.2;
    rr(g, x - 20, 126, 40, 56, 8); g.fillStyle = '#1b1c21'; g.fill();
    g.fillStyle = '#2d2f36'; g.fillRect(x - 15, 132, 30, 7);
  }
  // front wing tips peeking out beyond the body
  g.fillStyle = trim; g.fillRect(cx - 150 + shift * 2.2, 162, 300, 7);
  g.fillStyle = shade(trim, -0.3); g.fillRect(cx - 150 + shift * 2.2, 166, 300, 3);
  // floor and diffuser (dark, with fins)
  g.fillStyle = '#0f1013'; g.beginPath(); g.moveTo(cx - 118, ground - 8); g.lineTo(cx - 104, 172); g.lineTo(cx + 104, 172); g.lineTo(cx + 118, ground - 8); g.closePath(); g.fill();
  g.strokeStyle = '#2a2c33'; g.lineWidth = 2;
  for (let i = -3; i <= 3; i++) { g.beginPath(); g.moveTo(cx + i * 22, 176); g.lineTo(cx + i * 26, ground - 10); g.stroke(); }
  // rear tyres: big, with tread grooves and a highlight band
  for (const s of [-1, 1]) {
    const x = cx + s * 116;
    rr(g, x - 34, 118, 68, 86, 10); g.fillStyle = dark; g.fill();
    g.fillStyle = '#2a2c33'; rr(g, x - 30, 122, 60, 10, 5); g.fill();
    g.strokeStyle = '#0a0a0c'; g.lineWidth = 2;
    for (let y = 140; y < 198; y += 9) { g.beginPath(); g.moveTo(x - 31, y); g.lineTo(x + 31, y); g.stroke(); }
    g.strokeStyle = '#3a3c44'; g.lineWidth = 1.5;
    for (let y = 144; y < 198; y += 9) { g.beginPath(); g.moveTo(x - 31, y); g.lineTo(x + 31, y); g.stroke(); }
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(x - 32, 120, 64, 5);
    // a touch of colour on the tyre's shoulder (the compound band)
    g.fillStyle = s < 0 ? '#ffd200' : '#ffd200'; g.fillRect(x - 34 + (s < 0 ? 0 : 64), 130, 4, 60);
  }
  // suspension arms: thin grey rods from the body to each rear wheel
  g.strokeStyle = '#8a8f99'; g.lineWidth = 4; g.lineCap = 'round';
  for (const s of [-1, 1]) {
    g.beginPath(); g.moveTo(cx + s * 44, 150); g.lineTo(cx + s * 84, 134); g.stroke();
    g.beginPath(); g.moveTo(cx + s * 44, 182); g.lineTo(cx + s * 84, 178); g.stroke();
    g.strokeStyle = '#5c6270'; g.lineWidth = 2; g.beginPath(); g.moveTo(cx + s * 44, 166); g.lineTo(cx + s * 84, 156); g.stroke(); g.strokeStyle = '#8a8f99'; g.lineWidth = 4;
  }
  // sidepods and engine cover (team colour, with the trim stripe)

  g.beginPath(); g.moveTo(cx - 104, 184); g.lineTo(cx - 96, 142); g.lineTo(cx - 56, 128); g.lineTo(cx + 56, 128); g.lineTo(cx + 96, 142); g.lineTo(cx + 104, 184); g.closePath(); g.fill();

  g.beginPath(); g.moveTo(cx + 104, 184); g.lineTo(cx + 96, 142); g.lineTo(cx + 76, 150); g.lineTo(cx + 70, 184); g.closePath(); g.fill();

  g.beginPath(); g.moveTo(cx - 96, 142); g.lineTo(cx - 56, 128); g.lineTo(cx + 56, 128); g.lineTo(cx + 96, 142); g.lineTo(cx + 92, 147); g.lineTo(cx + 54, 134); g.lineTo(cx - 54, 134); g.lineTo(cx - 92, 147); g.closePath(); g.fill();
  // wing mirrors either side of the cockpit

  // airbox / engine cover: the narrow hump rising up behind the driver

  g.beginPath(); g.moveTo(cx - 56, 128); g.lineTo(ax - 24, 100); g.lineTo(ax - 14, 86); g.lineTo(ax + 14, 86); g.lineTo(ax + 24, 100); g.lineTo(cx + 56, 128); g.closePath(); g.fill();
  g.fillStyle = shade(main, -0.3);
  g.beginPath(); g.moveTo(cx - 56, 128); g.lineTo(ax - 24, 100); g.lineTo(ax - 14, 86); g.lineTo(ax - 6, 88); g.lineTo(ax - 12, 104); g.lineTo(cx - 30, 128); g.closePath(); g.fill();
  g.fillStyle = trim; g.fillRect(ax - 6, 86, 12, 44);                             // trim stripe down the spine
  g.fillStyle = dark; rr(g, ax - 12, 88, 24, 12, 5); g.fill();                     // the air intake opening

  g.fillStyle = shade(main, -0.35); g.fillRect(ax - 18, 100, 7, 34); g.fillRect(ax + 11, 100, 7, 34);
  const wx = cx + shift * 0.8;
  g.fillStyle = main; rr(g, wx - 128, 90, 256, 16, 3); g.fill();
  g.fillStyle = shade(main, -0.3); g.fillRect(wx - 128, 102, 256, 4);

  }

  // the number on the engine cover
