<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Congkak</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1220;
    color: #ffffff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 10px 10px 12px;
    gap: 8px;
  }
  #top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .side { font-size: 15px; font-weight: 700; min-width: 84px; line-height: 1.15; }
  .side.right { text-align: right; }
  .side b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .side small { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; opacity: 0; }
  .side.leading small { opacity: 1; }
  .side.red { color: #ff6b6b; }
  .side.green { color: #4dd4ac; }
  #status { font-size: 15px; color: rgba(255,255,255,0.85); text-align: center; flex: 1; }
  /* Sound on/off button. It sits above the start screen too, so it can always be reached */
  #sound {
    position: relative; z-index: 3; flex: none; width: 38px; height: 38px; padding: 0; border: 0;
    border-radius: 10px; background: rgba(255,255,255,0.10); color: #fff; font-size: 18px; line-height: 1;
    font-family: inherit; touch-action: manipulation;
  }
  #sound.off { opacity: .45; }
  #stage { flex: 1; min-height: 0; position: relative; }
  /* Call-out banner that pops over the board for big moments (capture, go again, burnt house) */
  #callout {
    position: absolute; left: 50%; top: 18%; transform: translate(-50%, 0) scale(0.8);
    padding: 10px 22px; border-radius: 14px; background: rgba(11,18,32,0.9); border: 2px solid #f4d35e;
    color: #f4d35e; font-size: 26px; font-weight: 800; letter-spacing: 0.02em; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 0.18s, transform 0.18s;
  }
  #callout.show { opacity: 1; transform: translate(-50%, 0) scale(1); }
  #callout.red { border-color: #ff6b6b; color: #ff6b6b; }
  #callout.green { border-color: #4dd4ac; color: #4dd4ac; }
  #game { display: block; width: 100%; height: 100%; }
  #controls { display: flex; gap: 10px; }
  #controls button, #modes button {
    flex: 1; height: 46px; border: 0; border-radius: 12px;
    background: #1c2742; color: #ffffff; font-size: 15px; font-weight: 600; font-family: inherit;
  }
  #controls button:active, #modes button:active { background: #2c3a60; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 12px; background: rgba(11,18,32,0.94); text-align: center; padding: 24px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 30px; }
  #overlay p  { margin: 0 0 6px; font-size: 16px; color: rgba(255,255,255,0.8); max-width: 320px; }
  #modes { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  #modes button { flex: none; height: 54px; font-size: 16px; }
  #modes button.main { background: #2a6f5c; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="side red" id="sideTop"><span id="nameTop">Computer</span><b id="seedsTop">0</b><small>leading</small></div>
    <div id="status">Congkak</div>
    <div class="side green right" id="sideBottom"><span id="nameBottom">You</span><b id="seedsBottom">0</b><small>leading</small></div>
    <button id="sound" aria-label="Sound on or off"></button>
  </div>
  <div id="stage"><canvas id="game"></canvas><div id="callout"></div></div>
  <div id="controls">
    <button id="btnNew">New game</button>
    <button id="btnMode">Change mode</button>
  </div>
  <div id="overlay">
    <h1 id="msgTitle">Congkak</h1>
    <p id="msgLine">Tap one of your houses to sow its seeds. Collect the most seeds to win.</p>
    <button id="btnSpeak" style="display:none; height:46px; padding:0 18px; border:0; border-radius:12px; background:#1c2742; color:#fff; font-size:15px; font-weight:600; font-family:inherit;">🔊 Speak</button>
    <div id="modes">
      <button data-mode="easy" class="main">Computer: Easy</button>
      <button data-mode="medium">Computer: Medium</button>
      <button data-mode="hard">Computer: Hard</button>
      <button data-mode="two">2 players, one phone</button>
    </div>
  </div>
</div>

<script>
// =====================================================
// CONGKAK - the traditional Malay seed-sowing game
// You are green and play the bottom row. Your storehouse (rumah) is on the right.
//
// Rules used in this version (house rules vary, so the main ones are settings below):
// - Tap one of your houses. Its seeds are sown one by one anti-clockwise into the houses
//   that follow, into your own storehouse, but never into the opponent's storehouse.
// - Last seed lands in your storehouse: you play again.
// - Last seed lands in a house that already has seeds: pick them all up and keep sowing.
// - Last seed lands in an empty house on YOUR side: you capture the seeds in the house
//   opposite, plus that last seed. Your turn ends.
// - Last seed lands in an empty house on the OTHER side: your turn ends.
// - When a player has no seeds left on their side, the round ends and the seeds still on
//   the board go to the player whose side they are on.
// - Next round: each player refills their houses with 7 seeds from their storehouse, starting
//   from the house nearest the storehouse. A house that cannot be filled is BURNT (rumah
//   terbakar): seeds are never sown into it and it cannot be played. Leftovers stay in the store.
// - The match ends when a player cannot fill even one house. The other player wins.
// =====================================================

// ---------- Settings (change these to match your own house rules) ----------
const HOUSES = 7;                  // houses per side
const SEEDS_PER_HOUSE = 7;         // seeds in each house at the start
const CAPTURE_NEEDS_SEEDS = true;  // true = capturing only happens if the opposite house has seeds
const MULTI_ROUND = true;          // true = play rounds with burnt houses; false = one round, most seeds wins
const EASY_ONE_ROUND = true;       // Easy mode is a single quick round, most seeds wins (about 2-3 minutes)
const MAX_ROUNDS = 20;             // if nobody is wiped out by then, most seeds wins
// Messages shown at the end (change the words here if you like)
const MSG_WIN  = 'Alhamdulillah';
const MSG_LOSE = 'Insya-Allah lain kali';
const MSG_DRAW = 'Seri \u00B7 Alhamdulillah';
const MSG_SUB_WIN  = 'Tahniah, anda menang';
const MSG_SUB_LOSE = 'Cuba lagi';
const SOW_DELAY = 0.22;            // seconds between each seed being dropped (animation speed)
const FAST_AFTER = 12;             // after this many drops in one move, sowing speeds up
const FAST_SPEED = 4;              // how many times faster long chains run
const AI_SPEED = 2;                // the computer's sowing always runs this many times faster than yours
const MAX_MOVE_SECONDS = 12;       // no single move's animation takes longer than this
const AI_DEPTH = { easy: 1, medium: 3, hard: 5 };   // how many turns ahead the computer thinks
const EASY_RANDOM = 0.35;          // on Easy, chance the computer plays a random move
const SOUND_VOLUME = 0.25;         // 0 = silent, 1 = very loud
const VIBRATE = true;              // true = short buzz on Android for captures and wins

// ---------- Board layout in memory ----------
// Pits are numbered going anti-clockwise, as the seeds travel:
//   0..6   = bottom row (green), left to right        7 = green storehouse (right)
//   8..14  = top row (red), right to left            15 = red storehouse (left)
const BOTTOM_STORE = HOUSES;                 // 7
const TOP_STORE = HOUSES * 2 + 1;            // 15
const TOTAL = HOUSES * 2 + 2;                // 16
const GREEN = 0, RED = 1;                    // GREEN = bottom player, RED = top player

function storeOf(side) { return side === GREEN ? BOTTOM_STORE : TOP_STORE; }
function housesOf(side) {                    // the pit numbers of one side's houses
  const out = [];
  for (let i = 0; i < HOUSES; i++) out.push(side === GREEN ? i : HOUSES + 1 + i);
  return out;
}
function sideOf(pit) { return pit <= BOTTOM_STORE ? GREEN : RED; }
function opposite(pit) { return TOTAL - 2 - pit; }   // house facing this one across the board

function newBoard() {
  const b = Array(TOTAL).fill(SEEDS_PER_HOUSE);
  b[BOTTOM_STORE] = 0;
  b[TOP_STORE] = 0;
  return b;
}
let burnt = Array(TOTAL).fill(false);     // burnt[pit] = true means seeds skip this house

// Refill both sides from their storehouses for a new round. Returns false if a player cannot fill any house.
function refillBoard(board) {
  const b = Array(TOTAL).fill(0);
  burnt = Array(TOTAL).fill(false);
  b[BOTTOM_STORE] = board[BOTTOM_STORE];
  b[TOP_STORE] = board[TOP_STORE];
  for (const side of [GREEN, RED]) {
    const store = storeOf(side);
    // Fill from the house nearest the storehouse outward
    const order = housesOf(side).slice().reverse();
    for (const p of order) {
      if (b[store] >= SEEDS_PER_HOUSE) { b[p] = SEEDS_PER_HOUSE; b[store] -= SEEDS_PER_HOUSE; }
      else burnt[p] = true;
    }
  }
  return b;
}
function canPlayRound(board, side) { return housesOf(side).some(p => !burnt[p]); }

// ---------- Rules ----------
// Play a full move from "pit" for "side". Returns the finished board, whether the player
// goes again, and a list of steps for the animation.
// Each step: { pit, seeds } = board after a seed is dropped,  or { pickup: pit } / { capture: [from, store, n] }
function playMove(board, side, pit, steps) {
  const b = board.slice();
  const myStore = storeOf(side), theirStore = storeOf(1 - side);
  let hand = b[pit];
  b[pit] = 0;
  if (steps) steps.push({ pickup: pit, board: b.slice() });
  let pos = pit;

  while (true) {
    // Sow one seed at a time
    while (hand > 0) {
      pos = (pos + 1) % TOTAL;
      if (pos === theirStore || burnt[pos]) continue;   // skip the opponent's storehouse and burnt houses
      b[pos]++;
      hand--;
      if (steps) steps.push({ drop: pos, board: b.slice() });
    }

    if (pos === myStore) return { board: b, again: true };     // landed in own storehouse

    if (b[pos] > 1) {
      // Landed in a house with seeds: pick them all up and keep going
      hand = b[pos];
      b[pos] = 0;
      if (steps) steps.push({ pickup: pos, board: b.slice() });
      continue;
    }

    // Landed in an empty house (it now holds just this seed)
    if (sideOf(pos) === side) {
      const opp = opposite(pos);
      if (!burnt[opp] && (b[opp] > 0 || !CAPTURE_NEEDS_SEEDS)) {
        const taken = b[opp] + b[pos];
        b[myStore] += taken;
        b[opp] = 0;
        b[pos] = 0;
        if (steps) steps.push({ capture: [pos, opp, taken], board: b.slice() });
      }
    }
    return { board: b, again: false };
  }
}

function legalMoves(board, side) {
  return housesOf(side).filter(p => board[p] > 0 && !burnt[p]);
}

function sideEmpty(board, side) {
  return housesOf(side).every(p => board[p] === 0);
}

// At the end, seeds still on each side go to that side's storehouse
function sweep(board) {
  const b = board.slice();
  for (const side of [GREEN, RED]) {
    for (const p of housesOf(side)) { b[storeOf(side)] += b[p]; b[p] = 0; }
  }
  return b;
}

// ---------- Computer player ----------
function evaluate(board, side) {
  return board[storeOf(side)] - board[storeOf(1 - side)];
}

// Look ahead. A player who goes again keeps the move.
function search(board, side, depth, alpha, beta, me) {
  if (sideEmpty(board, GREEN) || sideEmpty(board, RED)) {
    const b = sweep(board);
    return evaluate(b, me) * 10;                 // a finished game counts a lot
  }
  if (depth === 0) return evaluate(board, me);
  const moves = legalMoves(board, side);
  const maximizing = side === me;
  let best = maximizing ? -Infinity : Infinity;
  for (const m of moves) {
    const r = playMove(board, side, m);
    const next = r.again ? side : 1 - side;
    const score = search(r.board, next, depth - 1, alpha, beta, me);
    if (maximizing) { best = Math.max(best, score); alpha = Math.max(alpha, best); }
    else            { best = Math.min(best, score); beta = Math.min(beta, best); }
    if (alpha >= beta) break;
  }
  return best;
}

function chooseMove(board, side, difficulty) {
  const moves = legalMoves(board, side);
  if (moves.length === 0) return null;
  if (difficulty === 'easy' && Math.random() < EASY_RANDOM) return moves[Math.floor(Math.random() * moves.length)];
  const depth = AI_DEPTH[difficulty];
  let bestScore = -Infinity, bestMoves = [];
  for (const m of moves) {
    const r = playMove(board, side, m);
    const next = r.again ? side : 1 - side;
    const score = search(r.board, next, depth - 1, -Infinity, Infinity, side);
    if (score > bestScore) { bestScore = score; bestMoves = [m]; }
    else if (score === bestScore) bestMoves.push(m);
  }
  return bestMoves[Math.floor(Math.random() * bestMoves.length)];
}

// ---------- Sound ----------
// All sounds are made by code (short notes), so there are no sound files to upload.
// Phones only allow sound after a touch, so the sound engine starts on the first touch.
// The on/off choice is remembered, and is shared by all the games on this site.
const btnSound = document.getElementById('sound');
let audio = null;                // the sound engine (created on first touch)
let muted = false;
try { muted = localStorage.getItem('gamesMuted') === '1'; } catch (e) { /* storage blocked: start with sound on */ }

function showSoundButton() {
  btnSound.textContent = muted ? '\u{1F507}' : '\u{1F50A}';      // speaker off / speaker on
  btnSound.classList.toggle('off', muted);
}
showSoundButton();

function startAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }                                  // no sound support: the game still works
}
for (const type of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(type, startAudio, true);
}

// Play one note: freq in Hz, dur in seconds, type of wave, delay before it starts, pitch to slide to, volume 0-1
function beep(freq, dur, type = 'sine', delay = 0, slide = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(SOUND_VOLUME * volume, t + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// A burst of hiss, for the wooden "clack" of a seed
let noiseBuffer = null;
function noise(dur, tone = 1000, delay = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  if (!noiseBuffer) {
    noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const t = audio.currentTime + delay;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = noiseBuffer;
  src.loop = true;
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(tone, t);
  filter.frequency.exponentialRampToValueAtTime(Math.max(60, tone * 0.25), t + dur);
  gain.gain.setValueAtTime(SOUND_VOLUME * volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

function buzz(ms) {
  if (VIBRATE && !muted && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

const btnSpeak = document.getElementById('btnSpeak');
btnSpeak.addEventListener('click', () => { startAudio(); speak(lastSpoken); });

btnSound.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('gamesMuted', muted ? '1' : '0'); } catch (e) {}
  showSoundButton();
  startAudio();
  if (!muted) setTimeout(() => beep(740, 0.05, 'sine', 0, 0, 0.6), 60);
});

// Speak a short phrase with the phone's built-in voice (nothing to download).
// Uses a Malay voice if the phone has one, otherwise the phone's default voice.
const SPEAK = true;                // false = never speak
let lastSpoken = '';
function speak(text, delay = 0) {
  if (!SPEAK || muted || !('speechSynthesis' in window)) return;
  try {
    // Arabic spelling for the Arabic voice, so the pronunciation is right
    const ARABIC = {
      'Alhamdulillah': '\u0627\u064E\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650',                       // اَلْحَمْدُ لِلَّهِ  (spelling A3 from the test page)
      'Insya-Allah lain kali': '\u0625\u0650\u0646\u0652\u0634\u064E\u0627\u0621\u064E \u0627\u0644\u0644\u0651\u0670\u0647\u064F',               // إِنْشَاءَ اللّٰهُ  (spelling B3 from the test page)
      'Seri \u00B7 Alhamdulillah': '\u0627\u064E\u0644\u0652\u062D\u064E\u0645\u0652\u062F\u064F \u0644\u0650\u0644\u064E\u0651\u0647\u0650'
    };
    const voices = window.speechSynthesis.getVoices();
    const arabic = voices.find(v => /^ar/i.test(v.lang));
    const u = new SpeechSynthesisUtterance(arabic && ARABIC[text] ? ARABIC[text] : text);
    if (arabic) { u.voice = arabic; u.lang = arabic.lang; }
    else {
      const malay = voices.find(v => /^ms/i.test(v.lang)) || voices.find(v => /^id/i.test(v.lang));
      if (malay) { u.voice = malay; u.lang = malay.lang; } else u.lang = 'ar-SA';
    }
    u.rate = 0.8;
    u.volume = 1;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
    lastSpoken = text;
  } catch (e) { /* no voice on this phone: the game still works */ }
}
// Some phones only list their voices after a moment; ask once so they are ready later
if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); }

// The game's own sounds: one small function for each thing that happens
const sfx = {
  // A seed dropping into a house: a small wooden tick (slightly different pitch each time)
  drop(intoStore) {
    // a soft round tick, no hiss (the hiss made a long chain sound like "rrrrr")
    beep(intoStore ? 330 : 520 + Math.random() * 100, 0.045, 'sine', 0, 0, 0.45);
  },
  // Scooping up a house: a soft rising rustle
  pickup() {
    beep(260, 0.12, 'sine', 0, 420, 0.35);
  },
  // Capturing the opposite house: a satisfying double knock
  capture() {
    noise(0.10, 2600, 0, 0.6);
    beep(300, 0.13, 'triangle', 0, 110, 0.8);
    beep(520, 0.10, 'triangle', 0.12, 0, 0.6);
    buzz(15);
  },
  // Landing in your own store: you go again
  again() {
    beep(660, 0.08, 'sine', 0, 0, 0.6);
    beep(880, 0.12, 'sine', 0.09, 0, 0.6);
  },
  // A new round starts (houses refilled, some burnt)
  round() {
    beep(440, 0.1, 'triangle', 0, 0, 0.5);
    beep(550, 0.1, 'triangle', 0.12, 0, 0.5);
    beep(660, 0.16, 'triangle', 0.24, 0, 0.5);
  },
  // Match won: a short rising fanfare
  win() {
    [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.18, 'triangle', i * 0.13, 0, 0.7));
    beep(1047, 0.4, 'sine', 0.55, 0, 0.5);
    buzz(30);
  },
  // Match lost: two falling notes
  lose() {
    beep(392, 0.2, 'sine', 0, 0, 0.6);
    beep(294, 0.35, 'sine', 0.22, 0, 0.6);
  }
};

// ---------- Page elements ----------
const stage   = document.getElementById('stage');
const canvas  = document.getElementById('game');
const ctx     = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const msgTitle = document.getElementById('msgTitle');
const msgLine  = document.getElementById('msgLine');
const elStatus = document.getElementById('status');
const elTop = document.getElementById('nameTop');
const elBottom = document.getElementById('nameBottom');
const sideTop = document.getElementById('sideTop'), sideBottom = document.getElementById('sideBottom');
const seedsTop = document.getElementById('seedsTop'), seedsBottom = document.getElementById('seedsBottom');

// Pop a short message over the board. color: 'gold' | 'red' | 'green'
const calloutEl = document.getElementById('callout');
let calloutTimer = null;
function callout(text, color = 'gold', ms = 1300) {
  calloutEl.textContent = text;
  calloutEl.className = 'show' + (color === 'red' ? ' red' : color === 'green' ? ' green' : '');
  clearTimeout(calloutTimer);
  calloutTimer = setTimeout(() => calloutEl.classList.remove('show'), ms);
}
function whoIs(side) { return mode === 'two' ? (side === GREEN ? 'Green' : 'Red') : (side === GREEN ? 'You' : 'Computer'); }

// Seeds in each storehouse, and who is ahead
function updateScores() {
  const g = shown[BOTTOM_STORE], r = shown[TOP_STORE];
  seedsBottom.textContent = g;
  seedsTop.textContent = r;
  sideBottom.classList.toggle('leading', g > r);
  sideTop.classList.toggle('leading', r > g);
}

// ---------- Game state ----------
let mode = 'easy';
let board = newBoard();
let shown = newBoard();          // what is drawn (lags behind during the animation)
let turn = GREEN;
let playing = false;
let animating = false;
let steps = [], stepTimer = 0, pendingAgain = false;
let lastDrop = -1;               // pit highlighted during the animation
let note = '';
let aiTimer = 0;
let round = 1;
let dropsThisMove = 0;
let squeeze = 1;                 // extra speed-up for very long moves
let nextStarter = GREEN;         // the loser of a game starts the next one
let pits = [];                   // screen position of each pit, set by resize

function startGame(newMode) {
  if (newMode) mode = newMode;
  board = newBoard();
  burnt = Array(TOTAL).fill(false);
  round = 1;
  shown = board.slice();
  turn = nextStarter;
  note = '';
  steps = [];
  animating = false;
  playing = true;
  overlay.classList.add('hidden');
  elTop.textContent = mode === 'two' ? 'Red' : 'Computer';
  elBottom.textContent = mode === 'two' ? 'Green' : 'You';
  beginTurn();
}

function beginTurn() {
  if (sideEmpty(board, GREEN) || sideEmpty(board, RED)) { endGame(); return; }
  if (legalMoves(board, turn).length === 0) { turn = 1 - turn; }   // cannot happen with the rules above, but safe
  if (mode !== 'two' && turn === RED) aiTimer = note ? 0.3 : 0.8;   // shorter pause when it is going again
  updateHud();
}

// Start a move and its animation
function makeMove(pit) {
  const stepList = [];
  const r = playMove(board, turn, pit, stepList);
  board = r.board;
  pendingAgain = r.again;
  steps = stepList;
  animating = true;
  stepTimer = 0;
  dropsThisMove = 0;
  // Work out how long this move would take at normal speed, and squeeze it to fit
  let normal = 0;
  stepList.forEach((st, i) => { normal += (st.capture ? SOW_DELAY * 2.5 : (st.pickup !== undefined ? SOW_DELAY * 1.5 : SOW_DELAY)) / (i >= FAST_AFTER ? FAST_SPEED : 1); });
  squeeze = Math.max(1, normal / MAX_MOVE_SECONDS);
  note = '';
  updateHud();
}

function afterMove() {
  animating = false;
  lastDrop = -1;
  shown = board.slice();
  if (pendingAgain) { note = (mode === 'two' ? (turn === GREEN ? 'Green' : 'Red') : (turn === GREEN ? 'You' : 'Computer')) + ' go again'; sfx.again(); callout('Main lagi!', turn === GREEN ? 'green' : 'red'); }
  else turn = 1 - turn;
  beginTurn();
}

function endGame() {
  board = sweep(board);
  shown = board.slice();
  const g = board[BOTTOM_STORE], r = board[TOP_STORE];

  if (MULTI_ROUND && !(mode === 'easy' && EASY_ONE_ROUND)) {
    // Try to set up the next round. If both can still fill a house, carry on.
    const next = refillBoard(board);
    const gOk = canPlayRound(next, GREEN), rOk = canPlayRound(next, RED);
    if (gOk && rOk && round < MAX_ROUNDS) {
      round++;
      turn = g >= r ? RED : GREEN;             // round loser starts
      board = next;
      shown = board.slice();
      const burntG = housesOf(GREEN).filter(p => burnt[p]).length, burntR = housesOf(RED).filter(p => burnt[p]).length;
      sfx.round();
      const burntNow = housesOf(GREEN).filter(p => burnt[p]).length + housesOf(RED).filter(p => burnt[p]).length;
      callout(burntNow ? 'Rumah terbakar! \u00B7 Round ' + round : 'Round ' + round, 'gold', 2200);
      note = 'Round ' + round + ' \u00B7 burnt: ' + (mode === 'two' ? 'Green ' + burntG + ', Red ' + burntR : 'you ' + burntG + ', computer ' + burntR);
      beginTurn();
      return;
    }
    // Someone cannot fill a single house: the match is over
    playing = false;
    // Winner: the one who can still play; if both can (round limit reached), the one with more seeds
    let winner = null;
    if (gOk !== rOk) winner = gOk ? GREEN : RED;
    else if (g !== r) winner = g > r ? GREEN : RED;
    nextStarter = winner === GREEN ? RED : GREEN;
    let title, sub;
    if (winner === null) { title = MSG_DRAW; sub = 'Draw'; }
    else if (mode === 'two') { title = MSG_WIN; sub = (winner === GREEN ? 'Green' : 'Red') + ' wins the match'; }
    else if (winner === GREEN) { title = MSG_WIN; sub = MSG_SUB_WIN; }
    else { title = MSG_LOSE; sub = MSG_SUB_LOSE + ' \u00B7 computer wins'; }
    if (winner === GREEN || (mode === 'two' && winner !== null)) sfx.win(); else sfx.lose();
    speak(title, 700);
    btnSpeak.style.display = 'block';
    msgTitle.textContent = title;
    msgLine.textContent = sub + '. After ' + round + ' round' + (round > 1 ? 's' : '') + ': Green ' + g + '  \u00B7  Red ' + r + '.';
    elStatus.textContent = 'Match over';
    setTimeout(() => overlay.classList.remove('hidden'), 900);
    return;
  }

  playing = false;
  nextStarter = g >= r ? RED : GREEN;        // loser starts next time
  let title, sub;
  if (g === r) { title = MSG_DRAW; sub = 'Draw'; }
  else if (mode === 'two') { title = MSG_WIN; sub = (g > r ? 'Green' : 'Red') + ' wins'; }
  else if (g > r) { title = MSG_WIN; sub = MSG_SUB_WIN; }
  else { title = MSG_LOSE; sub = MSG_SUB_LOSE + ' \u00B7 computer wins'; }
  if (g > r || (mode === 'two' && g !== r)) sfx.win(); else sfx.lose();
  speak(title, 700);
  btnSpeak.style.display = 'block';
  msgTitle.textContent = title;
  msgLine.textContent = sub + '. Green ' + g + '  \u00B7  Red ' + r + '.';
  elStatus.textContent = 'Game over';
  setTimeout(() => overlay.classList.remove('hidden'), 900);
}

function updateHud() {
  updateScores();
  if (!playing) return;
  let text;
  if (animating) text = 'Sowing...';
  else if (mode === 'two') text = (turn === GREEN ? 'Green' : 'Red') + ' to play';
  else text = turn === GREEN ? 'Your move' : 'Computer is thinking';
  elStatus.textContent = note && !animating ? note + ' · ' + text : text;
}

// ---------- Update ----------
function update(dt) {
  if (!playing) return;
  if (animating) {
    stepTimer -= dt;
    while (stepTimer <= 0) {
      if (steps.length === 0) { afterMove(); return; }
      const s = steps.shift();
      shown = s.board;
      updateScores();
      lastDrop = s.drop !== undefined ? s.drop : (s.pickup !== undefined ? s.pickup : -1);
      if (s.capture) { sfx.capture(); callout('Makan! +' + s.capture[2], turn === GREEN ? 'green' : 'red'); }
      else if (s.pickup !== undefined) sfx.pickup();
      else if (s.drop !== undefined) sfx.drop(s.drop === BOTTOM_STORE || s.drop === TOP_STORE);
      dropsThisMove++;
      let speed = dropsThisMove > FAST_AFTER ? FAST_SPEED : 1;   // long chains run faster
      if (mode !== 'two' && turn === RED) speed *= AI_SPEED;      // and the computer sows quickly
      if (mode === 'easy') speed *= 1.5;                          // Easy is a quick game
      speed *= squeeze;
      stepTimer += (s.capture ? SOW_DELAY * 2.5 : (s.pickup !== undefined ? SOW_DELAY * 1.5 : SOW_DELAY)) / speed;
    }
    return;
  }
  if (mode !== 'two' && turn === RED) {
    aiTimer -= dt;
    if (aiTimer <= 0) {
      const m = chooseMove(board, RED, mode);
      if (m !== null) makeMove(m); else { turn = GREEN; updateHud(); }
    }
  }
}

// ---------- Drawing ----------
function drawSeeds(x, y, n, r) {
  // Seeds drawn in a small cluster, plus the number
  const shownSeeds = Math.min(n, 12);
  for (let i = 0; i < shownSeeds; i++) {
    const a = i * 2.4, d = r * 0.45 * Math.sqrt(i / 12);
    ctx.fillStyle = 'rgba(233,216,166,0.45)';
    ctx.beginPath(); ctx.arc(x + Math.cos(a) * d, y + Math.sin(a) * d, r * 0.13, 0, Math.PI * 2); ctx.fill();
  }
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const W = stage.clientWidth, H = stage.clientHeight;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, W, H);
  if (!pits.length) return;

  // Wooden board
  const pad = pits.pad;
  ctx.fillStyle = '#6b4423';
  roundRect(pits.bx, pits.by, pits.bw, pits.bh, 24); ctx.fill();
  ctx.fillStyle = '#7d5230';
  roundRect(pits.bx + 6, pits.by + 6, pits.bw - 12, pits.bh - 12, 20); ctx.fill();

  const human = playing && !animating && (mode === 'two' || turn === GREEN);
  const legal = human ? legalMoves(board, turn) : [];

  for (let p = 0; p < TOTAL; p++) {
    const q = pits[p];
    const isStore = p === BOTTOM_STORE || p === TOP_STORE;
    // Pit hollow (burnt houses are drawn dark and crossed out)
    ctx.fillStyle = burnt[p] ? '#1a0f08' : (p === lastDrop ? '#4a2c14' : '#3d2412');
    if (isStore) { roundRect(q.x - q.w / 2, q.y - q.h / 2, q.w, q.h, q.w / 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(q.x, q.y, q.r, 0, Math.PI * 2); ctx.fill(); }
    // Highlight houses you can tap
    if (legal.includes(p)) {
      ctx.strokeStyle = turn === GREEN ? '#4dd4ac' : '#ff6b6b';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 2, 0, Math.PI * 2); ctx.stroke();
    }
    if (p === lastDrop && animating) {
      ctx.strokeStyle = '#f4d35e';
      ctx.lineWidth = 3;
      if (isStore) { roundRect(q.x - q.w / 2 - 2, q.y - q.h / 2 - 2, q.w + 4, q.h + 4, q.w / 2 + 2); ctx.stroke(); }
      else { ctx.beginPath(); ctx.arc(q.x, q.y, q.r + 2, 0, Math.PI * 2); ctx.stroke(); }
    }
    if (burnt[p]) {
      ctx.strokeStyle = '#8a3b2b';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(q.x - q.r * 0.5, q.y - q.r * 0.5); ctx.lineTo(q.x + q.r * 0.5, q.y + q.r * 0.5);
      ctx.moveTo(q.x + q.r * 0.5, q.y - q.r * 0.5); ctx.lineTo(q.x - q.r * 0.5, q.y + q.r * 0.5);
      ctx.stroke();
      continue;
    }
    // Seeds and count
    drawSeeds(q.x, q.y, shown[p], isStore ? q.w / 2 : q.r);
    ctx.font = '700 ' + Math.round((isStore ? q.w : q.r * 2) * 0.46) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(0,0,0,0.7)';
    ctx.strokeText(shown[p], q.x, q.y);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(shown[p], q.x, q.y);
  }

  // Side labels
  ctx.font = '600 13px system-ui, sans-serif';
  ctx.fillStyle = '#ff6b6b';
  ctx.fillText(mode === 'two' ? 'RED' : 'COMPUTER', pits.bx + pits.bw / 2, pits.by - 12);
  ctx.fillStyle = '#4dd4ac';
  ctx.fillText(mode === 'two' ? 'GREEN' : 'YOU', pits.bx + pits.bw / 2, pits.by + pits.bh + 12);
  if (MULTI_ROUND && !(mode === 'easy' && EASY_ONE_ROUND)) {
    ctx.fillStyle = 'rgba(255,255,255,0.6)';
    ctx.textAlign = 'right';
    ctx.fillText('Round ' + round, pits.bx + pits.bw, pits.by - 12);
    ctx.textAlign = 'center';
  }
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '500 11px system-ui, sans-serif';
  ctx.fillText('◀ seeds travel this way (anti-clockwise)', pits.bx + pits.bw / 2, pits.by + pits.bh / 2);
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// ---------- Layout ----------
function resize() {
  const dpr = window.devicePixelRatio || 1;
  const W = stage.clientWidth, H = stage.clientHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  // Board is wide: 7 houses + 2 storehouses across. Fit by width, limit by height.
  const cols = HOUSES + 2;
  let cellW = Math.min(W / cols, H / 3.2);
  const r = cellW * 0.4;
  const bw = cellW * cols, bh = cellW * 2.6;
  const bx = (W - bw) / 2, by = (H - bh) / 2;
  pits = [];
  pits.bx = bx; pits.by = by; pits.bw = bw; pits.bh = bh;
  const rowTop = by + bh * 0.3, rowBottom = by + bh * 0.7;
  for (let i = 0; i < HOUSES; i++) {
    const x = bx + cellW * (1.5 + i);
    pits[i] = { x, y: rowBottom, r };                     // bottom row left to right
    pits[HOUSES + 1 + i] = { x: bx + cellW * (cols - 1.5 - i), y: rowTop, r };   // top row right to left
  }
  pits[BOTTOM_STORE] = { x: bx + cellW * (cols - 0.5), y: by + bh / 2, w: cellW * 0.8, h: bh * 0.78 };
  pits[TOP_STORE] = { x: bx + cellW * 0.5, y: by + bh / 2, w: cellW * 0.8, h: bh * 0.78 };
  draw();
}

// ---------- Input ----------
canvas.addEventListener('click', (e) => {
  if (!playing || animating) return;
  if (mode !== 'two' && turn !== GREEN) return;
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  for (const p of legalMoves(board, turn)) {
    const q = pits[p];
    if (Math.hypot(x - q.x, y - q.y) <= q.r + 6) { makeMove(p); return; }
  }
});
document.getElementById('btnNew').addEventListener('click', () => startGame());
document.getElementById('btnMode').addEventListener('click', () => {
  playing = false;
  btnSpeak.style.display = 'none';
  msgTitle.textContent = 'Congkak';
  msgLine.textContent = 'Tap one of your houses to sow its seeds. Collect the most seeds to win.';
  overlay.classList.remove('hidden');
});
for (const btn of document.querySelectorAll('#modes button')) btn.addEventListener('click', () => startGame(btn.dataset.mode));

// ---------- Main loop ----------
let lastTime = performance.now();
function tick() {
  const now = performance.now();
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  update(dt);
  draw();
}
function loop() { tick(); requestAnimationFrame(loop); }
// Keep the game moving even when the browser pauses animation frames (e.g. a hidden tab)
setInterval(() => { if (performance.now() - lastTime > 250) tick(); }, 100);
window.addEventListener('resize', resize);
resize();
requestAnimationFrame(loop);
</script>
</body>
