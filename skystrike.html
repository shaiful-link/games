<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sky Strike</title>
<style>
  /* Page fills the phone screen: stats on top, game below */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1220;
    color: #ffffff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* Top bar: score, level, power, lives, and the sound button in the corner */
  #top {
    display: flex;
    align-items: stretch;
    gap: 6px;
    padding: 6px 8px;
    background: linear-gradient(#131d38, #0b1220);
  }
  /* Each number sits in its own small rounded card */
  .stat {
    flex: 1;
    min-width: 0;
    text-align: center;
    padding: 3px 2px 4px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.09);
    border-radius: 12px;
  }
  .stat span {
    display: block;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }
  .stat b {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 24px;
    font-size: 19px;
    font-variant-numeric: tabular-nums;
  }
  #score { color: #f4d35e; }
  #level { color: #8fd3ff; }

  /* Power is shown as small bars that light up */
  #power i {
    display: inline-block;
    width: 9px;
    height: 16px;
    margin: 0 2px;
    border-radius: 3px;
    background: rgba(255,255,255,0.14);
  }
  #power i.on {
    background: linear-gradient(#fff3a6, #f4b93e);
    box-shadow: 0 0 6px rgba(244,211,94,0.7);
  }

  /* Lives are shown as small planes (drawn on a tiny canvas) */
  #livesIcons { display: block; }
  .stat.low {                                   /* last life: the card glows red */
    border-color: rgba(255,107,107,0.8);
    background: rgba(255,107,107,0.16);
    animation: lowPulse 0.7s ease-in-out infinite alternate;
  }
  @keyframes lowPulse { from { background: rgba(255,107,107,0.10); } to { background: rgba(255,107,107,0.30); } }

  /* Sound on/off button (top right corner, far away from the steering finger) */
  #sound {
    flex: 0 0 auto;
    width: 38px;
    align-self: stretch;
    min-height: 38px;
    padding: 0;
    font-size: 18px;
    line-height: 1;
    color: #fff;
    background: rgba(255,255,255,0.10);
    border: 0;
    border-radius: 10px;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  #sound.off { opacity: .45; }

  #stage { flex: 1; min-height: 0; }
  #game { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Level</span><b id="level">1/10</b></div>
    <div class="stat"><span>Power</span><b id="power"></b></div>
    <div class="stat" id="livesCard"><span>Lives</span><b id="lives"><canvas id="livesIcons"></canvas></b></div>
    <button id="sound" aria-label="Sound on or off"></button>
  </div>
  <div id="stage"><canvas id="game"></canvas></div>
</div>

<script>
// =====================================================
// SKY STRIKE - plane shooting game, with 10 levels
// Slide your finger in the strip at the bottom to move your plane.
// Your plane shoots by itself. Shoot the enemy planes and dodge their bullets.
// Each level ends with a big boss plane.
// P = stronger guns (up to power 3). Heart = extra life.
// Keyboard (for laptop testing): arrows or A/D move, Space = start
// Sounds are made by code. The speaker button (top right) turns them on or off.
//
// How the pictures work: every plane, bullet, cloud and explosion is painted
// ONCE onto a small hidden canvas (a "sprite") and then stamped onto the screen
// each frame. Stamping a ready-made picture is very fast, even on cheap phones.
// =====================================================

// ---------- Settings (change these to experiment) ----------
const WORLD_W = 360, WORLD_H = 640;   // game area in game units
const CONTROL_ZONE = 100;             // height of the finger strip at the bottom
const FIELD_H = WORLD_H - CONTROL_ZONE;
const PLAYER_Y = FIELD_H - 70;        // where your plane flies
const MOVE_SPEED = 620;               // how fast your plane moves sideways (units per second)
const FIRE_GAP = 0.18;                // seconds between your shots
const SHOT_SPEED = 540;
const START_LIVES = 3;                // lives are topped back up to this at each new level
const MAX_POWER = 3;                  // 1 = single shot, 2 = double, 3 = triple spread
const SAFE_TIME = 2;                  // seconds you cannot be hit again after losing a life
const POWER_DROP = 0.12;              // chance that a destroyed plane drops a power-up
const LIFE_DROP = 0.03;               // chance of a heart (only when a life is missing)
const LEVEL_BONUS = 1000;             // bonus for finishing a level (multiplied by the level number)
const SOUND_VOLUME = 0.25;            // 0 = silent, 1 = very loud
const TAP_GUARD   = 0.4;        // seconds after a result panel appears before a tap is accepted
const MAX_PARTICLES = 150;            // most sparks/smoke puffs on screen at once (keeps cheap phones fast)
const SHAKE_AMOUNT = 1;               // screen shake strength: 0 = no shake, 1 = normal, 2 = strong

// How tough each kind of enemy is, and what it is worth
const ENEMY = {
  small:   { hp: 1, points: 100, size: 1.0 },   // flies straight down, weaving
  zig:     { hp: 2, points: 150, size: 1.1 },   // sweeps from side to side
  shooter: { hp: 4, points: 300, size: 1.3 },   // stops, hovers and shoots at you
  boss:    { hp: 0, points: 2000, size: 3.2 }   // hp comes from the level table
};

// ---------- Levels ----------
// waves   = groups of enemy planes before the boss arrives
// gap     = seconds between groups
// speed   = how fast enemy planes fly (game units per second)
// bullets = how fast enemy bullets fly
// boss    = hits needed to destroy the boss
// To add a level, add one more line to this list.
const LEVELS = [
  { waves: 8,  gap: 2.6, speed: 110, bullets: 150, boss: 50  },   // 1
  { waves: 9,  gap: 2.5, speed: 120, bullets: 160, boss: 65  },   // 2
  { waves: 10, gap: 2.4, speed: 130, bullets: 170, boss: 80  },   // 3
  { waves: 11, gap: 2.3, speed: 140, bullets: 180, boss: 95  },   // 4
  { waves: 12, gap: 2.2, speed: 150, bullets: 190, boss: 110 },   // 5
  { waves: 13, gap: 2.1, speed: 160, bullets: 200, boss: 125 },   // 6
  { waves: 14, gap: 2.0, speed: 170, bullets: 210, boss: 140 },   // 7
  { waves: 15, gap: 1.9, speed: 180, bullets: 220, boss: 155 },   // 8
  { waves: 16, gap: 1.8, speed: 190, bullets: 230, boss: 170 },   // 9
  { waves: 18, gap: 1.7, speed: 200, bullets: 240, boss: 200 }    // 10
];

// ---------- How each level looks (pictures only, the game plays the same) ----------
// ground  = what is below you: 'sea', 'ice', 'land', 'lava' or 'space'
// sea...  = the three colours of the ground (main, lighter patches, darker patches)
// shallow = light water around islands, shore = the beach ring, land... = the island colours
// cloud   = cloud colour, cloudShade = the darker underside of the clouds
// If there are more levels than looks, the looks repeat.
const THEMES = [
  { name: 'Coral Bay',      ground: 'sea',   sea: '#1b6ca8', seaLight: '#2f8fd0', seaDark: '#14588c', foam: 'rgba(255,255,255,0.30)',
    shallow: 'rgba(120,225,235,0.40)', shore: '#e6d6a0', land: '#3f8f4f', landLight: '#63b56a', landDark: '#2c6e3c', trees: true,
    cloud: 'rgba(255,255,255,0.50)', cloudShade: 'rgba(110,150,200,0.30)' },
  { name: 'Emerald Isles',  ground: 'sea',   sea: '#128a9a', seaLight: '#2bb5b8', seaDark: '#0d6f80', foam: 'rgba(255,255,255,0.32)',

    cloud: 'rgba(255,255,255,0.50)', cloudShade: 'rgba(90,170,180,0.30)' },
  { name: 'Sunset Strait',  ground: 'sea',   sea: '#7a4a7e', seaLight: '#e0856a', seaDark: '#55386b', foam: 'rgba(255,210,170,0.35)',
    shallow: 'rgba(255,170,130,0.30)', shore: '#c98a6a', land: '#4a3555', landLight: '#6b4a70', landDark: '#33243f', trees: true,
    cloud: 'rgba(255,196,150,0.50)', cloudShade: 'rgba(170,80,110,0.32)' },
  { name: 'Twilight Reef',  ground: 'sea',   sea: '#3b3f8f', seaLight: '#5a5fc0', seaDark: '#2a2d6e', foam: 'rgba(220,210,255,0.30)',
    shallow: 'rgba(150,160,255,0.35)', shore: '#b9a6c9', land: '#3f6f6a', landLight: '#5a9088', landDark: '#2a504d', trees: true,
    cloud: 'rgba(225,205,255,0.42)', cloudShade: 'rgba(90,70,150,0.30)' },
  { name: 'Moonlit Sea',    ground: 'sea',   sea: '#12305c', seaLight: '#1f4a85', seaDark: '#0b2244', foam: 'rgba(200,225,255,0.32)',
    shallow: 'rgba(90,150,210,0.30)', shore: '#8fa3b8', land: '#1f4a3c', landLight: '#2f6a55', landDark: '#12332a', trees: true, lights: true,
    cloud: 'rgba(170,190,230,0.30)', cloudShade: 'rgba(20,30,60,0.30)' },
  { name: 'Storm Front',    ground: 'sea',   sea: '#3c5a66', seaLight: '#557a86', seaDark: '#2a434d', foam: 'rgba(255,255,255,0.38)',
    shallow: 'rgba(150,190,190,0.30)', shore: '#9a9a86', land: '#3d6148', landLight: '#55805f', landDark: '#2a4532', trees: true, rain: true,
    cloud: 'rgba(70,80,95,0.55)', cloudShade: 'rgba(25,30,40,0.35)' },
  { name: 'Frozen North',   ground: 'ice',   sea: '#2c6f9e', seaLight: '#4a93c2', seaDark: '#1f5680', foam: 'rgba(255,255,255,0.35)',
    shallow: 'rgba(190,235,255,0.45)', shore: '#cfeaf7', land: '#f4fbff', landLight: '#ffffff', landDark: '#b9d9ea', trees: false,
    cloud: 'rgba(255,255,255,0.45)', cloudShade: 'rgba(130,170,210,0.30)' },
  { name: 'Jungle River',   ground: 'land',  sea: '#2a6a4a', seaLight: '#3a8558', seaDark: '#1f5239', foam: 'rgba(20,60,40,0.55)',
    shallow: null, shore: '#d9c98a', land: '#2a7fb0', landLight: '#4aa3cf', landDark: '#1f6690', trees: false,
    cloud: 'rgba(255,255,255,0.42)', cloudShade: 'rgba(60,110,90,0.30)' },
  { name: 'Fire Mountains', ground: 'lava',  sea: '#3a2a2e', seaLight: '#4f3b3d', seaDark: '#261a1e', foam: 'rgba(255,120,30,0.55)',
    shallow: 'rgba(255,90,20,0.25)', shore: '#ff7b1c', land: '#ffb52e', landLight: '#ffe27a', landDark: '#ff8a1c', trees: false,
    cloud: 'rgba(60,45,50,0.50)', cloudShade: 'rgba(20,12,14,0.35)' },
  { name: 'Edge of Space',  ground: 'space', sea: '#0a0f2a', seaLight: '#2a2f7a', seaDark: '#050818', foam: 'rgba(255,255,255,0.9)',
    shallow: null, shore: '#6a5acd', land: '#8a7bea', landLight: '#c6bcff', landDark: '#4a3d9e', trees: false, noShadows: true,
    cloud: 'rgba(130,150,255,0.16)', cloudShade: 'rgba(200,120,255,0.10)' }
];

// The boss of each level: its name and its paint colours (pictures only)
const BOSS_LOOKS = [
  { name: 'IRON HAWK',     hull: '#8c3b3b', light: '#c96a62', dark: '#5a2327', accent: '#ffd166' },   // 1
  { name: 'SKY CRUSHER',   hull: '#8a4a2a', light: '#cf8250', dark: '#57301c', accent: '#ffe08a' },   // 2
  { name: 'CRIMSON BARON', hull: '#a12f3f', light: '#e0606b', dark: '#651c2a', accent: '#ffd166' },   // 3
  { name: 'NIGHT RAVEN',   hull: '#5b4a86', light: '#8f7cc4', dark: '#382c57', accent: '#ff8fab' },   // 4
  { name: 'SHADOW BAT',    hull: '#6a5a7a', light: '#a391b6', dark: '#3f3549', accent: '#7df9ff' },   // 5
  { name: 'THUNDER KING',  hull: '#7a6a3a', light: '#bfa85c', dark: '#4a3f20', accent: '#fff36b' },   // 6
  { name: 'FROST GIANT',   hull: '#7a4a6a', light: '#b97aa3', dark: '#4a2a40', accent: '#9ff0ff' },   // 7
  { name: 'JUNGLE VIPER',  hull: '#8c3b5a', light: '#cf6a90', dark: '#571f36', accent: '#c8ff6b' },   // 8
  { name: 'FIRE DRAGON',   hull: '#93412c', light: '#e07a4c', dark: '#5a2416', accent: '#ffe27a' },   // 9
  { name: 'SKY EMPEROR',   hull: '#8a3ba0', light: '#c877e0', dark: '#52206a', accent: '#ffd166' }    // 10
];

// ---------- Page elements ----------
const stage  = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const elScore = document.getElementById('score');
const elLevel = document.getElementById('level');
const elPower = document.getElementById('power');
const elLives = document.getElementById('lives');
const elLivesCard = document.getElementById('livesCard');
const livesCanvas = document.getElementById('livesIcons');

// ---------- Sound ----------
// All sounds are made by code (short notes), so there are no sound files to upload.
// Phones only allow sound after a touch, so the sound engine starts on the first touch.
// The on/off choice is remembered, and is shared by all the games on this site.
const btnSound = document.getElementById('sound');
let audio = null;                // the sound engine (created on first touch)
let muted = false;
try { muted = localStorage.getItem('gamesMuted') === '1'; } catch (e) { /* storage blocked: start with sound on */ }

function showSoundButton() {
  btnSound.textContent = muted ? '\u{1F507}' : '\u{1F50A}';      // speaker off / speaker on
  btnSound.classList.toggle('off', muted);
}
showSoundButton();

function startAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }                                  // no sound support: the game still works
}
// Different phones accept different kinds of touch for this, so listen for all of them
for (const type of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(type, startAudio, true);
}

// Play one note.
//   freq  = pitch in Hz (higher number = higher note)
//   dur   = length in seconds
//   type  = 'sine' (soft), 'triangle' (round), 'square' (retro), 'sawtooth' (buzzy)
//   delay = seconds to wait before it starts (used to build little tunes)
//   slide = pitch to glide to by the end (optional)
//   volume = 0 to 1, share of SOUND_VOLUME
function beep(freq, dur, type = 'sine', delay = 0, slide = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(SOUND_VOLUME * volume, t + 0.01);   // quick fade in (no click)
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);                   // fade out
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// Play a burst of hiss (for explosions, crashes, whooshes).
//   dur = length in seconds, tone = how bright it is in Hz (300 = deep boom, 4000 = sharp crack)
let noiseBuffer = null;
function noise(dur, tone = 1000, delay = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  if (!noiseBuffer) {                                            // one second of random hiss, made once
    noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const t = audio.currentTime + delay;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = noiseBuffer;
  src.loop = true;
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(tone, t);
  filter.frequency.exponentialRampToValueAtTime(Math.max(60, tone * 0.25), t + dur);
  gain.gain.setValueAtTime(SOUND_VOLUME * volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

// Short buzz on Android phones (iPhone does not allow this from a web page)
function buzz(ms) {
  if (!muted && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

btnSound.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('gamesMuted', muted ? '1' : '0'); } catch (e) {}
  showSoundButton();
  startAudio();
  btnSound.blur();                                                         // so the Space key does not press it again
  if (!muted) setTimeout(() => beep(740, 0.05, 'sine', 0, 0, 0.6), 60);   // small note to confirm sound is on
});

// Some sounds can happen many times a second (shooting, hits).
// notTooSoon('name', 60) says "yes" only if that sound has not played in the last 60 ms.
const lastPlayed = {};
function notTooSoon(name, gapMs) {
  const now = performance.now();
  if (lastPlayed[name] !== undefined && now - lastPlayed[name] < gapMs) return false;
  lastPlayed[name] = now;
  return true;
}

// The game's sounds. Each one is built from beep() notes and noise() bursts.
const sfx = {
  // Your gun: a tiny soft "pew". The pitch changes a little each time so it is not boring.
  shoot() {
    if (!notTooSoon('shoot', 60)) return;
    beep(rand(780, 960), 0.06, 'triangle', 0, 400, 0.28);
  },
  // An enemy gun: lower and quieter
  enemyShot() {
    if (!notTooSoon('enemyShot', 90)) return;
    beep(250, 0.09, 'square', 0, 150, 0.2);
  },
  // Your shot hit an enemy but did not destroy it: tiny tick
  hit() {
    if (!notTooSoon('hit', 60)) return;
    beep(1500, 0.03, 'square', 0, 0, 0.18);
  },
  // Your shot hit the boss: low thump
  bossHit() {
    if (!notTooSoon('bossHit', 90)) return;
    beep(130, 0.09, 'sine', 0, 60, 0.8);
  },
  // An enemy plane blew up: hiss + falling note. Bigger planes sound deeper.
  destroy(kind) {
    if (!notTooSoon('destroy', 50)) return;
    if (kind === 'shooter')  { noise(0.30, 800, 0, 0.7);   beep(260, 0.30, 'triangle', 0, 60, 0.6); }
    else if (kind === 'zig') { noise(0.20, 1500, 0, 0.55); beep(400, 0.20, 'triangle', 0, 100, 0.5); }
    else                     { noise(0.16, 2200, 0, 0.5);  beep(520, 0.16, 'triangle', 0, 140, 0.5); }
  },
  // You lost a life: crunch + falling note
  lifeLost() {
    noise(0.30, 1200, 0, 0.9);
    beep(420, 0.40, 'sawtooth', 0, 70, 0.5);
    buzz(40);
  },
  // You lost your last life: crunch, then a sad falling tune
  gameOver() {
    noise(0.45, 900, 0, 1);
    beep(300, 0.45, 'sawtooth', 0, 50, 0.5);
    beep(392, 0.20, 'triangle', 0.55);
    beep(330, 0.20, 'triangle', 0.77);
    beep(262, 0.20, 'triangle', 0.99);
    beep(196, 0.55, 'triangle', 1.21);
    buzz(40);
  },
  // Picked up a P: three rising notes
  power() {
    beep(660, 0.09, 'sine', 0);
    beep(880, 0.09, 'sine', 0.08);
    beep(1175, 0.16, 'sine', 0.16);
  },
  // Picked up a P at full power (bonus points): two quick notes
  bonus() {
    beep(988, 0.07, 'sine', 0);
    beep(1319, 0.14, 'sine', 0.07);
  },
  // Picked up a heart: brighter, longer chime
  extraLife() {
    beep(784, 0.10, 'triangle', 0);
    beep(988, 0.10, 'triangle', 0.09);
    beep(1175, 0.10, 'triangle', 0.18);
    beep(1568, 0.30, 'triangle', 0.27);
    beep(2093, 0.30, 'sine', 0.27, 0, 0.5);
  },
  // The boss is coming: two-tone alarm, three times
  bossWarning() {
    for (let i = 0; i < 3; i++) {
      beep(620, 0.20, 'square', i * 0.6, 0, 0.3);
      beep(440, 0.20, 'square', i * 0.6 + 0.24, 0, 0.3);
    }
  },
  // The boss blew up: a chain of booms over about a second, then one huge one
  bossDestroyed() {
    noise(0.35, 900, 0, 1);
    noise(0.30, 1400, 0.20, 0.8);
    noise(0.30, 700, 0.42, 0.9);
    noise(0.30, 1600, 0.64, 0.8);
    noise(0.35, 600, 0.86, 0.9);
    noise(0.90, 500, 1.15, 1);
    beep(160, 0.60, 'sawtooth', 1.15, 40, 0.6);
    buzz(40);
  },
  // Level finished: short rising tune ("delay" lets the boss explosion finish first)
  levelClear(delay) {
    beep(523, 0.12, 'triangle', delay);
    beep(659, 0.12, 'triangle', delay + 0.12);
    beep(784, 0.12, 'triangle', delay + 0.24);
    beep(1047, 0.35, 'triangle', delay + 0.36);
  },
  // You beat the whole game: a longer fanfare
  victory(delay) {
    const tune = [523, 659, 784, 1047, 784, 1047, 1319];
    for (let i = 0; i < tune.length; i++) beep(tune[i], 0.14, 'triangle', delay + i * 0.13);
    beep(1568, 0.6, 'triangle', delay + tune.length * 0.13);
    beep(1047, 0.6, 'sine', delay + tune.length * 0.13, 0, 0.6);
  },
  // Starting a level: quick little jingle
  start() {
    beep(392, 0.08, 'triangle', 0);
    beep(523, 0.08, 'triangle', 0.08);
    beep(659, 0.08, 'triangle', 0.16);
    beep(784, 0.18, 'triangle', 0.24);
  }
};

// ---------- Game state ----------
let screen = 'title';            // 'title' | 'play' | 'clear' | 'over' | 'won'
let level = 1, score = 0, levelStartScore = 0;
let lives = START_LIVES, power = 1;
let planeX = WORLD_W / 2;        // centre of your plane
let targetX = WORLD_W / 2;       // where your finger wants the plane to be
let shots = [];                  // your bullets: { x, y, vx, vy }
let enemyShots = [];             // enemy bullets
let enemies = [];
let drops = [];                  // falling power-ups: { kind, x, y }
let sparks = [];                 // explosion pieces, smoke puffs and confetti
let effects = [];                // floating text
let fireTimer = 0, safeTimer = 0;
let wavesLeft = 0, waveTimer = 0;
let bossState = 'none';          // 'none' | 'warning' | 'fighting'
let bossTimer = 0;
let seaScroll = 0, clock = 0;
const keys = {};

// ---------- Extra state used only for the pictures (never changes the game) ----------
let blasts = [];                 // explosion fireballs: { x, y, t, life, size }
let rings = [];                  // expanding rings when you pick something up
let flashes = [];                // small gun flashes
let wreck = null;                // the boss while it is blowing up: { x, y, t, timer }
let farScroll = 0, nearScroll = 0, rainScroll = 0;   // how far each cloud layer has scrolled
let tilt = 0;                    // how much your plane leans: -1 = hard left, 1 = hard right
let lastPlaneX = WORLD_W / 2;
let muzzleTimer = 0;             // your gun flash is shown while this is above 0
let shakeTime = 0, shakeSize = 0;
let whiteFlash = 0, redFlash = 0;   // full-screen flashes (boss explosion, being hit)
let shownScreen = '';            // the screen we were on last frame (to notice changes)
let screenTime = 0;              // seconds since the screen changed (for the pop-in animation)
let panelDelay = 0;              // wait this long before the message panel pops in
let levelTime = 0;               // seconds since the level started (for the "LEVEL 3" banner)
let smokeTimer = 0, partyTimer = 0, lightningAt = 6, lightning = 0;

// Screen fitting
let dpr = 1, scale = 1, offX = 0, offY = 0, screenW = 0, screenH = 0;

// Islands in the sea (same every time, so the view is steady)
const ISLANDS = [
  { x: 60, y: 80, r: 34 }, { x: 290, y: 260, r: 46 }, { x: 120, y: 470, r: 28 },
  { x: 250, y: 640, r: 38 }, { x: 40, y: 800, r: 30 }
];
const SEA_LOOP = 900;            // the sea picture repeats after this many units
// A few tiny extra rocks between the islands, and how tall the cloud pictures are
const ISLETS = [ { x: 205, y: 150, r: 11 }, { x: 335, y: 530, r: 13 }, { x: 160, y: 735, r: 10 }, { x: 25, y: 340, r: 9 } ];
const FAR_LOOP = 640, NEAR_LOOP = 880, RAIN_LOOP = 560;
const TAU = Math.PI * 2;         // a full circle

// ---------- Helpers ----------
function rand(lo, hi) { return lo + Math.random() * (hi - lo); }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// A random-number maker that gives the SAME numbers every time for the same seed.
// Used to paint backgrounds, so the islands and clouds look the same on every visit.
function seededRandom(seed) {
  let s = seed;
  return function () {
    s = (s * 16807) % 2147483647;
    return s / 2147483647;
  };
}

// Turn '#rrggbb' into 'rgba(r,g,b,alpha)'
function withAlpha(hex, alpha) {
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
}

// "Pop" curve for animations: goes 0 -> a little over 1 -> 1
function popCurve(p) {
  p = clamp(p, 0, 1);
  const c = 1.9;
  return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2);
}

// ---------- Start a level ----------
function startLevel(n) {
  level = n;
  levelStartScore = score;
  shots = []; enemyShots = []; enemies = []; drops = []; sparks = []; effects = [];
  blasts = []; rings = []; flashes = []; wreck = null;     // (pictures only)
  whiteFlash = 0; redFlash = 0; shakeTime = 0; levelTime = 0;
  wavesLeft = LEVELS[n - 1].waves;
  waveTimer = 1.2;               // short calm before the first planes
  bossState = 'none';
  fireTimer = 0;
  safeTimer = 0;
  screen = 'play';
  updateHud();
}

// Tap or Space: what happens depends on the current screen
function advance() {
  // Wait until the message panel has popped in before a tap counts.
  // A finger that is still steering cannot skip the boss explosion or the result by accident.
  if (screen !== 'title' && screenTime < panelDelay + TAP_GUARD) return;
  if (screen === 'title' || screen === 'won') { score = 0; lives = START_LIVES; power = 1; startLevel(1); sfx.start(); }
  else if (screen === 'clear') { lives = Math.max(lives, START_LIVES); startLevel(level + 1); sfx.start(); }
  else if (screen === 'over') { score = levelStartScore; lives = START_LIVES; power = 1; startLevel(level); sfx.start(); }   // retry same level
}

// The top bar. To save work, the page is only touched when a number really changed.
const hudShown = { score: null, level: null, power: null, lives: null };
function updateHud() {
  if (hudShown.score !== score) { hudShown.score = score; elScore.textContent = score; }
  if (hudShown.level !== level) { hudShown.level = level; elLevel.textContent = level + '/' + LEVELS.length; }
  if (hudShown.power !== power) {
    hudShown.power = power;
    // One small bar for each power step; the first "power" bars are lit
    elPower.textContent = '';
    for (let i = 1; i <= MAX_POWER; i++) {
      const bar = document.createElement('i');
      if (i <= power) bar.className = 'on';
      elPower.appendChild(bar);
    }
    elPower.setAttribute('aria-label', 'Power ' + power);
  }
  if (hudShown.lives !== lives) {
    hudShown.lives = lives;
    drawLivesIcons();
    elLives.setAttribute('aria-label', lives + ' lives');
    elLivesCard.classList.toggle('low', lives <= 1);
  }
}

// Lives are drawn as small copies of your plane; lost lives are shown faded
function drawLivesIcons() {
  if (!sprites.player) return;                   // pictures not painted yet
  const size = 18;                               // size of one icon on the page
  const slots = Math.max(START_LIVES, lives);
  livesCanvas.width = Math.round(slots * size * dpr);
  livesCanvas.height = Math.round(size * dpr);
  livesCanvas.style.width = slots * size + 'px';
  livesCanvas.style.height = size + 'px';
  const g = livesCanvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, slots * size, size);
  for (let i = 0; i < slots; i++) {
    g.globalAlpha = i < lives ? 1 : 0.18;
    g.drawImage(sprites.player.canvas, i * size, 0, size, size);
  }
}

// ---------- Enemy planes ----------
function addEnemy(kind, x, y, extra) {
  const base = ENEMY[kind];
  enemies.push(Object.assign({
    kind, x, y, baseX: x, hp: base.hp, t: 0,
    dir: Math.random() < 0.5 ? -1 : 1,
    fireAt: -1,                 // small planes: the height at which they fire once (-1 = never)
    fireTimer: rand(0.6, 1.4)   // shooters and the boss: time until the next shot
  }, extra || {}));
}

// Send in one group of planes. Later levels unlock more kinds of group.
function spawnWave() {
  const kinds = ['line', 'column'];
  if (level >= 2) kinds.push('vee');
  if (level >= 3) kinds.push('zig');
  if (level >= 4) kinds.push('shooter');
  const kind = kinds[Math.floor(Math.random() * kinds.length)];
  const fireChance = Math.min(0.5, 0.08 * level);
  const maybeFire = () => (Math.random() < fireChance ? rand(60, 240) : -1);

  if (kind === 'line') {
    // Four planes side by side
    const start = rand(50, 110);
    for (let i = 0; i < 4; i++) addEnemy('small', start + i * 66, -30, { amp: 0, fireAt: maybeFire() });
  } else if (kind === 'column') {
    // Five planes one behind the other, weaving
    const x = rand(80, WORLD_W - 80);
    for (let i = 0; i < 5; i++) addEnemy('small', x, -30 - i * 48, { amp: 46, phase: i * 0.5, fireAt: maybeFire() });
  } else if (kind === 'vee') {
    // Five planes in a V shape
    const x = rand(110, WORLD_W - 110);
    for (let i = -2; i <= 2; i++) addEnemy('small', x + i * 42, -30 - Math.abs(i) * 34, { amp: 0, fireAt: maybeFire() });
  } else if (kind === 'zig') {
    for (let i = 0; i < 3; i++) addEnemy('zig', rand(50, WORLD_W - 50), -30 - i * 70);
  } else {
    const count = level >= 7 ? 2 : 1;
    for (let i = 0; i < count; i++) addEnemy('shooter', rand(70, WORLD_W - 70), -40 - i * 60, { hoverY: rand(90, 190), hover: 0 });
  }
}

function spawnBoss() {
  addEnemy('boss', WORLD_W / 2, -80, { hp: LEVELS[level - 1].boss, maxHp: LEVELS[level - 1].boss, fireTimer: 1.5, pattern: 0 });
  bossState = 'fighting';
}

// Fire one enemy bullet from (x, y) at an angle. 0 = straight down, positive = to the right.
function enemyFire(x, y, angle) {
  const speed = LEVELS[level - 1].bullets;
  enemyShots.push({ x, y, vx: Math.sin(angle) * speed, vy: Math.cos(angle) * speed });
  // Gun flash and sound (a fan of bullets from one gun makes just one flash)
  const last = flashes[flashes.length - 1];
  if (!last || last.x !== x || last.y !== y || last.t > 0) flashes.push({ x, y, t: 0, life: 0.12, size: 26, enemy: true });
  sfx.enemyShot();
}
// Angle from (x, y) toward your plane
function aimAt(x, y) { return Math.atan2(planeX - x, PLAYER_Y - y); }

function updateEnemy(e, dt) {
  const def = LEVELS[level - 1];
  e.t += dt;

  if (e.kind === 'small') {
    const before = e.y;
    e.y += def.speed * dt;
    e.x = e.baseX + Math.sin(e.t * 2.2 + (e.phase || 0)) * (e.amp || 0);
    // Fire once when passing its firing height
    if (e.fireAt >= 0 && before < e.fireAt && e.y >= e.fireAt) enemyFire(e.x, e.y + 10, aimAt(e.x, e.y));
  } else if (e.kind === 'zig') {
    e.y += def.speed * 0.75 * dt;
    e.x += e.dir * def.speed * 1.1 * dt;
    if (e.x < 30) { e.x = 30; e.dir = 1; }
    if (e.x > WORLD_W - 30) { e.x = WORLD_W - 30; e.dir = -1; }
  } else if (e.kind === 'shooter') {
    if (e.y < e.hoverY && e.hover < 5) {
      e.y += def.speed * dt;                       // flying in
    } else if (e.hover < 5) {
      // Hovering: drift sideways and shoot at you
      e.hover += dt;
      e.x += e.dir * 55 * dt;
      if (e.x < 40) { e.x = 40; e.dir = 1; }
      if (e.x > WORLD_W - 40) { e.x = WORLD_W - 40; e.dir = -1; }
      e.fireTimer -= dt;
      if (e.fireTimer <= 0) {
        enemyFire(e.x, e.y + 14, aimAt(e.x, e.y));
        e.fireTimer = Math.max(0.8, 1.9 - level * 0.08);
      }
    } else {
      e.y += def.speed * 1.2 * dt;                 // leaving
    }
  } else {
    // Boss: fly in, then sweep side to side and fire patterns
    if (e.y < 95) { e.y += 70 * dt; e.t = 0; return; }
    e.x = WORLD_W / 2 + Math.sin(e.t * 0.8) * 105;
    e.fireTimer -= dt;
    if (e.fireTimer <= 0) {
      if (e.pattern % 2 === 0) {
        // Three bullets aimed at you
        const a = aimAt(e.x, e.y + 30);
        for (const off of [-0.22, 0, 0.22]) enemyFire(e.x, e.y + 30, a + off);
      } else {
        // A fan of five bullets
        for (let i = -2; i <= 2; i++) enemyFire(e.x, e.y + 30, i * 0.32);
      }
      e.pattern++;
      e.fireTimer = Math.max(0.9, 1.9 - level * 0.09);
    }
  }
}

// How close a shot must be to hit each kind of plane
function hitRadius(e) { return e.kind === 'boss' ? 46 : 15 * ENEMY[e.kind].size; }

function destroyEnemy(e) {
  e.dead = true;
  const points = ENEMY[e.kind].points * (e.kind === 'boss' ? level : 1);
  score += points;
  explode(e.x, e.y, e.kind === 'boss' ? 40 : 10, e.kind === 'boss' ? '#f79d65' : '#f4d35e');

  if (e.kind === 'boss') {
    // The boss does not just vanish: its wreck keeps exploding for a moment (pictures and sound only)
    wreck = { x: e.x, y: e.y, t: 0, timer: 0 };
    floatText('+' + points, e.x, e.y - 20, '#ffd166', 24);
    sfx.bossDestroyed();
    return;
  }
  floatText('+' + points, e.x, e.y, '#ffffff', 14);
  sfx.destroy(e.kind);
  // Sometimes leave a power-up behind
  const roll = Math.random();
  if (roll < LIFE_DROP && lives < START_LIVES) drops.push({ kind: 'life', x: e.x, y: e.y });
  else if (roll < LIFE_DROP + (e.kind === 'shooter' ? 0.4 : POWER_DROP)) drops.push({ kind: 'power', x: e.x, y: e.y });
}

// Add one spark, smoke puff or confetti piece (but never more than MAX_PARTICLES at once)
function addParticle(p) {
  if (sparks.length < MAX_PARTICLES) sparks.push(p);
}

// An explosion at (x, y). "count" = how big (10 = small plane, 40 = boss).
// It is built in layers: a fireball with a flash and a ring, flying sparks, and some smoke.
function explode(x, y, count, color) {
  const size = 40 + count * 2.2;
  blasts.push({ x, y, t: 0, life: 0.36 + count * 0.008, size });
  // Two smaller fireballs beside the main one, starting a moment later (looks less like a perfect circle)
  blasts.push({ x: x + rand(-0.25, 0.25) * size, y: y + rand(-0.25, 0.25) * size, t: -0.05, life: 0.3, size: size * 0.6, noRing: true });
  blasts.push({ x: x + rand(-0.3, 0.3) * size, y: y + rand(-0.3, 0.3) * size, t: -0.11, life: 0.3, size: size * 0.5, noRing: true });
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = rand(40, 190);
    addParticle({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.3, 0.7), color, size: rand(5, 9) });
  }
  for (let i = 0; i < Math.ceil(count / 5); i++) {
    addParticle({ kind: 'smoke', x: x + rand(-8, 8), y: y + rand(-8, 8), vx: rand(-20, 20), vy: rand(-10, 30), t: 0, life: rand(0.5, 0.9), size: rand(22, 34) + count * 0.5 });
  }
  shake(count * 0.14, 0.12 + count * 0.008);
}

// Shake the picture a little. size = how many game units, time = seconds.
function shake(size, time) {
  // A small shake never cancels a bigger one that is still going
  if (shakeTime <= 0 || size * SHAKE_AMOUNT >= shakeSize) { shakeSize = size * SHAKE_AMOUNT; shakeTime = time; }
}

function floatText(text, x, y, color, size) {
  effects.push({ text, x, y, color, t: 0, life: 0.9, size: size || 16 });
}

// Your plane was hit
function playerHit() {
  lives--;
  power = Math.max(1, power - 1);
  safeTimer = SAFE_TIME;
  enemyShots = [];                               // clear the bullets to give you a fresh start
  explode(planeX, PLAYER_Y, 14, '#4dd4ac');
  redFlash = 0.22;
  shake(5, 0.3);
  if (lives <= 0) {
    lives = 0; screen = 'over'; sfx.gameOver();
    explode(planeX, PLAYER_Y, 24, '#ffd166');    // your last plane goes with a bigger bang (picture only)
  }
  if (lives > 0) sfx.lifeLost();
}

// ---------- Update the pictures-only things (clouds, smoke, shake, confetti) ----------
function updateLooks(dt) {
  screenTime += dt;
  levelTime += dt;

  // The view keeps scrolling on every screen except "game over" (where everything freezes)
  if (screen !== 'over') {
    seaScroll = (seaScroll + 60 * dt) % SEA_LOOP;
    farScroll = (farScroll + 85 * dt) % FAR_LOOP;
    nearScroll = (nearScroll + 135 * dt) % NEAR_LOOP;
    rainScroll = (rainScroll + 520 * dt) % RAIN_LOOP;
  }

  // Lean the plane toward the way it is moving (smoothly)
  const sideSpeed = dt > 0 ? (planeX - lastPlaneX) / dt / MOVE_SPEED : 0;
  lastPlaneX = planeX;
  tilt += (clamp(sideSpeed * 1.6, -1, 1) - tilt) * Math.min(1, dt * 12);

  // Timers that simply count down
  muzzleTimer = Math.max(0, muzzleTimer - dt);
  shakeTime = Math.max(0, shakeTime - dt);
  whiteFlash = Math.max(0, whiteFlash - dt * 2.2);
  redFlash = Math.max(0, redFlash - dt * 1.5);
  lightning = Math.max(0, lightning - dt);

  for (const b of blasts) b.t += dt;
  blasts = blasts.filter(b => b.t < b.life);
  for (const r of rings) r.t += dt;
  rings = rings.filter(r => r.t < r.life);
  for (const f of flashes) f.t += dt;
  flashes = flashes.filter(f => f.t < f.life);

  // The boss wreck: small explosions all over it, then one huge one
  if (wreck) {
    wreck.t += dt;
    wreck.timer -= dt;
    if (wreck.t < 1.15 && wreck.timer <= 0) {
      wreck.timer = 0.13;
      const x = wreck.x + rand(-44, 44), y = wreck.y + rand(-36, 36);
      blasts.push({ x, y, t: 0, life: 0.42, size: rand(56, 90) });
      for (let i = 0; i < 4; i++) {
        const a = Math.random() * TAU, s = rand(60, 200);
        addParticle({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.3, 0.6), color: '#ffd166', size: rand(5, 9) });
      }
      addParticle({ kind: 'smoke', x, y, vx: rand(-20, 20), vy: rand(-30, 0), t: 0, life: 0.9, size: rand(34, 50) });
      shake(2.5, 0.15);
    }
    if (wreck.t >= 1.15) {
      // The final blast: big fireball, white flash, lots of sparks, strong shake
      blasts.push({ x: wreck.x, y: wreck.y, t: 0, life: 1.0, size: 250 });
      blasts.push({ x: wreck.x - 34, y: wreck.y + 14, t: -0.08, life: 0.7, size: 140, noRing: true });
      blasts.push({ x: wreck.x + 36, y: wreck.y - 12, t: -0.16, life: 0.7, size: 140, noRing: true });
      blasts.push({ x: wreck.x + 6, y: wreck.y + 30, t: -0.26, life: 0.7, size: 120 });
      blasts.push({ x: wreck.x - 10, y: wreck.y - 28, t: -0.36, life: 0.7, size: 110, noRing: true });
      for (let i = 0; i < 46; i++) {
        const a = Math.random() * TAU, s = rand(60, 330);
        addParticle({ kind: 'spark', x: wreck.x, y: wreck.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.5, 1.2),
                      color: i % 3 === 0 ? '#ffffff' : i % 3 === 1 ? '#ffd166' : '#f79d65', size: rand(6, 12) });
      }
      for (let i = 0; i < 8; i++) {
        addParticle({ kind: 'smoke', x: wreck.x + rand(-30, 30), y: wreck.y + rand(-24, 24), vx: rand(-40, 40), vy: rand(-40, 20), t: 0, life: rand(0.9, 1.5), size: rand(54, 80) });
      }
      whiteFlash = 0.85;
      shake(9, 0.55);
      wreck = null;
    }
  }

  // A badly damaged boss trails smoke and sparks
  if (screen === 'play') {
    for (const e of enemies) {
      if (e.kind !== 'boss' || e.dead || e.hp / e.maxHp > 0.35) continue;
      smokeTimer -= dt;
      if (smokeTimer <= 0) {
        smokeTimer = 0.07;
        const x = e.x + rand(-40, 40), y = e.y + rand(-24, 16);
        addParticle({ kind: 'smoke', x, y, vx: rand(-15, 15), vy: rand(-70, -30), t: 0, life: rand(0.7, 1.1), size: rand(26, 40) });
        if (Math.random() < 0.45) {
          const a = Math.random() * TAU, s = rand(50, 150);
          addParticle({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.25, 0.5), color: '#ffd166', size: rand(4, 8) });
        }
      }
    }
  }

  // Storm levels: a soft lightning flash now and then
  if (screen === 'play' && currentTheme().rain) {
    lightningAt -= dt;
    if (lightningAt <= 0) { lightning = 0.22; lightningAt = rand(5, 9); }
  }

  // You won the whole game: confetti and fireworks
  if (screen === 'won') {
    partyTimer -= dt;
    if (partyTimer <= 0) {
      partyTimer = 0.07;
      const colours = ['#ff6b6b', '#f4d35e', '#4dd4ac', '#8fd3ff', '#ff8fab', '#b388eb'];
      // Confetti falls from the top
      if (sparks.length < 90) {
        for (let i = 0; i < 2; i++) {
          addParticle({ kind: 'confetti', x: rand(0, WORLD_W), y: -10, vx: rand(-30, 30), vy: rand(70, 150), t: 0, life: 4.2,
                        color: colours[Math.floor(Math.random() * colours.length)], size: rand(8, 12), spin: rand(4, 9) });
        }
      }
      // A firework every so often
      if (Math.random() < 0.13 && screenTime > panelDelay) {
        // (above or below the message panel, so they are not hidden behind it)
        const x = rand(40, WORLD_W - 40), y = Math.random() < 0.6 ? rand(40, 125) : rand(385, 470);
        const color = colours[Math.floor(Math.random() * colours.length)];
        blasts.push({ x, y, t: 0, life: 0.5, size: 90, ringOnly: true });
        for (let i = 0; i < 18; i++) {
          const a = i / 18 * TAU, s = rand(90, 130);
          addParticle({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rand(0.8, 1.1), color, size: 11, gravity: 90 });
        }
      }
    }
  }
}

// ---------- Update: move the whole game forward by dt seconds ----------
function update(dt) {
  clock += dt;
  updateLooks(dt);
  for (const s of sparks) {
    s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.gravity) s.vy += s.gravity * dt;
  }
  sparks = sparks.filter(s => s.t < s.life);
  for (const e of effects) e.t += dt;
  effects = effects.filter(e => e.t < e.life);

  if (screen !== 'play') return;
  const def = LEVELS[level - 1];

  // Move your plane toward your finger
  if (keys['ArrowLeft']  || keys['a']) targetX = planeX - 60;
  if (keys['ArrowRight'] || keys['d']) targetX = planeX + 60;
  targetX = clamp(targetX, 22, WORLD_W - 22);
  const step = MOVE_SPEED * dt;
  planeX += clamp(targetX - planeX, -step, step);
  safeTimer = Math.max(0, safeTimer - dt);

  // Your guns fire by themselves
  fireTimer -= dt;
  if (fireTimer <= 0) {
    fireTimer = FIRE_GAP;
    const y = PLAYER_Y - 16;
    if (power === 1) shots.push({ x: planeX, y, vx: 0, vy: -SHOT_SPEED });
    else if (power === 2) {
      shots.push({ x: planeX - 8, y, vx: 0, vy: -SHOT_SPEED });
      shots.push({ x: planeX + 8, y, vx: 0, vy: -SHOT_SPEED });
    } else {
      shots.push({ x: planeX, y, vx: 0, vy: -SHOT_SPEED });
      shots.push({ x: planeX - 8, y, vx: -SHOT_SPEED * 0.2, vy: -SHOT_SPEED });
      shots.push({ x: planeX + 8, y, vx: SHOT_SPEED * 0.2, vy: -SHOT_SPEED });
    }
    muzzleTimer = 0.06;                          // show the gun flash for a moment
    sfx.shoot();
  }

  // New groups of planes, then the boss
  if (wavesLeft > 0) {
    waveTimer -= dt;
    if (waveTimer <= 0) { spawnWave(); wavesLeft--; waveTimer = def.gap; }
  } else if (bossState === 'none' && enemies.length === 0) {
    bossState = 'warning';
    bossTimer = 2;
    sfx.bossWarning();
  } else if (bossState === 'warning') {
    bossTimer -= dt;
    if (bossTimer <= 0) spawnBoss();
  }

  // Move everything
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; }
  for (const s of enemyShots) { s.x += s.vx * dt; s.y += s.vy * dt; }
  for (const d of drops) d.y += 110 * dt;
  for (const e of enemies) updateEnemy(e, dt);

  // Your shots hitting enemy planes
  for (const s of shots) {
    for (const e of enemies) {
      if (e.dead || s.used) continue;
      if (Math.abs(s.x - e.x) < hitRadius(e) && Math.abs(s.y - e.y) < hitRadius(e)) {
        s.used = true;
        e.hp--;
        e.flash = 0.08;
        if (e.hp <= 0) destroyEnemy(e);
        else {
          // Not destroyed yet: a tiny spark and a tick (or a thump for the boss)
          addParticle({ kind: 'spark', x: s.x, y: s.y - 6, vx: rand(-70, 70), vy: rand(20, 110), t: 0, life: 0.22, color: '#fff6b0', size: 6 });
          if (e.kind === 'boss') sfx.bossHit(); else sfx.hit();
        }
      }
    }
  }
  for (const e of enemies) if (e.flash) e.flash = Math.max(0, e.flash - dt);

  // Things hitting your plane (the hit area is smaller than the plane, to be forgiving)
  if (safeTimer === 0) {
    let hit = false;
    for (const s of enemyShots) {
      if (Math.abs(s.x - planeX) < 9 && Math.abs(s.y - PLAYER_Y) < 12) { hit = true; break; }
    }
    for (const e of enemies) {
      if (e.dead) continue;
      const r = hitRadius(e) * 0.8 + 8;
      if (Math.abs(e.x - planeX) < r && Math.abs(e.y - PLAYER_Y) < r) {
        hit = true;
        if (e.kind !== 'boss') { e.dead = true; explode(e.x, e.y, 10, '#f4d35e'); }
        break;
      }
    }
    if (hit) playerHit();
  }

  // Power-ups
  for (const d of drops) {
    if (Math.abs(d.x - planeX) < 26 && Math.abs(d.y - PLAYER_Y) < 26) {
      d.taken = true;
      if (d.kind === 'life') { lives = Math.min(START_LIVES, lives + 1); floatText('+1 life', d.x, d.y, '#ff8fab'); sfx.extraLife(); }
      else if (power < MAX_POWER) { power++; floatText('Power up!', d.x, d.y, '#f4d35e'); sfx.power(); }
      else { score += 250; floatText('+250', d.x, d.y, '#f4d35e'); sfx.bonus(); }
      // A ring that grows around your plane
      rings.push({ t: 0, life: 0.45, color: d.kind === 'life' ? '#ff8fab' : '#f4d35e' });
    }
  }

  // Tidy up anything used or off the screen
  const bossWasAlive = bossState === 'fighting';
  shots = shots.filter(s => !s.used && s.y > -20 && s.x > -20 && s.x < WORLD_W + 20);
  enemyShots = enemyShots.filter(s => s.y < FIELD_H + 20 && s.y > -40 && s.x > -20 && s.x < WORLD_W + 20);
  enemies = enemies.filter(e => !e.dead && e.y < FIELD_H + 60);
  drops = drops.filter(d => !d.taken && d.y < FIELD_H + 20);

  // Boss destroyed: level finished
  if (screen === 'play' && bossWasAlive && !enemies.some(e => e.kind === 'boss')) {
    score += LEVEL_BONUS * level;
    enemyShots = [];
    screen = level === LEVELS.length ? 'won' : 'clear';
    // The happy tune waits until the boss has finished exploding
    if (screen === 'won') sfx.victory(wreck ? 1.9 : 0); else sfx.levelClear(wreck ? 1.9 : 0);
  }
  updateHud();
}

// =====================================================
// PICTURES
// Everything below paints the sprites (once) and stamps them (every frame).
// =====================================================

let spriteRes = 1;               // how many real screen pixels per game unit (so sprites stay sharp)
let sprites = {};                // all the ready-made pictures, by name
let dotCache = {};               // small glowing dots for sparks, one per colour
let bg = {};                     // the background pictures for the current level
let bgLevel = 0;                 // which level the background and boss pictures were made for

// Make a sprite: a hidden canvas "w x h" game units big, painted once by paint(g).
// Inside paint, (0,0) is the CENTRE of the picture (or the top-left corner if fromCorner is true).
function makeSprite(w, h, paint, res, fromCorner) {
  const r = res || spriteRes;
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w * r));
  c.height = Math.max(1, Math.ceil(h * r));
  const g = c.getContext('2d');
  g.scale(c.width / w, c.height / h);
  if (!fromCorner) g.translate(w / 2, h / 2);
  paint(g);
  return { canvas: c, w, h };
}

// Stamp a sprite with its centre at (x, y)
function stamp(s, x, y) {
  ctx.drawImage(s.canvas, x - s.w / 2, y - s.h / 2, s.w, s.h);
}
// Stamp a sprite stretched: sx = sideways size, sy = up/down size (1 = normal)
function stampScaled(s, x, y, sx, sy) {
  ctx.drawImage(s.canvas, x - s.w * sx / 2, y - s.h * sy / 2, s.w * sx, s.h * sy);
}
// Stamp a sprite turned by an angle (in radians)
function stampTurned(s, x, y, angle, size) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.drawImage(s.canvas, -s.w * size / 2, -s.h * size / 2, s.w * size, s.h * size);
  ctx.restore();
}

// A copy of a sprite where every painted pixel becomes one colour.
// White copies are the "hit flash"; dark, low-detail copies are the soft shadows on the sea.
function makeSilhouette(s, color, res) {
  return makeSprite(s.w, s.h, (g) => {
    g.drawImage(s.canvas, -s.w / 2, -s.h / 2, s.w, s.h);
    g.globalCompositeOperation = 'source-in';
    g.fillStyle = color;
    g.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
  }, res);
}

// A soft round glow. "stops" is a list of [position 0..1, colour] from the middle outwards.
function makeGlow(size, stops, res) {
  return makeSprite(size, size, (g) => {
    const paint = g.createRadialGradient(0, 0, 0, 0, 0, size / 2);
    for (const stop of stops) paint.addColorStop(stop[0], stop[1]);
    g.fillStyle = paint;
    g.fillRect(-size / 2, -size / 2, size, size);
  }, res);
}

// ----- Small drawing helpers used while painting sprites -----
// Outline a shape from a list of points: [x1, y1, x2, y2, ...]
function shape(g, points) {
  g.beginPath();
  g.moveTo(points[0], points[1]);
  for (let i = 2; i < points.length; i += 2) g.lineTo(points[i], points[i + 1]);
  g.closePath();
}
// Fill (and maybe outline) a shape
function paintShape(g, points, fill, outline) {
  shape(g, points);
  g.fillStyle = fill;
  g.fill();
  if (outline) { g.strokeStyle = outline; g.stroke(); }
}
function paintCircle(g, x, y, r, fill, outline) {
  g.beginPath();
  g.arc(x, y, r, 0, TAU);
  g.fillStyle = fill;
  g.fill();
  if (outline) { g.strokeStyle = outline; g.stroke(); }
}
function paintOval(g, x, y, rx, ry, fill, outline) {
  g.beginPath();
  g.ellipse(x, y, rx, ry, 0, 0, TAU);
  g.fillStyle = fill;
  g.fill();
  if (outline) { g.strokeStyle = outline; g.stroke(); }
}
// A box with rounded corners (path only)
function roundedBox(g, x, y, w, h, r) {
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function paintBox(g, x, y, w, h, r, fill, outline) {
  roundedBox(g, x, y, w, h, r);
  g.fillStyle = fill;
  g.fill();
  if (outline) { g.strokeStyle = outline; g.stroke(); }
}
// Paint something on the right side, then the same thing mirrored on the left side
function bothSides(g, paintRightSide) {
  paintRightSide();
  g.save();
  g.scale(-1, 1);
  paintRightSide();
  g.restore();
}
// A colour blend from left to right, made of [position, colour] steps
function blendAcross(g, x1, x2, stops) {
  const paint = g.createLinearGradient(x1, 0, x2, 0);
  for (const stop of stops) paint.addColorStop(stop[0], stop[1]);
  return paint;
}
// A colour blend from top to bottom
function blendDown(g, y1, y2, stops) {
  const paint = g.createLinearGradient(0, y1, 0, y2);
  for (const stop of stops) paint.addColorStop(stop[0], stop[1]);
  return paint;
}
// Cockpit glass with a white shine
function paintGlass(g, x, y, rx, ry) {
  paintOval(g, x, y, rx, ry, blendDown(g, y - ry, y + ry, [[0, '#c9efff'], [0.5, '#2f7fc4'], [1, '#12325e']]), '#0b2233');
  paintOval(g, x - rx * 0.32, y - ry * 0.35, rx * 0.28, ry * 0.36, 'rgba(255,255,255,0.85)');
}

// ----- Your plane: a fighter jet seen from above, nose pointing up -----
// bank = 0 flying level, -1 leaning left, 1 leaning right (one wing darker, one lighter)
function paintPlayer(g, bank) {
  const OUTLINE = '#0c3b3a';
  g.lineJoin = 'round';
  g.lineWidth = 1.1;
  const wingPaint = blendDown(g, -8, 10, [[0, '#8ff0d2'], [1, '#2a9d7f']]);

  bothSides(g, () => {
    // Swept-back main wing
    paintShape(g, [2, -7, 21, 5, 21, 9.5, 12, 9, 2, 7.5], wingPaint, OUTLINE);
    // White stripe and a red-and-white roundel on the wing
    paintShape(g, [15.2, 1.6, 17.6, 3.1, 17.6, 9.2, 15.2, 9.1], '#f4fffb');
    paintCircle(g, 9.6, 3.8, 2.5, '#ffffff');
    paintCircle(g, 9.6, 3.8, 1.3, '#f25f5c');
    // Wing-tip pod
    paintBox(g, 19.6, 1.2, 2.8, 9.6, 1.4, '#e9f5f2', OUTLINE);
    paintBox(g, 19.6, 1.2, 2.8, 2.6, 1.3, '#f25f5c');
    // Tail wing and tail fin
    paintShape(g, [1.5, 12, 10, 18, 10, 20.8, 1.5, 19.4], wingPaint, OUTLINE);
    paintShape(g, [2.5, 12.4, 4.3, 13.6, 4.7, 19.6, 3, 19.6], '#1f7a66');
    // Air intake beside the body
    paintShape(g, [4.4, -5, 7.2, -1.5, 7.2, 5, 4.4, 5.5], '#1f7a66', OUTLINE);
  });

  // Engine nozzle at the back
  paintBox(g, -2.8, 17.5, 5.6, 4.6, 1.2, '#2b3a4a', OUTLINE);

  // Body: light on the left, darker on the right, so it looks round
  g.beginPath();
  g.moveTo(0, -24);
  g.bezierCurveTo(3, -21, 5.2, -13, 5.2, -4);
  g.lineTo(4.6, 14); g.lineTo(3, 19.5); g.lineTo(-3, 19.5); g.lineTo(-4.6, 14); g.lineTo(-5.2, -4);
  g.bezierCurveTo(-5.2, -13, -3, -21, 0, -24);
  g.closePath();
  g.fillStyle = blendAcross(g, -5.2, 5.2, [[0, '#d6fff3'], [0.45, '#4dd4ac'], [1, '#1f8f73']]);
  g.fill();
  g.strokeStyle = OUTLINE;
  g.stroke();

  // White nose cone
  g.beginPath();
  g.moveTo(0, -24);
  g.bezierCurveTo(1.7, -22.3, 2.8, -19.6, 3.4, -17.2);
  g.lineTo(-3.4, -17.2);
  g.bezierCurveTo(-2.8, -19.6, -1.7, -22.3, 0, -24);
  g.closePath();
  g.fillStyle = '#f4fffb';
  g.fill();

  // Panel line down the back, and the cockpit glass
  g.strokeStyle = 'rgba(12,59,58,0.45)';
  g.lineWidth = 0.7;
  g.beginPath(); g.moveTo(0, -1.5); g.lineTo(0, 16); g.stroke();
  g.lineWidth = 0.8;
  paintGlass(g, 0, -9.5, 2.8, 6.2);

  // Leaning: darken the low wing and brighten the high wing
  if (bank) {
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = 'rgba(0,25,45,0.32)';
    g.fillRect(bank > 0 ? 0 : -40, -40, 40, 80);
    g.fillStyle = 'rgba(255,255,255,0.20)';
    g.fillRect(bank > 0 ? -40 : 0, -40, 40, 80);
    g.globalCompositeOperation = 'source-over';
  }
}

// ----- The boss: a huge armoured bomber with four engines and gun turrets, nose DOWN -----
// "look" gives its colours (see BOSS_LOOKS)
function paintBoss(g, look) {
  const OUTLINE = '#1c0f18';
  const steel = blendAcross(g, -6, 6, [[0, '#d5dbe6'], [0.5, '#8a93a6'], [1, '#4a5163']]);
  g.lineJoin = 'round';
  g.lineWidth = 1.4;
  const wingPaint = blendDown(g, -22, 16, [[0, look.dark], [0.55, look.hull], [1, look.light]]);

  bothSides(g, () => {
    // Tail wing with an upright fin (at the top)
    paintShape(g, [4, -47, 25, -45, 28, -39, 23, -34, 4, -36], wingPaint, OUTLINE);
    paintBox(g, 20, -48, 5, 13, 2, look.dark, OUTLINE);
    // Giant main wing
    paintShape(g, [8, -23, 50, -12, 57, -5, 57, 3, 50, 8, 8, 17], wingPaint, OUTLINE);
    // Yellow and black warning stripes near the wing tip
    paintShape(g, [46, -11.6, 50, -10.6, 50, 6.8, 46, 7.8], look.accent);
    paintShape(g, [46, -5, 50, -4, 50, -0.5, 46, -1.5], '#2a1a1a');
    paintShape(g, [46, 2, 50, 3, 50, 6.5, 46, 5.5], '#2a1a1a');
    // Panel lines on the wing
    g.strokeStyle = 'rgba(0,0,0,0.28)';
    g.lineWidth = 0.8;
    g.beginPath(); g.moveTo(12, -8); g.lineTo(54, -2); g.moveTo(12, 6); g.lineTo(52, 3); g.stroke();
    g.lineWidth = 1.4;

    // Two engines on each wing, each with a spinning propeller in front
    for (const x of [21, 39]) {
      paintBox(g, x - 4.6, -17, 9.2, 28, 4, blendAcross(g, x - 4.6, x + 4.6, [[0, '#d5dbe6'], [0.5, '#8a93a6'], [1, '#4a5163']]), OUTLINE);
      paintBox(g, x - 4.6, 4, 9.2, 4, 1.5, look.accent);
      paintOval(g, x, 12.6, 9.5, 2, 'rgba(255,255,255,0.38)');
      paintCircle(g, x, 12, 1.8, '#2a2f3a', OUTLINE);
    }

    // A gun turret on each wing
    paintBox(g, 28.6, 2, 2.8, 12, 1.2, '#2a2f3a', OUTLINE);
    paintCircle(g, 30, 0, 5.2, steel, OUTLINE);
    paintCircle(g, 30, 0, 2.2, look.dark);
  });

  // Main body
  g.beginPath();
  g.moveTo(0, 47);
  g.bezierCurveTo(8, 44, 13.5, 32, 13.5, 20);
  g.lineTo(13.5, -30); g.lineTo(8, -47); g.lineTo(-8, -47); g.lineTo(-13.5, -30); g.lineTo(-13.5, 20);
  g.bezierCurveTo(-13.5, 32, -8, 44, 0, 47);
  g.closePath();
  g.fillStyle = blendAcross(g, -13.5, 13.5, [[0, look.light], [0.5, look.hull], [1, look.dark]]);
  g.fill();
  g.strokeStyle = OUTLINE;
  g.stroke();

  // Armour bands across the body, and a bright stripe down the back
  g.strokeStyle = 'rgba(0,0,0,0.35)';
  g.lineWidth = 1;
  g.beginPath();
  g.moveTo(-13, -30); g.lineTo(13, -30);
  g.moveTo(-13.5, 14); g.lineTo(13.5, 14);
  g.stroke();
  paintBox(g, -1.6, -44, 3.2, 24, 1.4, look.accent);

  // Twin nose guns (the boss bullets come from here)
  bothSides(g, () => { paintBox(g, 3.4, 30, 3, 13, 1.3, '#2a2f3a', OUTLINE); });
  // Cockpit glass at the nose
  g.lineWidth = 1;
  paintGlass(g, 0, 31, 4.6, 6.5);

  // Top turret behind the core
  bothSides(g, () => { paintBox(g, 0.6, -24, 2.4, 9, 1, '#2a2f3a', OUTLINE); });
  paintCircle(g, 0, -24, 5.4, steel, OUTLINE);
  paintCircle(g, 0, -24, 2.2, look.dark);

  // The power core in the middle: a dark socket with a bright centre (it also glows, drawn each frame)
  paintCircle(g, 0, 0, 11, '#1a1320', OUTLINE);
  const core = g.createRadialGradient(0, 0, 0, 0, 0, 8.5);
  core.addColorStop(0, '#ffffff');
  core.addColorStop(0.45, look.accent);
  core.addColorStop(1, withAlpha(look.accent, 0.25));
  paintCircle(g, 0, 0, 8.5, core);
  g.strokeStyle = 'rgba(255,255,255,0.5)';
  g.lineWidth = 0.8;
  g.beginPath(); g.arc(0, 0, 9.6, 0, TAU); g.stroke();
}

// ----- Power-up icons -----
function paintPowerIcon(g) {
  // Gold coin with a big P
  paintCircle(g, 0, 0, 12, '#8a5a00');
  paintCircle(g, 0, 0, 10.8, blendDown(g, -11, 11, [[0, '#fff3a6'], [0.5, '#f4d35e'], [1, '#e09a1f']]));
  g.strokeStyle = 'rgba(255,255,255,0.7)';
  g.lineWidth = 1;
  g.beginPath(); g.arc(0, 0, 8.6, Math.PI * 1.05, Math.PI * 1.6); g.stroke();
  g.fillStyle = '#5a3200';
  g.font = '900 15px system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillText('P', 0, 1);
}
function paintLifeIcon(g) {
  // Pink bubble with a red heart
  paintCircle(g, 0, 0, 12, '#a02a55');
  paintCircle(g, 0, 0, 10.8, blendDown(g, -11, 11, [[0, '#ffe3ec'], [0.5, '#ff8fab'], [1, '#f0558a']]));
  g.beginPath();
  g.moveTo(0, 6.4);
  g.bezierCurveTo(-9.5, 0, -6.5, -7.4, 0, -2.8);
  g.bezierCurveTo(6.5, -7.4, 9.5, 0, 0, 6.4);
  g.closePath();
  g.fillStyle = '#d9003c';
  g.fill();
  paintOval(g, -2.8, -2.6, 1.3, 0.9, 'rgba(255,255,255,0.8)');
}
// Rays of light that spin slowly behind a power-up
function paintRays(g, color) {
  for (let i = 0; i < 8; i++) {
    g.rotate(TAU / 8);
    const paint = g.createLinearGradient(0, 0, 0, -22);
    paint.addColorStop(0, withAlpha(color, 0.75));
    paint.addColorStop(1, withAlpha(color, 0));
    paintShape(g, [-3.4, 0, 3.4, 0, 0.8, -22, -0.8, -22], paint);
  }
}

// ----- Paint all the sprites that do not depend on the level -----
function buildSprites() {
  sprites = {};
  dotCache = {};

  // Your plane: level, leaning left, leaning right, plus a big one for the title screen
  sprites.player = makeSprite(52, 52, (g) => paintPlayer(g, 0));
  sprites.playerLeft = makeSprite(52, 52, (g) => paintPlayer(g, -1));
  sprites.playerRight = makeSprite(52, 52, (g) => paintPlayer(g, 1));
  sprites.hero = makeSprite(104, 104, (g) => { g.scale(2, 2); paintPlayer(g, 0); });

  // Enemy planes
  sprites.small = makeSprite(40, 40, paintSmallEnemy);
  sprites.zig = makeSprite(46, 42, paintZigEnemy);
  sprites.shooter = makeSprite(56, 42, paintShooterEnemy);

  // For each plane: a white copy (hit flash) and a soft dark copy (shadow on the sea)
  for (const name of ['player', 'small', 'zig', 'shooter', 'hero']) {
    sprites[name + 'White'] = makeSilhouette(sprites[name], '#ffffff');
    sprites[name + 'Shadow'] = makeSilhouette(sprites[name], 'rgba(4,10,28,0.34)', Math.max(0.3, spriteRes * 0.3));
  }

  // Your bullet: a long thin yellow bolt (three versions: straight, leaning left, leaning right)
  const paintBolt = (g) => {
    paintOval(g, 0, 0, 4.6, 11, 'rgba(255,214,90,0.30)');
    paintBox(g, -2.2, -8, 4.4, 14, 2.2, '#ffb52e');
    paintBox(g, -1.3, -7.4, 2.6, 11.5, 1.3, '#fffbe0');
  };
  sprites.shot = makeSprite(12, 24, paintBolt);
  sprites.shotLeft = makeSprite(16, 24, (g) => { g.rotate(-0.197); paintBolt(g); });
  sprites.shotRight = makeSprite(16, 24, (g) => { g.rotate(0.197); paintBolt(g); });

  // Enemy bullet: a fat round red ball with a dark rim (very different from yours)
  sprites.enemyShot = makeSprite(18, 18, (g) => {
    paintCircle(g, 0, 0, 8.6, 'rgba(255,40,80,0.28)');
    paintCircle(g, 0, 0, 6.2, '#5a0018');
    const paint = g.createRadialGradient(-1, -1, 0, 0, 0, 5.2);
    paint.addColorStop(0, '#ffffff');
    paint.addColorStop(0.35, '#ffb0c0');
    paint.addColorStop(1, '#ff2a4a');

  });

  // Glows and flames (soft, so they can be painted small and stretched)
  const soft = Math.min(spriteRes, 1.5);
  sprites.flame = makeSprite(12, 26, (g) => {
    g.scale(1, 26 / 12);
    const paint = g.createRadialGradient(0, -2, 0, 0, 0, 6);
    paint.addColorStop(0, '#ffffff');
    paint.addColorStop(0.3, '#ffe98a');
    paint.addColorStop(0.6, 'rgba(255,140,40,0.75)');

    g.fillRect(-6, -6, 12, 12);

  sprites.muzzle = makeGlow(28, [[0, '#ffffff'], [0.3, 'rgba(255,240,150,0.9)'], [1, 'rgba(255,200,60,0)']], soft);
  sprites.redGlow = makeGlow(40, [[0, '#ffffff'], [0.25, 'rgba(255,120,140,0.9)'], [1, 'rgba(255,40,80,0)']], soft);
  sprites.shield = makeGlow(64, [[0, 'rgba(140,255,225,0)'], [0.62, 'rgba(140,255,225,0.05)'], [0.86, 'rgba(140,255,225,0.55)'], [1, 'rgba(140,255,225,0)']], soft);
  sprites.marker = makeGlow(56, [[0, 'rgba(77,212,172,0.55)'], [0.6, 'rgba(77,212,172,0.30)'], [1, 'rgba(77,212,172,0)']], soft);

  // Explosion layers: white flash, fireball, expanding ring, smoke puff
  sprites.blastFlash = makeGlow(64, [[0, '#ffffff'], [0.35, 'rgba(255,245,190,0.85)'], [1, 'rgba(255,220,120,0)']], soft);
  sprites.fireball = makeGlow(64, [[0, '#ffffff'], [0.22, '#fff3a8'], [0.45, '#ffb93e'], [0.68, '#f2661f'], [0.86, 'rgba(170,40,15,0.75)'], [1, 'rgba(90,20,10,0)']], soft);
  sprites.blastRing = makeGlow(64, [[0, 'rgba(255,255,255,0)'], [0.76, 'rgba(255,240,190,0)'], [0.88, 'rgba(255,236,170,0.95)'], [0.95, 'rgba(255,170,80,0.5)'], [1, 'rgba(255,120,40,0)']], soft);
  sprites.smoke = makeGlow(64, [[0, 'rgba(46,44,56,0.85)'], [0.5, 'rgba(56,54,66,0.60)'], [0.8, 'rgba(60,60,72,0.25)'], [1, 'rgba(60,60,72,0)']], Math.min(spriteRes, 1));

  // Power-ups: icon, and spinning rays behind it
  sprites.power = makeSprite(26, 26, paintPowerIcon);

  sprites.powerRays = makeSprite(48, 48, (g) => paintRays(g, '#f4d35e'), soft);
  sprites.lifeRays = makeSprite(48, 48, (g) => paintRays(g, '#ff8fab'), soft);

  // Yellow and black warning stripes for the boss alarm (drawn twice as wide as the screen, so it can slide)
  sprites.stripes = makeSprite(WORLD_W + 80, 12, (g) => {
    g.fillStyle = '#f4d35e';
    g.fillRect(0, 0, WORLD_W + 80, 12);
    g.fillStyle = '#1a1420';
    for (let x = -20; x < WORLD_W + 100; x += 20) paintShape(g, [x, 12, x + 10, 12, x + 22, 0, x + 12, 0], '#1a1420');
  }, null, true);

  // Dark corners over the playing field (makes the middle stand out)
  sprites.vignette = makeSprite(90, 135, (g) => {
    const paint = g.createRadialGradient(0, 0, 40, 0, 0, 86);

  // The finger strip at the bottom
  sprites.controlZone = makeSprite(WORLD_W, CONTROL_ZONE, (g) => {
    g.fillStyle = blendDown(g, 0, CONTROL_ZONE, [[0, '#15213f'], [1, '#0b1220']]);

    paintBox(g, 10, 20, WORLD_W - 20, 48, 24, 'rgba(255,255,255,0.05)', 'rgba(255,255,255,0.10)');
    // Faint arrows pointing left and right
    g.strokeStyle = 'rgba(255,255,255,0.10)';
    g.lineWidth = 3;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    for (let i = 0; i < 3; i++) {
      g.beginPath(); g.moveTo(52 + i * 22, 34); g.lineTo(42 + i * 22, 44); g.lineTo(52 + i * 22, 54); g.stroke();
      g.beginPath(); g.moveTo(WORLD_W - 52 - i * 22, 34); g.lineTo(WORLD_W - 42 - i * 22, 44); g.lineTo(WORLD_W - 52 - i * 22, 54); g.stroke();
    }
    // Bright line along the top edge
    g.fillStyle = 'rgba(77,212,172,0.55)';
    g.fillRect(0, 0, WORLD_W, 1.5);
  }, null, true);

  // The "SKY STRIKE" logo with a glow (the glow is slow to draw, so it is painted once here)
  sprites.logo = makeSprite(340, 96, (g) => {
    g.textAlign = 'center';
