    g.font = 'italic 900 50px system-ui, sans-serif';
    const wide = g.measureText('SKY STRIKE').width;
    if (wide > 300) g.scale(300 / wide, 300 / wide);          // shrink if this phone's letters are wide
    g.shadowColor = 'rgba(77,212,172,0.9)';
    g.shadowBlur = 16;
    g.strokeStyle = '#0b2a3a';
    g.lineWidth = 9;
    g.strokeText('SKY STRIKE', 0, 0);
    g.shadowBlur = 0;
    g.fillStyle = blendDown(g, -22, 22, [[0, '#ffffff'], [0.5, '#bff7e6'], [1, '#4dd4ac']]);
    g.fillText('SKY STRIKE', 0, 0);
    g.strokeStyle = 'rgba(255,255,255,0.55)';
    g.lineWidth = 1;
    g.strokeText('SKY STRIKE', 0, 0);
  });

  // A gold trophy for the "You win!" screen
  sprites.trophy = makeSprite(60, 60, (g) => {
    const gold = blendAcross(g, -16, 16, [[0, '#fff3a6'], [0.5, '#f4c33e'], [1, '#c9861a']]);
    g.lineJoin = 'round';
    g.lineWidth = 1.5;
    g.strokeStyle = '#7a4a00';
    // Handles
    g.lineWidth = 4;
    g.beginPath(); g.arc(-15, -8, 8, Math.PI * 0.5, Math.PI * 1.5); g.stroke();
    g.beginPath(); g.arc(15, -8, 8, Math.PI * 1.5, Math.PI * 0.5); g.stroke();
    g.lineWidth = 1.5;
    // Cup
    g.beginPath();
    g.moveTo(-16, -22); g.lineTo(16, -22);
    g.bezierCurveTo(16, -2, 8, 6, 0, 6);
    g.bezierCurveTo(-8, 6, -16, -2, -16, -22);
    g.closePath();
    g.fillStyle = gold; g.fill(); g.stroke();
    // Stem and base
    paintBox(g, -3, 5, 6, 9, 1, gold, '#7a4a00');
    paintBox(g, -12, 13, 24, 8, 2.5, gold, '#7a4a00');
    // Star on the cup
    g.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = i % 2 === 0 ? 7 : 3;
      g.lineTo(Math.cos(a) * r, -10 + Math.sin(a) * r);
    }
    g.closePath();
    g.fillStyle = '#ffffff';
    g.fill();
  });

  bgLevel = 0;                                   // the level pictures must be painted again too
}

// A small glowing dot in the given colour (made the first time that colour is needed)
function getDot(color) {
  if (!dotCache[color]) {
    dotCache[color] = makeGlow(12, [[0, '#ffffff'], [0.3, color], [1, withAlpha(color, 0)]], Math.min(spriteRes, 2));
  }
  return dotCache[color];
}

// ---------- Backgrounds ----------
function currentTheme() { return THEMES[(level - 1) % THEMES.length]; }

// One island (or iceberg, lake, lava pool) made of a few overlapping blobs
function paintIsland(g, x, y, r, theme, seed) {
  const random = seededRandom(seed);
  const blobs = [{ dx: 0, dy: 0, rx: r, ry: r * 0.75 }];
  for (let i = 0; i < 3; i++) {
    blobs.push({ dx: (random() - 0.5) * r * 1.1, dy: (random() - 0.5) * r * 0.7, rx: r * (0.45 + random() * 0.3), ry: r * (0.35 + random() * 0.25) });
  }
  // Paint all blobs a bit bigger ("grow") in one colour: this makes the rings around the island
  const layer = (grow, color, shiftX, shiftY) => {
    g.fillStyle = color;
    g.beginPath();
    for (const b of blobs) {
      g.moveTo(x + b.dx + (shiftX || 0) + b.rx + grow, y + b.dy + (shiftY || 0));
      g.ellipse(x + b.dx + (shiftX || 0), y + b.dy + (shiftY || 0), b.rx + grow, b.ry + grow, 0, 0, TAU);
    }
    g.fill();
  };
  if (theme.shallow) layer(15, theme.shallow);                    // light shallow water (or lava glow)
  if (theme.ground === 'sea' || theme.ground === 'ice') layer(8.5, 'rgba(255,255,255,0.55)');   // white foam
  layer(6, theme.shore);                                          // beach
  layer(0, 'rgba(0,0,0,0.18)', 1.5, 2.5);                         // soft shadow under the land
  layer(0, theme.land);
  layer(-r * 0.22, theme.landLight, -r * 0.1, -r * 0.1);          // lighter middle

  // Trees (or bumps): small dark circles with a light spot
  const count = Math.round(r * (theme.trees ? 0.9 : 0.35));
  for (let i = 0; i < count; i++) {
    const a = random() * TAU, d = Math.sqrt(random()) * 0.78;
    const tx = x + Math.cos(a) * r * d, ty = y + Math.sin(a) * r * 0.75 * d;
    const size = 2.2 + random() * 2.6;
    paintCircle(g, tx, ty, size, theme.landDark);
    paintCircle(g, tx - size * 0.3, ty - size * 0.3, size * 0.5, theme.landLight);
  }
  // Night levels: a few warm house lights
  if (theme.lights) {
    for (let i = 0; i < 4; i++) {
      const a = random() * TAU, d = random() * 0.6;
      const lx = x + Math.cos(a) * r * d, ly = y + Math.sin(a) * r * 0.75 * d;
      paintCircle(g, lx, ly, 3.2, 'rgba(255,220,120,0.25)');
      paintCircle(g, lx, ly, 1.2, '#ffe9a6');
    }
  }
}

// A ringed planet (space level)
function paintPlanet(g, x, y, r, theme) {
  const paint = g.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  paint.addColorStop(0, theme.landLight);
  paint.addColorStop(0.6, theme.land);
  paint.addColorStop(1, theme.landDark);
  paintCircle(g, x, y, r, paint);
  g.strokeStyle = 'rgba(220,210,255,0.55)';
  g.lineWidth = r * 0.12;
  g.beginPath(); g.ellipse(x, y, r * 1.7, r * 0.42, -0.35, 0.15, Math.PI - 0.15); g.stroke();
}

// The ground picture for a level. It is SEA_LOOP units tall and repeats without a visible join:
// anything near the top or bottom edge is painted three times (at y, y - loop and y + loop).
function paintGround(g, theme, themeNumber) {
  const L = SEA_LOOP;
  const random = seededRandom(100 + themeNumber * 17);
  const copies = [-L, 0, L];
  g.fillStyle = theme.sea;
  g.fillRect(0, 0, WORLD_W, L);

  // Soft lighter and darker patches, so the ground is not one flat colour
  for (let i = 0; i < 46; i++) {
    const x = random() * WORLD_W, y = random() * L, rx = 30 + random() * 70, ry = 12 + random() * 26;
    g.globalAlpha = 0.10 + random() * 0.14;
    for (const dy of copies) paintOval(g, x, y + dy, rx, ry, i % 2 ? theme.seaLight : theme.seaDark);
  }
  g.globalAlpha = 1;

  if (theme.ground === 'space') {
    // Stars: many tiny ones, a few bright ones with a cross sparkle
    for (let i = 0; i < 230; i++) {
      const x = random() * WORLD_W, y = random() * L, size = 0.4 + random() * 1.1;
      g.globalAlpha = 0.35 + random() * 0.65;
      for (const dy of copies) paintCircle(g, x, y + dy, size, i % 7 === 0 ? '#ffe9a6' : i % 5 === 0 ? '#a6d8ff' : '#ffffff');
    }
    g.globalAlpha = 1;
    g.strokeStyle = 'rgba(255,255,255,0.75)';
    g.lineWidth = 0.7;
    for (let i = 0; i < 12; i++) {
      const x = random() * WORLD_W, y = random() * L;
      for (const dy of copies) {
        g.beginPath(); g.moveTo(x - 5, y + dy); g.lineTo(x + 5, y + dy); g.moveTo(x, y + dy - 5); g.lineTo(x, y + dy + 5); g.stroke();
        paintCircle(g, x, y + dy, 1.5, '#ffffff');
      }
    }
    for (const dy of copies) {
      paintPlanet(g, ISLANDS[1].x, ISLANDS[1].y + dy, 30, theme);
      paintPlanet(g, ISLANDS[4].x + 30, ISLANDS[4].y + dy, 18, theme);
      paintCircle(g, ISLANDS[2].x, ISLANDS[2].y + dy, 9, '#c9c4d6');       // a small moon
      paintCircle(g, ISLANDS[2].x - 3, ISLANDS[2].y + dy - 2, 2.2, '#a9a3b8');
      paintCircle(g, ISLANDS[2].x + 3, ISLANDS[2].y + dy + 3, 1.4, '#a9a3b8');
    }
    return;
  }

  if (theme.ground === 'land') {
    // Jungle: lots of tree tops
    for (let i = 0; i < 620; i++) {
      const x = random() * WORLD_W, y = random() * L, size = 3 + random() * 4.5;
      for (const dy of copies) {
        paintCircle(g, x + 1, y + dy + 1.5, size, 'rgba(10,40,25,0.45)');
        paintCircle(g, x, y + dy, size, i % 3 === 0 ? theme.seaLight : theme.sea);
        paintCircle(g, x - size * 0.3, y + dy - size * 0.3, size * 0.45, 'rgba(150,220,140,0.35)');
      }
    }
  } else if (theme.ground === 'lava') {
    // Glowing cracks in dark rock
    for (let i = 0; i < 30; i++) {
      let x = random() * WORLD_W, y = random() * L;
      const points = [x, y];
      for (let j = 0; j < 5; j++) { x += (random() - 0.5) * 60; y += 14 + random() * 22; points.push(x, y); }
      for (const dy of copies) {
        for (const pass of [[5, 'rgba(255,90,20,0.16)'], [1.3, 'rgba(255,160,60,0.6)']]) {      // wide soft glow, then the thin bright crack
          g.lineWidth = pass[0]; g.strokeStyle = pass[1]; g.lineCap = 'round'; g.lineJoin = 'round';
          g.beginPath(); g.moveTo(points[0], points[1] + dy);
          for (let k = 2; k < points.length; k += 2) g.lineTo(points[k], points[k + 1] + dy);
          g.stroke();
        }
      }
    }
  } else {
    // Sea: small curved wave marks
    g.strokeStyle = theme.foam;
    g.lineWidth = 1.4;
    g.lineCap = 'round';
    for (let i = 0; i < 130; i++) {
      const x = random() * WORLD_W, y = random() * L, w = 8 + random() * 12;
      for (const dy of copies) {
        g.beginPath(); g.moveTo(x - w / 2, y + dy); g.quadraticCurveTo(x, y + dy - 3, x + w / 2, y + dy); g.stroke();
      }
    }
    // Ice level: small ice floes drifting between the icebergs
    if (theme.ground === 'ice') {
      for (let i = 0; i < 70; i++) {
        const x = random() * WORLD_W, y = random() * L, size = 4 + random() * 9, turn = random() * TAU;
        const points = [];
        for (let k = 0; k < 6; k++) {
          const a = turn + k / 6 * TAU, d = size * (0.7 + random() * 0.5);
          points.push(x + Math.cos(a) * d, y + Math.sin(a) * d * 0.8);
        }
        for (const dy of copies) {
          const moved = points.map((v, k) => (k % 2 ? v + dy : v));
          paintShape(g, moved.map((v, k) => (k % 2 ? v + 1.5 : v + 1)), 'rgba(20,60,100,0.35)');
          paintShape(g, moved, 'rgba(240,250,255,0.92)');
        }
      }
    }
  }

  // Islands (the same places as always) and a few tiny rocks
  for (let i = 0; i < ISLANDS.length; i++) {
    for (const dy of copies) paintIsland(g, ISLANDS[i].x, ISLANDS[i].y + dy, ISLANDS[i].r, theme, 11 + i * 7 + themeNumber);
  }
  for (let i = 0; i < ISLETS.length; i++) {
    for (const dy of copies) paintIsland(g, ISLETS[i].x, ISLETS[i].y + dy, ISLETS[i].r, theme, 61 + i * 5 + themeNumber);
  }
}

// A see-through picture full of clouds that repeats every "loop" units
function paintClouds(g, theme, loop, count, size, seed) {
  const random = seededRandom(seed);
  for (let i = 0; i < count; i++) {
    const cx = random() * WORLD_W, cy = (i + random() * 0.8) / count * loop, w = size * (36 + random() * 44);
    // Each cloud is a row of round puffs
    const puffs = [];
    for (let k = 0; k < 6; k++) {
      puffs.push({ x: cx + (k - 2.5) * w * 0.2 + (random() - 0.5) * w * 0.1, y: cy + (random() - 0.5) * w * 0.14, r: w * (0.16 + random() * 0.13) * (k === 0 || k === 5 ? 0.7 : 1) });
    }
    for (const dy of [-loop, 0, loop]) {
      for (const pass of [[theme.cloudShade, w * 0.07], [theme.cloud, 0]]) {      // darker underside first, then the cloud
        g.fillStyle = pass[0];
        g.beginPath();
        for (const p of puffs) { g.moveTo(p.x + p.r, p.y + dy + pass[1]); g.arc(p.x, p.y + dy + pass[1], p.r, 0, TAU); }
        g.fill();
      }
    }
  }
}

// Paint the pictures that change with the level: the ground, the clouds and the boss
function buildLevelArt() {
  const number = (level - 1) % THEMES.length;
  const theme = THEMES[number];
  bg = {};
  bg.sea = makeSprite(WORLD_W, SEA_LOOP, (g) => paintGround(g, theme, number), Math.min(spriteRes, 1.5), true);
  // Clouds are soft, so small pictures stretched up look fine (and save memory)
  bg.far = makeSprite(WORLD_W, FAR_LOOP, (g) => paintClouds(g, theme, FAR_LOOP, 7, 0.75, 31 + number), Math.min(spriteRes, 0.8), true);
  bg.near = makeSprite(WORLD_W, NEAR_LOOP, (g) => paintClouds(g, theme, NEAR_LOOP, 4, 1.7, 77 + number), Math.min(spriteRes, 0.6), true);
  if (theme.rain) {
    bg.rain = makeSprite(WORLD_W, RAIN_LOOP, (g) => {
      const random = seededRandom(5);
      g.strokeStyle = 'rgba(210,230,255,0.30)';
      g.lineWidth = 1;
      for (let i = 0; i < 110; i++) {
        const x = random() * (WORLD_W + 20), y = random() * RAIN_LOOP;
        for (const dy of [-RAIN_LOOP, 0, RAIN_LOOP]) { g.beginPath(); g.moveTo(x, y + dy); g.lineTo(x - 5, y + dy + 22); g.stroke(); }
      }
    }, Math.min(spriteRes, 1), true);
  }

  // The boss for this level
  const look = BOSS_LOOKS[(level - 1) % BOSS_LOOKS.length];
  sprites.boss = makeSprite(124, 104, (g) => paintBoss(g, look));
  sprites.bossWhite = makeSilhouette(sprites.boss, '#ffffff');
  sprites.bossShadow = makeSilhouette(sprites.boss, 'rgba(4,10,28,0.34)', Math.max(0.3, spriteRes * 0.3));
  sprites.coreGlow = makeGlow(44, [[0, '#ffffff'], [0.3, withAlpha(look.accent, 0.85)], [1, withAlpha(look.accent, 0)]], Math.min(spriteRes, 1.5));
  bgLevel = level;
}

// Draw one scrolling layer twice, one copy above the other, so there is never a gap.
// "shift" moves the picture up (the islands used to be drawn 120 units higher).
function drawLayer(tile, scroll, loop, shift) {
  const snap = dpr * scale;                                        // line up with real screen pixels (no shimmer)
  let y = ((scroll - shift) % loop + loop) % loop - loop;
  y = Math.round(y * snap) / snap;
  ctx.drawImage(tile.canvas, -8, y, WORLD_W + 16, loop + 0.6);     // slightly wider than the screen, for the shake
  ctx.drawImage(tile.canvas, -8, y + loop, WORLD_W + 16, loop);
}

// ---------- Drawing ----------
// Text with an optional dark outline (keeps it readable over any background)
function drawText(text, x, y, size, color, weight, outline) {
  ctx.font = (weight || 700) + ' ' + size + 'px system-ui, sans-serif';
  if (outline) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size * 0.2);
    ctx.strokeStyle = outline;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// One enemy plane, with its moving parts
function drawEnemy(e) {
  if (e.kind === 'small') {
    // Lean a little when weaving
    const lean = e.amp ? Math.abs(Math.cos(e.t * 2.2 + (e.phase || 0))) * 0.18 : 0;
    stampScaled(e.flash ? sprites.smallWhite : sprites.small, e.x, e.y, 1 - lean, 1);
  } else if (e.kind === 'zig') {
    // Little engine flame, and a lean toward the way it is sweeping
    stampScaled(sprites.flame, e.x, e.y - 17, 0.8, 0.45 + Math.random() * 0.2);
    stampScaled(e.flash ? sprites.zigWhite : sprites.zig, e.x, e.y, 0.88, 1);
  } else if (e.kind === 'shooter') {
    stamp(e.flash ? sprites.shooterWhite : sprites.shooter, e.x, e.y);
    // Spinning rotor blades
    ctx.strokeStyle = 'rgba(240,232,255,0.8)';
    ctx.lineWidth = 1.3;
    ctx.beginPath();
    for (const side of [-1, 1]) {
      const a = e.t * 26 * side, cx = e.x + side * 17, cy = e.y - 2;
      ctx.moveTo(cx - Math.cos(a) * 6, cy - Math.sin(a) * 6);
      ctx.lineTo(cx + Math.cos(a) * 6, cy + Math.sin(a) * 6);
    }
    ctx.stroke();
    // The gun glows just before it fires (a fair warning)
    if (e.hover > 0 && e.hover < 5 && e.fireTimer < 0.35) {
      const grow = 1 - e.fireTimer / 0.35;
      stampScaled(sprites.redGlow, e.x, e.y + 16, 0.25 + grow * 0.5, 0.25 + grow * 0.5);
    }
  } else {
    drawBoss(e);
  }
}

// The boss: body, glowing core, hit flash, charging guns
function drawBoss(e) {
  const hurt = e.hp / e.maxHp <= 0.35;
  // A badly hurt boss trembles
  const jx = hurt ? rand(-1, 1) : 0, jy = hurt ? rand(-0.6, 0.6) : 0;
  stamp(sprites.boss, e.x + jx, e.y + jy);
  // Engine fire at the back of the four engines
  for (const x of [-39, -21, 21, 39]) stampScaled(sprites.flame, e.x + jx + x, e.y + jy - 21, 0.9, 0.4 + Math.random() * 0.2);
  // The core pulses (faster and red when badly hurt)
  const pulse = 0.75 + Math.sin(clock * (hurt ? 16 : 5)) * 0.25;
  ctx.globalAlpha = pulse;
  stampScaled(hurt ? sprites.redGlow : sprites.coreGlow, e.x + jx, e.y + jy, hurt ? 1.2 : 1, hurt ? 1.2 : 1);
  ctx.globalAlpha = 1;
  // White flash when hit
  if (e.flash) {
    ctx.globalAlpha = 0.75;
    stamp(sprites.bossWhite, e.x + jx, e.y + jy);
    ctx.globalAlpha = 1;
  }
  // The nose guns glow just before they fire
  if (e.y >= 95 && e.fireTimer < 0.35) {
    const grow = 1 - e.fireTimer / 0.35;
    stampScaled(sprites.redGlow, e.x, e.y + 40, 0.3 + grow * 0.6, 0.3 + grow * 0.6);
  }
}

// The boss name and health bar at the top of the field
function drawBossBar(e) {
  const look = BOSS_LOOKS[(level - 1) % BOSS_LOOKS.length];
  const left = 60, width = WORLD_W - 120, top = 19;
  const share = Math.max(0, e.hp / e.maxHp);
  // The white "just lost" part of the bar shrinks slowly, so you can see how much each burst took off
  if (e.shownShare === undefined) e.shownShare = 1;
  e.shownShare = Math.max(share, e.shownShare - 0.006);
  const slide = clamp((e.y + 80) / 60, 0, 1);                       // the bar slides in as the boss arrives
  ctx.save();
  ctx.translate(0, (slide - 1) * 36);
  // Dark backing plate
  roundedBox(ctx, left - 12, 3, width + 24, 30, 9);
  ctx.fillStyle = 'rgba(11,18,32,0.72)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,107,107,0.55)';
  ctx.lineWidth = 1;
  ctx.stroke();
  drawText(look.name, WORLD_W / 2, 11.5, 10, '#ffd0d0', 800);
  // Empty bar, white "just lost" part, then the coloured part
  roundedBox(ctx, left, top, width, 9, 4.5);
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fill();
  if (e.shownShare > 0.02) { roundedBox(ctx, left, top, width * e.shownShare, 9, 4.5); ctx.fillStyle = '#ffffff'; ctx.fill(); }
  if (share > 0.02) {
    const low = share <= 0.35;
    roundedBox(ctx, left, top, width * share, 9, 4.5);
    ctx.fillStyle = low && Math.floor(clock * 6) % 2 === 0 ? '#ffb347' : '#ff5a5a';
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';                       // shine along the top of the bar
    ctx.fillRect(left + 3, top + 1.5, Math.max(0, width * share - 6), 2);
  }
  ctx.restore();
}

// The boss alarm: sliding warning stripes and flashing words
function drawWarning() {
  const age = 2 - bossTimer;                                        // seconds since the alarm started
  const open = clamp(age / 0.25, 0, 1) * clamp(bossTimer / 0.2, 0, 1);   // the band opens, then closes
  const mid = FIELD_H / 2 - 60, half = 44 * open;
  const look = BOSS_LOOKS[(level - 1) % BOSS_LOOKS.length];
  ctx.fillStyle = 'rgba(60,0,10,0.62)';
  ctx.fillRect(0, mid - half, WORLD_W, half * 2);
  // Stripes slide in opposite directions along the top and bottom of the band
  const slide = (clock * 60) % 20;
  ctx.drawImage(sprites.stripes.canvas, -40 - slide, mid - half - 12, sprites.stripes.w, 12);
  ctx.drawImage(sprites.stripes.canvas, -60 + slide, mid + half, sprites.stripes.w, 12);
  if (open < 1) return;
  // The words blink (same rhythm as before)
  const bright = Math.floor(clock * 4) % 2 === 0;
  drawText('WARNING', WORLD_W / 2, mid - 14, 34, bright ? '#ff5a5a' : '#ffd166', 900, '#2a0008');
  drawText('BOSS INCOMING', WORLD_W / 2, mid + 14, 15, '#ffffff', 800, '#2a0008');
  drawText(look.name, WORLD_W / 2, mid + 31, 11, '#ffd0d0', 700);
}

// A rounded dark card for messages
function drawPanel(cx, cy, w, h, edgeColor) {
  roundedBox(ctx, cx - w / 2, cy - h / 2, w, h, 18);
  ctx.fillStyle = 'rgba(13,22,44,0.90)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = edgeColor;
  ctx.stroke();
  roundedBox(ctx, cx - w / 2 + 4, cy - h / 2 + 4, w - 8, h - 8, 14);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.stroke();
}

// The "Tap to ..." line gently pulses
function drawTapLine(text, x, y) {
  const beat = Math.sin(clock * 5);
  ctx.globalAlpha = 0.82 + beat * 0.18;
  drawText(text, x, y, 18 + beat * 1.2, '#fff3a6', 800, 'rgba(11,18,32,0.9)');
  ctx.globalAlpha = 1;
}

// Title, level clear, game over and win screens
function drawScreens() {
  if (screen === 'play') return;
  const cx = WORLD_W / 2;
  const age = screenTime - panelDelay;                               // seconds since the panel should appear
  // Darken the game a little behind the message (fades in)
  ctx.fillStyle = 'rgba(11,18,32,' + (clamp(age / 0.3, 0, 1) * (screen === 'title' ? 0.38 : 0.55)).toFixed(3) + ')';
  ctx.fillRect(0, 0, WORLD_W, FIELD_H);
  // Win screen: the confetti and fireworks go on top of the dark layer, so they stay bright
  if (screen === 'won') {
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, WORLD_W, FIELD_H);
    ctx.clip();
    drawEffects();
    ctx.restore();
  }
  if (age <= 0) return;
  const pop = popCurve(age / 0.4);                                   // the panel "pops" in

  if (screen === 'title') {
    // Logo, a hovering plane, how to play, and the pulsing start line
    const bob = Math.sin(clock * 2.2) * 5;
    stampScaled(sprites.logo, cx, 92, pop, pop);
    stamp(sprites.heroShadow, cx + 16, 232 + 22);
    stampScaled(sprites.flame, cx, 216 + bob + 46, 2, 1.5 + Math.random() * 0.5);
    stamp(sprites.hero, cx, 216 + bob);
    drawPanel(cx, 372, 300, 124, 'rgba(77,212,172,0.55)');
    drawText('Slide in the bottom strip to fly', cx, 334, 15.5, '#ffffff', 600);
    drawText('Your plane shoots by itself', cx, 358, 15.5, '#ffffff', 600);
    // What the two pick-ups do
    stampScaled(sprites.power, cx - 124, 398, 0.9, 0.9);
    drawText('stronger guns', cx - 62, 398, 13.5, '#f4d35e', 600);
    stampScaled(sprites.life, cx + 28, 398, 0.9, 0.9);
    drawText('extra life', cx + 76, 398, 13.5, '#ff8fab', 600);
    drawTapLine('Tap to start', cx, 474);
    return;
  }

  ctx.save();
  ctx.translate(cx, FIELD_H / 2 - 20);
  ctx.scale(pop, pop);
  if (screen === 'clear') {
    drawPanel(0, 0, 290, 190, 'rgba(244,211,94,0.75)');
    stampScaled(sprites.flame, 0, -52 + 19, 0.9, 0.7 + Math.random() * 0.3);
    stampScaled(sprites.player, 0, -52 + Math.sin(clock * 3) * 3, 1, 1);
    drawText('Level ' + level + ' clear!', 0, -10, 28, '#f4d35e', 800, '#3a2a00');
    drawText('Bonus +' + LEVEL_BONUS * level, 0, 22, 16, '#ffffff', 600);
    drawText('Score ' + score, 0, 44, 16, 'rgba(255,255,255,0.8)', 600);
    drawTapLine('Tap for level ' + (level + 1), 0, 72);
  } else if (screen === 'won') {
    drawPanel(0, 0, 290, 210, 'rgba(244,211,94,0.9)');
    stampScaled(sprites.trophy, 0, -58, 1 + Math.sin(clock * 3) * 0.04, 1 + Math.sin(clock * 3) * 0.04);
    drawText('You win!', 0, -6, 34, '#f4d35e', 900, '#3a2a00');
    drawText('Score ' + score, 0, 32, 20, '#ffffff', 700);
    drawTapLine('Tap to play again', 0, 72);
  } else {
    drawPanel(0, 0, 290, 150, 'rgba(255,107,107,0.8)');
    drawText('Game over', 0, -34, 32, '#ff6b6b', 900, '#2a0008');
    drawText('Score ' + score, 0, 4, 16, 'rgba(255,255,255,0.8)', 600);
    drawTapLine('Tap to retry level ' + level, 0, 40);
  }
  ctx.restore();
}

// Smoke, explosions, sparks and confetti
function drawEffects() {
  // Smoke puffs first (they sit behind the fire)
  for (const s of sparks) {
    if (s.kind !== 'smoke') continue;
    const p = s.t / s.life, size = s.size * (0.6 + p * 1.2) / 64;
    ctx.globalAlpha = Math.min(1, (1 - p) * 1.4);
    stampScaled(sprites.smoke, s.x, s.y, size, size);
  }
  // Explosions: a solid fireball that grows and fades, a bright white flash at the start, and a thin ring
  for (const b of blasts) {
    if (b.t < 0) continue;                                                      // (this one starts a moment later)
    const p = b.t / b.life;
    const grow = 1 - (1 - p) * (1 - p);                                         // fast at first, then slowing
    if (!b.ringOnly) {
      ctx.globalAlpha = p < 0.45 ? 1 : (1 - p) / 0.55;
      let size = b.size * (0.5 + grow * 0.6) / 64;
      stampScaled(sprites.fireball, b.x, b.y, size, size);
      if (p < 0.25) {
        ctx.globalAlpha = 1 - p / 0.25;
        size = b.size * (0.9 + p * 2) / 64;
        stampScaled(sprites.blastFlash, b.x, b.y, size, size);
      }
    }
    if (!b.noRing) {
      ctx.globalAlpha = (1 - p) * 0.7;
      const ring = b.size * (0.5 + grow * 1.3) / 64;
      stampScaled(sprites.blastRing, b.x, b.y, ring, ring);
    }
  }
  // Sparks and confetti
  for (const s of sparks) {
    if (s.kind === 'smoke') continue;
    const p = s.t / s.life;
    if (s.kind === 'confetti') {
      // A paper piece that flips as it falls (its width swings between thin and wide)
      ctx.globalAlpha = Math.min(1, (1 - p) * 4);
      ctx.fillStyle = s.color;
      const wide = s.size * Math.abs(Math.cos(s.t * s.spin));
      ctx.fillRect(s.x - wide / 2 + Math.sin(s.t * 3 + s.spin) * 6, s.y - s.size * 0.3, wide + 0.8, s.size * 0.6);
    } else {
      ctx.globalAlpha = Math.min(1, (1 - p) * 1.6);
      const size = (s.size || 6) * (1 - p * 0.5) / 12 * 1.6;
      stampScaled(getDot(s.color), s.x, s.y, size, size);
    }
  }
  ctx.globalAlpha = 1;
}

function draw() {
  // Notice when the screen changed (title -> play -> clear ...) so the pop-in animation can restart
  if (screen !== shownScreen) {
    shownScreen = screen;
    screenTime = 0;
    // Leave time to watch the boss (or your own plane) blow up before the message pops in
    panelDelay = (screen === 'clear' || screen === 'won') && wreck ? 1.8 : screen === 'over' ? 0.7 : 0;
  }
  // Make sure the level's background and boss pictures are ready
  if (bgLevel !== level) buildLevelArt();
  const theme = currentTheme();

  // Clear the whole canvas
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, screenW, screenH);

  // From here on, draw in game units (scaled and centred on screen)
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * offX, dpr * offY);
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Keep all drawing inside the game area
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, WORLD_W, WORLD_H);
  ctx.clip();

  // ----- The flying field (this part shakes on big explosions) -----
  ctx.save();
  ctx.beginPath();
  ctx.rect(0, 0, WORLD_W, FIELD_H);
  ctx.clip();
  if (shakeTime > 0) ctx.translate(rand(-1, 1) * shakeSize, rand(-1, 1) * shakeSize);

  // Background: the ground far below, then two layers of clouds that scroll faster (closer to you)
  drawLayer(bg.sea, seaScroll, SEA_LOOP, 120);
  drawLayer(bg.far, farScroll, FAR_LOOP, 0);
  drawLayer(bg.near, nearScroll, NEAR_LOOP, 0);

  const showPlayer = screen !== 'title' && screen !== 'over';
  const blink = safeTimer > 0 && Math.floor(safeTimer * 10) % 2 === 0;

  // Soft shadows on the ground under every plane
  if (!theme.noShadows) {
    for (const e of enemies) {
      const s = sprites[e.kind + 'Shadow'];
      stampScaled(s, e.x + 9, e.y + 14, 0.85, 0.85);
    }
    if (wreck) stampScaled(sprites.bossShadow, wreck.x + 9, wreck.y + 14, 0.85, 0.85);
    if (showPlayer && !blink) stampScaled(sprites.playerShadow, planeX + 9, PLAYER_Y + 14, 0.85, 0.85);
  }

  // Power-ups: spinning rays behind a gently pulsing icon
  for (const d of drops) {
    const beat = 1 + Math.sin(clock * 7) * 0.08;
    stampTurned(d.kind === 'life' ? sprites.lifeRays : sprites.powerRays, d.x, d.y, clock * 2.2, 1);
    stampScaled(d.kind === 'life' ? sprites.life : sprites.power, d.x, d.y, beat, beat);
  }

  // Enemy planes (they flash white when hit)
  for (const e of enemies) drawEnemy(e);

  // The boss wreck: shaking, flashing white, sinking
  if (wreck) {
    const x = wreck.x + rand(-2.5, 2.5), y = wreck.y + wreck.t * 14 + rand(-2, 2);
    stamp(sprites.boss, x, y);
    if (Math.floor(wreck.t * 12) % 2 === 0) { ctx.globalAlpha = 0.6; stamp(sprites.bossWhite, x, y); ctx.globalAlpha = 1; }
  }

  // Bullets: yours are thin yellow bolts, the enemy's are fat red balls that throb
  for (const s of shots) stamp(s.vx < 0 ? sprites.shotLeft : s.vx > 0 ? sprites.shotRight : sprites.shot, s.x, s.y - 1);
  const throb = 1 + Math.sin(clock * 14) * 0.1;
  for (const s of enemyShots) stampScaled(sprites.enemyShot, s.x, s.y, throb, throb);

  // Your plane (it blinks while protected after a hit)
  if (showPlayer && !blink) {
    const lean = Math.abs(tilt);
    const picture = tilt < -0.3 ? sprites.playerLeft : tilt > 0.3 ? sprites.playerRight : sprites.player;
    stampScaled(sprites.flame, planeX, PLAYER_Y + 26, 1 - lean * 0.2, 0.75 + Math.random() * 0.4);   // flickering engine flame
    stampScaled(picture, planeX, PLAYER_Y, 1 - lean * 0.22, 1);
    if (safeTimer > 0) stamp(sprites.shield, planeX, PLAYER_Y);                 // protective bubble
    // Gun flash
    if (muzzleTimer > 0 && screen === 'play') {
      const size = 0.5 + muzzleTimer / 0.06 * 0.4;
      if (power !== 2) stampScaled(sprites.muzzle, planeX, PLAYER_Y - 25, size, size);
      if (power >= 2) {
        stampScaled(sprites.muzzle, planeX - 8, PLAYER_Y - 18, size * 0.8, size * 0.8);
        stampScaled(sprites.muzzle, planeX + 8, PLAYER_Y - 18, size * 0.8, size * 0.8);
      }
    }
  }

  // Enemy gun flashes
  for (const f of flashes) {
    const size = (1 - f.t / f.life) * f.size / 40;
    stampScaled(sprites.redGlow, f.x, f.y, size, size);
  }

  // Smoke, explosions and sparks (on the win screen they are drawn later, on top of the dark layer)
  if (screen !== 'won') drawEffects();

  // Ring that grows around your plane when you pick something up
  for (const r of rings) {
    const p = r.t / r.life;
    ctx.globalAlpha = 1 - p;
    ctx.strokeStyle = r.color;
    ctx.lineWidth = 4 * (1 - p) + 1;
    ctx.beginPath(); ctx.arc(planeX, PLAYER_Y, 14 + p * 34, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // Weather and mood: rain, darker corners, lightning, and the flashes for big moments
  if (bg.rain) drawLayer(bg.rain, rainScroll, RAIN_LOOP, 0);
  ctx.drawImage(sprites.vignette.canvas, -8, -8, WORLD_W + 16, FIELD_H + 16);
  if (lightning > 0) { ctx.fillStyle = 'rgba(220,235,255,' + (lightning * 0.9).toFixed(3) + ')'; ctx.fillRect(-8, -8, WORLD_W + 16, FIELD_H + 16); }
  if (redFlash > 0) { ctx.fillStyle = 'rgba(255,60,60,' + redFlash.toFixed(3) + ')'; ctx.fillRect(-8, -8, WORLD_W + 16, FIELD_H + 16); }
  if (whiteFlash > 0) { ctx.fillStyle = 'rgba(255,255,255,' + Math.min(1, whiteFlash).toFixed(3) + ')'; ctx.fillRect(-8, -8, WORLD_W + 16, FIELD_H + 16); }
  ctx.restore();                                                                // (end of the part that shakes)

  // Boss name and health bar
  for (const e of enemies) if (e.kind === 'boss') drawBossBar(e);

  // Boss warning
  if (screen === 'play' && bossState === 'warning') drawWarning();

  // "LEVEL 3 - Sunset Strait" banner during the calm at the start of a level
  if (screen === 'play' && levelTime < 2.2) {
    const pop = popCurve(levelTime / 0.35);
    ctx.globalAlpha = clamp((2.2 - levelTime) / 0.4, 0, 1);
    ctx.save();
    ctx.translate(WORLD_W / 2, 170);
    ctx.scale(pop, pop);
    drawText('LEVEL ' + level, 0, 0, 34, '#ffffff', 900, 'rgba(11,18,32,0.85)');
    drawText(theme.name, 0, 28, 16, '#f4d35e', 700, 'rgba(11,18,32,0.85)');
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  drawControlZone();

  // Floating text ("+100", "Power up!") that rises and fades
  for (const e of effects) {
    const p = e.t / e.life;
    ctx.globalAlpha = Math.min(1, (1 - p) * 2);
    const size = e.size * (p < 0.15 ? 0.6 + p / 0.15 * 0.4 : 1);                 // quick pop when it appears
    drawText(e.text, clamp(e.x, 30, WORLD_W - 30), e.y - 30 * p, size, e.color, 800, 'rgba(11,18,32,0.85)');
    ctx.globalAlpha = 1;
  }

  // Messages
  drawScreens();
  ctx.restore();
}

// The finger strip at the bottom
function drawControlZone() {
  ctx.drawImage(sprites.controlZone.canvas, 0, FIELD_H, WORLD_W, CONTROL_ZONE);

  // Small marker showing where your plane is
  const y = FIELD_H + CONTROL_ZONE / 2 - 6;
  stamp(sprites.marker, planeX, y);
  ctx.strokeStyle = 'rgba(140,255,225,0.75)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(planeX, y, 20, 0, TAU);
  ctx.stroke();
  ctx.globalAlpha = 0.9;
  stampScaled(sprites.player, planeX, y, 0.5, 0.5);
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  drawText('◀  slide here  ▶', WORLD_W / 2, WORLD_H - 14, 13, 'rgba(255,255,255,' + (0.5 + Math.sin(clock * 3) * 0.15).toFixed(3) + ')', 500);
}

// ---------- Fit the game area to the screen ----------
function resize() {
  dpr = window.devicePixelRatio || 1;            // keep drawing sharp on phone screens
  screenW = stage.clientWidth;
  screenH = stage.clientHeight;
  canvas.width  = Math.round(screenW * dpr);
  canvas.height = Math.round(screenH * dpr);
  scale = Math.min(screenW / WORLD_W, screenH / WORLD_H);
  offX = (screenW - WORLD_W * scale) / 2;
  offY = (screenH - WORLD_H * scale) / 2;

  // Paint the sprites again at the new size, so they stay sharp (only if the size really changed)
  const wanted = clamp(dpr * scale, 0.5, 4);
  if (wanted !== spriteRes || !sprites.player) {
    spriteRes = wanted;
    buildSprites();
    hudShown.lives = null;                       // the life icons use the plane sprite, so redraw them
    updateHud();
  }
}

// ---------- Input: slide to move ----------
let dragging = false;
function steer(e) {
  const rect = canvas.getBoundingClientRect();
  targetX = (e.clientX - rect.left - offX) / scale;
}
canvas.addEventListener('pointerdown', (e) => {
  if (screen !== 'play') { advance(); return; }
  dragging = true;
  canvas.setPointerCapture(e.pointerId);
  steer(e);
});
canvas.addEventListener('pointermove', (e) => {
  // With a mouse the plane follows without holding the button; with a finger it follows the slide
  if (screen === 'play' && (dragging || e.pointerType === 'mouse')) steer(e);
});
canvas.addEventListener('pointerup', () => { dragging = false; });
canvas.addEventListener('pointercancel', () => { dragging = false; });

// ---------- Input: keyboard (for testing on a laptop) ----------
window.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = true;
  if (k === ' ' && screen !== 'play') advance();
  if (k.startsWith('Arrow') || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
  if (k === 'ArrowLeft' || k === 'ArrowRight' || k === 'a' || k === 'd') targetX = planeX;
});

// ---------- Main loop ----------
let lastTime = 0;
function loop(time) {
  // dt = seconds since last frame, capped so a paused tab does not jump the game
  const dt = Math.min((time - lastTime) / 1000, 0.05);
  lastTime = time;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- Start ----------
window.addEventListener('resize', resize);
resize();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
