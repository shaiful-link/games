<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Dam Ular</title>
<style>
  /* Page fills the phone screen: players on top, board in the middle, dice and buttons at the bottom */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1220;
    color: #ffffff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  /* Soft glow behind everything, so the dark navy page is not flat */
  body {
    background:
      radial-gradient(120% 70% at 50% 0%, #1b2a4d 0%, rgba(27,42,77,0) 70%),
      radial-gradient(90% 60% at 50% 100%, #14213d 0%, rgba(20,33,61,0) 70%),
      #0b1220;
  }
  /* The faint batik flower pattern is painted by the script and put on #app as a background picture */
  #app {
    position: relative;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 8px 12px 12px;
    gap: 8px;
  }

  /* Top bar: one rounded "pill" for each player, and the sound button at the right end */
  #top {
    display: flex;
    align-items: center;
    gap: 6px;
    min-height: 40px;
  }
  #pills {
    flex: 1;
    min-width: 0;
    display: flex;
    gap: 5px;
  }
  .pill {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 4px 9px;
    border-radius: 14px;
    background: rgba(255,255,255,0.07);
    border: 2px solid rgba(255,255,255,0.08);
    transition: border-color 0.2s, background 0.2s, box-shadow 0.2s;
  }
  /* The pill of the player whose turn it is glows in that player's own colour (--c is set by the script) */
  .pill.turn {
    border-color: var(--c);
    background: rgba(255,255,255,0.14);
    box-shadow: 0 0 12px var(--c);
  }
  .pill .dot {
    flex: none;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    box-shadow: inset 0 -2px 3px rgba(0,0,0,0.35), 0 1px 2px rgba(0,0,0,0.5);
  }
  .pill .who {
    min-width: 0;
    display: flex;
    flex-direction: column;
    line-height: 1.1;
  }
  .pill .name {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.75);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .pill .square {
    font-size: 16px;
    font-weight: 800;
    font-variant-numeric: tabular-nums;      /* all digits the same width, so numbers do not wobble */
  }
  /* With four players the pills are narrow, so everything inside is packed a little tighter */
  #pills.four .pill { padding: 4px 6px; gap: 4px; }
  #pills.four .dot { width: 14px; height: 14px; }
  #pills.four .name { font-size: 10.5px; letter-spacing: -0.2px; }
  /* A square number "pops" for a moment when it changes */
  .pill .bump { animation: bump 0.35s ease-out; transform-origin: left center; }
  @keyframes bump {
    0%   { transform: scale(1.5); }
    100% { transform: scale(1); }
  }

  /* Sound on/off button. It sits above the start screen too, so it can always be reached */
  #sound {
    position: relative;
    z-index: 3;
    flex: none;
    width: 38px;
    height: 38px;
    padding: 0;
    border: 0;
    border-radius: 10px;
    background: rgba(255,255,255,0.10);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    font-family: inherit;
    touch-action: manipulation;
  }
  #sound.off { opacity: .45; }

  /* One line that says whose turn it is and what just happened */
  #status {
    min-height: 20px;
    font-size: 15px;
    line-height: 20px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Board area takes all remaining space; canvas is centred inside */
  #boardWrap {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #board {
    border-radius: 10px;
    box-shadow: 0 10px 24px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.06);
  }

  /* The dice strip under the board. The whole strip can be tapped, so it is an easy target for a child,
     and it is BELOW the board so the finger never covers the board. */
  #dice {
    display: block;
    width: 100%;
    height: 104px;
    flex: none;
    touch-action: manipulation;
  }

  /* See-through layer over the whole page, only used for the win confetti. Taps pass through it. */
  #fx {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 5;
    pointer-events: none;
  }

  #controls { display: flex; gap: 10px; }
  #controls button, #modes button, #winMode {
    flex: 1;
    height: 48px;
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 12px;
    background: linear-gradient(#26345c, #1a2440);
    box-shadow: 0 3px 0 #0a1020, inset 0 1px 0 rgba(255,255,255,0.10);
    color: #ffffff;
    font-size: 16px;
    font-weight: 600;
    font-family: inherit;
    touch-action: manipulation;
  }
  /* A pressed button sinks a little */
  #controls button:active, #modes button:active, #winMode:active {
    background: #2c3a60;
    transform: translateY(2px);
    box-shadow: 0 1px 0 #0a1020;
  }

  /* Small phones: everything a little tighter, so the board stays as big as possible */
  @media (max-width: 350px) {
    #top { gap: 5px; }
    #pills { gap: 4px; }
    .pill { padding: 4px 5px; gap: 4px; border-radius: 12px; }
    .pill .dot { width: 12px; height: 12px; }
    .pill .name { font-size: 10px; }
    #pills.four .pill { padding: 4px 3px 4px 4px; gap: 3px; }
    #pills.four .dot { width: 11px; height: 11px; }
    #pills.four .name { font-size: 9.5px; letter-spacing: -0.3px; }
    .pill .square { font-size: 15px; }
    #status { font-size: 14px; }
  }
  @media (max-height: 640px) {
    #dice { height: 92px; }
    #controls button { height: 44px; }
  }
  @media (min-height: 860px) {
    #dice { height: 118px; }
  }

  /* Start screen and winner screen */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: radial-gradient(90% 60% at 50% 35%, rgba(30,46,84,0.97) 0%, rgba(11,18,32,0.97) 75%);
    text-align: center;
    padding: 24px;
  }
  #overlay.hidden { display: none; }
  /* On the winner screen the board stays a little visible behind the card */
  #overlay.win { background: rgba(8,13,26,0.72); }
  #overlay.win #menu { display: none; }
  #overlay:not(.win) #winCard { display: none; }

  #menu {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
  }
  /* The little picture above the title (a snake, a ladder and a die, painted by the script) */
  #logo { display: block; width: 150px; height: 96px; }
  #overlay h1 {
    margin: 0;
    font-size: 36px;
    letter-spacing: 0.5px;
    color: #f4d35e;
    text-shadow: 0 2px 0 rgba(0,0,0,0.45);
  }
  #overlay p  { margin: 0 0 6px; font-size: 16px; color: rgba(255,255,255,0.8); }
  #modes { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 300px; }
  #modes button { flex: none; height: 54px; }
  #modes button.main {
    background: linear-gradient(#34917a, #24634f);
    box-shadow: 0 3px 0 #123a2e, inset 0 1px 0 rgba(255,255,255,0.18);
  }
  #modes button.main:active { background: #2a6f5c; box-shadow: 0 1px 0 #123a2e; }
  @media (max-height: 520px) {
    #logo { width: 110px; height: 70px; }
    #overlay h1 { font-size: 28px; }
    #overlay { gap: 8px; padding: 12px 24px; }
    #menu { gap: 8px; }
    #modes { gap: 7px; }
    #modes button { height: 44px; }
  }

  /* Winner card: a rounded card with the winner's colour around it (--c is set by the script) */
  #winCard {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    width: 100%;
    max-width: 290px;
    padding: 22px 20px 18px;
    border-radius: 22px;
    border: 3px solid var(--c, #f4d35e);
    background: linear-gradient(#243560, #141d38);
    box-shadow: 0 0 34px var(--c, #f4d35e), 0 14px 30px rgba(0,0,0,0.6);
    animation: cardIn 0.45s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes cardIn {
    0%   { transform: scale(0.5); opacity: 0; }
    100% { transform: scale(1);   opacity: 1; }
  }
  #winToken { display: block; width: 96px; height: 110px; }
  #winCard h1 { color: var(--c, #f4d35e); font-size: 34px; }
  #winCard .again {
    margin: 4px 0 6px;
    font-size: 17px;
    font-weight: 700;
    color: #ffffff;
    animation: pulse 1.1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.55; transform: scale(0.97); }
    50%      { opacity: 1;    transform: scale(1.04); }
  }
  #winMode { flex: none; width: 100%; height: 42px; font-size: 14px; opacity: 0.9; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div id="pills"></div>
    <button id="sound" aria-label="Sound on or off"></button>
  </div>

  <div id="status">Dam Ular</div>

  <div id="boardWrap"><canvas id="board"></canvas></div>

  <canvas id="dice" aria-label="Tap to roll the dice"></canvas>

  <div id="controls">
    <button id="btnNew">New game</button>
    <button id="btnMode">Change mode</button>
  </div>

  <div id="overlay">
    <div id="menu">
      <canvas id="logo"></canvas>
      <h1>Dam Ular</h1>
      <p id="msgLine">Snakes and Ladders</p>
      <div id="modes">
        <button data-players="1" class="main">1 player (vs computer)</button>
        <button data-players="2">2 players</button>
        <button data-players="3">3 players</button>
        <button data-players="4">4 players</button>
      </div>
    </div>
    <div id="winCard">
      <canvas id="winToken"></canvas>
      <h1 id="winTitle">Red wins!</h1>
      <div class="again">Tap to play again</div>
      <button id="winMode">Change mode</button>
    </div>
  </div>
</div>
<canvas id="fx"></canvas>

<script>
// =====================================================
// DAM ULAR - Snakes and Ladders, the Malaysian childhood board game
// Tap the big die under the board to roll. Your piece hops forward by itself.
//
// Rules used in this version (the main ones are settings below):
// - The board has 100 squares. Square 1 is bottom-left. The numbers go left to right on the
//   first row, then right to left on the next row up, and so on. Square 100 is top-left.
// - 2 to 4 players take turns. Every piece starts off the board and comes in on the first roll.
// - Stop at the foot of a ladder: climb up to its top.
// - Stop on a snake's head: slide down to the tip of its tail.
// - Roll a 6 and you roll again.
// - You must land exactly on 100 to win. If the roll is too big, the piece stays where it is.
// - "1 player" means you (red) against the computer (blue). The computer rolls by itself.
//   With 2, 3 or 4 players everybody shares the phone: roll, then pass it on.
//
// Looks and sound:
// - The board (frame, squares, ladders, snakes, numbers), the pieces and the die are painted
//   once into hidden canvases (and again when the screen size changes), then stamped on screen.
//   That keeps the game fast on cheap phones and sharp on good ones.
// - Pieces hop square by square, climb along the ladder and slide along the snake's own curve.
// - All sounds are made by code. The speaker button (top right) turns them on and off.
// =====================================================

// ---------- Settings (change these to make your own board and house rules) ----------
// Ladders: [bottom square, top square]. A piece that stops on the bottom climbs to the top.
const LADDERS = [
  [3, 19],
  [13, 35],
  [21, 43],
  [30, 51],
  [36, 76],
  [63, 96],
  [66, 86]
];
// Snakes: [head square, tail square]. A piece that stops on the head slides down to the tail.
// You may add a third number to choose which way the body bends: 1 or -1 (leave it out = automatic).
// This layout was picked so that no snake lies on top of a ladder or another snake. If you change it,
// look at the board afterwards: the order of the list also decides each snake's colour and bend.
const SNAKES = [
  [99, 61],
  [89, 54],
  [93, 74],
  [71, 53],
  [55, 28],
  [48, 10],
  [44, 18],
  [25, 4]
];
const EXTRA_ROLL_ON_SIX = true;       // true = rolling a 6 gives one more roll
const EXACT_FINISH      = true;       // true = you must land exactly on 100 (too big a roll = stay)

const SOUND_VOLUME      = 0.25;       // 0 = silent, 1 = very loud
const DICE_ROLL_MS      = 700;        // how long the die tumbles (milliseconds)
const DICE_FACE_MS      = 75;         // while tumbling, a new face shows this often
const HOP_MS            = 190;        // time for one hop to the next square
const HOP_HEIGHT        = 0.42;       // how high a hop is, as a share of one square
const LADDER_MS_PER_SQUARE = 150;     // climbing speed: time for each square of ladder length
const SNAKE_MS_PER_SQUARE  = 190;     // sliding speed: time for each square of snake length
const SNAKE_BITE_MS     = 420;        // the pause on the snake's head before the slide starts
const COMPUTER_WAIT_MS  = 800;        // the computer waits this long before it rolls
const AFTER_MOVE_MS     = 380;        // short rest after a move, before the next turn
const WIN_TAP_GUARD_MS  = 800;        // on the winner card, taps are ignored for this long

const FRAME_SHARE       = 0.036;      // width of the wooden frame, as a share of the board size
const SNAKE_BEND        = 0.55;       // how far a snake's body swings sideways, in squares
const MAX_PARTICLES     = 150;        // most sparkles + confetti bits alive at once (keeps cheap phones smooth)
const CONFETTI_COUNT    = 100;        // confetti pieces thrown on a win

// The four pieces. "light", "main" and "dark" are three shades of the same colour, used for shading.
const PLAYER_LOOKS = [
  { name: 'Red',    light: '#ffb9b3', main: '#e8423f', dark: '#8f1c1c' },
  { name: 'Blue',   light: '#b3d4ff', main: '#2f7fe6', dark: '#17408f' },
  { name: 'Green',  light: '#b9f2c6', main: '#2fb866', dark: '#136b38' },
  { name: 'Yellow', light: '#fff4b0', main: '#f5c518', dark: '#9a7306' }
];

// Colours of the squares (they repeat in a diagonal pattern)
const TILE_COLOURS = ['#ffe6a8', '#c4ebcd', '#ffd0bd', '#c3e0f7', '#e6d3f5'];

// One colour set for each snake: dark edge, main body, light shine, and the pattern colour
const SNAKE_LOOKS = [
  { name: 'green',  dark: '#1f6b2e', main: '#42b552', light: '#b6f0a6', mark: '#17551f' },
  { name: 'orange', dark: '#a3460d', main: '#f28c2e', light: '#ffd9a0', mark: '#8a3406' },
  { name: 'purple', dark: '#4a2a82', main: '#8f63d6', light: '#dccbf9', mark: '#38206c' },
  { name: 'teal',   dark: '#0f6464', main: '#25b5ae', light: '#b4f1ea', mark: '#0a4f52' },
  { name: 'red',    dark: '#8f1d2c', main: '#e24a5c', light: '#ffc0c4', mark: '#701322' },
  { name: 'blue',   dark: '#1d3f91', main: '#4d84e6', light: '#c2d8ff', mark: '#152f74' },
  { name: 'gold',   dark: '#7a5a12', main: '#d9aa2c', light: '#f9e698', mark: '#5f4308' },
  { name: 'pink',   dark: '#a02a6e', main: '#ef72b5', light: '#ffd0e8', mark: '#84195a' }
];

// ---------- Board basics ----------
// Where is square "n" on the board?  row 0 is the TOP row, col 0 is the LEFT column.
// Square 1 is bottom-left. Rows going up switch direction each time (like a snake!).
function squareToRowCol(n) {
  const index = n - 1;                              // 0 to 99
  const rowFromBottom = Math.floor(index / 10);     // 0 = bottom row
  const step = index % 10;                          // how far along that row
  const col = (rowFromBottom % 2 === 0) ? step : 9 - step;   // even rows go right, odd rows go left
  return { row: 9 - rowFromBottom, col: col };
}

// Quick look-up tables made from the two lists above:
//   ladderFrom[4] = 0  means "square 4 is the foot of ladder number 0"
//   snakeFrom[27] = 0  means "square 27 is the head of snake number 0"
const ladderFrom = {};
const snakeFrom = {};
LADDERS.forEach((ladder, i) => { ladderFrom[ladder[0]] = i; });
SNAKES.forEach((snake, i) => { snakeFrom[snake[0]] = i; });

// Check the two lists for mistakes. Returns a list of problems in plain words (empty = all good).
function checkLayout() {
  const problems = [];
  const starts = {};                                // every square where a ladder or snake begins
  const ends = {};                                  // every square where one ends
  function onBoard(n) { return Number.isInteger(n) && n >= 1 && n <= 100; }

  for (const [bottom, top] of LADDERS) {
    if (!onBoard(bottom) || !onBoard(top)) problems.push('Ladder ' + bottom + '-' + top + ' is off the board');
    if (bottom >= top) problems.push('Ladder ' + bottom + '-' + top + ' must go up');
    if (bottom === 1 || bottom === 100) problems.push('A ladder cannot start on square ' + bottom);
    if (starts[bottom]) problems.push('Two things start on square ' + bottom);
    starts[bottom] = true;
    ends[top] = true;
  }
  for (const [head, tail] of SNAKES) {
    if (!onBoard(head) || !onBoard(tail)) problems.push('Snake ' + head + '-' + tail + ' is off the board');
    if (head <= tail) problems.push('Snake ' + head + '-' + tail + ' must go down');
    if (head === 1 || head === 100) problems.push('A snake cannot start on square ' + head);
    if (starts[head]) problems.push('Two things start on square ' + head);
    starts[head] = true;
    ends[tail] = true;
  }
  // A square where one thing ends must not be the start of another (no chain reactions)
  for (const square in ends) {
    if (starts[square]) problems.push('Square ' + square + ' is both an end and a start');
  }
  return problems;
}

// The rules for one roll, with no pictures at all.
// A piece on square "pos" rolls "roll". The answer says:
//   stop  = the square it hops to (the same as pos if the roll was too big)
//   end   = where it finally rests after a ladder or a snake
//   stuck = true if it could not move
function squareAfterRoll(pos, roll) {
  let stop = pos + roll;
  if (stop > 100) {
    if (EXACT_FINISH) return { stop: pos, end: pos, stuck: true };
    stop = 100;
  }
  let end = stop;
  if (ladderFrom[stop] !== undefined) end = LADDERS[ladderFrom[stop]][1];
  if (snakeFrom[stop] !== undefined) end = SNAKES[snakeFrom[stop]][1];
  return { stop: stop, end: end, stuck: false };
}

// Roll the die: a whole number from 1 to 6
function rollNumber() {
  return 1 + Math.floor(Math.random() * 6);
}

// ---------- Page elements ----------
const canvas     = document.getElementById('board');
const boardWrap  = document.getElementById('boardWrap');
const ctx        = canvas.getContext('2d');
const diceCanvas = document.getElementById('dice');       // the strip under the board with the die on it
const diceCtx    = diceCanvas.getContext('2d');
const fxCanvas   = document.getElementById('fx');         // see-through layer for confetti
const fxCtx      = fxCanvas.getContext('2d');
const appBox     = document.getElementById('app');
const overlay    = document.getElementById('overlay');
const msgLine    = document.getElementById('msgLine');
const elStatus   = document.getElementById('status');
const elPills    = document.getElementById('pills');
const winCard    = document.getElementById('winCard');
const winTitle   = document.getElementById('winTitle');
const winToken   = document.getElementById('winToken');
const logoCanvas = document.getElementById('logo');

// ---------- Sound ----------
// All sounds are made by code (short notes), so there are no sound files to upload.
// Phones only allow sound after a touch, so the sound engine starts on the first touch.
// The on/off choice is remembered, and is shared by all the games on this site.
const btnSound = document.getElementById('sound');
let audio = null;                // the sound engine (created on first touch)
let muted = false;
try { muted = localStorage.getItem('gamesMuted') === '1'; } catch (e) { /* storage blocked: start with sound on */ }

function showSoundButton() {
  btnSound.textContent = muted ? '\u{1F507}' : '\u{1F50A}';      // speaker off / speaker on
  btnSound.classList.toggle('off', muted);
}
showSoundButton();

function startAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }                                  // no sound support: the game still works
}
// Different phones accept different kinds of touch for this, so listen for all of them
for (const type of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(type, startAudio, true);
}

// Play one note.
//   freq  = pitch in Hz (higher number = higher note)
//   dur   = length in seconds
//   type  = 'sine' (soft), 'triangle' (round), 'square' (retro), 'sawtooth' (buzzy)
//   delay = seconds to wait before it starts (used to build little tunes)
//   slide = pitch to glide to by the end (optional)
//   volume = 0 to 1, share of SOUND_VOLUME
function beep(freq, dur, type = 'sine', delay = 0, slide = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(SOUND_VOLUME * volume, t + 0.01);   // quick fade in (no click)
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);                   // fade out
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// Play a burst of hiss (for explosions, crashes, whooshes).
//   dur = length in seconds, tone = how bright it is in Hz (300 = deep boom, 4000 = sharp crack)
let noiseBuffer = null;
function noise(dur, tone = 1000, delay = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  if (!noiseBuffer) {                                            // one second of random hiss, made once
    noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const t = audio.currentTime + delay;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = noiseBuffer;
  src.loop = true;
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(tone, t);
  filter.frequency.exponentialRampToValueAtTime(Math.max(60, tone * 0.25), t + dur);
  gain.gain.setValueAtTime(SOUND_VOLUME * volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

// Short buzz on Android phones (iPhone does not allow this from a web page)
function buzz(ms) {
  if (!muted && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

btnSound.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('gamesMuted', muted ? '1' : '0'); } catch (e) {}
  showSoundButton();
  startAudio();
  if (!muted) setTimeout(() => beep(740, 0.05, 'sine', 0, 0, 0.6), 60);   // small note to confirm sound is on
});

// The notes of a happy scale going up (used while a piece climbs a ladder)
const CLIMB_NOTES = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
let lastRattleTime = 0;          // when the last dice rattle played (so they never pile up)

// The game's own sounds: one small function for each thing that happens
const sfx = {
  // The die tumbling: one quiet "tick". It is called many times in a row while the die rolls.
  rattle() {
    const now = performance.now();
    if (now - lastRattleTime < 60) return;
    lastRattleTime = now;
    noise(0.035, 2200 + Math.random() * 1500, 0, 0.3);
    beep(260 + Math.random() * 180, 0.03, 'square', 0, 0, 0.1);
  },
  // The die comes to rest: one firm knock
  diceLand() {
    noise(0.07, 1700, 0, 0.6);
    beep(210, 0.10, 'sine', 0, 130, 0.9);
  },
  // One hop to the next square. "count" is 0 for the first hop, 1 for the second... so the note climbs.
  hop(count) {
    beep(440 + count * 45, 0.06, 'triangle', 0, 0, 0.4);
  },
  // One step up a ladder: the next note of the happy scale
  ladderStep(count) {
    const note = CLIMB_NOTES[Math.min(count, CLIMB_NOTES.length - 1)];
    beep(note, 0.09, 'triangle', 0, 0, 0.5);
  },
  // Reached the top of the ladder: three bright notes
  ladderTop() {
    beep(1047, 0.12, 'sine', 0.00, 0, 0.7);
    beep(1319, 0.12, 'sine', 0.10, 0, 0.7);
    beep(1568, 0.30, 'sine', 0.20, 0, 0.7);
    buzz(15);
  },
  // Caught by a snake: a hiss first, then a falling slide whistle that lasts as long as the slide.
  //   wait = seconds before the slide starts, slideTime = how long the slide lasts (seconds)
  snake(wait, slideTime) {
    noise(wait + 0.15, 6000, 0, 0.45);                              // "sss!"
    beep(990, slideTime, 'sine', wait, 170, 0.6);                   // whistle going down
    noise(slideTime, 4500, wait, 0.2);                              // soft hiss under the whistle
    buzz(30);
  },
  // Rolled a 6: a bright little chime
  six() {
    beep(988,  0.09, 'sine', 0.00, 0, 0.7);
    beep(1319, 0.09, 'sine', 0.08, 0, 0.7);
    beep(1976, 0.24, 'sine', 0.16, 0, 0.7);
  },
  // The roll was too big to finish: two soft low notes
  cannotMove() {
    beep(220, 0.14, 'sine', 0.00, 0, 0.6);
    beep(165, 0.24, 'sine', 0.15, 0, 0.6);
  },
  // The turn passes to the next player: a very soft blip
  turn() {
    beep(660, 0.05, 'sine', 0, 0, 0.2);
  },
  // Pressing one of the buttons
  button() {
    beep(520, 0.05, 'triangle', 0, 0, 0.4);
  },
  // Somebody reached 100: a short fanfare
  win() {
    beep(523,  0.14, 'triangle', 0.15, 0, 0.8);
    beep(659,  0.14, 'triangle', 0.29, 0, 0.8);
    beep(784,  0.14, 'triangle', 0.43, 0, 0.8);
    beep(1047, 0.20, 'triangle', 0.57, 0, 0.8);
    beep(784,  0.10, 'triangle', 0.79, 0, 0.7);
    beep(1047, 0.45, 'triangle', 0.90, 0, 0.8);
    buzz(35);
  },
  // The computer reached 100 first: a short gentle tune going down
  lose() {
    beep(392, 0.18, 'sine', 0.15, 0, 0.8);
    beep(330, 0.18, 'sine', 0.33, 0, 0.8);
    beep(262, 0.40, 'sine', 0.51, 196, 0.8);
  }
};

// ---------- Game state ----------
// Each player looks like { look, name, pos, isComputer, x, y, lift, spin, landedAt }
//   pos = the square the piece is on (0 = not on the board yet)
//   x, y = where the piece is drawn right now (board pixels); lift/spin/landedAt are for the animation
let players = [];
let playerCount = 2;             // what was chosen on the start screen: 1, 2, 3 or 4
let current = 0;                 // whose turn it is (a position in the players list)
// What the game is doing right now:
//   'menu'    = start screen is showing
//   'waiting' = waiting for the player (or the computer) to roll
//   'rolling' = the die is tumbling
//   'moving'  = a piece is hopping, climbing or sliding
//   'pause'   = a short rest between two of the steps above
//   'over'    = somebody has won
let phase = 'menu';
let lastRoll = 0;                // the number of the last roll
let gameId = 0;                  // goes up by one for every new game. Old timers check it and give up.
let winShownAt = 0;              // when the winner card appeared (for the tap guard)

// Sizes in CSS pixels (set by resize)
let cell = 30;                   // one square
let edge = 10;                   // the wooden frame around the squares
let boardSize = 320;             // the whole board picture, frame included
let diceW = 300, diceH = 104;    // the dice strip
let dieSize = 88;                // the die itself

// ---------- Effects state (looks only: none of this changes the rules) ----------
const dice = { face: 1, rolling: false, start: 0, tick: -1, result: 1, landedAt: -9999 };
let mover = null;                // the piece that is travelling right now: { player, segments, index, segStart }
let particles = [];              // sparkles and puffs on the board
let floaters = [];               // floating words like "+21 Ladder!"
let confetti = [];               // confetti bits on the whole page
let shakeUntil = 0;              // the board shakes a little until this time
let ladderGlow = null;           // the ladder being climbed: { index, until }
let snakeAwake = null;           // the snake that just caught a piece: { index, start, until }
let loopRunning = false;         // true while the next animation frame is already booked
let lastFrameTime = 0;
let fxDirty = false;             // true when the confetti layer has something on it to wipe

// Run "action" after "ms" milliseconds, but ONLY if the same game is still being played.
// This is what stops an old timer from rolling the die in a new game.
function later(action, ms) {
  const id = gameId;
  setTimeout(() => { if (id === gameId) action(); }, ms);
}

// ---------- Game flow ----------
function startGame(count) {
  if (count) playerCount = count;
  gameId++;                                         // every timer from the old game now gives up

  // Make the players. In 1-player mode the second player is the computer.
  const seats = playerCount === 1 ? 2 : playerCount;
  players = [];
  for (let i = 0; i < seats; i++) {
    let name = PLAYER_LOOKS[i].name;
    if (playerCount === 1) name = i === 0 ? 'You' : 'Computer';
    players.push({
      look: i, name: name, pos: 0, isComputer: playerCount === 1 && i === 1,
      x: 0, y: 0, lift: 0, spin: 0, landedAt: -9999
    });
  }
  current = 0;
  lastRoll = 0;

  // Clear any effects left over from the last game
  mover = null;
  particles = [];
  floaters = [];
  confetti = [];
  ladderGlow = null;
  snakeAwake = null;
  shakeUntil = 0;
  dice.rolling = false;
  dice.face = 1;
  dice.landedAt = -9999;

  overlay.classList.add('hidden');
  overlay.classList.remove('win');
  buildPills();
  beginTurn();
  keepAnimating();
}

// The words used for a player in the status line: "You" or "Red", "Your" or "Red's"
function nameOf(player)  { return player.name; }
function ownerOf(player) { return player.name === 'You' ? 'Your' : player.name + "'s"; }

// Start the turn of the player number "current"
function beginTurn() {
  const player = players[current];
  phase = 'waiting';
  if (player.isComputer) {
    elStatus.textContent = 'Computer is rolling...';
    later(rollDice, COMPUTER_WAIT_MS);              // the computer "taps" the die by itself
  } else {
    elStatus.textContent = ownerOf(player) + ' turn - tap the dice';
  }
  updatePills();
}

// Start the die tumbling. The number is chosen now; the tumbling is only for show.
function rollDice() {
  if (phase !== 'waiting') return;
  phase = 'rolling';
  lastRoll = rollNumber();
  dice.rolling = true;
  dice.start = performance.now();
  dice.tick = -1;
  dice.result = lastRoll;
  if (!players[current].isComputer) elStatus.textContent = nameOf(players[current]) + ' rolling...';
  keepAnimating();
}

// The die has come to rest (called by the animation)
function diceLanded() {
  const player = players[current];
  phase = 'pause';
  sfx.diceLand();
  elStatus.textContent = nameOf(player) + ' rolled ' + lastRoll;
  later(startMove, 260);
}

// Work out the move with the rules, then build the list of little journeys ("segments") to show it
function startMove() {
  const player = players[current];
  const result = squareAfterRoll(player.pos, lastRoll);

  // The roll is too big to finish: say so, and the turn ends
  if (result.stuck) {
    const need = 100 - player.pos;
    sfx.cannotMove();
    addFloater('Need exactly ' + need, player.x, player.y - cell * 0.9, '#ffffff');
    elStatus.textContent = nameOf(player) + (player.name === 'You' ? ' need' : ' needs') + ' exactly ' + need;
    later(endTurn, 900);
    return;
  }

  const segments = [];
  // 1. One hop for every square
  //    (a piece that is not on the board yet comes in from the bottom edge, under square 1)
  if (player.pos === 0) {
    const entry = entryPoint();
    player.x = entry.x;
    player.y = entry.y;
  }
  let from = { x: player.x, y: player.y };
  for (let square = player.pos + 1; square <= result.stop; square++) {
    const to = tokenSpot(square, 0, 1);
    segments.push({ type: 'hop', from: from, to: to, square: square, count: square - player.pos - 1, dur: HOP_MS });
    from = to;
  }
  // 2. A ladder to climb?
  if (ladderFrom[result.stop] !== undefined) {
    const index = ladderFrom[result.stop];
    const squares = ladderShapes[index].length / cell;
    segments.push({
      type: 'ladder', index: index, from: from, to: tokenSpot(result.end, 0, 1),
      steps: Math.max(3, Math.round(squares * 1.6)), lastStep: -1,
      dur: Math.max(650, squares * LADDER_MS_PER_SQUARE)
    });
  }
  // 3. A snake to slide down? First a short "bite" pause on the head, then the slide.
  if (snakeFrom[result.stop] !== undefined) {
    const index = snakeFrom[result.stop];
    const squares = snakeShapes[index].length / cell;
    const slideMs = Math.max(900, squares * SNAKE_MS_PER_SQUARE);
    segments.push({ type: 'bite', index: index, from: from, dur: SNAKE_BITE_MS, slideMs: slideMs });
    segments.push({ type: 'slide', index: index, from: from, to: tokenSpot(result.end, 0, 1), dur: slideMs });
  }

  phase = 'moving';
  mover = { player: player, segments: segments, index: 0, segStart: performance.now() };
  beginSegment(segments[0]);
  keepAnimating();
}

// Things that happen at the START of a segment
function beginSegment(segment) {
  const now = performance.now();
  if (segment.type === 'ladder') {
    ladderGlow = { index: segment.index, until: now + segment.dur + 300 };
    elStatus.textContent = 'A ladder! Up we go!';
  }
  if (segment.type === 'bite') {
    snakeAwake = { index: segment.index, start: now, until: now + segment.dur + segment.slideMs };
    shakeUntil = now + 260;
    sfx.snake(segment.dur / 1000, segment.slideMs / 1000);
    addFloater('Oh no! Snake!', segment.from.x, segment.from.y - cell * 0.9, '#ff9c9c');
    elStatus.textContent = 'Oh no! A snake!';
  }
}

// Things that happen at the END of a segment
function finishSegment(segment, now) {
  const player = mover.player;
  if (segment.type === 'hop') {
    player.pos = segment.square;
    player.x = segment.to.x;
    player.y = segment.to.y;
    player.lift = 0;
    player.landedAt = now;                          // starts the tiny squash
    sfx.hop(segment.count);
    updatePills();
  }
  if (segment.type === 'ladder') {
    const ladder = LADDERS[segment.index];
    player.pos = ladder[1];
    player.x = segment.to.x;
    player.y = segment.to.y;
    player.lift = 0;
    player.landedAt = now;
    sfx.ladderTop();
    addFloater('+' + (ladder[1] - ladder[0]) + ' Ladder!', player.x, player.y - cell * 0.9, '#8dffb8');
    burst(player.x, player.y - cell * 0.3, 14, ['#fff6b0', '#f4d35e', '#ffffff', '#8dffb8'], true);
    updatePills();
  }
  if (segment.type === 'slide') {
    const snake = SNAKES[segment.index];
    player.pos = snake[1];
    player.x = segment.to.x;
    player.y = segment.to.y;
    player.spin = 0;
    player.landedAt = now;
    burst(player.x, player.y - cell * 0.1, 8, ['#ffffff', '#d7dcec'], false);
    updatePills();
  }
}

// The whole move is finished
function afterMove() {
  const player = players[current];
  phase = 'pause';
  if (player.pos === 100) { endGame(player); return; }
  later(endTurn, AFTER_MOVE_MS);
}

// Pass the turn on (or give the same player another roll after a 6)
function endTurn() {
  const player = players[current];
  if (lastRoll === 6 && EXTRA_ROLL_ON_SIX) {
    sfx.six();
    const where = player.pos === 0 ? entryPoint() : player;
    addFloater('6! Roll again', where.x, where.y - cell * 0.9, '#f4d35e');
  } else {
    current = (current + 1) % players.length;
    sfx.turn();
  }
  beginTurn();
}

function endGame(winner) {
  phase = 'over';
  const computerWon = winner.isComputer;
  const title = winner.name === 'You' ? 'You win!' : winner.name + ' wins!';
  elStatus.textContent = title;
  updatePills();

  // Tune and confetti. Against the computer only your own win is a party.
  if (computerWon) sfx.lose();
  else { sfx.win(); throwConfetti(); }
  burst(winner.x, winner.y - cell * 0.4, 18, ['#fff6b0', '#f4d35e', '#ffffff'], true);

  // Show the winner card a little later, so the final position can be seen first
  later(() => {
    const look = PLAYER_LOOKS[winner.look];
    winTitle.textContent = title;
    winCard.style.setProperty('--c', look.main);
    paintWinToken(winner.look);
    overlay.classList.add('win');
    overlay.classList.remove('hidden');
    winShownAt = performance.now();
  }, 1100);
}

// Leave the game and show the start screen again
function showMenu() {
  gameId++;                                         // stop every timer of the game that was running
  phase = 'menu';
  mover = null;
  dice.rolling = false;
  confetti = [];
  overlay.classList.remove('win');
  overlay.classList.remove('hidden');
  keepAnimating();                                  // one more frame, to wipe the confetti
}

// ---------- Top bar: one pill for each player ----------
function buildPills() {
  elPills.textContent = '';
  elPills.classList.toggle('four', players.length === 4);
  for (const player of players) {
    const look = PLAYER_LOOKS[player.look];
    const pill = document.createElement('div');
    pill.className = 'pill';
    pill.style.setProperty('--c', look.main);

    const dot = document.createElement('span');
    dot.className = 'dot';
    dot.style.background = 'radial-gradient(circle at 35% 30%, ' + look.light + ' 0%, ' + look.main + ' 45%, ' + look.dark + ' 100%)';

    const who = document.createElement('span');
    who.className = 'who';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = player.name;
    const square = document.createElement('span');
    square.className = 'square';
    square.textContent = '0';
    who.appendChild(name);
    who.appendChild(square);

    pill.appendChild(dot);
    pill.appendChild(who);
    elPills.appendChild(pill);
    player.pill = pill;
    player.squareLabel = square;
  }
}

// Show every player's square number, and light up the pill of the player whose turn it is
function updatePills() {
  players.forEach((player, i) => {
    const text = String(player.pos);
    if (player.squareLabel.textContent !== text) {
      player.squareLabel.textContent = text;
      player.squareLabel.classList.remove('bump');
      void player.squareLabel.offsetWidth;          // makes the browser restart the pop animation
      player.squareLabel.classList.add('bump');
    }
    const glowing = phase === 'over' ? player.pos === 100 : i === current;
    player.pill.classList.toggle('turn', glowing);
  });
}

// ---------- Where things are on the board ----------
// The middle of square "n", in board pixels
function squareCentre(n) {
  const place = squareToRowCol(n);
  return { x: edge + (place.col + 0.5) * cell, y: edge + (place.row + 0.5) * cell };
}

// Where pieces come onto the board from: the bottom edge, just under square 1
function entryPoint() {
  const first = squareCentre(1);
  return { x: first.x, y: boardSize + cell * 0.2 };
}

// When pieces share a square they stand side by side, so all of them can be seen.
// SHARE_SPOTS[how many][which one] = [sideways, up/down] in squares
const SHARE_SPOTS = {
  1: [[0, 0]],
  2: [[-0.21, 0], [0.21, 0]],
  3: [[-0.22, -0.13], [0.22, -0.13], [0, 0.13]],
  4: [[-0.22, -0.14], [0.22, -0.14], [-0.22, 0.14], [0.22, 0.14]]
};
const SHARE_SCALE = { 1: 1, 2: 0.88, 3: 0.8, 4: 0.8 };

// Where the foot of a piece goes on square "n", when it is number "slot" out of "total" pieces there
function tokenSpot(n, slot, total) {
  const centre = squareCentre(n);
  const spot = SHARE_SPOTS[total][slot];
  return { x: centre.x + spot[0] * cell, y: centre.y + 0.24 * cell + spot[1] * cell };
}

// Which pieces are resting on square "n" (the travelling piece does not count)
function playersOn(n) {
  return players.filter(p => p.pos === n && !(mover && mover.player === p));
}

// ---------- Pictures made once: board, snakes, ladders, pieces, die ----------
// Painting wood, snakes and shiny pieces is slow, so each picture is painted once into a hidden
// canvas (and again when the screen size changes). Drawing a frame is then just "stamping" them.
let boardImage = null;           // frame, squares, ladders, snakes and numbers
let tokenImages = [];            // one picture for each player colour
let dieImages = [];              // dieImages[1] to dieImages[6]
let glowImages = [];             // a soft round light in each player's colour (shown behind the die)
let ladderShapes = [];           // for each ladder: { a, b, length } (foot, top, length in pixels)
let snakeShapes = [];            // for each snake: { points, normals, length, look, ... }
let tokenW = 30, tokenH = 36;    // size of one piece picture in CSS pixels
let tokenFootY = 30;             // where the foot of the piece is inside its picture

// A "random" number maker that always gives the same numbers for the same seed,
// so the wood grain looks the same every time the board is rebuilt.
function makeRandom(seed) {
  let s = seed;
  return function () {
    s = (s * 16807) % 2147483647;
    return s / 2147483647;
  };
}

// Make a hidden canvas of the given size (CSS pixels), ready to draw on sharply
function makeHiddenCanvas(width, height, dpr) {
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(width * dpr));
  c.height = Math.max(1, Math.round(height * dpr));
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { canvas: c, g: g };
}

// Draw a few wavy grain lines across a rectangle of wood
function drawGrain(g, x, y, w, h, lines, colour, rnd) {
  g.save();
  g.beginPath();
  g.rect(x, y, w, h);
  g.clip();                                       // keep the lines inside this rectangle
  g.strokeStyle = colour;
  for (let i = 0; i < lines; i++) {
    const y0 = y + rnd() * h;
    const bend = (rnd() - 0.5) * h * 0.3;
    g.globalAlpha = 0.25 + rnd() * 0.75;
    g.lineWidth = 0.5 + rnd() * 1.2;
    g.beginPath();
    g.moveTo(x - 2, y0);
    g.bezierCurveTo(x + w * 0.3, y0 + bend, x + w * 0.7, y0 - bend, x + w + 2, y0 + bend * 0.5);
    g.stroke();
  }
  g.restore();
}

// Trace a rectangle with rounded corners (older phones do not have a built-in one)
function roundedRect(g, x, y, w, h, radius) {
  g.beginPath();
  g.moveTo(x + radius, y);
  g.arcTo(x + w, y, x + w, y + h, radius);
  g.arcTo(x + w, y + h, x, y + h, radius);
  g.arcTo(x, y + h, x, y, radius);
  g.arcTo(x, y, x + w, y, radius);
  g.closePath();
}

// Trace a star with "points" points (used on square 100, the frame corners and sparkles)
function starPath(g, x, y, outer, inner, points) {
  g.beginPath();
  for (let i = 0; i < points * 2; i++) {
    const radius = i % 2 === 0 ? outer : inner;
    const angle = -Math.PI / 2 + i * Math.PI / points;
    const px = x + Math.cos(angle) * radius, py = y + Math.sin(angle) * radius;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
}

// ----- Snakes -----
// Work out the body line of one snake: a wavy line from the head square to the tail square.
// It is stored as many points the same distance apart. The picture is drawn along these points,
// and a piece that is caught slides along the very same points.
function buildSnakeShape(index) {
  const head = squareCentre(SNAKES[index][0]);
  const tail = squareCentre(SNAKES[index][1]);
  // The head sits a little down and right of the middle of its square, so it does not hide the number
  head.x += cell * 0.07;
  head.y += cell * 0.13;
  const dx = tail.x - head.x, dy = tail.y - head.y;
  const straight = Math.hypot(dx, dy);
  const sideX = -dy / straight, sideY = dx / straight;      // the direction "sideways" to the body
  const waves = straight > cell * 4.6 ? 3 : 2;              // long snakes get one more bend
  const swing = Math.min(cell * SNAKE_BEND, straight * 0.24);
  const low = edge + cell * 0.32, high = edge + cell * 10 - cell * 0.32;   // keep the bends on the board

  // Make the wavy line for one bend direction (1 or -1). "pushed" adds up how much of it had to be
  // pushed back onto the board, so the better direction can be chosen.
  function wavyLine(direction) {
    const line = [];
    let pushed = 0;
    for (let i = 0; i <= 240; i++) {
      const t = i / 240;
      const off = Math.sin(t * Math.PI * waves) * swing * direction;
      const x = head.x + dx * t + sideX * off;
      const y = head.y + dy * t + sideY * off;
      const cx = Math.min(high, Math.max(low, x));
      const cy = Math.min(high, Math.max(low, y));
      pushed += Math.abs(cx - x) + Math.abs(cy - y);
      line.push({ x: cx, y: cy });
    }
    return { line: line, pushed: pushed };
  }
  let chosen;
  const wanted = SNAKES[index][2];
  if (wanted === 1 || wanted === -1) {
    chosen = wavyLine(wanted);
  } else {
    const one = wavyLine(1), two = wavyLine(-1);
    if (one.pushed === two.pushed) chosen = index % 2 === 0 ? one : two;
    else chosen = one.pushed < two.pushed ? one : two;
  }
  const rough = chosen.line;

  // Measure the line, then pick new points that are all the same distance apart
  const along = [0];
  for (let i = 1; i < rough.length; i++) {
    along.push(along[i - 1] + Math.hypot(rough[i].x - rough[i - 1].x, rough[i].y - rough[i - 1].y));
  }
  const length = along[along.length - 1];
  const count = Math.max(24, Math.round(length / (cell * 0.085)));
  const points = [];
  let k = 0;
  for (let i = 0; i <= count; i++) {
    const want = length * i / count;
    while (k < rough.length - 2 && along[k + 1] < want) k++;
    const span = along[k + 1] - along[k] || 1;
    const part = (want - along[k]) / span;
    points.push({
      x: rough[k].x + (rough[k + 1].x - rough[k].x) * part,
      y: rough[k].y + (rough[k + 1].y - rough[k].y) * part
    });
  }

  // For every point: which way is "sideways" there, and how wide is the body there
  const normals = [], widths = [];
  for (let i = 0; i <= count; i++) {
    const before = points[Math.max(0, i - 1)], after = points[Math.min(count, i + 1)];
    const tx = after.x - before.x, ty = after.y - before.y;
    const tl = Math.hypot(tx, ty) || 1;
    normals.push({ x: -ty / tl, y: tx / tl });
    widths.push(snakeHalfWidth(i / count));
  }

  // The head looks away from the body
  const hx = points[0].x - points[3].x, hy = points[0].y - points[3].y;
  return {
    points: points, normals: normals, widths: widths, count: count, length: length,
    headAngle: Math.atan2(hy, hx),
    look: SNAKE_LOOKS[index % SNAKE_LOOKS.length],
    pattern: index % 3                               // 0 = bands, 1 = diamonds, 2 = spots
  };
}

// Half the width of a snake's body at "t" (0 = head end, 1 = tail tip): thick neck, thin tail
function snakeHalfWidth(t) {
  let w = cell * 0.155 * (1 - 0.62 * t);
  const tip = (1 - t) / 0.16;                       // the last part narrows to a point
  if (tip < 1) w *= Math.pow(tip, 0.8);
  return Math.max(w, cell * 0.012);
}

// Trace the outline of a snake's body. "share" makes it thinner (1 = full width),
// shiftX/shiftY move it a little (used for the shine line).
function traceSnakeBody(g, shape, share, shiftX, shiftY) {
  g.beginPath();
  for (let i = 0; i <= shape.count; i++) {
    const p = shape.points[i], n = shape.normals[i], w = shape.widths[i] * share;
    const x = p.x + n.x * w + shiftX, y = p.y + n.y * w + shiftY;
    if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
  }
  for (let i = shape.count; i >= 0; i--) {
    const p = shape.points[i], n = shape.normals[i], w = shape.widths[i] * share;
    g.lineTo(p.x - n.x * w + shiftX, p.y - n.y * w + shiftY);
  }
  g.closePath();
}

// Trace the egg shape of a snake's head. The head is drawn "looking right", around (0, 0);
// the canvas is turned first so it looks the right way.
function traceSnakeHead(g, headLong, headWide) {
  g.beginPath();
  g.moveTo(headLong, 0);
  g.bezierCurveTo(headLong, -headWide * 0.72, headLong * 0.35, -headWide, -headLong * 0.2, -headWide);
  g.bezierCurveTo(-headLong * 0.75, -headWide, -headLong, -headWide * 0.55, -headLong, 0);
  g.bezierCurveTo(-headLong, headWide * 0.55, -headLong * 0.75, headWide, -headLong * 0.2, headWide);
  g.bezierCurveTo(headLong * 0.35, headWide, headLong, headWide * 0.72, headLong, 0);
  g.closePath();
}

// Paint a snake's head: tongue, face, eyes, nostrils and smile.
//   awake = 0 for the normal picture. From 0 to 1 the eyes open wide and the tongue flicks out
//   (used for a moment when the snake catches a piece).
function drawSnakeHead(g, shape, awake, now) {
  const look = shape.look;
  const headLong = cell * 0.36, headWide = cell * 0.285;
  const p = shape.points[0];
  const angle = shape.headAngle;

  g.save();
  g.translate(p.x, p.y);
  g.rotate(angle);
  g.lineCap = 'round';
  g.lineJoin = 'round';

  // Red forked tongue, sticking out of the front of the mouth
  const flick = awake > 0 ? Math.sin(now * 0.035) * 0.35 * awake : 0;
  const tongue = cell * (0.17 + 0.2 * awake);
  const fork = cell * 0.09;
  g.save();
  g.translate(headLong * 0.9, 0);
  g.rotate(flick);
  for (let pass = 0; pass < 2; pass++) {
    g.strokeStyle = pass === 0 ? '#7d0f18' : '#f0323f';       // dark edge first, then red on top
    g.lineWidth = cell * (pass === 0 ? 0.075 : 0.045);
    g.beginPath();
    g.moveTo(0, 0);
    g.lineTo(tongue, 0);
    g.lineTo(tongue + fork, -fork * 0.75);
    g.moveTo(tongue, 0);
    g.lineTo(tongue + fork, fork * 0.75);
    g.stroke();
  }
  g.restore();

  // Head: dark edge, then a rounded face that is lighter in the middle
  traceSnakeHead(g, headLong, headWide);
  g.strokeStyle = '#1b1320';
  g.lineWidth = cell * 0.06;
  g.stroke();
  const face = g.createRadialGradient(headLong * 0.1, 0, headWide * 0.1, 0, 0, headLong * 1.05);
  face.addColorStop(0, look.light);
  face.addColorStop(0.45, look.main);
  face.addColorStop(1, look.dark);
  g.fillStyle = face;
  g.fill();

  // A small mark on the top of the head, in the pattern colour
  g.fillStyle = look.mark;
  g.globalAlpha = 0.45;
  g.beginPath();
  g.ellipse(-headLong * 0.62, 0, headLong * 0.2, headWide * 0.34, 0, 0, Math.PI * 2);
  g.fill();
  g.globalAlpha = 1;

  // Smile: a curved line around the front of the snout
  g.strokeStyle = 'rgba(40,12,20,0.75)';
  g.lineWidth = cell * 0.03;
  g.beginPath();
  g.arc(headLong * 0.12, 0, headLong * 0.66, -0.8, 0.8);
  g.stroke();

  // Nostrils
  g.fillStyle = 'rgba(30,10,16,0.8)';
  for (const side of [-1, 1]) {
    g.beginPath();
    g.arc(headLong * 0.74, side * headWide * 0.17, cell * 0.02, 0, Math.PI * 2);
    g.fill();
  }

  // Two friendly eyes: white, with a dark pupil that looks forward and a tiny shine
  const eyeSize = cell * 0.105 * (1 + 0.3 * awake);
  for (const side of [-1, 1]) {
    const ex = -headLong * 0.05, ey = side * headWide * 0.58;
    g.beginPath();
    g.arc(ex, ey, eyeSize, 0, Math.PI * 2);
    g.fillStyle = '#ffffff';
    g.fill();
    g.strokeStyle = '#1b1320';
    g.lineWidth = cell * 0.028;
    g.stroke();
    g.beginPath();
    g.arc(ex + eyeSize * 0.28, ey, eyeSize * 0.56, 0, Math.PI * 2);
    g.fillStyle = '#16121c';
    g.fill();
    // The shine sits up-left on the screen. The head is turned, so turn that direction back.
    const sx = Math.cos(-angle - 2.35) * eyeSize * 0.3, sy = Math.sin(-angle - 2.35) * eyeSize * 0.3;
    g.beginPath();
    g.arc(ex + eyeSize * 0.28 + sx, ey + sy, eyeSize * 0.2, 0, Math.PI * 2);
    g.fillStyle = '#ffffff';
    g.fill();
  }
  g.restore();
}

// Paint one whole snake onto the board picture
function drawSnake(g, shape, dpr) {
  const look = shape.look;
  const headLong = cell * 0.36, headWide = cell * 0.285;
  const head = shape.points[0];

  // 1. A soft shadow under the body and the head, so the snake sits above the board
  g.save();
  g.shadowColor = 'rgba(30,15,5,0.5)';
  g.shadowBlur = cell * 0.13 * dpr;
  g.shadowOffsetX = cell * 0.04 * dpr;
  g.shadowOffsetY = cell * 0.09 * dpr;
  g.fillStyle = '#1b1320';
  traceSnakeBody(g, shape, 1, 0, 0);
  g.fill();
  g.translate(head.x, head.y);
  g.rotate(shape.headAngle);
  traceSnakeHead(g, headLong, headWide);
  g.fill();
  g.restore();

  // 2. Dark outline all around the body
  g.lineJoin = 'round';
  g.strokeStyle = '#1b1320';
  g.lineWidth = cell * 0.06;
  traceSnakeBody(g, shape, 1, 0, 0);
  g.stroke();

  // 3. The body: dark at the edges, the main colour in the middle. This makes it look round.
  g.fillStyle = look.dark;
  g.fill();
  g.save();
  g.clip();                                         // everything below stays inside the body
  g.fillStyle = look.main;
  traceSnakeBody(g, shape, 0.72, -cell * 0.008, -cell * 0.012);
  g.fill();

  // 4. The pattern along the back. Each snake gets bands, diamonds or spots.
  g.fillStyle = look.mark;
  g.globalAlpha = 0.6;
  const P = shape.points, N = shape.normals, W = shape.widths;
  if (shape.pattern === 0) {
    for (let i = 6; i < shape.count - 2; i += 5) {              // bands across the body
      const j = i + 2;
      g.beginPath();
      g.moveTo(P[i].x + N[i].x * W[i], P[i].y + N[i].y * W[i]);
      g.lineTo(P[j].x + N[j].x * W[j], P[j].y + N[j].y * W[j]);
      g.lineTo(P[j].x - N[j].x * W[j], P[j].y - N[j].y * W[j]);
      g.lineTo(P[i].x - N[i].x * W[i], P[i].y - N[i].y * W[i]);
      g.closePath();
      g.fill();
    }
  } else if (shape.pattern === 1) {
    for (let i = 7; i < shape.count - 3; i += 5) {              // diamonds along the back
      const a = i - 2, b = i + 2, w = W[i] * 0.86;
      g.beginPath();
      g.moveTo(P[a].x, P[a].y);
      g.lineTo(P[i].x + N[i].x * w, P[i].y + N[i].y * w);
      g.lineTo(P[b].x, P[b].y);
      g.lineTo(P[i].x - N[i].x * w, P[i].y - N[i].y * w);
      g.closePath();
      g.fill();
    }
  } else {
    let side = 1;
    for (let i = 6; i < shape.count - 2; i += 3) {              // spots, left and right in turn
      const w = W[i];
      g.beginPath();
      g.arc(P[i].x + N[i].x * w * 0.38 * side, P[i].y + N[i].y * w * 0.38 * side, w * 0.42, 0, Math.PI * 2);
      g.fill();
      side = -side;
    }
  }

  // 5. A light stripe of shine along the back, a little to the upper-left (where the light comes from)
  g.globalAlpha = 0.5;
  g.fillStyle = look.light;
  traceSnakeBody(g, shape, 0.26, -cell * 0.03, -cell * 0.04);
  g.fill();
  g.restore();

  // 6. The head goes on top
  drawSnakeHead(g, shape, 0, 0);
}

// ----- Ladders -----
function buildLadderShape(index) {
  const a = squareCentre(LADDERS[index][0]);
  const b = squareCentre(LADDERS[index][1]);
  return { a: a, b: b, length: Math.hypot(b.x - a.x, b.y - a.y), angle: Math.atan2(b.y - a.y, b.x - a.x) };
}

// Paint one wooden ladder. The canvas is turned so the ladder can be drawn lying flat, left to right:
// the foot is at x = 0 and the top is at x = length. The two rails run along it at y = -half and y = +half.
function drawLadder(g, shape, dpr, rnd) {
  const half = cell * 0.2;                          // from the middle line to each rail
  const rail = cell * 0.1;                          // thickness of a rail
  const rung = cell * 0.08;                         // thickness of a rung
  const over = cell * 0.24;                         // the rails stick out a little past both squares
  const x0 = -over, x1 = shape.length + over;
  const rungCount = Math.max(2, Math.round(shape.length / (cell * 0.36)));

  // Where does the light come from (the upper-left of the screen) once the ladder is turned?
  // lightSide is -1 or 1: which edge of a rail or rung gets the light line.
  const lightSide = (Math.sin(shape.angle) - Math.cos(shape.angle)) < 0 ? -1 : 1;
  const lightEnd  = (-Math.cos(shape.angle) - Math.sin(shape.angle)) < 0 ? -1 : 1;

  g.save();
  g.translate(shape.a.x, shape.a.y);
  g.rotate(shape.angle);
  g.lineCap = 'round';

  // 1. Soft shadow of the whole ladder
  g.save();
  g.shadowColor = 'rgba(30,15,5,0.5)';
  g.shadowBlur = cell * 0.11 * dpr;
  g.shadowOffsetX = cell * 0.05 * dpr;
  g.shadowOffsetY = cell * 0.09 * dpr;
  g.strokeStyle = '#3d220c';
  g.lineWidth = rail;
  for (const side of [-1, 1]) {
    g.beginPath();
    g.moveTo(x0, side * half);
    g.lineTo(x1, side * half);
    g.stroke();
  }
  g.lineWidth = rung;
  for (let i = 0; i < rungCount; i++) {
    const x = shape.length * (i + 0.5) / rungCount;
    g.beginPath();
    g.moveTo(x, -half);
    g.lineTo(x, half);
    g.stroke();
  }
  g.restore();

  // 2. Rungs: dark edge, wood colour, a light line on the lit side
  for (let i = 0; i < rungCount; i++) {
    const x = shape.length * (i + 0.5) / rungCount;
    g.strokeStyle = '#4a2a10';
    g.lineWidth = rung + cell * 0.045;
    g.beginPath(); g.moveTo(x, -half); g.lineTo(x, half); g.stroke();
    g.strokeStyle = '#d9a05c';
    g.lineWidth = rung;
    g.beginPath(); g.moveTo(x, -half); g.lineTo(x, half); g.stroke();
    g.strokeStyle = 'rgba(255,236,190,0.75)';
    g.lineWidth = rung * 0.3;
    g.beginPath(); g.moveTo(x + lightEnd * rung * 0.25, -half); g.lineTo(x + lightEnd * rung * 0.25, half); g.stroke();
  }

  // 3. Rails: dark edge, wood, a shaded side, a lit side, and a few grain lines
  for (const side of [-1, 1]) {
    const y = side * half;
    g.strokeStyle = '#4a2a10';
    g.lineWidth = rail + cell * 0.05;
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.strokeStyle = '#c4853f';
    g.lineWidth = rail;
    g.beginPath(); g.moveTo(x0, y); g.lineTo(x1, y); g.stroke();
    g.lineCap = 'butt';
    g.strokeStyle = 'rgba(110,62,22,0.55)';                       // shaded side
    g.lineWidth = rail * 0.3;
    g.beginPath(); g.moveTo(x0, y - lightSide * rail * 0.33); g.lineTo(x1, y - lightSide * rail * 0.33); g.stroke();
    g.strokeStyle = 'rgba(255,226,170,0.8)';                      // lit side
    g.lineWidth = rail * 0.28;
    g.beginPath(); g.moveTo(x0, y + lightSide * rail * 0.26); g.lineTo(x1, y + lightSide * rail * 0.26); g.stroke();
    g.strokeStyle = 'rgba(96,54,18,0.35)';                        // short grain lines
    g.lineWidth = Math.max(0.5, rail * 0.1);
    for (let k = 0; k < rungCount * 2; k++) {
      const gx = x0 + rnd() * (x1 - x0 - cell * 0.4);
      const gy = y + (rnd() - 0.5) * rail * 0.5;
      g.beginPath(); g.moveTo(gx, gy); g.lineTo(gx + cell * (0.15 + rnd() * 0.25), gy); g.stroke();
    }
    g.lineCap = 'round';
  }

  // 4. A nail where every rung meets a rail
  for (let i = 0; i < rungCount; i++) {
    const x = shape.length * (i + 0.5) / rungCount;
    for (const side of [-1, 1]) {
      g.fillStyle = '#3a2410';
      g.beginPath(); g.arc(x, side * half, cell * 0.026, 0, Math.PI * 2); g.fill();
      g.fillStyle = 'rgba(255,240,210,0.8)';
      g.beginPath(); g.arc(x - cell * 0.008, side * half - cell * 0.008, cell * 0.01, 0, Math.PI * 2); g.fill();
    }
  }
  g.restore();
}

// ----- The board -----
// Paint the whole board: frame, squares, ladders, snakes, then the numbers on top
function buildBoardImage(dpr) {
  const inner = cell * 10;
  const made = makeHiddenCanvas(boardSize, boardSize, dpr);
  const g = made.g;
  const rnd = makeRandom(20251);

  // Wooden frame: warm brown, lighter at the top-left, with grain lines
  const wood = g.createLinearGradient(0, 0, boardSize, boardSize);
  wood.addColorStop(0, '#a56a32');
  wood.addColorStop(0.5, '#8a5526');
  wood.addColorStop(1, '#6b3f18');
  g.fillStyle = wood;
  roundedRect(g, 0, 0, boardSize, boardSize, edge * 0.8);
  g.fill();
  g.save();
  roundedRect(g, 0, 0, boardSize, boardSize, edge * 0.8);
  g.clip();
  drawGrain(g, 0, 0, boardSize, boardSize, 46, 'rgba(60,30,8,0.35)', rnd);
  drawGrain(g, 0, 0, boardSize, boardSize, 18, 'rgba(255,220,160,0.22)', rnd);
  g.restore();
  // Light line on the outside edge, dark line where the frame meets the squares
  g.strokeStyle = 'rgba(255,225,170,0.45)';
  g.lineWidth = 1;
  roundedRect(g, 0.75, 0.75, boardSize - 1.5, boardSize - 1.5, edge * 0.75);
  g.stroke();
  // A thin gold line around the middle of the frame
  g.strokeStyle = 'rgba(244,211,94,0.55)';
  g.lineWidth = Math.max(0.75, edge * 0.08);
  roundedRect(g, edge * 0.45, edge * 0.45, boardSize - edge * 0.9, boardSize - edge * 0.9, edge * 0.4);
  g.stroke();
  // Gold studs in the four corners
  for (const cx of [edge * 0.5, boardSize - edge * 0.5]) {
    for (const cy of [edge * 0.5, boardSize - edge * 0.5]) {
      const stud = g.createRadialGradient(cx - edge * 0.1, cy - edge * 0.1, 0, cx, cy, edge * 0.34);
      stud.addColorStop(0, '#fff3b8');
      stud.addColorStop(0.5, '#f4d35e');
      stud.addColorStop(1, '#a8801e');
      g.fillStyle = stud;
      g.beginPath();
      g.arc(cx, cy, edge * 0.32, 0, Math.PI * 2);
      g.fill();
      g.strokeStyle = 'rgba(70,40,10,0.7)';
      g.lineWidth = 0.75;
      g.stroke();
    }
  }

  // The dark sunken bed that the squares sit in
  g.fillStyle = '#3b2613';
  g.fillRect(edge - 1.5, edge - 1.5, inner + 3, inner + 3);

  // The 100 squares
  for (let n = 1; n <= 100; n++) {
    const place = squareToRowCol(n);
    const x = edge + place.col * cell, y = edge + place.row * cell;
    const gap = 0.6, size = cell - gap * 2, radius = cell * 0.1;

    // Colour: five pastel colours in a diagonal pattern. Square 100 is gold.
    g.fillStyle = n === 100 ? '#f7c948' : TILE_COLOURS[(place.col + place.row * 2) % TILE_COLOURS.length];
    roundedRect(g, x + gap, y + gap, size, size, radius);
    g.fill();

    // Light from the upper-left: a soft white-to-dark wash over the colour
    const wash = g.createLinearGradient(x, y, x + cell, y + cell);
    wash.addColorStop(0, 'rgba(255,255,255,0.42)');
    wash.addColorStop(0.5, 'rgba(255,255,255,0.05)');
    wash.addColorStop(1, 'rgba(120,70,20,0.16)');
    g.fillStyle = wash;
    g.fill();

    // Bevel: a light line inside the top and left edges, a dark one inside the bottom and right
    const inset = gap + Math.max(0.75, cell * 0.035);
    g.lineWidth = Math.max(0.75, cell * 0.035);
    g.strokeStyle = 'rgba(255,255,255,0.7)';
    g.beginPath();
    g.moveTo(x + inset, y + cell - inset - radius);
    g.lineTo(x + inset, y + inset + radius * 0.6);
    g.quadraticCurveTo(x + inset, y + inset, x + inset + radius * 0.6, y + inset);
    g.lineTo(x + cell - inset - radius, y + inset);
    g.stroke();
    g.strokeStyle = 'rgba(90,50,15,0.22)';
    g.beginPath();
    g.moveTo(x + cell - inset, y + inset + radius);
    g.lineTo(x + cell - inset, y + cell - inset - radius * 0.6);
    g.quadraticCurveTo(x + cell - inset, y + cell - inset, x + cell - inset - radius * 0.6, y + cell - inset);
    g.lineTo(x + inset + radius, y + cell - inset);
    g.stroke();
  }

  // Paper grain: many tiny faint specks over all the squares, like printed card
  for (let i = 0; i < 2600; i++) {
    g.fillStyle = rnd() < 0.5 ? 'rgba(255,255,255,0.10)' : 'rgba(90,60,20,0.06)';
    const s = 0.5 + rnd() * 1.1;
    g.fillRect(edge + rnd() * inner, edge + rnd() * inner, s, s);
  }

  // Square 1: a green "START" word. Square 100: a big star and the word "WIN".
  const first = squareCentre(1), last = squareCentre(100);
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.font = '800 ' + (cell * 0.23).toFixed(1) + 'px system-ui, sans-serif';
  g.fillStyle = '#1f8a4c';
  g.fillText('START', first.x, first.y + cell * 0.3);
  starPath(g, last.x + cell * 0.12, last.y - cell * 0.02, cell * 0.27, cell * 0.12, 5);
  g.fillStyle = '#fff6c9';
  g.fill();
  g.strokeStyle = '#b07a10';
  g.lineWidth = Math.max(0.75, cell * 0.035);
  g.lineJoin = 'round';
  g.stroke();
  g.fillStyle = '#8a5a00';
  g.fillText('WIN', last.x, last.y + cell * 0.33);

  // Ladders first, then the snakes on top of them
  ladderShapes = LADDERS.map((ladder, i) => buildLadderShape(i));
  snakeShapes = SNAKES.map((snake, i) => buildSnakeShape(i));
  for (const shape of ladderShapes) drawLadder(g, shape, dpr, rnd);
  for (const shape of snakeShapes) drawSnake(g, shape, dpr);

  // The numbers go on last, so a snake or a ladder never hides one.
  // Each number has a pale outline, so it can be read on top of anything.
  g.textAlign = 'left';
  g.textBaseline = 'top';
  g.font = '800 ' + (cell * 0.29).toFixed(1) + 'px system-ui, sans-serif';
  g.lineJoin = 'round';
  g.lineWidth = cell * 0.09;
  for (let n = 1; n <= 100; n++) {
    const place = squareToRowCol(n);
    const x = edge + place.col * cell + cell * 0.1, y = edge + place.row * cell + cell * 0.09;
    g.strokeStyle = 'rgba(255,252,240,0.92)';
    g.strokeText(String(n), x, y);
    g.fillStyle = '#3a2814';
    g.fillText(String(n), x, y);
  }

  boardImage = made.canvas;
}

// ----- Pieces -----
// Paint one playing piece (a shiny pawn seen a little from above). "unit" is the size of one square.
function paintToken(g, look, cx, footY, unit) {
  // Shadow on the board under the piece
  g.save();
  g.translate(cx + unit * 0.05, footY + unit * 0.02);
  g.scale(1, 0.38);
  const shadow = g.createRadialGradient(0, 0, 0, 0, 0, unit * 0.36);
  shadow.addColorStop(0, 'rgba(0,0,0,0.5)');
  shadow.addColorStop(0.6, 'rgba(0,0,0,0.3)');
  shadow.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = shadow;
  g.beginPath();
  g.arc(0, 0, unit * 0.36, 0, Math.PI * 2);
  g.fill();
  g.restore();

  const baseR = unit * 0.26;                        // half the width of the foot
  const neckY = footY - unit * 0.46;                // where the body meets the head
  const headY = footY - unit * 0.6, headR = unit * 0.165;

  // Body: wide round foot, curving in to a thin neck
  g.beginPath();
  g.moveTo(cx - baseR, footY - unit * 0.03);
  g.lineTo(cx - baseR, footY - unit * 0.08);
  g.bezierCurveTo(cx - baseR * 0.95, footY - unit * 0.2, cx - unit * 0.09, footY - unit * 0.28, cx - unit * 0.075, neckY);
  g.lineTo(cx + unit * 0.075, neckY);
  g.bezierCurveTo(cx + unit * 0.09, footY - unit * 0.28, cx + baseR * 0.95, footY - unit * 0.2, cx + baseR, footY - unit * 0.08);
  g.lineTo(cx + baseR, footY - unit * 0.03);
  g.ellipse(cx, footY - unit * 0.03, baseR, unit * 0.09, 0, 0, Math.PI);
  g.closePath();
  const body = g.createLinearGradient(cx - baseR, 0, cx + baseR, 0);
  body.addColorStop(0, look.main);
  body.addColorStop(0.3, look.light);
  body.addColorStop(0.55, look.main);
  body.addColorStop(1, look.dark);
  g.fillStyle = body;
  g.fill();
  g.strokeStyle = look.dark;
  g.lineWidth = Math.max(1, unit * 0.035);
  g.lineJoin = 'round';
  g.stroke();
  // A light rim line around the top of the foot
  g.strokeStyle = 'rgba(255,255,255,0.4)';
  g.lineWidth = Math.max(0.6, unit * 0.02);
  g.beginPath();
  g.ellipse(cx, footY - unit * 0.1, baseR * 0.9, unit * 0.07, 0, 0.25, Math.PI - 0.25);
  g.stroke();

  // Collar between body and head
  g.beginPath();
  g.ellipse(cx, neckY, unit * 0.115, unit * 0.045, 0, 0, Math.PI * 2);
  g.fillStyle = look.main;
  g.fill();
  g.strokeStyle = look.dark;
  g.lineWidth = Math.max(0.8, unit * 0.028);
  g.stroke();

  // Head: a glossy ball
  const ball = g.createRadialGradient(cx - headR * 0.35, headY - headR * 0.4, headR * 0.05, cx, headY, headR);
  ball.addColorStop(0, '#ffffff');
  ball.addColorStop(0.25, look.light);
  ball.addColorStop(0.65, look.main);
  ball.addColorStop(1, look.dark);
  g.beginPath();
  g.arc(cx, headY, headR, 0, Math.PI * 2);
  g.fillStyle = ball;
  g.fill();
  g.strokeStyle = look.dark;
  g.lineWidth = Math.max(1, unit * 0.035);
  g.stroke();
  // Small white glint on the head
  g.fillStyle = 'rgba(255,255,255,0.85)';
  g.beginPath();
  g.ellipse(cx - headR * 0.4, headY - headR * 0.45, headR * 0.26, headR * 0.16, -0.6, 0, Math.PI * 2);
  g.fill();
}

function buildTokenImage(lookIndex, dpr) {
  tokenW = cell * 1.0;
  tokenH = cell * 1.1;
  tokenFootY = tokenH * 0.84;
  const made = makeHiddenCanvas(tokenW, tokenH, dpr);
  paintToken(made.g, PLAYER_LOOKS[lookIndex], tokenW / 2, tokenFootY, cell);
  return made.canvas;
}

// ----- The die -----
// Where the dots go on each face. 0, 1, 2 mean left/top, middle, right/bottom.
const PIPS = {
  1: [[1, 1]],
  2: [[0, 0], [2, 2]],
  3: [[0, 0], [1, 1], [2, 2]],
  4: [[0, 0], [2, 0], [0, 2], [2, 2]],
  5: [[0, 0], [2, 0], [1, 1], [0, 2], [2, 2]],
  6: [[0, 0], [2, 0], [0, 1], [2, 1], [0, 2], [2, 2]]
};

// Paint a die face of width "size" at (x, y) on any canvas
function paintDie(g, face, x, y, size, dpr) {
  const radius = size * 0.2;
  const depth = size * 0.07;                        // the bit of the die's side that shows at the bottom

  // Soft shadow, and the side of the die
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.55)';
  g.shadowBlur = size * 0.14 * dpr;
  g.shadowOffsetY = size * 0.07 * dpr;
  const sideColour = g.createLinearGradient(x, y, x + size, y);
  sideColour.addColorStop(0, '#b4b9cd');
  sideColour.addColorStop(1, '#8d92ab');
  g.fillStyle = sideColour;
  roundedRect(g, x, y + depth, size, size - depth, radius);
  g.fill();
  g.restore();

  // Top face: white, a little grey toward the lower-right
  const top = size - depth;
  const white = g.createLinearGradient(x, y, x + size, y + top);
  white.addColorStop(0, '#ffffff');
  white.addColorStop(0.55, '#f1f2f7');
  white.addColorStop(1, '#d5d8e5');
  g.fillStyle = white;
  roundedRect(g, x, y, size, top, radius);
  g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.9)';
  g.lineWidth = Math.max(1, size * 0.02);
  roundedRect(g, x + size * 0.03, y + size * 0.03, size * 0.94, top - size * 0.06, radius * 0.85);
  g.stroke();
  g.strokeStyle = 'rgba(70,76,105,0.55)';
  g.lineWidth = Math.max(0.75, size * 0.012);
  roundedRect(g, x, y, size, top, radius);
  g.stroke();

  // The dots: dark, slightly sunk in, with a tiny shine
  const pip = size * 0.088;
  for (const [col, row] of PIPS[face]) {
    const px = x + size * (0.26 + col * 0.24), py = y + top * (0.26 + row * 0.24);
    g.fillStyle = 'rgba(255,255,255,0.9)';          // light lower rim = looks pressed in
    g.beginPath(); g.arc(px, py + size * 0.012, pip, 0, Math.PI * 2); g.fill();
    const dark = g.createRadialGradient(px - pip * 0.3, py - pip * 0.3, 0, px, py, pip);
    dark.addColorStop(0, face === 1 ? '#e04a4a' : '#444c74');
    dark.addColorStop(1, face === 1 ? '#8f1c1c' : '#141931');
    g.fillStyle = dark;
    g.beginPath(); g.arc(px, py, pip, 0, Math.PI * 2); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.4)';
    g.beginPath(); g.arc(px - pip * 0.3, py - pip * 0.35, pip * 0.25, 0, Math.PI * 2); g.fill();
  }
}

function buildDieImage(face, dpr) {
  const pad = dieSize * 0.25;                       // room around the die for its shadow
  const made = makeHiddenCanvas(dieSize + pad * 2, dieSize + pad * 2, dpr);
  paintDie(made.g, face, pad, pad, dieSize, dpr);
  return made.canvas;
}

// A faint batik-style flower pattern for the page background (very low contrast)
function buildBackgroundPattern() {
  const size = 96;
  const made = makeHiddenCanvas(size, size, 2);
  const g = made.g;
  g.strokeStyle = 'rgba(255,255,255,0.035)';
  g.fillStyle = 'rgba(255,255,255,0.03)';
  g.lineWidth = 1.2;
  // One flower in the middle and a quarter flower in each corner (so the tiles join up)
  for (const [cx, cy] of [[size / 2, size / 2], [0, 0], [size, 0], [0, size], [size, size]]) {
    for (let petal = 0; petal < 8; petal++) {
      g.save();
      g.translate(cx, cy);
      g.rotate(petal * Math.PI / 4);
      g.beginPath();
      g.moveTo(0, -5);
      g.bezierCurveTo(7, -12, 5, -22, 0, -26);
      g.bezierCurveTo(-5, -22, -7, -12, 0, -5);
      g.stroke();
      g.restore();
    }
    g.beginPath();
    g.arc(cx, cy, 3.5, 0, Math.PI * 2);
    g.fill();
  }
  // Small dots between the flowers
  for (const [cx, cy] of [[size / 2, 0], [0, size / 2], [size, size / 2], [size / 2, size]]) {
    g.beginPath();
    g.arc(cx, cy, 2.2, 0, Math.PI * 2);
    g.fill();
    g.beginPath();
    g.arc(cx, cy, 7, 0, Math.PI * 2);
    g.stroke();
  }
  try {
    appBox.style.backgroundImage = 'url(' + made.canvas.toDataURL() + ')';
    appBox.style.backgroundSize = size + 'px ' + size + 'px';
  } catch (e) { /* no pattern: the plain background still looks fine */ }
}

// The little picture on the start screen: a ladder, a snake and a die
function paintLogo(dpr) {
  const w = logoCanvas.clientWidth || 150, h = logoCanvas.clientHeight || 96;
  logoCanvas.width = Math.round(w * dpr);
  logoCanvas.height = Math.round(h * dpr);
  const g = logoCanvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The snake and ladder painters use the game's "cell" and "edge" sizes, so borrow them for a moment
  const keepCell = cell, keepEdge = edge;
  cell = h * 0.42;
  edge = -cell * 5;                                 // makes the "keep it on the board" limits very wide
  const rnd = makeRandom(7);
  drawLadder(g, { a: { x: w * 0.2, y: h * 0.84 }, b: { x: w * 0.38, y: h * 0.2 },
                  length: Math.hypot(w * 0.18, h * 0.64), angle: Math.atan2(-h * 0.64, w * 0.18) }, dpr, rnd);
  // A short green snake, made by hand from a wavy line
  const points = [], normals = [], widths = [];
  const count = 40;
  for (let i = 0; i <= count; i++) {
    const t = i / count;
    points.push({ x: w * 0.56 + Math.sin(t * Math.PI * 2) * w * 0.1 + t * w * 0.02, y: h * 0.3 + t * h * 0.56 });
  }
  for (let i = 0; i <= count; i++) {
    const before = points[Math.max(0, i - 1)], after = points[Math.min(count, i + 1)];
    const tl = Math.hypot(after.x - before.x, after.y - before.y) || 1;
    normals.push({ x: -(after.y - before.y) / tl, y: (after.x - before.x) / tl });
    widths.push(snakeHalfWidth(i / count));
  }
  drawSnake(g, {
    points: points, normals: normals, widths: widths, count: count,
    headAngle: Math.atan2(points[0].y - points[3].y, points[0].x - points[3].x),
    look: SNAKE_LOOKS[0], pattern: 1
  }, dpr);
  cell = keepCell;
  edge = keepEdge;

  // The die, tilted a little
  g.save();
  g.translate(w * 0.84, h * 0.62);
  g.rotate(0.22);
  paintDie(g, 5, -h * 0.19, -h * 0.19, h * 0.38, dpr);
  g.restore();
}

// The big piece on the winner card
function paintWinToken(lookIndex) {
  const dpr = window.devicePixelRatio || 1;
  const w = 96, h = 110;
  winToken.width = Math.round(w * dpr);
  winToken.height = Math.round(h * dpr);
  const g = winToken.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintToken(g, PLAYER_LOOKS[lookIndex], w / 2, h * 0.86, 100);
}

// A soft round glow that fades out to nothing at its edge
function buildGlowImage(lookIndex, dpr) {
  const size = dieSize * 1.9;
  const made = makeHiddenCanvas(size, size, dpr);
  const g = made.g;
  const light = g.createRadialGradient(size / 2, size / 2, dieSize * 0.3, size / 2, size / 2, size / 2);
  light.addColorStop(0, PLAYER_LOOKS[lookIndex].main);
  light.addColorStop(0.55, PLAYER_LOOKS[lookIndex].main);
  light.addColorStop(1, 'rgba(0,0,0,0)');
  g.globalAlpha = 0.9;
  g.fillStyle = light;
  g.fillRect(0, 0, size, size);
  return made.canvas;
}

function buildPictures(dpr) {
  buildBoardImage(dpr);
  tokenImages = PLAYER_LOOKS.map((look, i) => buildTokenImage(i, dpr));
  dieImages = [null];
  for (let face = 1; face <= 6; face++) dieImages.push(buildDieImage(face, dpr));
  glowImages = PLAYER_LOOKS.map((look, i) => buildGlowImage(i, dpr));
}

// ---------- Effects: sparkles, floating words, confetti ----------
function addParticle(x, y, vx, vy, life, size, colour, star) {
  if (particles.length + confetti.length >= MAX_PARTICLES) return;
  particles.push({ x: x, y: y, vx: vx, vy: vy, life: life, maxLife: life, size: size, colour: colour, star: star });
}

// A small burst of bits flying out from one point. star = true makes little stars, false makes dust.
function burst(x, y, count, colours, star) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = cell * (1.5 + Math.random() * 3);
    addParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed - cell,
                0.45 + Math.random() * 0.4, cell * (0.07 + Math.random() * 0.08),
                colours[i % colours.length], star);
  }
  keepAnimating();
}

// Words that float up from the board and fade away
function addFloater(text, x, y, colour) {
  floaters.push({ text: text, x: x, y: Math.max(cell * 0.9, y), colour: colour, start: performance.now(), life: 1300 });
  if (floaters.length > 6) floaters.shift();
  keepAnimating();
}

// Confetti falls over the whole page when somebody wins
function throwConfetti() {
  const colours = ['#f4d35e', '#4dd4ac', '#ff6b6b', '#6fb7ff', '#ffffff', '#c792ff'];
  const width = window.innerWidth, height = window.innerHeight;
  for (let i = 0; i < CONFETTI_COUNT; i++) {
    if (particles.length + confetti.length >= MAX_PARTICLES) break;
    confetti.push({
      x: Math.random() * width,
      y: -20 - Math.random() * height * 0.5,      // they start above the screen, spread out
      vx: (Math.random() - 0.5) * 60,
      vy: 140 + Math.random() * 160,
      spin: Math.random() * Math.PI * 2,
      spinSpeed: (Math.random() - 0.5) * 10,
      w: 6 + Math.random() * 5,
      h: 9 + Math.random() * 6,
      colour: colours[i % colours.length]
    });
  }
  keepAnimating();
}

// A smooth start and a smooth stop: turns a steady 0-to-1 count into a gentle one
function easeInOut(t) {
  return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
}

// Move the travelling piece along its current segment
function updateMover(now) {
  const segment = mover.segments[mover.index];
  const player = mover.player;
  const t = Math.min(1, (now - mover.segStart) / segment.dur);

  if (segment.type === 'hop') {
    // Straight line to the next square, with a little arc upward
    player.x = segment.from.x + (segment.to.x - segment.from.x) * t;
    player.y = segment.from.y + (segment.to.y - segment.from.y) * t;
    player.lift = Math.sin(t * Math.PI) * cell * HOP_HEIGHT;
  }
  if (segment.type === 'ladder') {
    // Up along the ladder, with a small bob for every step, a note and a sparkle
    const e = easeInOut(t);
    player.x = segment.from.x + (segment.to.x - segment.from.x) * e;
    player.y = segment.from.y + (segment.to.y - segment.from.y) * e;
    player.lift = Math.abs(Math.sin(t * Math.PI * segment.steps)) * cell * 0.1;
    const step = Math.floor(t * segment.steps);
    if (step > segment.lastStep && step < segment.steps) {
      segment.lastStep = step;
      sfx.ladderStep(step);
      addParticle(player.x + (Math.random() - 0.5) * cell * 0.6, player.y - cell * 0.4,
                  (Math.random() - 0.5) * cell, -cell * 0.6, 0.5, cell * 0.11, '#fff2a0', true);
    }
  }
  if (segment.type === 'bite') {
    // Caught! The piece trembles on the snake's head for a moment
    player.x = segment.from.x + Math.sin(now * 0.07) * cell * 0.05;
    player.y = segment.from.y;
  }
  if (segment.type === 'slide') {
    // Slide along the snake's own body line, from the head to the tip of the tail
    const shape = snakeShapes[segment.index];
    const e = easeInOut(t);
    const place = e * shape.count;
    const i = Math.min(shape.count - 1, Math.floor(place));
    const part = place - i;
    const bx = shape.points[i].x + (shape.points[i + 1].x - shape.points[i].x) * part;
    const by = shape.points[i].y + (shape.points[i + 1].y - shape.points[i].y) * part + cell * 0.24;
    // Blend in from where the piece stood and out to where it will stand, so nothing jumps
    const blendIn = Math.min(1, t / 0.12), blendOut = Math.max(0, (t - 0.9) / 0.1);
    let x = segment.from.x + (bx - segment.from.x) * blendIn;
    let y = segment.from.y + (by - segment.from.y) * blendIn;
    x += (segment.to.x - x) * blendOut;
