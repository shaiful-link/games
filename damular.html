    y += (segment.to.y - y) * blendOut;
    player.x = x;
    player.y = y;
    player.spin = Math.sin(t * Math.PI * 7) * 0.4 * (1 - blendOut);    // wobble from side to side
  }

  if (t >= 1) {
    finishSegment(segment, now);
    mover.index++;
    if (mover.index < mover.segments.length) {
      mover.segStart = now;
      beginSegment(mover.segments[mover.index]);
    } else {
      mover = null;
      afterMove();
    }
  }
}

// Move every effect forward by a small step of time (dt, in seconds)
function update(now, dt) {
  // The die: show a new random face every few moments, then stop on the real number
  if (dice.rolling) {
    const elapsed = now - dice.start;
    const tick = Math.floor(elapsed / DICE_FACE_MS);
    if (tick !== dice.tick) {
      dice.tick = tick;
      dice.face = 1 + (dice.face + Math.floor(Math.random() * 5)) % 6;   // always a different face
      sfx.rattle();
    }
    if (elapsed >= DICE_ROLL_MS) {
      dice.rolling = false;
      dice.face = dice.result;
      dice.landedAt = now;
      diceLanded();
    }
  }

  if (mover) updateMover(now);

  // Pieces that are standing still glide to their place (they shuffle aside when a square is shared)
  for (const player of players) {
    if (player.pos === 0 || (mover && mover.player === player)) continue;
    const group = playersOn(player.pos);
    const spot = tokenSpot(player.pos, group.indexOf(player), group.length);
    const pull = Math.min(1, dt * 14);
    player.x += (spot.x - player.x) * pull;
    player.y += (spot.y - player.y) * pull;
  }

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const slow = Math.pow(0.02, dt);                // they slow down, like dust in the air
    p.vx *= slow;
    p.vy = p.vy * slow + cell * 3 * dt;             // and fall a little
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);
  floaters = floaters.filter(f => now - f.start < f.life);

  const floor = window.innerHeight + 30;
  for (const f of confetti) {
    f.x += (f.vx + Math.sin(f.spin) * 40) * dt;     // a little side-to-side sway
    f.y += f.vy * dt;
    f.spin += f.spinSpeed * dt;
  }
  confetti = confetti.filter(f => f.y < floor);

  if (ladderGlow && now > ladderGlow.until) ladderGlow = null;
  if (snakeAwake && now > snakeAwake.until) snakeAwake = null;

  // Board shake: a few pixels, for a very short time
  if (now < shakeUntil) {
    const dx = (Math.random() - 0.5) * 6, dy = (Math.random() - 0.5) * 6;
    canvas.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
  } else if (canvas.style.transform) {
    canvas.style.transform = '';
  }
}

// Is there anything on screen that still needs to move?
function somethingIsMoving() {
  return phase !== 'menu' || particles.length > 0 || floaters.length > 0 || confetti.length > 0;
}

// Book the next animation frame (only one at a time)
function keepAnimating() {
  if (loopRunning) return;
  loopRunning = true;
  requestAnimationFrame(animationFrame);
}

function animationFrame(now) {
  loopRunning = false;
  const dt = Math.min(50, now - lastFrameTime) / 1000;   // seconds since the last frame (never a big jump)
  lastFrameTime = now;
  update(now, dt);
  draw(now);
  if (somethingIsMoving()) keepAnimating();
}

// ---------- Drawing ----------
// Stamp one piece. (x, y) is where its foot stands. wide/tall stretch it (for the squash),
// turn leans it over (for the wobble on a snake).
function stampToken(g, lookIndex, x, y, scale, wide, tall, turn) {
  const w = tokenW * scale * wide, h = tokenH * scale * tall;
  const foot = tokenFootY * scale * tall;
  if (turn) {
    g.save();
    g.translate(x, y - h * 0.35);
    g.rotate(turn);
    g.drawImage(tokenImages[lookIndex], -w / 2, -foot + h * 0.35, w, h);
    g.restore();
  } else {
    g.drawImage(tokenImages[lookIndex], x - w / 2, y - foot, w, h);
  }
}

function draw(now) {
  if (!now) now = performance.now();
  ctx.clearRect(0, 0, boardSize, boardSize);
  if (boardImage) ctx.drawImage(boardImage, 0, 0, boardSize, boardSize);

  // The ladder being climbed glows gold
  if (ladderGlow) {
    const shape = ladderShapes[ladderGlow.index];
    ctx.save();
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(now * 0.02);
    ctx.strokeStyle = '#fff3a0';
    ctx.lineCap = 'round';
    ctx.lineWidth = cell * 0.62;
    ctx.beginPath();
    ctx.moveTo(shape.a.x, shape.a.y);
    ctx.lineTo(shape.b.x, shape.b.y);
    ctx.stroke();
    ctx.restore();
  }

  // The snake that caught a piece: its body flashes, its eyes open wide and its tongue flicks
  if (snakeAwake) {
    const shape = snakeShapes[snakeAwake.index];
    const age = now - snakeAwake.start;
    const awake = Math.min(1, age / 120) * Math.min(1, Math.max(0, (snakeAwake.until - now) / 250));
    ctx.save();
    ctx.globalAlpha = (0.22 + 0.18 * Math.sin(now * 0.025)) * awake;
    ctx.strokeStyle = '#ffffff';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.lineWidth = cell * 0.12;
    ctx.beginPath();
    for (let i = 3; i <= shape.count - 3; i++) {
      if (i === 3) ctx.moveTo(shape.points[i].x, shape.points[i].y);
      else ctx.lineTo(shape.points[i].x, shape.points[i].y);
    }
    ctx.stroke();
    ctx.restore();
    drawSnakeHead(ctx, shape, awake, now);
  }

  // A pulsing ring under the piece of the player who has to roll
  if (phase === 'waiting' && players[current] && players[current].pos > 0) {
    const p = players[current];
    const beat = 0.5 + 0.5 * Math.sin(now * 0.006);
    ctx.save();
    ctx.translate(p.x, p.y - cell * 0.02);
    ctx.scale(1, 0.42);
    ctx.lineWidth = cell * 0.07;
    ctx.strokeStyle = 'rgba(20,20,40,0.55)';
    ctx.beginPath();
    ctx.arc(0, 0, cell * (0.37 + 0.07 * beat), 0, Math.PI * 2);
    ctx.stroke();
    ctx.lineWidth = cell * 0.045;
    ctx.strokeStyle = 'rgba(255,255,255,' + (0.65 + 0.35 * beat).toFixed(2) + ')';
    ctx.stroke();
    ctx.restore();
  }

  // The pieces. Ones lower on the screen are drawn later, so they overlap the right way.
  // The travelling piece is always drawn last, on top.
  const order = players.filter(p => p.pos > 0 || (mover && mover.player === p));
  order.sort((a, b) => {
    const am = mover && mover.player === a ? 1 : 0, bm = mover && mover.player === b ? 1 : 0;
    return am - bm || a.y - b.y;
  });
  for (const p of order) {
    const moving = mover && mover.player === p;
    const scale = moving ? 1 : SHARE_SCALE[playersOn(p.pos).length || 1];
    // Tiny squash just after landing: a bit wider and shorter, then back to normal
    let wide = 1, tall = 1;
    const sinceLanding = now - p.landedAt;
    if (sinceLanding >= 0 && sinceLanding < 120) {
      const squash = 0.2 * (1 - sinceLanding / 120);
      wide = 1 + squash * 0.7;
      tall = 1 - squash;
    }
    stampToken(ctx, p.look, p.x, p.y - (moving ? p.lift : 0), scale, wide, tall, moving ? p.spin : 0);
  }

  // Sparkles and dust
  for (const p of particles) {
    const fade = p.life / p.maxLife;
    ctx.globalAlpha = Math.min(1, fade * 1.6);
    ctx.fillStyle = p.colour;
    if (p.star) {
      starPath(ctx, p.x, p.y, p.size * (0.6 + fade), p.size * 0.35, 4);
      ctx.fill();
    } else {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (1.4 - fade * 0.6), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  // Floating words: they rise, pop a little at the start, and fade at the end
  if (floaters.length) {
    const size = Math.max(15, cell * 0.52);
    ctx.font = '800 ' + size.toFixed(1) + 'px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    for (const f of floaters) {
      const t = (now - f.start) / f.life;
      const half = ctx.measureText(f.text).width / 2 + 6;
      const x = Math.min(boardSize - half, Math.max(half, f.x));       // keep the words on the board
      const y = Math.max(size * 0.8, f.y - t * cell * 0.9);          // and never above its top edge
      const pop = t < 0.12 ? 0.6 + 0.4 * (t / 0.12) : 1;
      ctx.save();
      ctx.translate(x, y);
      ctx.scale(pop, pop);
      ctx.globalAlpha = t > 0.7 ? Math.max(0, (1 - t) / 0.3) : 1;
      ctx.lineWidth = size * 0.28;
      ctx.strokeStyle = 'rgba(11,18,32,0.9)';
      ctx.strokeText(f.text, 0, 0);
      ctx.fillStyle = f.colour;
      ctx.fillText(f.text, 0, 0);
      ctx.restore();
    }
  }

  drawDice(now);
  drawConfetti();
}

// The strip under the board: pieces still waiting to start (left), the die (middle), "Tap to roll" (right)
function drawDice(now) {
  const g = diceCtx;
  g.clearRect(0, 0, diceW, diceH);
  const cx = diceW / 2, cy = diceH / 2 - 2;
  const player = players[current];
  const humanCanRoll = phase === 'waiting' && player && !player.isComputer;
  const beat = 0.5 + 0.5 * Math.sin(now * 0.006);

  // A soft glow behind the die, in the colour of the player whose turn it is
  if (player && phase !== 'menu' && phase !== 'over') {
    const look = PLAYER_LOOKS[player.look];
    g.save();
    g.globalAlpha = humanCanRoll ? 0.45 + 0.4 * beat : 0.4;
    g.drawImage(glowImages[player.look], cx - dieSize * 0.95, cy - dieSize * 0.95, dieSize * 1.9, dieSize * 1.9);
    g.restore();
  }

  // The die. While rolling it tumbles: it jumps, leans and changes face. After landing it bounces once.
  let turn = 0, size = 1, lift = 0;
  if (dice.rolling) {
    const t = Math.min(1, (now - dice.start) / DICE_ROLL_MS);
    turn = Math.sin((now - dice.start) * 0.028) * 0.55 * (1 - t * 0.6);
    lift = Math.abs(Math.sin(t * Math.PI * 3)) * dieSize * 0.16 * (1 - t * 0.5);
    size = 0.94 + 0.08 * Math.sin((now - dice.start) * 0.05);
  } else {
    const since = now - dice.landedAt;
    if (since >= 0 && since < 260) size = 1 + 0.14 * Math.sin((since / 260) * Math.PI) * (1 - since / 260);
    else if (humanCanRoll) size = 1 + 0.025 * beat;                  // gentle "tap me" breathing
  }
  const image = dieImages[dice.face];
  if (image) {
    const full = dieSize * 1.5 * size;                               // the picture has room for the shadow around it
    g.save();
    g.translate(cx, cy - lift);
    g.rotate(turn);
    g.drawImage(image, -full / 2, -full / 2, full, full);
    g.restore();
  }

  // Left: the pieces that have not come onto the board yet
  const waiting = players.filter(p => p.pos === 0 && !(mover && mover.player === p));
  const sideWidth = cx - dieSize * 0.62;                             // free room on each side of the die
  if (waiting.length && phase !== 'menu') {
    const mini = Math.min(0.95, (diceH * 0.5) / tokenH);
    const gapX = Math.min(tokenW * mini * 0.8, (sideWidth - 12) / Math.max(1, waiting.length));
    const startX = sideWidth / 2 - gapX * (waiting.length - 1) / 2;
    g.font = '600 11px system-ui, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.fillText('Waiting', sideWidth / 2, diceH - 12);
    waiting.forEach((p, i) => {
      const x = startX + i * gapX, y = diceH * 0.62;
      const isTurn = p === player && phase === 'waiting';
      stampToken(g, p.look, x, y - (isTurn ? beat * 4 : 0), mini, 1, 1, 0);
    });
  }

  // Right: "Tap to roll", pulsing, only when a person has to roll
  if (humanCanRoll) {
    const look = PLAYER_LOOKS[player.look];
    const textX = diceW - sideWidth / 2;
    const narrow = sideWidth < 100;
    g.save();
    g.translate(textX, cy);
    g.scale(0.96 + 0.08 * beat, 0.96 + 0.08 * beat);
    g.globalAlpha = 0.6 + 0.4 * beat;
    g.font = '800 ' + (narrow ? 15 : 17) + 'px system-ui, sans-serif';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    g.fillStyle = look.light;
    if (sideWidth < 92) {                                            // very narrow: two short lines
      g.fillText('Tap', 0, -10);
      g.fillText('to roll', 0, 10);
    } else {
      g.fillText('Tap to roll', 0, 0);
    }
    g.restore();
  }
}

function drawConfetti() {
  if (!confetti.length && !fxDirty) return;
  fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  fxDirty = confetti.length > 0;
  for (const f of confetti) {
    fxCtx.save();
    fxCtx.translate(f.x, f.y);
    fxCtx.rotate(f.spin);
    fxCtx.fillStyle = f.colour;
    fxCtx.fillRect(-f.w / 2, -f.h / 2 * Math.cos(f.spin * 1.3), f.w, f.h * Math.cos(f.spin * 1.3));
    fxCtx.restore();
  }
}

// ---------- Fit everything to the screen ----------
function resize() {
  const dpr = window.devicePixelRatio || 1;       // keep drawing sharp on phone screens
  const space = Math.min(boardWrap.clientWidth, boardWrap.clientHeight);
  edge = Math.max(6, Math.round(space * FRAME_SHARE));              // wooden frame around the squares
  cell = Math.floor((space - edge * 2) / 10);
  cell = Math.max(cell, 12);
  boardSize = cell * 10 + edge * 2;
  canvas.style.width  = boardSize + 'px';
  canvas.style.height = boardSize + 'px';
  canvas.width  = Math.round(boardSize * dpr);
  canvas.height = Math.round(boardSize * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The dice strip
  diceW = diceCanvas.clientWidth || 300;
  diceH = diceCanvas.clientHeight || 104;
  diceCanvas.width  = Math.round(diceW * dpr);
  diceCanvas.height = Math.round(diceH * dpr);
  diceCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  dieSize = Math.round(diceH * 0.8);

  // The confetti layer covers the whole page
  fxCanvas.width  = Math.round(window.innerWidth * dpr);
  fxCanvas.height = Math.round(window.innerHeight * dpr);
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fxDirty = true;

  buildPictures(dpr);                             // repaint the board, piece and die pictures at the new size
  paintLogo(dpr);

  // Put every resting piece straight onto its square at the new size
  for (const player of players) {
    if (player.pos === 0) continue;
    const group = playersOn(player.pos);
    const index = group.indexOf(player);
    if (index < 0) continue;                      // the travelling piece looks after itself
    const spot = tokenSpot(player.pos, index, group.length);
    player.x = spot.x;
    player.y = spot.y;
  }
  // A piece in the middle of a move: point its journey at the new places
  if (mover) {
    for (const segment of mover.segments) {
      if (segment.type === 'hop') {
        segment.from = segment.square - 1 >= 1 ? tokenSpot(segment.square - 1, 0, 1) : entryPoint();
        segment.to = tokenSpot(segment.square, 0, 1);
      } else {
        const list = segment.type === 'ladder' ? LADDERS : SNAKES;
        segment.from = tokenSpot(list[segment.index][0], 0, 1);
        if (segment.to) segment.to = tokenSpot(list[segment.index][1], 0, 1);
      }
    }
  }
  draw();
}

// ---------- Input ----------
// Tap the dice strip to roll. Taps are ignored while anything is moving and on the computer's turn.
diceCanvas.addEventListener('click', () => {
  if (phase !== 'waiting') return;
  if (players[current].isComputer) return;
  rollDice();
});

document.getElementById('btnNew').addEventListener('click', () => { sfx.button(); startGame(); });
document.getElementById('btnMode').addEventListener('click', () => { sfx.button(); showMenu(); });
for (const btn of document.querySelectorAll('#modes button')) {
  btn.addEventListener('click', () => { sfx.button(); startGame(Number(btn.dataset.players)); });
}

// Winner card: tap anywhere to play again. Taps in the first moment are ignored,
// so a tap that was meant for the die does not skip the card.
overlay.addEventListener('click', (e) => {
  if (!overlay.classList.contains('win')) return;
  if (performance.now() - winShownAt < WIN_TAP_GUARD_MS) return;
  sfx.button();
  if (e.target.id === 'winMode') showMenu();
  else startGame();
});

// ---------- Start ----------
// If the ladder and snake lists have a mistake, say so on the start screen
const layoutProblems = checkLayout();
if (layoutProblems.length) msgLine.textContent = 'Check the lists: ' + layoutProblems[0];

buildBackgroundPattern();
window.addEventListener('resize', resize);
resize();
</script>
