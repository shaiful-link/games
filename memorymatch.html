<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Memory Match</title>
<style>
  /* Page fills the phone screen: stats on top, cards below */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1220;
    color: #ffffff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: manipulation;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    padding: 10px 12px 14px;
    gap: 10px;
  }

  /* Top bar: score, level, moves left */
  #top {
    display: flex;
    align-items: center;
    justify-content: space-around;
  }
  .stat { text-align: center; min-width: 70px; }
  .stat span {
    display: block;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.55);
  }
  .stat b { font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat b.low { color: #ff6b6b; }               /* moves nearly used up */

  /* Card area takes all remaining space; the grid is centred inside */
  #boardWrap {
    flex: 1;
    min-height: 0;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #board { display: grid; gap: 8px; }

  /* A card has two faces and flips over in 3D */
  .card {
    position: relative;
    padding: 0;
    border: 0;
    background: none;
    perspective: 600px;
    cursor: pointer;
  }
  .inner {
    position: absolute;
    inset: 0;
    transition: transform 0.3s;
    transform-style: preserve-3d;
  }
  .card.up .inner { transform: rotateY(180deg); }
  .face {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .back {                                         /* face-down side */
    background: #1c2742;
    border: 2px solid #2c3a60;
    color: #4dd4ac;
    font-weight: 700;
  }
  .front {                                        /* picture side */
    background: #f3f5fa;
    transform: rotateY(180deg);
  }
  .card.matched .front { background: #bfeedd; }
  .card.matched { opacity: 0.55; transition: opacity 0.4s; }

  /* Message shown over the cards between levels */
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(11,18,32,0.86);
    text-align: center;
    border-radius: 8px;
  }
  #overlay.hidden { display: none; }
  #overlay h1 { margin: 0; font-size: 26px; }
  #overlay p  { margin: 0; font-size: 16px; color: rgba(255,255,255,0.8); }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat"><span>Score</span><b id="score">0</b></div>
    <div class="stat"><span>Level</span><b id="level">1/10</b></div>
    <div class="stat"><span>Moves left</span><b id="moves">0</b></div>
  </div>

  <div id="boardWrap">
    <div id="board"></div>
    <div id="overlay">
      <h1 id="msgTitle">Memory Match</h1>
      <p id="msgLine1">Find all the matching pairs</p>
      <p id="msgLine2">Tap to start</p>
    </div>
  </div>
</div>

<script>
// =====================================================
// MEMORY MATCH - card matching game for phones, with 10 levels
// Tap two cards to turn them over. A matching pair stays face up.
// Find every pair before you run out of moves.
// =====================================================

// ---------- Settings (change these to experiment) ----------
const FLIP_BACK_MS  = 800;       // how long a wrong pair stays visible
const MATCH_POINTS  = 100;       // per pair (multiplied by the level number)
const MOVE_BONUS    = 50;        // per unused move when a level is finished
const CARD_GAP      = 8;         // space between cards in pixels (same as the CSS gap)
const MAX_CARD_SIZE = 110;

// ---------- Levels ----------
// cols x rows must be an even number (cards come in pairs)
// moves = how many pairs you may turn over before the level is lost
// To add a level, add one more line to this list.
const LEVELS = [
  { cols: 3, rows: 2, moves: 9  },   // 1:  3 pairs
  { cols: 4, rows: 2, moves: 12 },   // 2:  4 pairs
  { cols: 4, rows: 3, moves: 17 },   // 3:  6 pairs
  { cols: 4, rows: 4, moves: 22 },   // 4:  8 pairs
  { cols: 4, rows: 5, moves: 26 },   // 5:  10 pairs
  { cols: 4, rows: 6, moves: 30 },   // 6:  12 pairs
  { cols: 4, rows: 7, moves: 34 },   // 7:  14 pairs
  { cols: 5, rows: 6, moves: 35 },   // 8:  15 pairs
  { cols: 6, rows: 6, moves: 41 },   // 9:  18 pairs
  { cols: 5, rows: 8, moves: 44 }    // 10: 20 pairs
];

// Pictures on the cards (one per pair; the biggest level needs 20)
const SYMBOLS = [
  '🐶', '🐱', '🦊', '🐼', '🐸', '🐵', '🦁', '🐷', '🐙', '🦋',
  '🍎', '🍌', '🍇', '🍉', '🍓', '⚽', '🚗', '🚀', '⭐', '🌈'
];

// ---------- Page elements ----------
const boardWrap = document.getElementById('boardWrap');
const boardEl   = document.getElementById('board');
const overlay   = document.getElementById('overlay');
const msgTitle  = document.getElementById('msgTitle');
const msgLine1  = document.getElementById('msgLine1');
const msgLine2  = document.getElementById('msgLine2');
const elScore = document.getElementById('score');
const elLevel = document.getElementById('level');
const elMoves = document.getElementById('moves');

// ---------- Game state ----------
let cards = [];                  // each card: { symbol, up, matched, el }
let firstPick = null;            // the first card turned over in the current move
let locked = false;              // true while a wrong pair is being shown
let screen = 'title';            // 'title' | 'play' | 'clear' | 'over' | 'won'
let level = 1, score = 0, levelStartScore = 0;
let movesLeft = 0, pairsLeft = 0;
let flipTimer = null;

// ---------- Helpers ----------
// Shuffle a list in place
function shuffle(list) {
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

// ---------- Start a level ----------
function startLevel(n) {
  const def = LEVELS[n - 1];
  const pairs = def.cols * def.rows / 2;

  level = n;
  levelStartScore = score;
  movesLeft = def.moves;
  pairsLeft = pairs;
  firstPick = null;
  locked = false;
  clearTimeout(flipTimer);

  // Pick random pictures, make two of each, and shuffle
  const chosen = shuffle(SYMBOLS.slice()).slice(0, pairs);
  const deck = shuffle(chosen.concat(chosen));

  // Build the cards on the page
  boardEl.innerHTML = '';
  cards = deck.map((symbol) => {
    const el = document.createElement('button');
    el.className = 'card';
    el.setAttribute('aria-label', 'Card');
    el.innerHTML =
      '<div class="inner">' +
        '<div class="face back">?</div>' +
        '<div class="face front">' + symbol + '</div>' +
      '</div>';
    const card = { symbol, up: false, matched: false, el };
    el.addEventListener('click', () => pick(card));
    boardEl.appendChild(el);
    return card;
  });

  screen = 'play';
  overlay.classList.add('hidden');
  layout();
  updateHud();
}

// ---------- Turning cards over ----------
function pick(card) {
  if (screen !== 'play' || locked || card.up || card.matched) return;

  setUp(card, true);
  if (!firstPick) { firstPick = card; return; }    // first card of the move: wait for the second

  // Second card: this counts as one move
  const a = firstPick, b = card;
  firstPick = null;
  movesLeft--;

  if (a.symbol === b.symbol) {
    // Match: both stay face up
    a.matched = b.matched = true;
    a.el.classList.add('matched');
    b.el.classList.add('matched');
    pairsLeft--;
    score += MATCH_POINTS * level;
    updateHud();
    checkEnd();
  } else {
    // No match: show both for a moment, then turn them back
    locked = true;
    updateHud();
    flipTimer = setTimeout(() => {
      setUp(a, false);
      setUp(b, false);
      locked = false;
      checkEnd();
    }, FLIP_BACK_MS);
  }
}

function setUp(card, up) {
  card.up = up;
  card.el.classList.toggle('up', up);
}

// Level finished, or out of moves
function checkEnd() {
  if (pairsLeft === 0) {
    score += movesLeft * MOVE_BONUS;
    updateHud();
    if (level === LEVELS.length) {
      screen = 'won';
      showMessage('You win!', 'Score ' + score, 'Tap to play again');
    } else {
      screen = 'clear';
      showMessage('Level ' + level + ' clear!', movesLeft + ' moves to spare', 'Tap for level ' + (level + 1));
    }
  } else if (movesLeft <= 0) {
    screen = 'over';
    showMessage('Out of moves', pairsLeft + (pairsLeft === 1 ? ' pair' : ' pairs') + ' left', 'Tap to retry level ' + level);
  }
}

function showMessage(title, line1, line2) {
  msgTitle.textContent = title;
  msgLine1.textContent = line1;
  msgLine2.textContent = line2;
  overlay.classList.remove('hidden');
}

// Tap on the message: what happens depends on the current screen
function advance() {
  if (screen === 'title' || screen === 'won') { score = 0; startLevel(1); }
  else if (screen === 'clear') startLevel(level + 1);
  else if (screen === 'over') { score = levelStartScore; startLevel(level); }   // retry same level
}

function updateHud() {
  elScore.textContent = score;
  elLevel.textContent = level + '/' + LEVELS.length;
  elMoves.textContent = movesLeft;
  elMoves.classList.toggle('low', screen === 'play' && movesLeft <= 3);
}

// ---------- Fit the cards to the screen ----------
function layout() {
  const def = LEVELS[level - 1];
  const w = boardWrap.clientWidth, h = boardWrap.clientHeight;
  let size = Math.floor(Math.min(
    (w - CARD_GAP * (def.cols - 1)) / def.cols,
    (h - CARD_GAP * (def.rows - 1)) / def.rows
  ));
  size = Math.max(28, Math.min(MAX_CARD_SIZE, size));

  boardEl.style.gridTemplateColumns = 'repeat(' + def.cols + ', ' + size + 'px)';
  for (const card of cards) {
    card.el.style.width = size + 'px';
    card.el.style.height = size + 'px';
    card.el.style.fontSize = Math.round(size * 0.55) + 'px';
  }
}

// ---------- Input ----------
overlay.addEventListener('click', advance);
window.addEventListener('keydown', (e) => {
  if (e.key === ' ' || e.key === 'Enter') {
    if (screen !== 'play') { advance(); e.preventDefault(); }
  }
});

// ---------- Start ----------
window.addEventListener('resize', layout);
updateHud();
</script>
</body>
</html>
