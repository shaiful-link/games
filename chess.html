// ---------- Spoken zikir ----------
// Speak a short phrase with the phone's built-in voice (nothing to download).
// Uses an Arabic voice if the phone has one, otherwise a Malay voice, otherwise the default.
const btnSpeak = document.getElementById('btnSpeak');
btnSpeak.addEventListener('click', () => { startAudio(); speak(lastSpoken); });

const SPEAK = true;                // false = never speak
let lastSpoken = '';
function speak(text, delay = 0) {
  if (!SPEAK || muted || !('speechSynthesis' in window)) return;
  try {
    // Arabic spelling for the Arabic voice, so the pronunciation is right
    const ARABIC = {
      'Alhamdulillah': 'اَلْحَمْدُ لِلَّهِ',                       // اَلْحَمْدُ لِلَّهِ  (spelling A3 from the test page)
      'Insya-Allah lain kali': 'إِنْشَاءَ اللّٰهُ',               // إِنْشَاءَ اللّٰهُ  (spelling B3 from the test page)
      'Seri · Alhamdulillah': 'اَلْحَمْدُ لِلَّهِ'
    };
    const voices = window.speechSynthesis.getVoices();
    const arabic = voices.find(v => /^ar/i.test(v.lang));
    const u = new SpeechSynthesisUtterance(arabic && ARABIC[text] ? ARABIC[text] : text);
    if (arabic) { u.voice = arabic; u.lang = arabic.lang; }
    else {
      const malay = voices.find(v => /^ms/i.test(v.lang)) || voices.find(v => /^id/i.test(v.lang));
      if (malay) { u.voice = malay; u.lang = malay.lang; } else u.lang = 'ar-SA';
    }
    u.rate = 0.8;
    u.volume = 1;
    // iPhone: cancel() right before speak() can swallow the phrase when the game ends
    // on its own (not on a tap). Only clear if something is still talking, wake the
    // engine up, and say it again if it did not start within a second.
    // Also step out of the game's drawing loop (setTimeout 0): iPhone can ignore speak()
    // from inside an animation frame. If it still has not started, say it on the next
    // finger lift or tap, which iPhone always allows.
    let started = false;
    u.onstart = () => { started = true; pendingSpeech = null; };
    pendingSpeech = u;
    setTimeout(() => {
      try {
        if (window.speechSynthesis.speaking || window.speechSynthesis.pending) window.speechSynthesis.cancel();
        window.speechSynthesis.resume();
        window.speechSynthesis.speak(u);
      } catch (e) {}
      setTimeout(() => { if (!started) { try { window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); } catch (e) {} } }, 1000);
    }, 0);
    lastSpoken = text;
  } catch (e) { /* no voice on this phone: the game still works */ }
}
// Some phones only list their voices after a moment; ask once so they are ready later
if ('speechSynthesis' in window) { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices(); }
// iPhone only allows speech soon after a touch. Saying an empty phrase on the first touch
// unlocks the voice, so the zikir can still be spoken later when the game ends on its own.
let speechUnlocked = false;
function unlockSpeech() {
  if (speechUnlocked || !('speechSynthesis' in window)) return;
  speechUnlocked = true;
  try { window.speechSynthesis.resume(); const u = new SpeechSynthesisUtterance(' '); window.speechSynthesis.speak(u); } catch (e) {}
}
for (const type of ['pointerdown', 'touchend', 'click', 'keydown']) window.addEventListener(type, unlockSpeech, true);
let pendingSpeech = null;   // a zikir the phone has not said yet
function retryPendingSpeech() {
  if (!pendingSpeech) return;
  const u = pendingSpeech; pendingSpeech = null;
  try { window.speechSynthesis.cancel(); window.speechSynthesis.resume(); window.speechSynthesis.speak(u); } catch (e) {}
}
for (const type of ['pointerup', 'touchend', 'click']) window.addEventListener(type, retryPendingSpeech, true);

// ---------- Game state ----------
let state = newState();          // the position (see the rules part above)
let mode = 'easy';               // 'easy' | 'medium' | 'hard' | 'two'
let legal = [];                  // legal moves for the side to move
let keys = [];                   // positionKey() of every position so far (for the repetition rule)
let history = [];                // earlier positions, so Undo can go back: { state, keys length, lastMove }
let selected = -1;               // the square of the piece you tapped, or -1
let lastMove = null;             // highlighted on the board
let result = null;               // null while playing, otherwise { kind, winner }
let flipped = false;             // true = Black sits at the bottom (2-player "Flip board")
let playing = false;
let thinking = false;            // true while the computer is choosing
let aiRequest = 0;               // number of the latest request to the computer (older replies are ignored)
let aiTimer = null;
let pendingPromo = null;         // the promotion moves waiting for the picker: [moves]
let cardShownAt = 0;             // when the result card appeared (taps right after are ignored)
let cell = 40;                   // size of one square in CSS pixels (set by resize)

// ---------- Effects state (looks only: none of this changes the rules) ----------
let edge = 14;                   // width of the wooden frame around the squares, in CSS pixels (set by resize)
let glide = null;                // pieces gliding right now, or null
let particles = [];              // puff bits on the board
let confetti = [];               // confetti bits on the whole page
let loopRunning = false;         // true while the next animation frame is already booked
let lastFrameTime = 0;
let fxDirty = false;             // true when the confetti layer has something on it to wipe

const isHumanTurn = () => playing && !thinking && (mode === 'two' || state.turn === WHITE);

// Where a square is drawn on screen (Black at the bottom when flipped): { r, c } rows and columns
function screenRC(sq) {
  const r = rowOf(sq), c = colOf(sq);
  return flipped ? { r: 7 - r, c: 7 - c } : { r: r, c: c };
}
function screenToSquare(r, c) {
  return flipped ? squareAt(7 - r, 7 - c) : squareAt(r, c);
}

function startGame(newMode) {
  if (newMode) mode = newMode;
  setPosition(newState());
}

// Put a position on the board and start play from there (also used by the tests through CH.loadFEN)
function setPosition(s) {
  clearTimeout(aiTimer);
  aiRequest++;                   // any reply from an older think is now ignored
  state = s;
  history = [];
  keys = [positionKey(state)];
  selected = -1;
  lastMove = null;
  result = null;
  thinking = false;
  pendingPromo = null;
  promoPane.classList.add('hidden');
  playing = true;
  if (mode !== 'two') flipped = false;
  // Clear any effects left over from the last game
  glide = null;
  particles = [];
  confetti = [];
  overlay.classList.add('hidden');
  card.classList.add('hidden');
  beginTurn();
}

// Work out the legal moves for the side to move, check whether the game is over, and
// hand the move to the computer when it is its turn
function beginTurn() {
  legal = legalMoves(state);
  selected = -1;
  result = gameResult(state, legal, keys);
  if (result) { endGame(); return; }
  updateHud();
  if (mode !== 'two' && state.turn === BLACK) askComputer();
  draw();
}

// Play a move: remember the old position (for Undo), change the board, start the glide
function playMove(m) {
  const before = state;
  const movingPiece = before.b[m.from];
  let capturedSq = m.capt ? m.to : -1;
  if (m.flag === FLAG_EP) capturedSq = m.to + 8 * before.turn;       // the passed pawn sits behind the landing square
  const capturedPiece = capturedSq >= 0 ? before.b[capturedSq] : 0;

  history.push({ state: before, keyCount: keys.length, lastMove: lastMove });
  state = makeMove(before, m);
  keys.push(positionKey(state));
  lastMove = m;
  selected = -1;
  pendingPromo = null;
  promoPane.classList.add('hidden');

  // The rules are done above. This only starts the picture of the piece gliding.
  startGlide(m, movingPiece, capturedSq, capturedPiece);
  beginTurn();
}

// ---------- The computer's turn ----------
// The thinking runs in a Web Worker made from this page's own rules text, so the screen stays
// smooth. If the phone has no Worker, the search runs in small steps between screen updates.
let worker = null;
try {
  const code = document.getElementById('engine').textContent;
  worker = new Worker(URL.createObjectURL(new Blob([code], { type: 'text/javascript' })));
  worker.onmessage = (e) => computerReplied(e.data.id, e.data.move);
  worker.onerror = () => { worker = null; };     // something went wrong: think on the main thread from now on
} catch (e) { worker = null; }

function askComputer() {
  thinking = true;
  updateHud();
  const id = ++aiRequest;
  const s = state, level = mode, keysNow = keys.slice();
  aiTimer = setTimeout(() => {
    if (id !== aiRequest) return;
    if (worker) {
      worker.postMessage({ id: id, fen: toFEN(s), level: level, keys: keysNow });
      // Safety net: if the worker never answers, think here instead
      aiTimer = setTimeout(() => { if (id === aiRequest && thinking) thinkInSteps(id, s, level, keysNow); }, 4000);
    } else {
      thinkInSteps(id, s, level, keysNow);
    }
  }, AI_PAUSE_MS);
}

// Fallback without a Worker: one search depth per step, with a breath for the screen in between
function thinkInSteps(id, s, level, keysNow) {
  const job = startSearch(s, level, keysNow);
  const step = () => {
    if (id !== aiRequest) return;                 // a new game started meanwhile: forget this
    if (job.step()) computerReplied(id, job.best);
    else setTimeout(step, 0);
  };
  step();
}

function computerReplied(id, reply) {
  if (id !== aiRequest || !playing) return;       // an old think, or the game was changed: no ghost moves
  clearTimeout(aiTimer);
  thinking = false;
  if (!reply) { updateHud(); return; }
  const m = legal.find(x => x.from === reply.from && x.to === reply.to && x.promo === (reply.promo || 0));
  if (m) playMove(m);
  else updateHud();
}

// ---------- Game over ----------
function resultText(res) {
  if (res.kind === 'mate') return 'Checkmate · ' + (res.winner === WHITE ? 'White' : 'Black') + ' wins';
  if (res.kind === 'stalemate') return 'Stalemate';
  if (res.kind === 'repetition') return 'Draw · repetition';
  if (res.kind === 'fifty') return 'Draw · 50 moves';
  return 'Draw · not enough pieces';
}

function endGame() {
  playing = false;
  thinking = false;
  clearTimeout(aiTimer);
  aiRequest++;
  let title;
  if (result.winner === 0) title = MSG_DRAW;
  else if (mode === 'two') title = MSG_WIN;
  else title = result.winner === WHITE ? MSG_WIN : MSG_LOSE;
  const humanWon = result.winner !== 0 && (mode === 'two' || result.winner === WHITE);
  msgTitle.textContent = title;
  msgLine.textContent = resultText(result);
  updateHud();

  // Tune and confetti. Against the computer only your own win is a party.
  if (result.winner === 0) sfx.drawn();
  else if (!humanWon) sfx.lose();
  else { sfx.win(); throwConfetti(); }

  draw();
  const id = aiRequest;
  setTimeout(() => {                              // let the final position be seen first
    if (id !== aiRequest || playing) return;      // a new game was started in the meantime
    startPane.classList.add('hidden');
    card.classList.remove('hidden');
    overlay.classList.remove('hidden');
    cardShownAt = performance.now();
    speak(title);
  }, 900);
}

// Back to the start screen
function showStartScreen() {
  clearTimeout(aiTimer);
  aiRequest++;
  playing = false;
  thinking = false;
  pendingPromo = null;
  promoPane.classList.add('hidden');
  card.classList.add('hidden');
  startPane.classList.remove('hidden');
  overlay.classList.remove('hidden');
  updateHud();
}

// ---------- Undo ----------
// In 2-player one move goes back. Against the computer both the computer's reply and your own
// move go back, so it is your turn again.
function undo() {
  if (!history.length || thinking) return;
  clearTimeout(aiTimer);
  aiRequest++;
  const wasOver = result !== null;
  let item = history.pop();
  if (mode !== 'two' && item.state.turn === BLACK && history.length) item = history.pop();
  state = item.state;
  keys.length = item.keyCount;
  lastMove = item.lastMove;
  result = null;
  playing = true;
  glide = null;
  pendingPromo = null;
  promoPane.classList.add('hidden');
  if (wasOver) { overlay.classList.add('hidden'); card.classList.add('hidden'); confetti = []; }
  beginTurn();
}

// ---------- The top bar, the hint line, the captured pieces and the buttons ----------
function updateHud() {
  // Status pill
  elStatus.className = '';
  if (result) {
    elStatus.textContent = result.kind === 'stalemate' ? 'Stalemate · Draw' : resultText(result);
    elStatus.classList.add('over');
  } else if (thinking) {
    // Blinking dots while the computer thinks. The word and the dots are kept together
    // in one piece, so on a narrow phone the dots never drop onto a line of their own.
    // (Everything sits in one span: the pill is a flex box, and separate children would be spread out.)
    const text = document.createElement('span');
    text.textContent = 'Computer is ';
    const lastWord = document.createElement('span');
    lastWord.className = 'dots';
    lastWord.textContent = 'thinking';
    for (let i = 0; i < 3; i++) lastWord.appendChild(document.createElement('i'));
    text.appendChild(lastWord);
    elStatus.textContent = '';
    elStatus.appendChild(text);
    elStatus.classList.add('black');
  } else if (playing && inCheck(state)) {
    elStatus.textContent = 'Check!';
    elStatus.classList.add('check');
  } else if (playing) {
    elStatus.textContent = (state.turn === WHITE ? 'White' : 'Black') + ' to move';
    elStatus.classList.add(state.turn === WHITE ? 'white' : 'black');
  } else {
    elStatus.textContent = 'Chess';
  }

  // Hint line under the board
  if (isHumanTurn()) {
    elHint.textContent = selected >= 0 ? 'Tap where it should go' : 'Tap a piece to move';
    elHint.classList.remove('quiet');
  } else {
    elHint.classList.add('quiet');
  }

  // Buttons
  btnFlip.classList.toggle('hidden', mode !== 'two');
  btnUndo.disabled = thinking || history.length === 0;

  showCaptured();
}

// Pieces each side has taken, worked out from what is missing compared with the start.
// The side that is ahead shows the difference, e.g. "+2".
const START_COUNT = { 1: 8, 2: 2, 3: 2, 4: 2, 5: 1 };
function showCaptured() {
  const count = { 1: {}, [-1]: {} };
  let material = 0;                              // White's material minus Black's (pawn = 1, knight/bishop = 3, rook = 5, queen = 9)
  const VALUE = { 1: 1, 2: 3, 3: 3, 4: 5, 5: 9, 6: 0 };
  for (const v of state.b) {
    if (v === 0) continue;
    const side = Math.sign(v), t = Math.abs(v);
    count[side][t] = (count[side][t] || 0) + 1;
    material += side * VALUE[t];
  }
  // What White captured = Black pieces that are missing (and the other way round)
  const takenBy = { 1: [], [-1]: [] };
  for (const side of [WHITE, BLACK]) {
    for (const t of [QUEEN, ROOK, BISHOP, KNIGHT, PAWN]) {
      const missing = START_COUNT[t] - (count[-side][t] || 0);
      for (let i = 0; i < missing; i++) takenBy[side].push(-side * t);
    }
  }
  const topSide = flipped ? WHITE : BLACK;       // the row above the board belongs to the player sitting at the top
  fillCaptureRow(capsTop, topSide, takenBy[topSide], material * topSide);
  fillCaptureRow(capsBottom, -topSide, takenBy[-topSide], -material * topSide);
}

function fillCaptureRow(row, side, pieces, lead) {
  row.querySelector('.who').className = 'who ' + (side === WHITE ? 'white' : 'black');
  const holder = row.querySelector('.pieces');
  const key = pieces.join(',') + '|' + cell;
  if (holder.dataset.key !== key) {              // only redraw when something changed
    holder.dataset.key = key;
    holder.textContent = '';
    const dpr = window.devicePixelRatio || 1;
    for (const v of pieces) {
      const made = makeHiddenCanvas(22, 22, dpr);
      paintPiece(made.g, Math.abs(v), Math.sign(v), 11, 11, 24, dpr);
      made.canvas.style.width = '22px';
      made.canvas.style.height = '22px';
      holder.appendChild(made.canvas);
    }
  }
  row.querySelector('.diff').textContent = lead > 0 ? '+' + lead : '';
}

// ---------- Pictures made once: the wooden board and the pieces ----------
// Painting wood grain and shaded pieces takes many drawing steps. Doing that 60 times a second
// would be slow on a cheap phone, so each picture is painted once into a hidden canvas
// and then simply stamped onto the screen.
let boardImage = null;           // the frame, the coordinates and the 64 squares
let pieceImages = {};            // one picture for each piece, keyed by its board number (1..6, -1..-6)
let spriteSize = 52;             // width of one piece picture in CSS pixels

// A "random" number maker that always gives the same numbers for the same seed,
// so the wood grain looks the same every time the board is rebuilt.
function makeRandom(seed) {
  let s = seed;
  return function () {
    s = (s * 16807) % 2147483647;
    return s / 2147483647;
  };
}

// Make a hidden canvas of the given size (CSS pixels), ready to draw on sharply
function makeHiddenCanvas(width, height, dpr) {
  const c = document.createElement('canvas');
  c.width  = Math.max(1, Math.round(width * dpr));
  c.height = Math.max(1, Math.round(height * dpr));
  const g = c.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { canvas: c, g: g };
}

// Draw a few wavy grain lines across a rectangle of wood
function drawGrain(g, x, y, w, h, lines, colour, rnd) {
  g.save();
  g.beginPath();
  g.rect(x, y, w, h);
  g.clip();                                       // keep the lines inside this rectangle
  g.strokeStyle = colour;
  for (let i = 0; i < lines; i++) {
    const y0 = y + rnd() * h;
    const bend = (rnd() - 0.5) * h * 0.3;
    g.globalAlpha = 0.25 + rnd() * 0.75;
    g.lineWidth = 0.5 + rnd() * 1.2;
    g.beginPath();
    g.moveTo(x - 2, y0);
    g.bezierCurveTo(x + w * 0.3, y0 + bend, x + w * 0.7, y0 - bend, x + w + 2, y0 + bend * 0.5);
    g.stroke();
  }
  g.restore();
}

// Trace a rectangle with rounded corners (older phones do not have a built-in one)
function roundedRect(g, x, y, w, h, radius) {
  g.beginPath();
  g.moveTo(x + radius, y);
  g.arcTo(x + w, y, x + w, y + h, radius);
  g.arcTo(x + w, y + h, x, y + h, radius);
  g.arcTo(x, y + h, x, y, radius);
  g.arcTo(x, y, x + w, y, radius);
  g.closePath();
}

// Paint the whole board: frame with coordinates first, then the squares
function buildBoardImage(dpr) {
  const inner = 8 * cell;                         // the 8 x 8 squares
  const full = inner + edge * 2;                  // squares plus frame
  const made = makeHiddenCanvas(full, full, dpr);
  const g = made.g;
  const rnd = makeRandom(20240);

  // Frame: dark walnut, lighter at the top, with long grain lines
  const frameShade = g.createLinearGradient(0, 0, 0, full);
  frameShade.addColorStop(0, '#7a4d2b');
  frameShade.addColorStop(0.5, '#5c3719');
  frameShade.addColorStop(1, '#40240f');
  g.fillStyle = frameShade;
  roundedRect(g, 0, 0, full, full, 10);
  g.fill();
  g.save();
  roundedRect(g, 0, 0, full, full, 10);
  g.clip();
  drawGrain(g, 0, 0, full, full, 60, 'rgba(0,0,0,0.20)', rnd);
  g.restore();
  // A thin bright line on the outer edge so the frame looks rounded
  g.strokeStyle = 'rgba(255,214,150,0.35)';
  g.lineWidth = 1;
  roundedRect(g, 0.75, 0.75, full - 1.5, full - 1.5, 9.5);
  g.stroke();

  // Squares: cream and brown, each with a faint grain
  for (let r = 0; r < 8; r++) {
    for (let c = 0; c < 8; c++) {
      const x = edge + c * cell, y = edge + r * cell;
      const light = (r + c) % 2 === 0;
      g.fillStyle = light ? LIGHT_SQUARE : DARK_SQUARE;
      g.fillRect(x, y, cell, cell);
      drawGrain(g, x, y, cell, cell, 5, light ? 'rgba(140,100,50,0.10)' : 'rgba(60,30,10,0.14)', rnd);
    }
  }

  // Soft inner shadow: the squares look set a little into the frame
  g.save();
  g.beginPath();
  g.rect(edge, edge, inner, inner);
  g.clip();
  const shade = Math.max(6, cell * 0.35);
  for (const [x0, y0, x1, y1] of [[edge, edge, edge, edge + shade], [edge, edge + inner, edge, edge + inner - shade],
                                  [edge, edge, edge + shade, edge], [edge + inner, edge, edge + inner - shade, edge]]) {
    const grad = g.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, 'rgba(0,0,0,0.28)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(edge, edge, inner, inner);
  }
  g.restore();

  // A dark groove and a thin gold line where the squares meet the frame
  g.strokeStyle = 'rgba(0,0,0,0.6)';
  g.lineWidth = 2;
  g.strokeRect(edge - 1, edge - 1, inner + 2, inner + 2);
  g.strokeStyle = 'rgba(244,211,94,0.45)';
  g.lineWidth = 1;
  g.strokeRect(edge - 2.5, edge - 2.5, inner + 5, inner + 5);

  // Coordinates in the frame: letters along the bottom, numbers down the left side
  g.fillStyle = 'rgba(255,225,180,0.85)';
  g.font = '600 ' + Math.max(8, Math.round(edge * 0.62)) + 'px system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  for (let i = 0; i < 8; i++) {
    const file = flipped ? FILES[7 - i] : FILES[i];
    const rank = flipped ? i + 1 : 8 - i;
    g.fillText(file, edge + i * cell + cell / 2, full - edge / 2 + 0.5);
    g.fillText(String(rank), edge / 2, edge + i * cell + cell / 2 + 0.5);
  }

  boardImage = made.canvas;
}

// ---------- The pieces: Staunton-style silhouettes drawn with paths ----------
// Every piece is drawn inside a 100 x 100 box (x from 0 to 100, y from 0 at the top to 100 at
// the bottom) and scaled to the size needed. The shape is built from simple parts (rounded
// rectangles, circles, polygons) that are all filled with the same colour, so they merge into one
// silhouette. The outline is drawn first as a thick stroke, then the fill covers its inside.
// Owner's rule: the king has a crown with a small ball on top - there is NO cross on any piece.

// Add shapes to a path, always traced clockwise so they merge properly
function addRoundRect(p, x, y, w, h, r) {
  p.moveTo(x + r, y);
  p.arcTo(x + w, y, x + w, y + h, r);
  p.arcTo(x + w, y + h, x, y + h, r);
  p.arcTo(x, y + h, x, y, r);
  p.arcTo(x, y, x + w, y, r);
  p.closePath();
}
function addEllipse(p, cx, cy, rx, ry) {
  p.moveTo(cx + rx, cy);
  p.ellipse(cx, cy, rx, ry, 0, 0, Math.PI * 2);
  p.closePath();
}
function addPolygon(p, points) {
  let area = 0;                                   // make sure the points run clockwise on screen
  for (let i = 0; i < points.length; i++) {
    const a = points[i], b = points[(i + 1) % points.length];
    area += a[0] * b[1] - b[0] * a[1];
  }
  if (area < 0) points = points.slice().reverse();
  p.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) p.lineTo(points[i][0], points[i][1]);
  p.closePath();
}

// The outline of one piece as a path in the 100 x 100 box
function pieceShape(type) {
  const p = new Path2D();
  // Every piece stands on the same two-step base
  addRoundRect(p, 21, 83, 58, 11, 4.5);
  addRoundRect(p, 26, 76, 48, 9, 3.5);

  if (type === PAWN) {
    addEllipse(p, 50, 31, 12, 12);                         // head
    addRoundRect(p, 36, 44, 28, 7, 3.5);                   // collar
    addPolygon(p, [[43, 49], [57, 49], [63, 78], [37, 78]]); // stem
  } else if (type === ROOK) {
    addPolygon(p, [[37, 36], [63, 36], [66, 78], [34, 78]]); // body
    addRoundRect(p, 30, 29, 40, 9, 2.5);                   // ledge under the battlements
    addRoundRect(p, 29, 13, 12, 19, 2);                    // three merlons
    addRoundRect(p, 44, 13, 12, 19, 2);
    addRoundRect(p, 59, 13, 12, 19, 2);
    addRoundRect(p, 29, 26, 42, 8, 2);                     // bar joining them
  } else if (type === BISHOP) {
    addPolygon(p, [[44, 52], [56, 52], [61, 78], [39, 78]]); // stem
    addRoundRect(p, 34, 64, 32, 7, 3.5);                   // collar
    addEllipse(p, 50, 39, 14, 18);                         // mitre
    addEllipse(p, 50, 14, 5, 5);                           // ball on top
  } else if (type === KNIGHT) {
    knightShape(p);
  } else if (type === QUEEN) {
    addPolygon(p, [[43, 52], [57, 52], [62, 78], [38, 78]]); // stem
    addRoundRect(p, 32, 54, 36, 7, 3.5);                   // collar
    // Coronet: five points with a ball on each
    addPolygon(p, [[33, 54], [67, 54], [71, 33], [72, 18], [66, 31], [61, 14], [55.5, 30], [50, 12],
                   [44.5, 30], [39, 14], [34, 31], [28, 18], [29, 33]]);
    for (const [x, y] of [[28, 17], [39, 13], [50, 11], [61, 13], [72, 17]]) addEllipse(p, x, y, 3.6, 3.6);
  } else if (type === KING) {
    addPolygon(p, [[43, 58], [57, 58], [62, 78], [38, 78]]); // stem
    addRoundRect(p, 31, 56, 38, 7, 3.5);                   // collar
    addPolygon(p, [[37, 58], [63, 58], [70, 36], [30, 36]]); // crown body, flaring out upward
    addRoundRect(p, 26, 31, 48, 9, 3.5);                   // crown band
    for (const x of [30, 40, 50, 60, 70]) addEllipse(p, x, 31, 3.2, 3.2);   // small bumps along the band
    addEllipse(p, 50, 31, 18, 15);                         // dome
    addRoundRect(p, 47.5, 9, 5, 10, 1.5);                  // finial stem
    addEllipse(p, 50, 7.5, 5, 5);                          // ball on top (no cross)
  }
  return p;
}

// The knight: a horse head facing left, as one curved outline
function knightShape(p) {
  p.moveTo(43, 11);                                        // tip of the back ear
  p.quadraticCurveTo(60, 17, 64, 36);                      // back of the head into the mane
  p.quadraticCurveTo(73, 55, 71, 78);                      // back of the neck down to the base
  p.lineTo(30, 78);                                        // along the base
  p.quadraticCurveTo(29, 66, 35, 59);                      // chest up to the throat
  p.quadraticCurveTo(31, 59, 24, 57);                      // under the jaw, going forward
  p.quadraticCurveTo(13, 60, 10, 51);                      // the chin down to the mouth
  p.quadraticCurveTo(7, 43, 15, 37);                       // the muzzle and nose
  p.quadraticCurveTo(21, 31, 30, 26);                      // up the nose to the forehead
  p.lineTo(32, 11);                                        // the front ear
  p.lineTo(37.5, 21);                                      // the dip between the ears
  p.closePath();
}

// Little marks drawn on top of the silhouette: the bishop's slit, the knight's eye and mane, bands
function pieceDetails(g, type, colour) {
  const dark = colour === WHITE ? 'rgba(70,52,30,0.85)' : 'rgba(255,255,255,0.55)';
  const light = colour === WHITE ? 'rgba(255,255,255,0.75)' : 'rgba(255,255,255,0.28)';
  g.lineCap = 'round';
  g.lineJoin = 'round';
  g.strokeStyle = dark;
  g.fillStyle = dark;
  if (type === BISHOP) {
    g.lineWidth = 3.2;                                     // the classic slit: a diagonal cut
    g.beginPath(); g.moveTo(43, 46); g.lineTo(57, 30); g.stroke();
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(37, 64.5); g.lineTo(63, 64.5); g.stroke();
  } else if (type === KNIGHT) {
    g.beginPath(); g.ellipse(26, 40, 2.4, 2.4, 0, 0, Math.PI * 2); g.fill();       // eye
    g.beginPath(); g.ellipse(13, 45, 1.5, 1.5, 0, 0, Math.PI * 2); g.fill();       // nostril
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(11, 51); g.quadraticCurveTo(17, 52, 21, 50); g.stroke();   // mouth
    g.lineWidth = 2;
    for (const [x1, y1, x2, y2] of [[49, 20, 56, 30], [56, 31, 62, 42], [62, 44, 66, 56]]) {   // mane strands
      g.beginPath(); g.moveTo(x1, y1); g.quadraticCurveTo(x1 + 6, y1 + 3, x2, y2); g.stroke();
    }
  } else if (type === ROOK) {
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(32, 38); g.lineTo(68, 38); g.stroke();
    g.beginPath(); g.moveTo(37, 72); g.lineTo(63, 72); g.stroke();
  } else if (type === QUEEN) {
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(35, 54); g.lineTo(65, 54); g.stroke();
    g.beginPath(); g.moveTo(37, 61); g.lineTo(63, 61); g.stroke();
  } else if (type === KING) {
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(29, 40); g.lineTo(71, 40); g.stroke();                 // under the band
    g.beginPath(); g.moveTo(35, 58); g.lineTo(65, 58); g.stroke();
    g.beginPath(); g.moveTo(37, 63); g.lineTo(63, 63); g.stroke();
    // Two arches over the dome, meeting under the ball
    g.beginPath(); g.moveTo(33, 31); g.quadraticCurveTo(38, 16, 50, 16); g.stroke();
    g.beginPath(); g.moveTo(67, 31); g.quadraticCurveTo(62, 16, 50, 16); g.stroke();
  } else if (type === PAWN) {
    g.lineWidth = 1.6;
    g.beginPath(); g.moveTo(38, 51); g.lineTo(62, 51); g.stroke();
  }
  // A thin bright line along the base, like light catching the edge
  g.strokeStyle = light;
  g.lineWidth = 1.4;
  g.beginPath(); g.moveTo(28, 77.5); g.lineTo(72, 77.5); g.stroke();
}

// Paint one piece with its middle at (x, y), "size" CSS pixels tall (the 100-unit box).
//   colour = WHITE or BLACK. "pixelScale" is the device pixel ratio, for the shadow blur.
function paintPiece(g, type, colour, x, y, size, pixelScale) {
  const shape = pieceShape(type);
  const k = size / 100;
  g.save();
  g.translate(x - size / 2, y - size / 2);
  g.scale(k, k);
  g.lineJoin = 'round';
  g.lineCap = 'round';

  // Soft drop shadow under the piece
  g.save();
  g.shadowColor = 'rgba(0,0,0,0.45)';
  g.shadowBlur = 5 * k * pixelScale;
  g.shadowOffsetY = 3 * k * pixelScale;
  g.fillStyle = 'rgba(0,0,0,0.4)';
  g.fill(shape);
  g.restore();

  // Outline: a thick stroke all round, which the fill then covers on the inside
  const outline = colour === WHITE ? '#3e3020' : '#07070c';
  g.strokeStyle = outline;
  g.lineWidth = colour === WHITE ? 4.4 : 3.6;
  g.stroke(shape);

  // Body colour: ivory for White, charcoal for Black
  const body = g.createLinearGradient(20, 0, 80, 0);
  if (colour === WHITE) {
    body.addColorStop(0, '#fff8e8');
    body.addColorStop(0.55, '#efe2c4');
    body.addColorStop(1, '#cdb88f');
  } else {
    body.addColorStop(0, '#5c5c68');
    body.addColorStop(0.5, '#34343d');
    body.addColorStop(1, '#17171d');
  }
  g.fillStyle = body;
  g.fill(shape);

  // Shading, kept inside the silhouette: light from the upper left, shadow to the lower right
  g.save();
  g.clip(shape);
  const top = g.createLinearGradient(0, 0, 0, 100);
  top.addColorStop(0, colour === WHITE ? 'rgba(255,255,255,0.45)' : 'rgba(255,255,255,0.22)');
  top.addColorStop(0.5, 'rgba(255,255,255,0)');
  top.addColorStop(1, colour === WHITE ? 'rgba(90,60,30,0.28)' : 'rgba(0,0,0,0.45)');
  g.fillStyle = top;
  g.fillRect(0, 0, 100, 100);
  const sheen = g.createRadialGradient(36, 30, 2, 36, 30, 40);
  sheen.addColorStop(0, colour === WHITE ? 'rgba(255,255,255,0.55)' : 'rgba(255,255,255,0.30)');
  sheen.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = sheen;
  g.fillRect(0, 0, 100, 100);
  g.restore();

  // Thin inner outline for a crisp edge, then the little marks
  g.strokeStyle = colour === WHITE ? 'rgba(62,48,32,0.9)' : 'rgba(0,0,0,0.9)';
  g.lineWidth = 1.5;
  g.stroke(shape);
  pieceDetails(g, type, colour);
  g.restore();
}

// Paint one piece into a hidden canvas (the sprite that is stamped on the board)
function buildPieceImage(value, dpr) {
  const made = makeHiddenCanvas(spriteSize, spriteSize, dpr);
  paintPiece(made.g, Math.abs(value), Math.sign(value), spriteSize / 2, spriteSize / 2 - cell * 0.02, cell * 1.04, dpr);
  return made.canvas;
}

function buildPictures(dpr) {
  spriteSize = Math.ceil(cell * 1.3);
  buildBoardImage(dpr);
  pieceImages = {};
  for (const value of [1, 2, 3, 4, 5, 6, -1, -2, -3, -4, -5, -6]) pieceImages[value] = buildPieceImage(value, dpr);
  buildLogo(dpr);
  capsTop.querySelector('.pieces').dataset.key = '';            // the little captured pieces get repainted too
  capsBottom.querySelector('.pieces').dataset.key = '';
}

// The two pieces above the title on the start screen
function buildLogo(dpr) {
  const logo = document.getElementById('logo');
  const w = 140, h = 70;
  logo.width = Math.round(w * dpr);
  logo.height = Math.round(h * dpr);
  const g = logo.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  paintPiece(g, KING, WHITE, 50, 36, 66, dpr);
  paintPiece(g, KNIGHT, BLACK, 92, 38, 62, dpr);
}

// ---------- Effects: gliding pieces, puffs, confetti ----------

// Start showing the pieces of a move gliding. The board itself has already changed.
function startGlide(m, movingPiece, capturedSq, capturedPiece) {
  if (glide) finishGlide(false);                  // an older glide still running: finish it at once
  const movers = [{ piece: movingPiece, from: m.from, to: m.to }];
  if (m.flag === FLAG_CASTLE) {
    // The rook glides too
    const rookFrom = m.to > m.from ? m.to + 1 : m.to - 2;
    const rookTo = m.to > m.from ? m.to - 1 : m.to + 1;
    movers.push({ piece: state.b[rookTo], from: rookFrom, to: rookTo });
  }
  glide = {
    movers: movers,
    move: m,
    start: performance.now(),
    dur: SLIDE_MS,
    ghost: capturedSq >= 0 ? { sq: capturedSq, piece: capturedPiece, popped: false } : null,
    promoted: m.promo !== 0
  };
  keepAnimating();
}

// A captured piece disappears in a puff
function popGhost(ghost) {
  ghost.popped = true;
  const at = screenRC(ghost.sq);
  const x = at.c * cell + cell / 2, y = at.r * cell + cell / 2;
  const colour = ghost.piece > 0 ? '#f5ead0' : '#4a4a58';
  addRing(x, y, ghost.piece > 0 ? 'rgba(255,240,200,0.9)' : 'rgba(120,120,140,0.9)');
  for (let i = 0; i < 12; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = cell * (2 + Math.random() * 3);
    addParticle(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed,
                0.35 + Math.random() * 0.25, cell * (0.05 + Math.random() * 0.06),
                i % 3 === 0 ? '#ffffff' : colour);
  }
}

// The glide is over: the piece lands with a tap (and a few other sounds, depending on the move)
function finishGlide(withSound) {
  const gl = glide;
  glide = null;
  if (gl.ghost && !gl.ghost.popped) popGhost(gl.ghost);
  if (!withSound) return;
  if (gl.ghost) sfx.capture();
  else if (gl.move.flag === FLAG_CASTLE) sfx.castle();
  else sfx.move();
  if (gl.promoted) sfx.promote();
  if (playing && inCheck(state)) setTimeout(() => sfx.check(), 120);
}

// One small flying dot (position and speed are in CSS pixels on the board)
function addParticle(x, y, vx, vy, life, size, colour) {
  if (particles.length + confetti.length >= MAX_PARTICLES) return;
  particles.push({ ring: false, x: x, y: y, vx: vx, vy: vy, life: life, maxLife: life, size: size, colour: colour });
}

// One ring that grows and fades
function addRing(x, y, colour) {
  if (particles.length + confetti.length >= MAX_PARTICLES) return;
  particles.push({ ring: true, x: x, y: y, vx: 0, vy: 0, life: 0.3, maxLife: 0.3, size: cell * 0.3, colour: colour });
}

// Confetti falls over the whole page when somebody wins
function throwConfetti() {
  const colours = ['#f4d35e', '#4dd4ac', '#ff6b6b', '#6fb7ff', '#ffffff', '#c792ff'];
  const width = window.innerWidth, height = window.innerHeight;
  for (let i = 0; i < CONFETTI_COUNT; i++) {
    if (particles.length + confetti.length >= MAX_PARTICLES) break;
    confetti.push({
      x: Math.random() * width,
      y: -20 - Math.random() * height * 0.5,      // they start above the screen, spread out
      vx: (Math.random() - 0.5) * 60,
      vy: 140 + Math.random() * 160,
      spin: Math.random() * Math.PI * 2,
      spinSpeed: (Math.random() - 0.5) * 10,
      w: 6 + Math.random() * 5,
      h: 9 + Math.random() * 6,
      colour: colours[i % colours.length]
    });
  }
  keepAnimating();
}

// Move every effect forward by a small step of time (dt, in seconds)
function updateEffects(now, dt) {
  if (glide) {
    const t = (now - glide.start) / glide.dur;
    if (glide.ghost && !glide.ghost.popped && t >= 0.6) popGhost(glide.ghost);
    if (t >= 1) finishGlide(true);
  }

  for (const p of particles) {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    const slow = Math.pow(0.004, dt);             // they slow down, like dust in the air
    p.vx *= slow;
    p.vy *= slow;
    p.life -= dt;
  }
  particles = particles.filter(p => p.life > 0);

  const floor = window.innerHeight + 30;
  for (const f of confetti) {
    f.x += (f.vx + Math.sin(f.spin) * 40) * dt;   // a little side-to-side sway
    f.y += f.vy * dt;
    f.spin += f.spinSpeed * dt;
  }
  confetti = confetti.filter(f => f.y < floor);
}

// Is there anything on screen that still needs to move?
function somethingIsMoving() {
  return playing || glide !== null || particles.length > 0 || confetti.length > 0;
}

// Book the next animation frame (only one at a time)
function keepAnimating() {
  if (loopRunning) return;
  loopRunning = true;
  requestAnimationFrame(animationFrame);
}

function animationFrame(now) {
  loopRunning = false;
  const dt = Math.min(50, now - lastFrameTime) / 1000;   // seconds since the last frame (never a big jump)
  lastFrameTime = now;
  updateEffects(now, dt);
  draw(now);                                      // draw books the next frame if something still moves
}

// ---------- Drawing ----------

// Stamp one piece picture with its middle at (x, y). scale 1 = normal size.
function stampPiece(value, x, y, scale) {
  const size = spriteSize * scale;
  ctx.drawImage(pieceImages[value], x - size / 2, y - size / 2, size, size);
}

function tintSquare(sq, colour) {
  const at = screenRC(sq);
  ctx.fillStyle = colour;
  ctx.fillRect(at.c * cell, at.r * cell, cell, cell);
}

function draw(now) {
  if (now === undefined) now = performance.now();
  const full = 8 * cell + edge * 2;
  const pulse = 0.5 + 0.5 * Math.sin(now / 260);  // goes smoothly between 0 and 1, for gentle pulsing

  // The wooden board (one stamp of the ready-made picture)
  ctx.clearRect(0, 0, full, full);
  if (boardImage) ctx.drawImage(boardImage, 0, 0, full, full);

  // From here on, (0, 0) is the top left corner of the squares, inside the frame
  ctx.save();
  ctx.translate(edge, edge);

  // Last move: a soft yellow tint on the squares it went from and to
  if (lastMove) {
    tintSquare(lastMove.from, 'rgba(246,220,80,0.45)');
    tintSquare(lastMove.to, 'rgba(246,220,80,0.45)');
  }

  // Selected piece: a green tint under it
  if (selected >= 0) tintSquare(selected, 'rgba(70,170,110,0.55)');

  // King in check: a red glow under it
  if (playing && inCheck(state)) {
    const at = screenRC(kingSquare(state.b, state.turn));
    const cx = at.c * cell + cell / 2, cy = at.r * cell + cell / 2;
    const glow = ctx.createRadialGradient(cx, cy, cell * 0.1, cx, cy, cell * 0.7);
    glow.addColorStop(0, 'rgba(255,60,60,' + (0.75 + 0.2 * pulse).toFixed(2) + ')');
    glow.addColorStop(0.6, 'rgba(255,60,60,0.35)');
    glow.addColorStop(1, 'rgba(255,60,60,0)');
    ctx.fillStyle = glow;
    ctx.fillRect(at.c * cell, at.r * cell, cell, cell);
  }

  // Pieces (the gliding ones are drawn later, on top)
  const glidingTo = glide ? glide.movers.map(mv => mv.to) : [];
  for (let sq = 0; sq < 64; sq++) {
    const v = state.b[sq];
    if (v === 0 || glidingTo.includes(sq)) continue;
    const at = screenRC(sq);
    const x = at.c * cell + cell / 2;
    let y = at.r * cell + cell / 2;
    let scale = 1;
    if (sq === selected) { scale = 1.1; y -= cell * 0.07; }             // the selected piece is lifted a little
    stampPiece(v, x, y, scale);
  }

  // A captured piece stays visible until the gliding piece reaches it
  if (glide && glide.ghost && !glide.ghost.popped) {
    const at = screenRC(glide.ghost.sq);
    stampPiece(glide.ghost.piece, at.c * cell + cell / 2, at.r * cell + cell / 2, 1);
  }

  // Marks on the squares the selected piece can go to: a dot for a plain move, a ring for a capture
  if (selected >= 0 && isHumanTurn()) {
    for (const m of legal) {
      if (m.from !== selected) continue;
      const at = screenRC(m.to);
      const x = at.c * cell + cell / 2, y = at.r * cell + cell / 2;
      if (m.capt) {
        ctx.strokeStyle = 'rgba(214,60,60,0.85)';
        ctx.lineWidth = Math.max(3, cell * 0.075);
        ctx.beginPath();
        ctx.arc(x, y, cell * 0.42, 0, Math.PI * 2);
        ctx.stroke();
      } else {
        ctx.fillStyle = 'rgba(30,70,45,' + (0.3 + 0.15 * pulse).toFixed(2) + ')';
        ctx.beginPath();
        ctx.arc(x, y, cell * 0.15, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  // The gliding pieces, on top of everything else on the board
  if (glide) {
    const t = Math.min(1, Math.max(0, (now - glide.start) / glide.dur));
    const part = t * t * (3 - 2 * t);                                // start and stop gently
    const lift = Math.sin(part * Math.PI);                           // highest in the middle
    for (const mv of glide.movers) {
      const a = screenRC(mv.from), b = screenRC(mv.to);
      const x = (a.c + (b.c - a.c) * part) * cell + cell / 2;
      const y = (a.r + (b.r - a.r) * part) * cell + cell / 2;
      stampPiece(mv.piece, x, y - lift * cell * 0.08, 1 + lift * 0.1);
    }
  }

  // Puffs
  for (const p of particles) {
    const left = p.life / p.maxLife;                                 // 1 = just made, 0 = gone
    ctx.globalAlpha = Math.max(0, left);
    if (p.ring) {
      ctx.strokeStyle = p.colour;
      ctx.lineWidth = Math.max(1.5, cell * 0.05);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size + (1 - left) * cell * 0.45, 0, Math.PI * 2);
      ctx.stroke();
    } else {
      ctx.fillStyle = p.colour;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.5 + left * 0.5), 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawConfetti();
  if (somethingIsMoving()) keepAnimating();
}

// Confetti is drawn on its own see-through layer, so it can fall over the whole page
function drawConfetti() {
  if (!confetti.length && !fxDirty) return;       // nothing there and nothing to wipe
  fxCtx.clearRect(0, 0, window.innerWidth, window.innerHeight);
  fxDirty = confetti.length > 0;
  for (const f of confetti) {
    fxCtx.save();
    fxCtx.translate(f.x, f.y);
    fxCtx.rotate(f.spin);
    fxCtx.fillStyle = f.colour;
    // Squashing the height makes the paper look like it is tumbling
    fxCtx.fillRect(-f.w / 2, -f.h / 2 * Math.cos(f.spin * 1.7), f.w, f.h * Math.cos(f.spin * 1.7));
    fxCtx.restore();
  }
}

// ---------- Fit the board to the screen ----------
function resize() {
  const dpr = window.devicePixelRatio || 1;       // keep drawing sharp on phone screens
  const space = Math.min(boardWrap.clientWidth, boardWrap.clientHeight);
  edge = Math.max(12, Math.round(space * FRAME_SHARE));             // wooden frame around the squares
  cell = Math.floor((space - edge * 2) / 8);
  cell = Math.max(cell, 20);
  const full = 8 * cell + edge * 2;
  canvas.style.width  = full + 'px';
  canvas.style.height = full + 'px';
  canvas.width  = Math.round(full * dpr);
  canvas.height = Math.round(full * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // The confetti layer covers the whole page
  fxCanvas.width  = Math.round(window.innerWidth * dpr);
  fxCanvas.height = Math.round(window.innerHeight * dpr);
  fxCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

  buildPictures(dpr);                             // repaint the board and piece pictures at the new size
  showCaptured();
  draw();
}

// ---------- Pawn promotion picker ----------
function showPromoPicker(moves) {
  pendingPromo = moves;
  const holder = promoPane.querySelector('.choices');
  holder.textContent = '';
  const dpr = window.devicePixelRatio || 1;
  for (const type of [QUEEN, ROOK, BISHOP, KNIGHT]) {
    const btn = document.createElement('button');
    btn.dataset.promo = type;
    const made = makeHiddenCanvas(52, 52, dpr);
    paintPiece(made.g, type, state.turn, 26, 26, 50, dpr);
    btn.appendChild(made.canvas);
    btn.addEventListener('click', () => {
      if (!pendingPromo) return;
      const m = pendingPromo.find(x => x.promo === type);
      sfx.button();
      if (m) playMove(m);
    });
    holder.appendChild(btn);
  }
  promoPane.classList.remove('hidden');
}

// ---------- Input: tap a piece, then tap a square ----------
canvas.addEventListener('click', (e) => {
  if (!isHumanTurn() || pendingPromo) return;

  const rect = canvas.getBoundingClientRect();
  const c = Math.floor((e.clientX - rect.left - edge) / cell);      // "edge" skips the wooden frame
  const r = Math.floor((e.clientY - rect.top - edge) / cell);
  if (!onBoard(r, c)) return;
  const sq = screenToSquare(r, c);
  tapSquare(sq);
});

function tapSquare(sq) {
  // Tapped a square the selected piece can go to: play that move (or ask which piece a pawn becomes)
  if (selected >= 0) {
    const options = legal.filter(m => m.from === selected && m.to === sq);
    if (options.length === 1) { playMove(options[0]); return; }
    if (options.length > 1) { showPromoPicker(options); draw(); return; }
  }
  // Tapped one of your own pieces: select it. Anything else clears the selection.
  const hadSelection = selected >= 0;
  const v = state.b[sq];
  if (v !== 0 && Math.sign(v) === state.turn && sq !== selected) {
    selected = sq;
    sfx.select();
  } else {
    selected = -1;
    if (v !== 0 || hadSelection) sfx.illegal();           // an enemy piece, or a square you cannot go to
  }
  updateHud();
  draw();
}

// ---------- Input: buttons ----------
btnUndo.addEventListener('click', () => { if (!btnUndo.disabled) { sfx.button(); undo(); } });
btnFlip.addEventListener('click', () => {
  sfx.button();
  flipped = !flipped;
  selected = -1;
  buildPictures(window.devicePixelRatio || 1);    // the coordinates in the frame turn round too
  updateHud();
  draw();
});
document.getElementById('btnNew').addEventListener('click', () => { sfx.button(); startGame(); });
document.getElementById('btnMode').addEventListener('click', () => { sfx.button(); showStartScreen(); });
for (const btn of document.querySelectorAll('#modes button')) {
  btn.addEventListener('click', () => { sfx.button(); startGame(btn.dataset.mode); });
}
// The result card ignores taps for a moment after it pops in, so a tap meant for the board
// does not start a new game by accident
function cardReady() { return performance.now() - cardShownAt >= CARD_GUARD_MS; }
document.getElementById('cardNew').addEventListener('click', () => { if (cardReady()) { sfx.button(); startGame(); } });
document.getElementById('cardMode').addEventListener('click', () => { if (cardReady()) { sfx.button(); showStartScreen(); } });

// ---------- Test hooks (used by the automatic tests, not by players) ----------
window.CH = {
  get state() { return state; },
  get mode() { return mode; },
  get legal() { return legal.map(m => ({ from: squareName(m.from), to: squareName(m.to), promo: m.promo, flag: m.flag, capt: m.capt })); },
  get result() { return result; },
  get thinking() { return thinking; },
  get flipped() { return flipped; },
  get selected() { return selected >= 0 ? squareName(selected) : null; },
  get historyLength() { return history.length; },
  get hasWorker() { return worker !== null; },
  get confettiCount() { return confetti.length; },
  get cardVisible() { return !overlay.classList.contains('hidden') && !card.classList.contains('hidden'); },
  fen() { return toFEN(state); },
  loadFEN(fen) { setPosition(parseFEN(fen)); },
  startGame(m) { startGame(m); },
  // Play a move by square names, e.g. CH.move('e2', 'e4') or CH.move('e7', 'e8', 'q')
  move(from, to, promo) {
    const f = squareIndex(from), t = squareIndex(to);
    const promoType = promo ? { q: QUEEN, r: ROOK, b: BISHOP, n: KNIGHT }[promo] : 0;
    const m = legal.find(x => x.from === f && x.to === t && (x.promo === promoType || (!promo && (x.promo === 0 || x.promo === QUEEN))));
    if (!m || !playing) return false;
    playMove(m);
    return true;
  },
  // Where a square is on the screen (CSS pixels, relative to the page), for tapping in tests
  squareCenter(name) {
    const at = screenRC(squareIndex(name));
    const rect = canvas.getBoundingClientRect();
    return { x: rect.left + edge + at.c * cell + cell / 2, y: rect.top + edge + at.r * cell + cell / 2 };
  },
  // Run the computer right now (no waiting, no worker) and return its move as square names
  ai(level, fen) {
    const s = fen ? parseFEN(fen) : state;
    const m = chooseMove(s, level || mode, fen ? [] : keys);
    return m ? { from: squareName(m.from), to: squareName(m.to), promo: m.promo } : null;
  },
  perft(depth, fen) { return perft(fen ? parseFEN(fen) : state, depth); },
  // The rules and the computer, for self-play tests without the screen
  engine: { newState, parseFEN, toFEN, legalMoves, makeMove, chooseMove, positionKey, gameResult, perft, inCheck }
};

// ---------- Start ----------
window.addEventListener('resize', resize);
resize();
updateHud();
</script>
</body>
