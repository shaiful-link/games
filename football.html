    ty = clamp(ty, 0.4, PITCH_H - 0.4);
    const k = Math.min(1, 22 * dt);
    b.x += (tx - b.x) * k;
    b.y += (ty - b.y) * k;
    b.z = 0; b.vz = 0;
    b.vx = o.vx; b.vy = o.vy;
    b.idle = 0;
  } else {
    b.idle += dt;
    b.passAge += dt;
    if (b.idle > stats.longestIdle && phase === 'play') stats.longestIdle = b.idle;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    if (b.z > 0 || b.vz > 0) {                                   // in the air: fall, and bounce a little on landing
      b.vz -= GRAVITY * dt;
      b.z += b.vz * dt;
      if (b.z <= 0) { b.z = 0; b.vz = b.vz < -6 ? -b.vz * 0.45 : 0; }
    }
    const keep = Math.exp(-(b.z > 0.05 ? AIR_DRAG : BALL_FRICTION) * dt);
    b.vx *= keep;
    b.vy *= keep;
    if (b.z === 0 && b.vz === 0 && ballSpeed() < 1.2) { b.vx = 0; b.vy = 0; }
    if (phase === 'ended') { b.vx *= 0.9; b.vy *= 0.9; }           // the whistle has gone: the ball rolls to a stop
    // whatever happens, the ball never leaves the picture
    b.x = clamp(b.x, -MARGIN_X + 1, PITCH_W + MARGIN_X - 1);
    b.y = clamp(b.y, -MARGIN_Y + 1, PITCH_H + MARGIN_Y - 1);
    hitGoalFrame(oldX, dt);
    const speed = ballSpeed();
    // a long ball rolling towards a goal becomes "a shot" once it gets close (checked a few times a second)
    b.shotCheck -= dt;
    if (!b.shot && speed > 8 && b.shotCheck <= 0 && phase === 'play') { b.shotCheck = 0.1; registerShot(); }
    if (b.shot && speed < 6) b.shot = null;
    if (b.target && (speed < 4 || b.passAge > 2.5)) b.target = null;
    if (speed < 40) b.hot = false;
  }
  rollBall(b.x - oldX, b.y - oldY);
  // remember the last few places of a hard shot, for its trail
  if (b.hot && !fastForward) { b.trail.push({ x: b.x, y: b.y, z: b.z }); if (b.trail.length > 7) b.trail.shift(); }
  else if (b.trail.length) b.trail.shift();
}

// Who touches the ball this step? (steals, saves, loose balls, deflections)
function ballTouches(dt) {
  const b = ball;
  const o = b.owner;
  if (o) {
    // Somebody has it: can a nearby opponent bump it off them?
    if (o.role === 'gk' || o.protect > 0) return;
    const other = teams[1 - o.team];
    for (const q of other.players) {
      if (q.state !== 'run' || q.cool > 0) continue;
      const d = dist(q.x, q.y, b.x, b.y);
      let rate = 0;
      if (q.role === 'gk') {
        if (d < GK_GRAB) rate = GK_SMOTHER_RATE * other.skill.keeper;
      } else if (d < STEAL_REACH) {
        // easiest when the dribbler runs straight at the defender, hard from behind
        const front = Math.cos(o.facing - Math.atan2(q.y - o.y, q.x - o.x));   // 1 = right in front, -1 = right behind
        rate = other.skill.steal * (front > 0.5 ? STEAL_FRONT : (front > -0.25 ? 1 : 0.3));
      }
      if (rate > 0 && Math.random() < rate * dt) { winBall(q, o, false); return; }
    }
    return;
  }
  // A shot the keeper has decided to save: it is saved when it reaches the keeper
  if (b.shot && b.shot.save) {
    const team = teams[b.shot.team];
    const keeper = keeperOf(team);
    const toGoal = (b.x - keeper.x) * -team.dir;                 // above 0 = already past the keeper
    if (toGoal > -1.8 && (keeper.state === 'run' || keeper.state === 'dive')) {
      makeSave(keeper);
      return;
    }
  }

  if (b.z > 3) return;                                           // too high for anybody else to reach

  // Otherwise the nearest player who can reach the ball gets it (or it bounces off them if it is going too fast)
  let best = null, bestD = 1e9;
  for (const p of players) {
    if (p.state === 'stun' || p.state === 'down' || p.state === 'celebrate' || p.cool > 0) continue;
    if (p === b.kicker && b.kickerT > 0) continue;               // you cannot trap your own kick straight away
    if (p.role === 'gk' && (p.state === 'dive' || (b.shot && b.shot.team === p.team && b.shot.decided))) continue;   // a beaten keeper
    if (b.safeT > 0 && p.team !== b.safeTeam) continue;          // the keeper has only just thrown it out
    const reach = p.role === 'gk' ? GK_GRAB : (p.state === 'slide' ? TACKLE_REACH : PICKUP_REACH);
    const d = dist(p.x, p.y, b.x, b.y);
    if (d < reach && d < bestD) { bestD = d; best = p; }
  }
  if (!best) return;
  const speed = ballSpeed();
  const tooFast = best.role === 'gk' ? speed > GK_CATCH_SPEED : (speed > DEFLECT_SPEED && best !== b.target);
  if (!tooFast) { takeBall(best, false); return; }
  // Deflection: the ball bounces off the player (only if it is flying towards them, not away from them)
  const d = Math.max(0.1, bestD);
  const nx = (b.x - best.x) / d, ny = (b.y - best.y) / d;
  const into = b.vx * nx + b.vy * ny;
  if (into >= 0) return;
  b.vx -= 2 * into * nx;
  b.vy -= 2 * into * ny;
  b.vx = b.vx * 0.4 + (Math.random() - 0.5) * 8;
  b.vy = b.vy * 0.4 + (Math.random() - 0.5) * 8;
  b.vz = 3 + Math.random() * 4;
  b.z = Math.max(b.z, 0.1);
  b.lastTeam = best.team;
  b.target = null;
  b.hot = false;
  b.idle = 0;
  best.cool = 0.3;
  sound('kick', 0.5);
  registerShot();
}

// Has the ball left the pitch, or gone into a goal?
function checkOut() {
  const b = ball, mid = PITCH_H / 2;
  if (b.owner && b.owner.role === 'gk') return;
  if (b.x < -BALL_R || b.x > PITCH_W + BALL_R) {
    const side = b.x < 0 ? 0 : 1;
    if (Math.abs(b.y - mid) < GOAL_HALF && b.z < BAR_HEIGHT) { goalScored(side); return; }
    // Over the end line: corner if the defending team touched it last, otherwise a goal kick
    const defending = teams[0].dir > 0 ? teams[side === 0 ? 0 : 1] : teams[side === 0 ? 1 : 0];
    const gx = side === 0 ? 0 : PITCH_W;
    if (b.wasShot > 0 && Math.abs(b.y - mid) < GOAL_HALF + 6) sound('ooh');   // a near miss
    if (b.lastTeam === defending.idx) setRestart('corner', 1 - defending.idx, gx + (side === 0 ? 1.2 : -1.2), b.y < mid ? 1.2 : PITCH_H - 1.2);
    else setRestart('goalkick', defending.idx, gx + (side === 0 ? 5 : -5), mid + (b.y < mid ? -5 : 5));
    return;
  }
  if (b.y < -BALL_R || b.y > PITCH_H + BALL_R) {
    setRestart('kickin', 1 - b.lastTeam, clamp(b.x, 1.5, PITCH_W - 1.5), b.y < 0 ? 1 : PITCH_H - 1);
  }
}

// A match must always keep moving: if the ball is forgotten or play is jammed in a corner, drop the ball
function watchStuck(dt) {
  const b = ball;
  if (!b.owner && ballSpeed() < 1.5 && b.z === 0) stillTime += dt; else stillTime = 0;
  const cornerX = Math.min(b.x, PITCH_W - b.x), cornerY = Math.min(b.y, PITCH_H - b.y);
  if (cornerX < 10 && cornerY < 10) cornerTime += dt; else cornerTime = 0;
  if (stillTime > STUCK_SECONDS || cornerTime > CORNER_STUCK_SECONDS) dropBall();
}

// One step of the match (dt is always the same small slice of a second)
function stepMatch(dt) {
  // 1. The referee: pauses in play, and the clock
  if (phase === 'kickoff') { phaseT -= dt; if (phaseT <= 0) startPlay(); }
  else if (phase === 'restart') stepRestart(dt);
  else if (phase === 'goal') { phaseT -= dt; if (phaseT <= 0) afterGoal(); }
  else if (phase === 'ended') { phaseT -= dt; if (phaseT <= 0) afterWhistle(); }
  else if (!demo) {
    if (golden) goldenTime += dt;
    else {
      halfTime += dt;
      if (halfTime >= HALF_SECONDS) { halfTime = HALF_SECONDS; endHalf(); }
    }
  }
  if (screen !== 'match' && !demo) return;                       // a card has just opened

  // 2. Everybody decides where to go
  readStick();
  for (const team of teams) {
    team.thinkT -= dt;
    if (team.thinkT <= 0) { team.thinkT = 0.12; thinkTeam(team); }
  }
  for (const p of players) steerPlayer(p, dt);
  input.passTap = false;                                         // button taps are used once
  input.shootPress = false;

  // 3. Move, then see what the ball ran into
  movePlayers(dt);
  moveBall(dt);
  if (phase === 'play') ballTouches(dt);
  if (phase === 'play') checkOut();
  if (phase === 'play') watchStuck(dt);
  if (!demo) autoSwitch(dt);
  for (const n of netShake) n.t += dt;
}

// One step of the whole game. The match only moves while it is on screen and not paused.
const STEP = 1 / 60;
function stepGame(dt) {
  if (screen === 'match') { if (!paused) stepMatch(dt); }
  else if (demo && (screen === 'title' || screen === 'teams')) stepMatch(dt);
}

// ---------- Effects (looks only: they never change the match) ----------
function addParticle(p) {
  if (particles.length >= MAX_PARTICLES) particles.shift();      // too many: forget the oldest
  particles.push(p);
}

// Little bits of grass flying up (tackles and hard shots)
function spawnGrass(x, y, count) {
  if (fastForward) return;
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, s = 4 + Math.random() * 9;
    addParticle({ kind: 'grass', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, t: 0, life: 0.35 + Math.random() * 0.3,
                  size: 0.28 + Math.random() * 0.22, color: Math.random() < 0.5 ? '#8fe08a' : '#3fae4e', spin: 0 });
  }
}

// Paper confetti falling over the whole pitch
const CONFETTI_COLORS = ['#f4d35e', '#ff6b6b', '#4dd4ac', '#5b8def', '#ffffff', '#ff8fab', '#b388eb'];
function spawnConfetti(count) {
  if (fastForward) return;
  for (let i = 0; i < count; i++) {
    addParticle({ kind: 'confetti', x: -MARGIN_X + Math.random() * (PITCH_W + MARGIN_X * 2), y: -MARGIN_Y - Math.random() * 26,
                  vx: (Math.random() - 0.5) * 6, vy: 12 + Math.random() * 12, t: 0, life: 3 + Math.random() * 2,
                  size: 0.6 + Math.random() * 0.5, color: pick(CONFETTI_COLORS), spin: Math.random() * 6 });
  }
}

// One firework: a ring of bright sparks
function spawnFirework(x, y) {
  const color = pick(CONFETTI_COLORS);
  for (let i = 0; i < 22; i++) {
    const a = i / 22 * Math.PI * 2 + Math.random() * 0.2, s = 9 + Math.random() * 11;
    addParticle({ kind: 'spark', x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.8 + Math.random() * 0.5,
                  size: 0.65, color, spin: 0 });
  }
  sfx.pop();
}

// A word that floats up from a place on the pitch ("Saved!", "Corner", ...)
function spawnFloat(text, x, y, color) {
  if (demo || fastForward) return;
  floats.push({ text, x, y, t: 0, color });
  if (floats.length > 4) floats.shift();
}

function updateEffects(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.t += dt;
    if (p.t >= p.life) { particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    if (p.kind === 'grass') { p.vy += 30 * dt; p.vx *= 0.94; }
    else if (p.kind === 'spark') { p.vy += 9 * dt; p.vx *= 0.97; p.vy *= 0.97; }
    else p.vx += Math.sin(p.t * 5 + p.spin) * 14 * dt;            // confetti flutters from side to side
  }
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].t += dt;
    if (floats[i].t > 1.5) floats.splice(i, 1);
  }
  if (shakeTime > 0) shakeTime -= dt;
  if (bannerTime >= 0) { bannerTime += dt; if (bannerTime > 2.3) bannerTime = -1; }
  // Trophy screen: keep the fireworks and confetti coming
  if (screen === 'cupwon') {
    fireworkTimer -= dt;
    if (fireworkTimer <= 0) {
      fireworkTimer = 0.55;
      spawnFirework(8 + Math.random() * (PITCH_W - 16), 4 + Math.random() * (PITCH_H * 0.6));
      spawnConfetti(10);
    }
  }
}

// ---------- Screen layout ----------
const VIEW_W = PITCH_W + MARGIN_X * 2, VIEW_H = PITCH_H + MARGIN_Y * 2;   // the pitch plus its surroundings
let dpr = 1, screenW = 0, screenH = 0;
let scale = 0;                   // screen pixels per pitch unit
let viewX = 0, viewY = 0, viewW = 0, viewH = 0;   // where the pitch picture sits on the screen
let portrait = false;            // true when the phone is held upright
let hudH = 26;                   // height of the scoreboard strip above the pitch
let ui = 1;                      // size of the cards (1 = designed size)
let stickZone = { x: 0, y: 0, w: 0, h: 0 };       // where a touch starts the joystick
let buttonZone = { x: 0, y: 0, w: 0, h: 0 };      // where a touch presses Pass or Shoot
let stickHome = { x: 0, y: 0 }, stickR = 40;      // where the joystick rests, and its size
const padPass = { x: 0, y: 0 }, padShoot = { x: 0, y: 0 };
let buttonR = 32;
let stripGradient = null;

// The pitch picture is stamped onto the screen every frame. Stamping is fastest (and sharpest) when the
// picture lands exactly on the screen's real pixels, so the size and position are rounded to whole pixels.
function wholePixelScale(wanted) { return Math.floor(wanted * VIEW_W * dpr) / (VIEW_W * dpr); }
function snap(v) { return Math.round(v * dpr) / dpr; }

function resize() {
  dpr = window.devicePixelRatio || 1;            // keep drawing sharp on phone screens
  screenW = stage.clientWidth;
  screenH = stage.clientHeight;
  if (!screenW || !screenH) return;              // the page is hidden: nothing to fit yet
  canvas.width  = Math.round(screenW * dpr);
  canvas.height = Math.round(screenH * dpr);
  portrait = screenH > screenW * 1.1;
  if (!portrait) {
    // Sideways (the normal way): pitch in the middle, a control strip on each side
    hudH = 26;
    const minStrip = clamp(screenW * 0.14, 92, 130);
    scale = wholePixelScale(Math.min((screenW - minStrip * 2) / VIEW_W, (screenH - hudH) / VIEW_H));
    viewW = VIEW_W * scale;
    viewH = VIEW_H * scale;
    viewX = snap((screenW - viewW) / 2);
    viewY = snap(hudH + (screenH - hudH - viewH) / 2);
    const strip = viewX;
    stickZone = { x: 0, y: 0, w: strip, h: screenH };
    buttonZone = { x: screenW - strip, y: 0, w: strip, h: screenH };
    stickR = clamp(strip * 0.36, 30, 50);
    stickHome = { x: strip / 2, y: screenH * 0.64 };
    buttonR = clamp(Math.min(strip * 0.31, screenH * 0.105), 24, 42);
    const shift = clamp((strip - buttonR * 2) / 2 - 5, 0, 14);   // the two buttons are a little offset, like a game pad
    padShoot.x = screenW - strip / 2 + shift;
    padShoot.y = screenH * 0.75;
    padPass.x = screenW - strip / 2 - shift;
    padPass.y = padShoot.y - buttonR * 2 - 12;
  } else {
    // Upright: pitch across the top, controls underneath (it works, but sideways is bigger)
    hudH = 48;
    scale = wholePixelScale(screenW / VIEW_W);
    viewW = VIEW_W * scale;
    viewH = VIEW_H * scale;
    viewX = snap((screenW - viewW) / 2);
    viewY = hudH;
    const top = viewY + viewH + 34, h = screenH - top;
    stickZone = { x: 0, y: top, w: screenW / 2, h };
    buttonZone = { x: screenW / 2, y: top, w: screenW / 2, h };
    stickR = 46;
    stickHome = { x: screenW * 0.25, y: top + Math.min(h * 0.45, 170) };
    buttonR = 38;
    padShoot.x = screenW * 0.80; padShoot.y = stickHome.y + 34;
    padPass.x = screenW * 0.57;  padPass.y = stickHome.y - 30;
  }
  ui = Math.min(screenW / 600, screenH / 350, 1.5);
  stripGradient = ctx.createLinearGradient(0, 0, 0, screenH);
  stripGradient.addColorStop(0, '#131e3d');
  stripGradient.addColorStop(1, '#0c1428');
  stick.id = -1;                                 // let go of everything: the layout has moved
  resetInput();

  // The pre-painted pictures depend on the screen size, so paint them again
  buildPitch();
  buildPlayerSprites();
  buildTrophy();
}

// ---------- Pre-painted pictures ----------
// The pitch (grass, lines, boards, crowd) is painted once here and stamped every frame.
const pitchCanvas = document.createElement('canvas');
const RUN_X = GOAL_DEPTH + 1.2, RUN_Y = 1.8;     // strip of grass outside the lines
const BOARD = 0.9;                               // thickness of the advertising boards

function buildPitch() {
  const res = dpr * scale;                       // real pixels per pitch unit
  pitchCanvas.width = Math.max(1, Math.round(VIEW_W * res));
  pitchCanvas.height = Math.max(1, Math.round(VIEW_H * res));
  const g = pitchCanvas.getContext('2d');
  g.setTransform(res, 0, 0, res, MARGIN_X * res, MARGIN_Y * res);   // from here on, draw in pitch units
  const W = PITCH_W, H = PITCH_H, mid = H / 2;

  // 1. The crowd: lots of small coloured dots on dark stands, then a dark veil so it looks far away and blurred
  g.fillStyle = '#0d152b';
  g.fillRect(-MARGIN_X, -MARGIN_Y, VIEW_W, VIEW_H);
  seed = 11;
  const crowdColors = ['#e8c39e', '#c98d62', '#8d5a3b', '#f4d35e', '#ff6b6b', '#5b8def', '#ffffff', '#4dd4ac', '#b388eb'];
  for (let i = 0; i < 1700; i++) {
    const x = -MARGIN_X + seededRandom() * VIEW_W, y = -MARGIN_Y + seededRandom() * VIEW_H;
    const color = crowdColors[Math.floor(seededRandom() * crowdColors.length)];
    const r = 0.3 + seededRandom() * 0.22;
    if (x > -RUN_X - BOARD && x < W + RUN_X + BOARD && y > -RUN_Y - BOARD && y < H + RUN_Y + BOARD) continue;   // not on the grass
    g.globalAlpha = 0.45 + seededRandom() * 0.3;
    g.fillStyle = color;
    g.beginPath();
    g.arc(x, y, r, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 1;
  g.fillStyle = 'rgba(11,18,32,0.38)';
  g.fillRect(-MARGIN_X, -MARGIN_Y, VIEW_W, VIEW_H);

  // 2. Advertising boards all round: plain coloured panels with simple shapes (no real names)
  const boardColors = ['#e63946', '#f4d35e', '#2bb89a', '#4a72c4', '#f4f4f0', '#ff9f43', '#8f6be8'];
  let n = 0;
  function board(x, y, w, h) {
    const color = boardColors[n % boardColors.length];
    const ink = isLight(color) ? 'rgba(16,22,38,0.75)' : 'rgba(255,255,255,0.85)';
    g.fillStyle = color;
    g.fillRect(x, y, w, h);
    g.fillStyle = ink;
    const long = Math.max(w, h), flat = w >= h;
    // three kinds of pattern: a long bar, a row of dots, two blocks
    for (let k = 0; k < 3; k++) {
      const at = (0.25 + k * 0.25) * long;
      const size = n % 3 === 0 ? 0.42 : 0.3;
      const cx = flat ? x + at : x + w / 2, cy = flat ? y + h / 2 : y + at;
      if (n % 3 === 1) { g.beginPath(); g.arc(cx, cy, size, 0, Math.PI * 2); g.fill(); }
      else if (flat) g.fillRect(cx - (n % 3 === 0 ? 1.1 : 0.6), cy - size / 2, n % 3 === 0 ? 2.2 : 1.2, size);
      else g.fillRect(cx - size / 2, cy - (n % 3 === 0 ? 1.1 : 0.6), size, n % 3 === 0 ? 2.2 : 1.2);
    }
    g.fillStyle = 'rgba(0,0,0,0.22)';                            // a darker edge gives the board some depth
    if (flat) g.fillRect(x, y + h * 0.78, w, h * 0.22); else g.fillRect(x + w * 0.78, y, w * 0.22, h);
    n++;
  }
  const acrossCount = 10, acrossW = (W + (RUN_X + BOARD) * 2) / acrossCount;
  for (let i = 0; i < acrossCount; i++) {
    board(-RUN_X - BOARD + i * acrossW, -RUN_Y - BOARD, acrossW - 0.25, BOARD);
    board(-RUN_X - BOARD + i * acrossW, H + RUN_Y, acrossW - 0.25, BOARD);
  }
  const downCount = 6, downH = (H + RUN_Y * 2) / downCount;
  for (let i = 0; i < downCount; i++) {
    board(-RUN_X - BOARD, -RUN_Y + i * downH, BOARD, downH - 0.25);
    board(W + RUN_X, -RUN_Y + i * downH, BOARD, downH - 0.25);
  }

  // 3. Grass: a darker surround, then ten mown stripes
  g.fillStyle = '#1f6e36';
  g.fillRect(-RUN_X, -RUN_Y, W + RUN_X * 2, H + RUN_Y * 2);
  for (let i = 0; i < 10; i++) {
    g.fillStyle = i % 2 === 0 ? '#35a650' : '#2c9545';
    g.fillRect(i * W / 10, 0, W / 10, H);
  }
  // thousands of tiny light and dark strokes give the grass some texture
  g.lineWidth = 0.13;
  for (let i = 0; i < 3200; i++) {
    const x = -RUN_X + seededRandom() * (W + RUN_X * 2), y = -RUN_Y + seededRandom() * (H + RUN_Y * 2);
    g.strokeStyle = seededRandom() < 0.5 ? 'rgba(255,255,255,0.055)' : 'rgba(0,0,0,0.07)';
    g.beginPath();
    g.moveTo(x, y);
    g.lineTo(x + (seededRandom() - 0.5) * 0.5, y + 0.4 + seededRandom() * 0.5);
    g.stroke();
  }
  // floodlights: a little brighter in the middle, a little darker at the edges
  const light = g.createRadialGradient(W / 2, mid, 8, W / 2, mid, 66);
  light.addColorStop(0, 'rgba(255,255,220,0.10)');
  light.addColorStop(0.6, 'rgba(255,255,220,0)');
  light.addColorStop(1, 'rgba(0,20,10,0.22)');
  g.fillStyle = light;
  g.fillRect(-RUN_X, -RUN_Y, W + RUN_X * 2, H + RUN_Y * 2);

  // 4. White lines
  g.strokeStyle = 'rgba(255,255,255,0.9)';
  g.fillStyle = 'rgba(255,255,255,0.9)';
  g.lineWidth = 0.38;
  g.lineJoin = 'round';
  g.strokeRect(0, 0, W, H);
  g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke();
  g.beginPath(); g.arc(W / 2, mid, 9, 0, Math.PI * 2); g.stroke();
  g.beginPath(); g.arc(W / 2, mid, 0.6, 0, Math.PI * 2); g.fill();
  const arcAngle = Math.acos(5 / 8.5);                           // the part of the penalty arc outside the box
  for (let side = 0; side < 2; side++) {
    const gx = side === 0 ? 0 : W, into = side === 0 ? 1 : -1;   // into = direction onto the pitch
    g.strokeRect(Math.min(gx, gx + into * 16), mid - 20, 16, 40);            // penalty area
    g.strokeRect(Math.min(gx, gx + into * 6), mid - 11.5, 6, 23);            // goal area
    g.beginPath(); g.arc(gx + into * 11, mid, 0.5, 0, Math.PI * 2); g.fill();   // penalty spot
    g.beginPath();
    if (side === 0) g.arc(11, mid, 8.5, -arcAngle, arcAngle);
    else g.arc(W - 11, mid, 8.5, Math.PI - arcAngle, Math.PI + arcAngle);
    g.stroke();
    // corner arcs
    g.beginPath(); g.arc(gx, 0, 1.8, side === 0 ? 0 : Math.PI / 2, side === 0 ? Math.PI / 2 : Math.PI); g.stroke();
    g.beginPath(); g.arc(gx, H, 1.8, side === 0 ? -Math.PI / 2 : Math.PI, side === 0 ? 0 : Math.PI * 1.5); g.stroke();
    // the ground inside the goal is in shadow
    g.fillStyle = 'rgba(6,24,14,0.5)';
    g.fillRect(Math.min(gx, gx - into * GOAL_DEPTH), mid - GOAL_HALF, GOAL_DEPTH, GOAL_HALF * 2);
    g.fillStyle = 'rgba(255,255,255,0.9)';
  }

  // 5. Corner flags: a shadow, a pole and a little flag
  for (const fx of [0, W]) {
    for (const fy of [0, H]) {
      g.fillStyle = 'rgba(0,0,0,0.25)';
      g.beginPath(); g.ellipse(fx + 0.7, fy + 0.5, 1.1, 0.35, 0.5, 0, Math.PI * 2); g.fill();
      g.fillStyle = '#ffd21f';
      g.beginPath();
      g.moveTo(fx, fy);
      g.lineTo(fx + (fx === 0 ? -1.7 : 1.7), fy - 0.5);
      g.lineTo(fx + (fx === 0 ? -1.3 : 1.3), fy - 1.6);
      g.closePath();
      g.fill();
      g.fillStyle = '#ffffff';
      g.beginPath(); g.arc(fx, fy, 0.38, 0, Math.PI * 2); g.fill();
    }
  }
}

// Each player's body (shoulders, shirt number, head) is painted once, facing right.
// Arms and legs are drawn fresh every frame so they can swing.
const BODY_UNITS = PLAYER_R * 2.6;               // size of a body picture, in pitch units
function buildPlayerSprites() {
  if (!scale) return;
  const res = clamp(dpr * scale, 6, 30);
  for (const team of teams) {
    for (const p of team.players) {
      const kit = p.role === 'gk' ? team.keeperKit : team.kit;
      const c = document.createElement('canvas');
      c.width = c.height = Math.ceil(BODY_UNITS * res);
      const g = c.getContext('2d');
      g.scale(c.width / BODY_UNITS, c.height / BODY_UNITS);
      g.translate(BODY_UNITS / 2, BODY_UNITS / 2);
      paintBody(g, kit, p);
      p.sprite = c;
    }
  }
}

function paintBody(g, kit, p) {
  const R = PLAYER_R;
  // Shoulders and back, seen from above
  g.beginPath();
  g.ellipse(-0.05 * R, 0, 0.8 * R, 1.0 * R, 0, 0, Math.PI * 2);
  g.fillStyle = kit.shirt;
  g.fill();
  g.save();
  g.clip();
  if (kit.stripes) {                                             // striped shirts
    g.fillStyle = kit.trim;
    for (const k of [-0.62, 0, 0.62]) g.fillRect(-R, (k - 0.15) * R, R * 2, 0.3 * R);
  }
  g.fillStyle = kit.trim;                                        // coloured trim on the two sleeves
  g.fillRect(-R, -1.02 * R, R * 2, 0.2 * R);
  g.fillRect(-R, 0.82 * R, R * 2, 0.2 * R);
  const shadeBack = g.createLinearGradient(-0.85 * R, 0, 0.75 * R, 0);   // a little darker towards the back
  shadeBack.addColorStop(0, 'rgba(0,0,0,0.25)');
  shadeBack.addColorStop(0.55, 'rgba(0,0,0,0)');
  shadeBack.addColorStop(1, 'rgba(255,255,255,0.12)');
  g.fillStyle = shadeBack;
  g.fillRect(-R, -R * 1.1, R * 2, R * 2.2);
  g.restore();
  g.lineWidth = 0.13 * R;
  g.strokeStyle = OUTLINE;
  g.stroke();
  // Shirt number on the back
  g.save();
  g.translate(-0.47 * R, 0);
  g.rotate(Math.PI / 2);
  g.font = '900 ' + (0.64 * R) + 'px system-ui, sans-serif';
  g.textAlign = 'center';
  g.textBaseline = 'middle';
  g.fillStyle = isLight(kit.shirt) ? '#101626' : '#ffffff';
  if (kit.stripes) {                                             // a plain patch so the number is readable on stripes
    g.fillStyle = kit.shirt;
    g.fillRect(-0.5 * R, -0.34 * R, R, 0.66 * R);
    g.fillStyle = '#101626';
  }
  g.fillText(String(p.number), 0, 0.03 * R);
  g.restore();
  // Head: skin underneath, hair on top (set back a little, so a strip of forehead shows at the front)
  g.beginPath();
  g.arc(0.22 * R, 0, 0.45 * R, 0, Math.PI * 2);
  g.fillStyle = p.skin;
  g.fill();
  g.lineWidth = 0.11 * R;
  g.stroke();
  g.beginPath();
  g.arc(0.13 * R, 0, 0.38 * R, 0, Math.PI * 2);
  g.fillStyle = p.hair;
  g.fill();
  g.beginPath();
  g.arc(0.05 * R, -0.12 * R, 0.14 * R, 0, Math.PI * 2);
  g.fillStyle = 'rgba(255,255,255,0.2)';
  g.fill();
}

// The golden cup for the winner's screen (painted once)
const trophyCanvas = document.createElement('canvas');
const TROPHY_W = 120, TROPHY_H = 130;
function buildTrophy() {
  const res = clamp(dpr * ui, 1, 4);
  trophyCanvas.width = Math.ceil(TROPHY_W * res);
  trophyCanvas.height = Math.ceil(TROPHY_H * res);
  const g = trophyCanvas.getContext('2d');
  g.scale(res, res);
  g.translate(TROPHY_W / 2, 0);
  const gold = g.createLinearGradient(-40, 0, 40, 0);
  gold.addColorStop(0, '#c88a12');
  gold.addColorStop(0.35, '#ffe27a');
  gold.addColorStop(0.6, '#f4c430');
  gold.addColorStop(1, '#b87a0c');
  g.strokeStyle = '#7a4e05';
  g.lineWidth = 2.5;
  g.lineJoin = 'round';
  // handles
  g.lineWidth = 7;
  g.strokeStyle = '#d9a21b';
  g.beginPath(); g.arc(-34, 38, 17, Math.PI * 0.5, Math.PI * 1.5); g.stroke();
  g.beginPath(); g.arc(34, 38, 17, -Math.PI * 0.5, Math.PI * 0.5); g.stroke();
  g.lineWidth = 2.5;
  g.strokeStyle = '#7a4e05';
  // bowl
  g.beginPath();
  g.moveTo(-36, 12);
  g.lineTo(36, 12);
  g.quadraticCurveTo(36, 62, 8, 74);
  g.lineTo(8, 92);
  g.lineTo(-8, 92);
  g.lineTo(-8, 74);
  g.quadraticCurveTo(-36, 62, -36, 12);
  g.closePath();
  g.fillStyle = gold;
  g.fill();
  g.stroke();
  // rim, foot and base
  g.fillRect(-40, 8, 80, 8); g.strokeRect(-40, 8, 80, 8);
  g.fillRect(-22, 90, 44, 9); g.strokeRect(-22, 90, 44, 9);
  g.fillStyle = '#3b2a20';
  g.fillRect(-30, 99, 60, 20);
  g.strokeStyle = '#1b1410';
  g.strokeRect(-30, 99, 60, 20);
  g.fillStyle = '#f4d35e';
  g.fillRect(-14, 105, 28, 8);
  // shine and a star
  g.fillStyle = 'rgba(255,255,255,0.55)';
  g.beginPath(); g.ellipse(-20, 34, 4, 15, 0.15, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#fff6cf';
  g.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? 11 : 4.6, a = -Math.PI / 2 + i * Math.PI / 5;
    g.lineTo(4 + Math.cos(a) * r, 40 + Math.sin(a) * r);
  }
  g.closePath();
  g.fill();
}

// ---------- Drawing: the match ----------
// Outline of a box with rounded corners
function roundedRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}

// Text with an optional dark outline (keeps it readable over any background)
function label(text, x, y, size, color, weight, align, outline) {
  ctx.font = (weight || 700) + ' ' + size + 'px system-ui, sans-serif';
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (outline) {
    ctx.lineJoin = 'round';
    ctx.lineWidth = Math.max(2, size * 0.2);
    ctx.strokeStyle = outline;
    ctx.strokeText(text, x, y);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
}

// One arm or leg: a dark line with a coloured line on top
function limb(x1, y1, x2, y2, width, color) {
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.lineWidth = width + 0.22;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();
  ctx.lineWidth = width;
  ctx.strokeStyle = color;
  ctx.stroke();
}
function dot(x, y, r, color) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = color;
  ctx.fill();
}

// One footballer, seen from above. All numbers here are in "player sizes" (R).
function drawPlayer(p) {
  const R = PLAYER_R;
  const team = teams[p.team];
  const kit = p.role === 'gk' ? team.keeperKit : team.kit;
  const speed = Math.hypot(p.vx, p.vy);
  const swing = Math.sin(p.runPhase) * Math.min(1, speed / 10);   // -1 to 1: where the run cycle is

  // The pose: how far forward each foot and hand is, and how far out to the side
  let footA = swing * 1.35, footB = -swing * 1.35;               // left and right foot, forward (+) or back (-)
  let handA = -swing * 0.75 + 0.1, handB = swing * 0.75 + 0.1;   // hands swing opposite to the feet
  let legOut = 0.42, handOut = 1.03;
  let jump = 0;
  if (p.state === 'slide') {                                     // feet first, arms trailing
    footA = 1.6; footB = 1.25; handA = -0.75; handB = -0.6; handOut = 1.2;
  } else if (p.state === 'dive') {                               // stretched out, gloves first
    footA = -1.5; footB = -1.3; handA = 1.6; handB = 1.5; handOut = 0.42; legOut = 0.32;
  } else if (p.state === 'celebrate') {                          // arms up, jumping
    jump = Math.abs(Math.sin(clock * 9 + p.idx * 1.7));
    handA = 0.45; handB = 0.45; handOut = 1.5 + jump * 0.25;
    footA *= 0.5; footB *= 0.5;
  } else if (p.state === 'stun' || p.state === 'down') {         // knocked off balance
    handA = -0.2; handB = 0.5; handOut = 1.35; footA = 0.7; footB = -0.5;
  } else if (p.kickT > 0) {                                      // kicking leg out in front
    footB = 1.5; footA = -0.6;
  } else if (p.role === 'gk' && speed < 6) {                     // keeper ready: arms spread
    handA = 0.4; handB = 0.4; handOut = 1.4;
  }

  // Soft shadow on the grass (it moves away from the player when they jump)
  ctx.fillStyle = 'rgba(0,0,0,0.26)';
  ctx.beginPath();
  ctx.ellipse(p.x + 0.4 + jump * 0.5, p.y + 0.6 + jump * 0.8, R * 1.0, R * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(p.x, p.y - jump * 0.6);
  ctx.rotate(p.facing);
  if (jump > 0) ctx.scale(1 + jump * 0.1, 1 + jump * 0.1);
  ctx.lineCap = 'round';
  // legs: shorts near the hip, sock lower down, dark boot at the end
  const feet = [footA, footB];
  for (let i = 0; i < 2; i++) {
    const y = (i === 0 ? -1 : 1) * legOut * R, fx = feet[i] * R;
    limb(-0.05 * R, y, fx, y, 0.4 * R, kit.socks);
    limb(-0.05 * R, y, fx * 0.4, y, 0.4 * R, kit.shorts);
    dot(fx + Math.sign(fx) * 0.05, y, 0.27 * R, '#16181f');
  }
  // arms: sleeve in the shirt colour, then a hand (keepers wear big gloves)
  const hands = [handA, handB];
  for (let i = 0; i < 2; i++) {
    const side = i === 0 ? -1 : 1;
    const hx = hands[i] * R, hy = side * handOut * R;
    limb(0.05 * R, side * 0.8 * R, hx, hy, 0.34 * R, kit.shirt);
    if (p.role === 'gk') { dot(hx, hy, 0.34 * R, OUTLINE); dot(hx, hy, 0.27 * R, '#f4f4f0'); }
    else { dot(hx, hy, 0.25 * R, OUTLINE); dot(hx, hy, 0.19 * R, p.skin); }
  }
  // body and head: the ready-made picture
  if (p.sprite) ctx.drawImage(p.sprite, -BODY_UNITS / 2, -BODY_UNITS / 2, BODY_UNITS, BODY_UNITS);
  ctx.restore();
}

// The ball: a white ball with dark patches that move as it rolls, and a shadow that
// slides away from it when it is in the air
function drawBall() {
  const b = ball;
  // trail of a hard shot
  for (let i = 0; i < b.trail.length; i++) {
    const t = b.trail[i];
    ctx.globalAlpha = (i + 1) / (b.trail.length + 1) * 0.45;
    dot(t.x, t.y - t.z * 0.55, BALL_R * (0.5 + i * 0.07), '#ffffff');
  }
  ctx.globalAlpha = 1;
  const r = BALL_R * (1 + b.z * 0.07);
  const x = b.x, y = b.y - b.z * 0.55;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(b.x + 0.25 + b.z * 0.35, b.y + 0.35 + b.z * 0.4, BALL_R * 0.95, BALL_R * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#fbfbf7';
  ctx.fill();
  ctx.clip();
  ctx.fillStyle = '#1a1d26';
  for (const s of b.spots) {
    if (s[2] < -0.15) continue;                                  // this dot is on the underside
    const size = r * 0.42 * (0.45 + 0.55 * Math.max(0, s[2]));
    ctx.beginPath();
    ctx.arc(x + s[0] * r * 0.92, y + s[1] * r * 0.92, size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(0,0,0,0.16)';                            // shading on the lower right
  ctx.beginPath();
  ctx.arc(x + r * 0.45, y + r * 0.5, r * 0.8, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.lineWidth = 0.16;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();
}

// One goal seen from above: the net (which bulges and shakes after a goal), posts and crossbar
function drawGoal(side) {
  const gx = side === 0 ? 0 : PITCH_W, out = side === 0 ? -1 : 1;
  const mid = PITCH_H / 2, top = mid - GOAL_HALF, bottom = mid + GOAL_HALF;
  const n = netShake[side];
  const wobble = n.t < 2 ? n.power * Math.exp(-n.t * 3) * Math.cos(n.t * 17) * 1.5 : 0;
  // how far the net is pushed out at height y, at "share" of the way to the back
  function bulge(y, share) {
    if (wobble === 0) return 0;
    const near = (y - n.y) / 4.5;
    return wobble * Math.exp(-near * near) * share;
  }
  ctx.lineWidth = 0.13;
  ctx.strokeStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath();
  // net lines running along the goal
  for (let k = 1; k <= 4; k++) {
    const share = k / 4;
    for (let i = 0; i <= 10; i++) {
      const y = top + (bottom - top) * i / 10;
      const x = gx + out * (GOAL_DEPTH * share + bulge(y, share));
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
  }
  // net lines running from the goal line to the back
  for (let y = top + 1.25; y < bottom - 0.5; y += 1.25) {
    ctx.moveTo(gx, y);
    ctx.lineTo(gx + out * (GOAL_DEPTH * 0.5 + bulge(y, 0.5)), y);
    ctx.lineTo(gx + out * (GOAL_DEPTH + bulge(y, 1)), y);
  }
  ctx.stroke();
  // frame of the net
  ctx.lineWidth = 0.3;
  ctx.strokeStyle = 'rgba(225,232,245,0.9)';
  ctx.beginPath();
  ctx.moveTo(gx, top);
  ctx.lineTo(gx + out * GOAL_DEPTH, top);
  for (let i = 0; i <= 10; i++) {
    const y = top + (bottom - top) * i / 10;
    ctx.lineTo(gx + out * (GOAL_DEPTH + bulge(y, 1)), y);
  }
  ctx.lineTo(gx, bottom);
  ctx.stroke();
  // crossbar and posts
  ctx.lineCap = 'round';
  ctx.lineWidth = 0.95;
  ctx.strokeStyle = OUTLINE;
  ctx.beginPath(); ctx.moveTo(gx, top); ctx.lineTo(gx, bottom); ctx.stroke();
  ctx.lineWidth = 0.62;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  dot(gx, top, POST_R + 0.16, OUTLINE); dot(gx, top, POST_R, '#ffffff');
  dot(gx, bottom, POST_R + 0.16, OUTLINE); dot(gx, bottom, POST_R, '#ffffff');
}

function drawParticles() {
  for (const p of particles) {
    const left = 1 - p.t / p.life;
    ctx.globalAlpha = Math.min(1, left * 2.5);
    ctx.fillStyle = p.color;
    if (p.kind === 'confetti') {
      // a small paper rectangle that turns as it falls
      const turn = p.spin + p.t * 6;
      const w = p.size * 1.3 * Math.abs(Math.cos(turn)) + 0.15;
      ctx.fillRect(p.x - w / 2, p.y - p.size / 2, w, p.size);
    } else if (p.kind === 'spark') {
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * (0.5 + left * 0.6), 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
  }
  ctx.globalAlpha = 1;
}

// Switch the canvas to pitch units (optionally shaken a little)
function usePitchUnits(shakeX, shakeY) {
  ctx.setTransform(dpr * scale, 0, 0, dpr * scale, dpr * (viewX + MARGIN_X * scale + shakeX), dpr * (viewY + MARGIN_Y * scale + shakeY));
}
function useScreenPixels() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

const drawOrder = [];
function drawMatch() {
  let shakeX = 0, shakeY = 0;
  if (shakeTime > 0) {
    shakeX = Math.round((Math.random() * 2 - 1) * SHAKE_PIXELS);
    shakeY = Math.round((Math.random() * 2 - 1) * SHAKE_PIXELS);
  }
  // The ready-made pitch picture
  ctx.save();
  ctx.beginPath();
  ctx.rect(viewX, viewY, viewW, viewH);
  ctx.clip();
  ctx.drawImage(pitchCanvas, viewX + shakeX, viewY + shakeY, pitchCanvas.width / dpr, pitchCanvas.height / dpr);
  if (!ball) { ctx.restore(); return; }
  usePitchUnits(shakeX, shakeY);

  // Rings on the grass: bright under your player, faint under the player a pass is going to
  if (!demo && screen === 'match') {
    const you = teams[0].players[ctrl];
    const beat = 1 + Math.sin(clock * 7) * 0.06;
    ctx.lineWidth = 0.75;
    ctx.strokeStyle = 'rgba(16,22,38,0.55)';
    ctx.beginPath(); ctx.ellipse(you.x, you.y + 0.3, PLAYER_R * 1.55 * beat, PLAYER_R * 1.3 * beat, 0, 0, Math.PI * 2); ctx.stroke();
    ctx.lineWidth = 0.45;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();
    if (ball.target && !ball.owner && ball.target !== you) {
      const t = ball.target;
      ctx.lineWidth = 0.3;
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.beginPath(); ctx.ellipse(t.x, t.y + 0.3, PLAYER_R * 1.4, PLAYER_R * 1.15, 0, 0, Math.PI * 2); ctx.stroke();
    }
  }

  // Players, drawn from the top of the screen down so nearer ones overlap further ones
  drawOrder.length = 0;
  for (const p of players) drawOrder.push(p);
  drawOrder.sort((a, b) => a.y - b.y);
  const ballLow = ball.z < 2.5;
  if (ballLow) drawBall();
  for (const p of drawOrder) drawPlayer(p);
  // a held ball sits in the keeper's gloves, so draw it again on top; a high ball flies over everybody
  if (!ballLow || (ball.owner && ball.owner.role === 'gk')) drawBall();
  drawGoal(0);
  drawGoal(1);

  if (!demo && screen === 'match') {
    const you = teams[0].players[ctrl];
    // The little arrow above your player
    const bob = Math.sin(clock * 6) * 0.25;
    const ax = you.x, ay = you.y - PLAYER_R * 2.1 + bob;
    ctx.beginPath();
    ctx.moveTo(ax - 1.15, ay - 1.5);
    ctx.lineTo(ax + 1.15, ay - 1.5);
    ctx.lineTo(ax, ay);
    ctx.closePath();
    ctx.lineJoin = 'round';
    ctx.lineWidth = 0.45;
    ctx.strokeStyle = OUTLINE;
    ctx.stroke();
    ctx.fillStyle = '#ffe14d';
    ctx.fill();
    // Kick-power bar while Shoot is held: green is the best range, red means "too much"
    if (charging) {
      const w = 7, h = 1.1, bx = you.x - w / 2, by = you.y + PLAYER_R * 1.9;
      const fill = clamp(charge / OVERCHARGE, 0, 1);
      ctx.fillStyle = 'rgba(11,18,32,0.85)';
      ctx.fillRect(bx - 0.25, by - 0.25, w + 0.5, h + 0.5);
      ctx.fillStyle = 'rgba(77,212,172,0.35)';
      ctx.fillRect(bx + w * SWEET_FROM / OVERCHARGE, by, w * (SWEET_TO - SWEET_FROM) / OVERCHARGE, h);
      ctx.fillStyle = charge > 1.02 ? '#ff5a5a' : (charge >= SWEET_FROM && charge <= SWEET_TO ? '#4dd4ac' : '#f4d35e');
      ctx.fillRect(bx, by, w * fill, h);
    }
  }
  const cardWithConfetti = screen === 'fulltime' || screen === 'cupwon';
  if (!cardWithConfetti) drawParticles();
  ctx.restore();
  useScreenPixels();
}

// Words floating up from the pitch, and the GOAL! banner
function drawFloatsAndBanner() {
  for (const f of floats) {
    const x = viewX + (f.x + MARGIN_X) * scale;
    const y = viewY + (f.y + MARGIN_Y) * scale - f.t * 16;
    const size = (13 + 5 * popCurve(f.t / 0.2)) * Math.max(0.8, ui);
    ctx.globalAlpha = clamp((1.5 - f.t) / 0.4, 0, 1);
    label(f.text, clamp(x, viewX + 50, viewX + viewW - 50), y, size, f.color, 800, 'center', 'rgba(11,18,32,0.9)');
    ctx.globalAlpha = 1;
  }
  if (bannerTime >= 0 && !demo) {
    const team = teams[goalTeam];
    const cx = viewX + viewW / 2, cy = viewY + viewH * 0.2;
    const h = 52 * Math.max(0.75, ui);
    const open = clamp(bannerTime / 0.18, 0, 1) * clamp((2.3 - bannerTime) / 0.25, 0, 1);   // opens, then closes
    ctx.save();
    ctx.beginPath();
    ctx.rect(viewX, viewY, viewW, viewH);
    ctx.clip();
    ctx.globalAlpha = 0.94;
    ctx.fillStyle = team.kit.trim;
    ctx.fillRect(viewX, cy - h / 2 * open - 4, viewW, h * open + 8);
    ctx.fillStyle = team.kit.shirt;
    ctx.fillRect(viewX, cy - h / 2 * open, viewW, h * open);
    ctx.globalAlpha = 1;
    if (open > 0.5) {
      const pop = popCurve(bannerTime / 0.35) * (1 + Math.sin(clock * 12) * 0.03);
      const ink = isLight(team.kit.shirt) ? '#101626' : '#ffffff';
      const edge = isLight(team.kit.shirt) ? 'rgba(255,255,255,0.75)' : 'rgba(11,18,32,0.75)';
      label('GOAL!', cx, cy - h * 0.08, h * 0.62 * pop, ink, 900, 'center', edge);
      label(team.info.name, cx, cy + h * 0.33, h * 0.2, ink, 800, 'center');
    }
    ctx.restore();
  }
}

// ---------- Drawing: scoreboard and controls ----------
// The scoreboard, like the one in the corner of a TV broadcast
function clockText() {
  const footballSeconds = golden ? 5400 + goldenTime * 30 : ((half - 1) + halfTime / HALF_SECONDS) * 2700;
  const m = Math.floor(footballSeconds / 60), s = Math.floor(footballSeconds % 60);
  return (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s;
}

function drawScoreBug() {
  const fit = portrait ? Math.min(1, (screenW - 96) / 300) : Math.min(1.15, viewW / 340);
  const cx = screenW / 2, cy = portrait ? 24 : hudH / 2 + 1;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(fit, fit);
  const h = 22;
  roundedRect(ctx, -150, -h / 2, 300, h, 7);
  ctx.fillStyle = '#131e3d';
  ctx.fill();
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.14)';
  ctx.stroke();
  // the two teams: colour chip, short name, score
  for (let i = 0; i < 2; i++) {
    const team = teams[i], dir = i === 0 ? -1 : 1;
    roundedRect(ctx, dir * 141 - 4, -7, 8, 14, 2.5);
    ctx.fillStyle = team.kit.shirt;
    ctx.fill();
    ctx.fillStyle = team.kit.trim;
    ctx.fillRect(dir * 141 - 4, 3, 8, 2.5);
    label(team.info.code, dir * 128, 0.5, 13, '#ffffff', 800, i === 0 ? 'left' : 'right');
    roundedRect(ctx, dir * 62 - 13, -8.5, 26, 17, 4);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.fill();
    ctx.font = '800 14px system-ui, sans-serif';
    label(String(team.score), dir * 62, 0.5, 14, '#f4d35e', 800, 'center');
  }
  // clock and which half
  label(clockText(), -9, 0.5, 13, '#ffffff', 700, 'center');
  label(golden ? 'GG' : (half === 1 ? '1st' : '2nd'), 27, 1, 9.5, golden ? '#ff8fab' : '#8fd3ff', 800, 'center');
  ctx.restore();
}

// Joystick and the two round buttons. They are see-through and light up when touched.
function drawControls() {
  // joystick: a ring, four little direction marks, and the knob
  const bx = stick.id !== -1 ? stick.baseX : stickHome.x, by = stick.id !== -1 ? stick.baseY : stickHome.y;
  const held = stick.id !== -1 || Math.hypot(input.x, input.y) > 0.01;
  ctx.beginPath();
  ctx.arc(bx, by, stickR, 0, Math.PI * 2);
  ctx.fillStyle = held ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.06)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = held ? 'rgba(255,255,255,0.4)' : 'rgba(255,255,255,0.2)';
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  for (let i = 0; i < 4; i++) {
    const a = i * Math.PI / 2;
    const tx = bx + Math.cos(a) * stickR * 0.78, ty = by + Math.sin(a) * stickR * 0.78;
    ctx.beginPath();
    ctx.moveTo(tx + Math.cos(a) * 5, ty + Math.sin(a) * 5);
    ctx.lineTo(tx + Math.cos(a + 2.2) * 5, ty + Math.sin(a + 2.2) * 5);
    ctx.lineTo(tx + Math.cos(a - 2.2) * 5, ty + Math.sin(a - 2.2) * 5);
    ctx.closePath();
    ctx.fill();
  }
  const kx = bx + input.x * stickR * 0.75, ky = by + input.y * stickR * 0.75;
  ctx.beginPath();
  ctx.arc(kx, ky, stickR * 0.5, 0, Math.PI * 2);
  ctx.fillStyle = held ? 'rgba(143,211,255,0.55)' : 'rgba(255,255,255,0.22)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.55)';
  ctx.stroke();

  // buttons: the words change with who has the ball
  const attack = myTeamHasBall();
  drawPad(padPass, attack ? 'Pass' : 'Switch', '#3c9e82', '#2a6f5c', padDown.pass);
  drawPad(padShoot, attack ? 'Shoot' : 'Tackle', '#cf8a34', '#8a5a1f', padDown.shoot);
}

function drawPad(pad, text, color, darkColor, down) {
  const r = buttonR * (down ? 0.94 : 1);
  ctx.globalAlpha = down ? 1 : 0.82;
  ctx.beginPath();
  ctx.arc(pad.x, pad.y + (down ? 1 : 3), r, 0, Math.PI * 2);     // the dark "lip" underneath
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pad.x, pad.y + (down ? 2 : 0), r, 0, Math.PI * 2);
  ctx.fillStyle = down ? shade(color, 0.25) : color;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pad.x, pad.y + (down ? 2 : 0) + r * 0.12, r * 0.86, 0, Math.PI * 2);
  ctx.fillStyle = down ? color : darkColor;
  ctx.globalAlpha *= 0.45;
  ctx.fill();
  ctx.globalAlpha = 1;
  ctx.beginPath();
  ctx.arc(pad.x, pad.y + (down ? 2 : 0), r, 0, Math.PI * 2);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = 'rgba(255,255,255,0.35)';
  ctx.stroke();
  label(text, pad.x, pad.y + (down ? 2 : 0) + 0.5, clamp(r * 0.42, 11, 16), '#ffffff', 800, 'center', 'rgba(0,0,0,0.35)');
}

// ---------- Drawing: cards (title, team select, half time, results, pause) ----------
// Things on a card that can be tapped. The list is rebuilt every frame by whichever card is showing.
let uiButtons = [];              // { x, y, w, h, action } in screen pixels
let uiFocus = 0;                 // which one the keyboard is on
let keyboardUsed = false;        // show the keyboard highlight only after a key was used
let cardX = 0, cardY = 0;        // centre of the card on the screen

// Register a tappable box (given in card units) and say whether the keyboard is on it
function hitBox(x, y, w, h, action) {
  uiButtons.push({ x: cardX + (x - w / 2) * ui, y: cardY + (y - h / 2) * ui, w: w * ui, h: h * ui, action });
  return keyboardUsed && uiFocus === uiButtons.length - 1;
}

// A raised key with a word on it
function drawKey(text, x, y, w, h, color, action, chosen) {
  const focused = hitBox(x, y, w, h, action);
  roundedRect(ctx, x - w / 2, y - h / 2 + 3, w, h, 12);          // dark lip
  ctx.fillStyle = 'rgba(0,0,0,0.4)';
  ctx.fill();
  roundedRect(ctx, x - w / 2, y - h / 2, w, h, 12);
  ctx.fillStyle = color;
  ctx.fill();
  roundedRect(ctx, x - w / 2 + 2, y - h / 2 + h * 0.5, w - 4, h * 0.5 - 2, 10);   // darker lower half
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  ctx.fill();
  if (chosen || focused) {
    roundedRect(ctx, x - w / 2 - 2, y - h / 2 - 2, w + 4, h + 4, 14);
    ctx.lineWidth = 2.5;
    ctx.strokeStyle = chosen ? '#f4d35e' : '#ffffff';
    ctx.stroke();
  }
  label(text, x, y + 1, Math.min(18, h * 0.42), '#ffffff', 800, 'center', 'rgba(0,0,0,0.3)');
}

// A rounded dark card for messages
function drawPanel(cx, cy, w, h, edgeColor, seeThrough) {
  roundedRect(ctx, cx - w / 2, cy - h / 2, w, h, 18);
  ctx.fillStyle = seeThrough ? 'rgba(13,22,44,0.74)' : 'rgba(13,22,44,0.93)';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = edgeColor;
  ctx.stroke();
  roundedRect(ctx, cx - w / 2 + 4, cy - h / 2 + 4, w - 8, h - 8, 14);
  ctx.lineWidth = 1;
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.stroke();
}

// The "Tap to ..." line gently pulses
function drawTapLine(text, x, y) {
  const beat = Math.sin(clock * 5);
  ctx.globalAlpha = 0.82 + beat * 0.18;
  label(text, x, y, 18 + beat * 1.2, '#fff3a6', 800, 'center', 'rgba(11,18,32,0.9)');
  ctx.globalAlpha = 1;
}

// A football shirt seen from the front (for the team cards)
function drawShirt(x, y, size, kit) {
  const s = size;
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(-0.17 * s, -0.44 * s);
  ctx.lineTo(-0.5 * s, -0.3 * s);
  ctx.lineTo(-0.66 * s, 0.0 * s);
  ctx.lineTo(-0.42 * s, 0.1 * s);
  ctx.lineTo(-0.32 * s, -0.06 * s);
  ctx.lineTo(-0.32 * s, 0.46 * s);
  ctx.lineTo(0.32 * s, 0.46 * s);
  ctx.lineTo(0.32 * s, -0.06 * s);
  ctx.lineTo(0.42 * s, 0.1 * s);
  ctx.lineTo(0.66 * s, 0.0 * s);
  ctx.lineTo(0.5 * s, -0.3 * s);
  ctx.lineTo(0.17 * s, -0.44 * s);
  ctx.quadraticCurveTo(0, -0.3 * s, -0.17 * s, -0.44 * s);
  ctx.closePath();
  ctx.fillStyle = kit.shirt;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.fillStyle = kit.trim;
  if (kit.stripes) for (const k of [-0.2, 0.2]) ctx.fillRect((k - 0.07) * s, -0.5 * s, 0.14 * s, s);
  ctx.fillRect(-0.7 * s, 0.38 * s, 1.4 * s, 0.1 * s);            // hem
  // sleeve ends
  ctx.beginPath();
  ctx.moveTo(-0.66 * s, 0); ctx.lineTo(-0.42 * s, 0.1 * s); ctx.lineTo(-0.46 * s, 0.02 * s); ctx.lineTo(-0.62 * s, -0.07 * s);
  ctx.moveTo(0.66 * s, 0); ctx.lineTo(0.42 * s, 0.1 * s); ctx.lineTo(0.46 * s, 0.02 * s); ctx.lineTo(0.62 * s, -0.07 * s);
  ctx.fill();
  ctx.restore();
  ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(1.5, s * 0.045);
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();
  // collar
  ctx.beginPath();
  ctx.moveTo(-0.17 * s, -0.44 * s);
  ctx.quadraticCurveTo(0, -0.3 * s, 0.17 * s, -0.44 * s);
  ctx.lineWidth = s * 0.07;
  ctx.strokeStyle = kit.trim;
  ctx.stroke();
  ctx.restore();
}

// A small still football (decoration on the title card)
function drawBallIcon(x, y, r) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = '#fbfbf7';
  ctx.fill();
  ctx.lineWidth = 2;
  ctx.strokeStyle = OUTLINE;
  ctx.stroke();
  ctx.fillStyle = '#1a1d26';
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    ctx.lineTo(x + Math.cos(a) * r * 0.36, y + Math.sin(a) * r * 0.36);
  }
  ctx.closePath();
  ctx.fill();
  for (let i = 0; i < 5; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 5;
    ctx.beginPath();
    ctx.arc(x + Math.cos(a) * r * 0.95, y + Math.sin(a) * r * 0.95, r * 0.3, 0, Math.PI * 2);
    ctx.save();
    ctx.clip();
    ctx.beginPath();
    ctx.arc(x, y, r - 1, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// ---------- Input: touch (joystick + buttons at the same time) ----------
// Every finger has its own number (pointerId). We remember which finger is on the joystick
// and which is on each button, so two thumbs never get mixed up.
const stick = { id: -1, baseX: 0, baseY: 0, x: 0, y: 0 };        // id -1 = no finger on the joystick
const padDown = { pass: false, shoot: false };
const padFinger = { pass: -1, shoot: -1 };
const keys = {};

function resetInput() {
  stick.id = -1; stick.x = 0; stick.y = 0;
  padDown.pass = false; padDown.shoot = false;
  padFinger.pass = -1; padFinger.shoot = -1;
  input.x = 0; input.y = 0;
  input.passTap = false; input.shootPress = false; input.shootHeld = false;
  for (const k in keys) keys[k] = false;
  charging = false;
  chargeArmed = false;
}

// Work out the joystick direction from the finger (or the keyboard). Result: input.x and input.y, each -1 to 1.
function readStick() {
  let x = stick.x, y = stick.y;
  if (stick.id === -1) {
    x = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
    y = (keys.ArrowDown || keys.s ? 1 : 0) - (keys.ArrowUp || keys.w ? 1 : 0);
  }
  const d = Math.hypot(x, y);
  if (d < 0.18) { input.x = 0; input.y = 0; return; }           // tiny wobble in the middle is ignored
  const k = Math.min(1, d) / d;
  input.x = x * k;
  input.y = y * k;
}

function inZone(zone, x, y) {
  return x >= zone.x && x < zone.x + zone.w && y >= zone.y && y < zone.y + zone.h;
}

function moveStick(x, y) {
  stick.x = (x - stick.baseX) / stickR;
  stick.y = (y - stick.baseY) / stickR;
}

function pressPad(name, on, id) {
  padDown[name] = on;
  padFinger[name] = on ? id : -1;
  if (name === 'pass') { if (on) input.passTap = true; }
  else {
    if (on) input.shootPress = true;
    input.shootHeld = on;
  }
}

canvas.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const x = e.clientX - rect.left, y = e.clientY - rect.top;
  if (screen !== 'match' || paused) { tapCard(x, y); return; }
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* older browsers: still works */ }
  if (inZone(stickZone, x, y) && stick.id === -1) {
    // The joystick appears where the thumb lands (kept fully inside its strip)
    stick.id = e.pointerId;
    stick.baseX = clamp(x, stickZone.x + stickR + 4, stickZone.x + stickZone.w - stickR - 4);
    stick.baseY = clamp(y, stickZone.y + stickR + 46, stickZone.y + stickZone.h - stickR - 4);
    moveStick(x, y);
  } else if (inZone(buttonZone, x, y)) {
    // Anywhere in the button strip counts: the nearer of the two buttons is pressed
    const toPass = dist(x, y, padPass.x, padPass.y), toShoot = dist(x, y, padShoot.x, padShoot.y);
    const name = toPass < toShoot ? 'pass' : 'shoot';
    if (padFinger[name] === -1) pressPad(name, true, e.pointerId);
  }
});
canvas.addEventListener('pointermove', (e) => {
  if (e.pointerId !== stick.id) return;
  const rect = canvas.getBoundingClientRect();
  moveStick(e.clientX - rect.left, e.clientY - rect.top);
});
function liftFinger(e) {
  if (e.pointerId === stick.id) { stick.id = -1; stick.x = 0; stick.y = 0; }
  if (e.pointerId === padFinger.pass) pressPad('pass', false, -1);
  if (e.pointerId === padFinger.shoot) pressPad('shoot', false, -1);
}
canvas.addEventListener('pointerup', liftFinger);
canvas.addEventListener('pointercancel', liftFinger);
canvas.addEventListener('contextmenu', (e) => e.preventDefault());   // no long-press menu

// A tap while a card is showing: press the key under the finger, or "Tap to ..." anywhere else
function tapCard(x, y) {
  if (screenAge < 0.25) return;                                  // the card has only just appeared
  for (const b of uiButtons) {
    if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { b.action(); return; }
  }
  if (!uiButtons.length) advance();
}

btnPause.addEventListener('click', () => {
  btnPause.blur();
  if (screen !== 'match') return;
  sfx.tick();
  setPaused(!paused);
});

// The game pauses by itself when you leave the page or the phone locks
document.addEventListener('visibilitychange', () => {
  if (document.hidden && screen === 'match' && !paused) setPaused(true);
});

// ---------- Input: keyboard (for testing on a laptop) ----------
window.addEventListener('keydown', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  const inPlay = screen === 'match' && !paused;
  if (k === 'p') { if (screen === 'match' && !e.repeat) setPaused(!paused); return; }
  if (!inPlay) {
    keyboardUsed = true;
    if (e.repeat) return;
    if (k === ' ' || k === 'Enter') {
      if (uiButtons.length) { if (screenAge >= 0.25) uiButtons[uiFocus].action(); }
      else advance();
      e.preventDefault();
    } else if (uiButtons.length && (k === 'ArrowRight' || k === 'ArrowDown' || k === 'd' || k === 's')) {
      uiFocus = (uiFocus + 1) % uiButtons.length;
      e.preventDefault();
    } else if (uiButtons.length && (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'a' || k === 'w')) {
      uiFocus = (uiFocus + uiButtons.length - 1) % uiButtons.length;
      e.preventDefault();
    }
    return;
  }
  keys[k] = true;
  if (!e.repeat) {
    if (k === 'z' || k === 'j') input.passTap = true;
    if (k === 'x' || k === 'k') { input.shootPress = true; input.shootHeld = true; }
  }
  if (k.startsWith('Arrow') || k === ' ') e.preventDefault();
});
window.addEventListener('keyup', (e) => {
  const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
  keys[k] = false;
  if (k === 'x' || k === 'k') input.shootHeld = padDown.shoot;
});

// ---------- Main loop ----------
// The screen is redrawn as often as the phone likes, but the match always moves in
// equal steps of 1/60 second. "stepBank" holds the time that has not been played yet.
let lastTime = 0, stepBank = 0;
function loop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.1);            // capped so a paused tab does not jump the game
  lastTime = time;
  clock += dt;
  screenAge += dt;
  stepBank += dt;
  let steps = 0;
  while (stepBank >= STEP && steps < 8) {
    stepGame(STEP);
    stepBank -= STEP;
    steps++;
  }
  if (steps === 8) stepBank = 0;                                 // very slow frame: do not try to catch up
  updateEffects(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- Start ----------
window.addEventListener('resize', resize);
resize();
startDemo();
requestAnimationFrame(loop);
</script>
