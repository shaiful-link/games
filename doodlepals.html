<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Doodle Pals">
<meta name="theme-color" content="#ff5d8f">
<title>Doodle Pals</title>
<style>
:root{
  --pink:#ff5d8f; --yellow:#ffd23f; --teal:#2ec4b6; --purple:#7b5cff;
  --ink:#2b2440; --cream:#fff8ec; --card:#ffffff;
  --font:"Arial Rounded MT Bold","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;height:100%;background:var(--cream);color:var(--ink);font-family:var(--font);
  overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
button{font-family:inherit;color:inherit;border:0;background:none;padding:0;touch-action:manipulation;cursor:pointer;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.screen.on{display:flex;}

/* ---------- Home ---------- */
#home,#album{overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--cream);}
.awning{flex:none;padding:18px 16px 26px;text-align:center;color:#fff;position:relative;
  background:repeating-linear-gradient(90deg,var(--pink) 0 34px,#ff86ab 34px 68px);}
.awning:after{content:"";position:absolute;left:0;right:0;bottom:-11px;height:12px;
  background:radial-gradient(circle at 17px 0,var(--pink) 11px,transparent 12px) 0 0/68px 12px repeat-x,
             radial-gradient(circle at 17px 0,#ff86ab 11px,transparent 12px) 34px 0/68px 12px repeat-x;}
.awning h1{margin:0;font-size:34px;letter-spacing:1px;text-shadow:0 3px 0 rgba(43,36,64,.28);}
.awning p{margin:4px 0 0;font-size:15px;opacity:.95;}
.pill{display:inline-block;margin-top:10px;background:#fff;color:var(--ink);border-radius:999px;padding:6px 16px;font-size:17px;
  box-shadow:0 3px 0 rgba(43,36,64,.18);}
.pill b{color:#f5a400;}
.corner{position:absolute;top:14px;height:42px;border-radius:21px;background:rgba(255,255,255,.92);font-size:20px;color:var(--ink);}
#bMuteHome{right:12px;width:42px;}
#bLang{left:12px;padding:0 12px;font-size:14px;}
#bLang b{color:var(--pink);}
#bLang span{opacity:.45;}
#bAlbumBack{left:12px;width:42px;}
#gallery,#albumGrid{padding:24px 14px 30px;max-width:560px;width:100%;margin:0 auto;}
.trio{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.big3{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:86px;padding:8px 4px;border-radius:20px;color:#fff;
  background:linear-gradient(120deg,var(--purple),#b06cff);box-shadow:0 5px 0 #5a3fd1;}
.big3 .ic{font-size:28px;line-height:1.1;}
.big3 .t1{font-size:15px;margin-top:3px;}
.big3 .t2{font-size:11px;opacity:.95;margin-top:1px;}
.big3.quick{background:linear-gradient(120deg,#ff8a1c,#ffb52e);box-shadow:0 5px 0 #cf6f00;}
.big3.album{background:linear-gradient(120deg,#17b3a4,#4fd8c7);box-shadow:0 5px 0 #0f8c80;}
#nextGift{margin:14px 4px 0;font-size:14px;color:#6d6488;text-align:center;}
.pack{margin:22px 4px 10px;font-size:21px;display:flex;align-items:center;gap:8px;}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.card{background:var(--card);border-radius:22px;padding:10px 10px 12px;box-shadow:0 5px 0 rgba(43,36,64,.14);text-align:center;}
.card:active,.big3:active{transform:translateY(3px);}
.card .pic{border-radius:16px;overflow:hidden;aspect-ratio:1;display:block;}
.card .pic canvas,.card .pic img{width:100%;height:100%;display:block;}
.card .nm{font-size:17px;margin-top:8px;}
.stars{font-size:20px;letter-spacing:2px;color:#d9d3e6;}
.stars .y{color:#ffb800;}
.empty{text-align:center;color:#6d6488;font-size:16px;padding:40px 20px;}

/* ---------- Draw ---------- */
#draw{background:linear-gradient(180deg,#fff1d6,#ffe1ec);overflow:hidden;}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:8px 10px 4px;}
.rnd{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;font-size:20px;box-shadow:0 3px 0 rgba(43,36,64,.16);}
.rnd:active{transform:translateY(2px);}
.ttl{flex:1;min-width:0;text-align:center;}
#tName{font-size:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#tStep{font-size:14px;line-height:1.15;color:#6d6488;margin-top:1px;}
#dots{flex:none;display:flex;justify-content:center;gap:5px;height:18px;align-items:center;}
#dots i{width:9px;height:9px;border-radius:50%;background:#e4d9ee;display:block;}
#dots i.done{background:var(--teal);}
#dots i.now{background:var(--pink);transform:scale(1.35);}
#timer{flex:none;display:none;height:10px;margin:6px 44px 0;border-radius:10px;background:#f1e3f3;overflow:hidden;}
#timer.on{display:block;}
#timer i{display:block;height:100%;width:100%;border-radius:10px;background:var(--teal);}
#timer.low i{background:var(--pink);}
.stageWrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 12px;}
#stage{position:relative;background:#fff;border-radius:24px;overflow:hidden;aspect-ratio:1;
  width:min(calc(100vw - 24px), calc(100vh - 300px), 560px);
  width:min(calc(100vw - 24px), calc(100dvh - 300px), 560px);
  box-shadow:0 6px 0 rgba(43,36,64,.14), 0 0 0 4px #fff;touch-action:none;}
#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
#stage.pop{animation:pop .35s ease;}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.035)}100%{transform:scale(1)}}
.bar{flex:none;display:none;padding:6px 8px 10px;max-width:560px;width:100%;margin:0 auto;}
.bar.on{display:block;}
.row{display:flex;gap:4px;justify-content:center;}
.tool{flex:1;min-width:0;max-width:96px;min-height:54px;border-radius:14px;background:#fff;font-size:20px;line-height:1.1;
  box-shadow:0 3px 0 rgba(43,36,64,.16);display:flex;flex-direction:column;align-items:center;justify-content:center;}
.tool small{font-size:10px;margin-top:2px;white-space:nowrap;}
.tool:active{transform:translateY(2px);}
.tool.sel{background:var(--yellow);box-shadow:0 3px 0 #d9a900;}
.tool.go{background:var(--teal);color:#fff;box-shadow:0 3px 0 #1c9c90;}
#traceBar .tool{font-size:22px;} #traceBar .tool small{font-size:11px;} #traceBar .row{gap:6px;}
.sizes{display:flex;gap:6px;justify-content:center;align-items:center;margin:8px 0 6px;}
.sizes .gap{width:8px;flex:none;}
.sz{position:relative;width:40px;height:36px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(43,36,64,.14);overflow:hidden;}
.sz.st{font-size:18px;}
.sz i{display:block;border-radius:50%;background:var(--ink);}
.sz.sel{background:var(--yellow);}
.panel{display:none;grid-template-columns:repeat(8,1fr);gap:6px;justify-items:center;min-height:86px;align-content:start;}
.panel.on{display:grid;}
.sw{width:100%;max-width:40px;aspect-ratio:1;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 0 rgba(43,36,64,.2);}
.sw.sel{outline:3px solid var(--ink);outline-offset:1px;transform:scale(1.08);}
.pk{position:relative;width:100%;max-width:42px;aspect-ratio:1;border-radius:12px;background:#fff;box-shadow:0 2px 0 rgba(43,36,64,.16);overflow:hidden;}
.pk canvas{width:100%;height:100%;display:block;}
.pk.sel{outline:3px solid var(--ink);outline-offset:1px;}
#scenes{grid-template-columns:repeat(6,1fr);}
#scenes .pk{max-width:54px;}
.lock{position:absolute;inset:0;border-radius:inherit;background:rgba(255,255,255,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-size:13px;line-height:1.05;color:var(--ink);}
.lock small{font-size:10px;color:#b07a00;}

/* ---------- Overlays ---------- */
.over{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(43,36,64,.62);z-index:20;padding:16px;}
.over.on{display:flex;}
.sheet{background:#fff;border-radius:28px;padding:18px 18px 16px;width:100%;max-width:380px;text-align:center;
  animation:rise .4s cubic-bezier(.2,1.4,.4,1);}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 8px;font-size:28px;color:var(--pink);}
.shot{width:62%;border-radius:18px;box-shadow:0 0 0 4px var(--yellow);-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;}
#pImg{animation:wig 1.1s ease-in-out infinite alternate;}
@keyframes wig{from{transform:rotate(-3deg) scale(.98)}to{transform:rotate(3deg) scale(1.03)}}
#vImg{width:86%;}
#pStars{font-size:46px;letter-spacing:6px;margin-top:8px;height:58px;}
#pStars span{display:inline-block;color:#e3deee;transition:color .2s;}
#pStars span.y{color:#ffb800;animation:starpop .45s cubic-bezier(.2,1.8,.4,1);}
@keyframes starpop{from{transform:scale(.2) rotate(-40deg)}to{transform:none}}
#pMsg{font-size:15px;color:#6d6488;min-height:20px;margin:2px 0 6px;}
#pGift{font-size:15px;color:#0f8c80;margin:0 0 10px;}
#vName{font-size:18px;margin:10px 0 12px;}
.btns{display:flex;gap:8px;}
.btn{flex:1;min-width:0;min-height:52px;border-radius:16px;font-size:15px;color:#fff;background:var(--purple);box-shadow:0 4px 0 #5a3fd1;}
.btn.alt{background:var(--teal);box-shadow:0 4px 0 #1c9c90;}
.btn.soft{background:#efeaf7;color:var(--ink);box-shadow:0 4px 0 #d6cde6;}
.btn:active{transform:translateY(3px);}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;display:none;}
</style>
</head>
<body>

<!-- ================= HOME ================= -->
<div id="home" class="screen on">
  <div class="awning">
    <button id="bLang" class="corner" aria-label="Language"></button>
    <button id="bMuteHome" class="corner" aria-label="Sound"></button>
    <h1>Doodle Pals</h1>
    <p data-t="tagline"></p>
    <div class="pill">&#9733; <b id="totStars">0</b> <span id="totOf"></span></div>
  </div>
  <div id="gallery"></div>
</div>

<!-- ================= MY GALLERY ================= -->
<div id="album" class="screen">
  <div class="awning">
    <button id="bAlbumBack" class="corner" aria-label="Home">&#127968;</button>
    <h1 data-t="album"></h1>
    <p data-t="albumSub"></p>
  </div>
  <div id="albumGrid"></div>
</div>

<!-- ================= DRAW ================= -->
<div id="draw" class="screen">
  <div class="top">
    <button class="rnd" id="bBack" aria-label="Home">&#127968;</button>
    <div class="ttl"><div id="tName"></div><div id="tStep"></div></div>
    <button class="rnd" id="bMute" aria-label="Sound"></button>
  </div>
  <div id="dots"></div>
  <div id="timer"><i id="timerFill"></i></div>
  <div class="stageWrap">
    <div id="stage">
      <canvas id="cBg" width="640" height="640"></canvas>
      <canvas id="cColor" width="640" height="640"></canvas>
      <canvas id="cInk" width="640" height="640"></canvas>
      <canvas id="cStick" width="640" height="640"></canvas>
      <canvas id="cGuide" width="640" height="640"></canvas>
    </div>
  </div>

  <!-- tracing tools -->
  <div id="traceBar" class="bar">
    <div class="row">
      <button class="tool" id="tUndo">&#8617;&#65039;<small data-t="undo"></small></button>
      <button class="tool" id="tHint">&#128161;<small data-t="showme"></small></button>
      <button class="tool" id="tSkip">&#9193;&#65039;<small data-t="skip"></small></button>
    </div>
  </div>

  <!-- colouring tools -->
  <div id="paintBar" class="bar">
    <div class="row">
      <button class="tool sel" data-tool="brush">&#128396;&#65039;<small data-t="brush"></small></button>
      <button class="tool" data-tool="fill">&#129699;<small data-t="fill"></small></button>
      <button class="tool" data-tool="eraser">&#129533;<small data-t="eraser"></small></button>
      <button class="tool" data-tool="sticker">&#127880;<small data-t="sticker"></small></button>
      <button class="tool" data-tool="scene">&#127748;<small data-t="scene"></small></button>
      <button class="tool" id="pUndo">&#8617;&#65039;<small data-t="undo"></small></button>
      <button class="tool" id="pClear">&#128465;&#65039;<small data-t="clear"></small></button>
      <button class="tool go" id="pDone">&#9989;<small data-t="done"></small></button>
    </div>
    <div class="sizes" id="sizes"></div>
    <div id="palette" class="panel on"></div>
    <div id="stickers" class="panel"></div>
    <div id="scenes" class="panel"></div>
  </div>
</div>

<!-- ================= CELEBRATION ================= -->
<div id="party" class="over">
  <div class="sheet">
    <h2 id="pTitle"></h2>
    <img id="pImg" class="shot" alt="">
    <div id="pStars"><span>&#9733;</span><span>&#9733;</span><span>&#9733;</span></div>
    <div id="pMsg"></div>
    <div id="pGift"></div>
    <div class="btns">
      <button class="btn alt" id="pSave"></button>
      <button class="btn" id="pNext"></button>
      <button class="btn soft" id="pHome"></button>
    </div>
  </div>
</div>

<!-- ================= PICTURE VIEWER (My Gallery) ================= -->
<div id="viewer" class="over">
  <div class="sheet">
    <img id="vImg" class="shot" alt="">
    <div id="vName"></div>
    <div class="btns">
      <button class="btn alt" id="vSave"></button>
      <button class="btn soft" id="vDel"></button>
      <button class="btn" id="vClose"></button>
    </div>
  </div>
</div>
<canvas id="confetti"></canvas>
<svg width="0" height="0" style="position:absolute;left:-9px;top:-9px"><path id="meas" d=""/></svg>

<script>
/* ------------------------------------------------------------------
   CHARACTER ART (all original designs)
   Each character is a list of steps. Each step has shapes (SVG paths
   in a 320 x 320 box). Shape flags:
     behind : drawn behind everything traced so far
     line   : plain line (not a closed body part)
     fill   : solid dark fill (eyes, nose)
   fit  : [scale, moveX, moveY] shrinks the head to make room for a body
   body : extra steps (body, arms, legs) added after the head steps
   ms   : name in Bahasa Melayu
------------------------------------------------------------------- */
const r1 = n => Math.round(n * 10) / 10;
const E = (x, y, rx, ry) => `M${x - rx},${y} a${rx},${ry} 0 1,0 ${2 * rx},0 a${rx},${ry} 0 1,0 ${-2 * rx},0 Z`;
const C = (x, y, r) => E(x, y, r, r);
// fluffy circle made of n round bumps
function scallop(cx, cy, R, n) {
  const rb = r1(R * Math.sin(Math.PI / n) * 1.05);
  let d = '';
  for (let i = 0; i <= n; i++) {
    const a = i / n * Math.PI * 2 - Math.PI / 2;
    const x = r1(cx + R * Math.cos(a)), y = r1(cy + R * Math.sin(a));
    d += i === 0 ? `M${x},${y}` : ` A${rb},${rb} 0 0,1 ${x},${y}`;
  }
  return d + ' Z';
}
// star with n points
function starPath(cx, cy, R, r, n) {
  n = n || 5; let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = i * Math.PI / n - Math.PI / 2, rr = i % 2 ? r : R;
    d += (i ? ' L' : 'M') + r1(cx + Math.cos(a) * rr) + ',' + r1(cy + Math.sin(a) * rr);
  }
  return d + ' Z';
}
// mirror a path left-right (absolute "x,y" pairs only)
const mir = d => d.replace(/(-?[\d.]+),(-?[\d.]+)/g, (m, x, y) => (320 - parseFloat(x)) + ',' + y);
// shrink and move a path: new = old * s + (dx, dy)
function tf(d, s, dx, dy) {
  const tok = d.match(/[a-zA-Z]|-?[\d.]+/g); let out = '', i = 0, cmd = '';
  while (i < tok.length) {
    if (/[a-zA-Z]/.test(tok[i])) { cmd = tok[i++]; out += cmd; if (cmd === 'Z' || cmd === 'z') { out += ' '; continue; } }
    const rel = cmd === cmd.toLowerCase(), c = cmd.toUpperCase();
    const fx = v => r1(rel ? v * s : v * s + dx), fy = v => r1(rel ? v * s : v * s + dy);
    if (c === 'A') {
      out += r1(tok[i] * s) + ',' + r1(tok[i + 1] * s) + ' ' + tok[i + 2] + ' ' + tok[i + 3] + ',' + tok[i + 4] + ' ' + fx(+tok[i + 5]) + ',' + fy(+tok[i + 6]) + ' ';
      i += 7;
    } else {
      const n = { M: 1, L: 1, Q: 2, C: 3 }[c];
      for (let k = 0; k < n; k++) { out += fx(+tok[i]) + ',' + fy(+tok[i + 1]) + ' '; i += 2; }
    }
  }
  return out.trim();
}
const S = (d, o) => Object.assign({ d }, o || {});
const BEH = { behind: true }, LINE = { line: true }, DOT = { fill: true }, BLINE = { behind: true, line: true };
const bow = (x, y, w, h, k) => [S(`M${x},${y} L${x - w},${y - h} L${x - w},${y + h} Z`), S(`M${x},${y} L${x + w},${y - h} L${x + w},${y + h} Z`), S(C(x, y, k))];
const pair = (d, o) => [S(d, o), S(mir(d), o)];

const PACKS = [
  { id: 'circus', name: 'Circus Stars', ms: 'Bintang Sarkas', icon: '🎪' },
  { id: 'monster', name: 'Toy Monsters', ms: 'Raksasa Mainan', icon: '🧸' },
  { id: 'sea', name: 'Sea Friends', ms: 'Kawan Laut', icon: '🐠' },
  { id: 'royal', name: 'Royal Land', ms: 'Negeri Diraja', icon: '🏰' },
  { id: 'food', name: 'Yummy Pals', ms: 'Kawan Sedap', icon: '🧁' },
  { id: 'zoom', name: 'Zoom Zoom', ms: 'Laju Laju', icon: '🚀' }
];

const CHARS = [
  /* ---------------- Circus Stars ---------------- */
  { id: 'bobo', name: 'Bobo the Clown', ms: 'Bobo si Badut', pack: 'circus', tint: '#ffe3ec', fit: [0.58, 67.2, 4], steps: [
    { n: 'head', sh: [S(C(160, 170, 70))] },
    { n: 'curly hair', sh: [S(scallop(82, 160, 30, 7), BEH), S(scallop(238, 160, 30, 7), BEH)] },
    { n: 'party hat', sh: [S('M126,114 L160,34 L194,114 Z'), S(C(160, 30, 12))] },
    { n: 'eyes', sh: [S(C(134, 160, 7), DOT), S(C(186, 160, 7), DOT)] },
    { n: 'round nose', sh: [S(C(160, 186, 14))] },
    { n: 'big smile', sh: [S('M122,202 Q160,248 198,202', LINE)] },
    { n: 'bow tie', sh: bow(160, 264, 44, 22, 10) }
  ], body: [
    { n: 'round body', sh: [S(E(160, 214, 50, 52), BEH)] },
    { n: 'buttons', sh: [S(C(160, 204, 7)), S(C(160, 230, 7))] },
    { n: 'arms', sh: [S(E(100, 206, 28, 13), BEH), S(E(220, 206, 28, 13), BEH)] },
    { n: 'big shoes', sh: [S(E(132, 272, 30, 12), BEH), S(E(188, 272, 30, 12), BEH)] }
  ]},
  { id: 'leo', name: 'Leo the Lion', ms: 'Leo si Singa', pack: 'circus', tint: '#fff0c9', fit: [0.62, 60.8, -28], steps: [
    { n: 'face', sh: [S(C(160, 186, 56))] },
    { n: 'ears', sh: [S(C(114, 138, 18), BEH), S(C(206, 138, 18), BEH)] },
    { n: 'fluffy mane', sh: [S(scallop(160, 186, 84, 12), BEH)] },
    { n: 'top hat', sh: [S('M118,128 L202,128 L202,116 L118,116 Z'), S('M132,116 L132,66 L188,66 L188,116 Z')] },
    { n: 'eyes', sh: [S(C(140, 176, 6), DOT), S(C(180, 176, 6), DOT)] },
    { n: 'nose and mouth', sh: [S('M150,194 L170,194 L160,206 Z', DOT), S('M160,206 L160,214 M144,212 Q152,224 160,214 Q168,224 176,212', LINE)] },
    { n: 'whiskers', sh: [S('M126,200 L100,194 M126,208 L100,214 M194,200 L220,194 M194,208 L220,214', LINE)] }
  ], body: [
    { n: 'body', sh: [S(E(160, 200, 44, 58), BEH)] },
    { n: 'front paws', sh: [S(E(142, 256, 17, 11)), S(E(178, 256, 17, 11))] },
    { n: 'back feet', sh: [S(E(106, 250, 18, 12), BEH), S(E(214, 250, 18, 12), BEH)] },
    { n: 'tail', sh: [S('M202,222 Q246,228 244,186', LINE), S(C(244, 174, 11))] }
  ]},
  { id: 'ellie', name: 'Ellie the Elephant', ms: 'Ellie si Gajah', pack: 'circus', tint: '#dff3ff', fit: [0.58, 67.2, -4], steps: [
    { n: 'head', sh: [S(C(160, 150, 60))] },
    { n: 'big ears', sh: [S(E(82, 140, 46, 58), BEH), S(E(238, 140, 46, 58), BEH)] },
    { n: 'party hat', sh: [S('M136,97 L160,42 L184,97 Z'), S(C(160, 38, 9))] },

/* ------------------------------------------------------------------
   Drawing the character line art
------------------------------------------------------------------- */
const scratch = {};
function mk(s) { const c = document.createElement('canvas'); c.width = c.height = s; return c; }
function getScratch(size) {
  if (!scratch[size]) {
    const mask = mk(size), tmp = mk(size);
    scratch[size] = { mask, tmp, mctx: mask.getContext('2d', { willReadFrequently: true }), tctx: tmp.getContext('2d') };
  }

}
function inkStyle(c) { c.lineWidth = LW; c.lineCap = 'round'; c.lineJoin = 'round'; c.strokeStyle = INK; c.fillStyle = INK; c.setLineDash([]); }

// Draw steps 0..upto-1 of a character on ctx (a size x size canvas).
// Later body parts sit on top of earlier ones; "behind" parts tuck underneath.
function drawArt(ctx, size, ch, upto) {

  for (let s = 0; s < upto; s++) {
    for (const sh of ch.steps[s].sh) {
      const p = new Path2D(sh.d), solid = !sh.line;
      if (sh.behind) {
        const x = sc.tctx;
        x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, size, size);
        x.setTransform(k, 0, 0, k, 0, 0); inkStyle(x);

        ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(sc.tmp, 0, 0);
      } else {
        ctx.setTransform(k, 0, 0, k, 0, 0); inkStyle(ctx);
        if (solid) { ctx.globalCompositeOperation = 'destination-out'; ctx.fill(p); ctx.globalCompositeOperation = 'source-over'; }
        if (sh.fill) ctx.fill(p);
        ctx.stroke(p);
      }
      if (solid) { sc.mctx.setTransform(k, 0, 0, k, 0, 0); sc.mctx.fillStyle = '#000'; sc.mctx.fill(p); }
    }
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);

}

/* ------------------------------------------------------------------

------------------------------------------------------------------- */

  const sc = drawArt(ictx, RES, ch, i);                       // outlines finished so far
  const md = sc.mctx.getImageData(0, 0, RES, RES).data;       // where earlier body parts are

  // dotted guide for this step
  const g = cur.guide.getContext('2d');
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, RES, RES);
  cur.samples = [];
  for (const sh of st.sh) {
    const p = new Path2D(sh.d), x = sc.tctx;
    x.setTransform(1, 0, 0, 1, 0, 0); x.globalCompositeOperation = 'source-over'; x.clearRect(0, 0, RES, RES);

      const q = meas.getPointAtLength(L * j / n);
      if (sh.behind) {
        const px = Math.round(q.x * K), py = Math.round(q.y * K);
        if (px >= 0 && py >= 0 && px < RES && py < RES && md[(py * RES + px) * 4 + 3] > 128) continue; // hidden part
      }
      cur.samples.push({ x: q.x, y: q.y });
    }
  }
  cur.cov = new Uint8Array(cur.samples.length);
  $('tStep').textContent = t('step', i + 1, ch.steps.length, partName(st.n));
  showDots();

}

function tracePoint(p) {
  const s = cur.samples, c = cur.cov, T2 = TOL * TOL; let near = false;
  for (let i = 0; i < s.length; i++) {
    const dx = s[i].x - p.x, dy = s[i].y - p.y;

  }

}
function traceMove(p) {

  const a = st[st.length - 1], dx = p.x - a.x, dy = p.y - a.y, d = Math.hypot(dx, dy);
  const n = Math.max(1, Math.ceil(d / 5));

  if (!cur.lock && cur.nCov >= NEED * cur.samples.length) completeStep(false);

function completeStep(skipped, silent) {

  if (skipped) { if (!silent) cur.skips++; }
  else if (cur.total > 0) { cur.accSum += cur.good / cur.total; cur.accN++; }
  const done = cur.step + 1, ch = cur.ch;
  drawArt(ictx, RES, ch, done);          // snap to a neat clean line
  cur.strokes = []; cur.guide.getContext('2d').clearRect(0, 0, RES, RES);
  if (!silent) {
    sfx.step();
    for (let i = 0; i < cur.samples.length; i += 6) burst(cur.samples[i], 2);
    stage.classList.remove('pop'); void stage.offsetWidth; stage.classList.add('pop');
  }
  cur.samples = []; cur.cov = new Uint8Array(0); cur.nCov = 0;
  const me = cur;
  setTimeout(() => {
    if (cur !== me) return;
    if (done < ch.steps.length) beginStep(done); else enterPaint();
  }, silent ? 0 : 420);
}

function enterPaint() {
  cur.mode = 'paint'; cur.lock = false;
  const sc = drawArt(ictx, RES, cur.ch, cur.ch.steps.length);
  cur.inkData = ictx.getImageData(0, 0, RES, RES).data;
  // white shape of the pal, so a background scene does not show through its body
  cur.sil = mk(RES); const x = cur.sil.getContext('2d');
  x.drawImage(sc.mask, 0, 0); x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, RES, RES);
  $('tStep').textContent = t('colourTime');
  $('timer').classList.remove('on');
  if (cur.quick && !cur.quick.failed && cur.skips === 0) {          // traced everything before the clock ran out
    cur.crown = true; save.crowns[cur.ch.id] = true; persist(); sfx.win();
    $('tStep').textContent = '🏆 ' + t('beat');
  }
  $('traceBar').classList.remove('on'); $('paintBar').classList.add('on');
  $('pClear').style.display = 'none';
  buildPickers(); setTool('brush');
  showDots();
}

$('tUndo').onclick = () => {
  if (!cur || cur.mode !== 'trace' || cur.lock) return;
  if (cur.nCov > 0 || cur.strokes.length) beginStep(cur.step);
  else if (cur.step > 0) beginStep(cur.step - 1);
};
$('tHint').onclick = () => { if (cur && cur.mode === 'trace') cur.hintUntil = performance.now() + 1400; };
$('tSkip').onclick = () => { if (cur && cur.mode === 'trace' && !cur.lock) completeStep(true); };

/* ------------------------------------------------------------------
   Colouring: brush, fill, eraser, stickers, scenes, undo
------------------------------------------------------------------- */
function pushUndo(c) { c = c || cctx; undo.push({ c, d: c.getImageData(0, 0, RES, RES) }); if (undo.length > 12) undo.shift(); }
function star5(x, y, r) {                      // little five-point star
  cctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r;
    if (i) cctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); else cctx.moveTo(x, y - rr);
  }
  cctx.closePath(); cctx.fill();
}
function dab(a, b) {
  const er = tool === 'eraser', st = er ? 'normal' : bstyle, size = SIZES[sizeI];
  const dist = Math.hypot(b.x - a.x, b.y - a.y);
  let col = color;
  cctx.setTransform(1, 0, 0, 1, 0, 0);
  cctx.globalCompositeOperation = er ? 'destination-out' : 'source-over';
  if (st === 'rainbowb') { hue = (hue + dist * 2.2 + 1) % 360; col = 'hsl(' + hue + ',95%,58%)'; }
  if (st === 'sparkle') {                      // scatter little stars along the stroke
    const n = Math.max(1, Math.round(dist / 4));
    cctx.fillStyle = col;
    for (let i = 0; i < n; i++) {
      const q = Math.random(), off = size * 0.9 + 4;
      const x = a.x + (b.x - a.x) * q + (Math.random() - 0.5) * 2 * off;
      const y = a.y + (b.y - a.y) * q + (Math.random() - 0.5) * 2 * off;
      cctx.globalAlpha = 0.55 + Math.random() * 0.45;
      star5(x * K, y * K, (2 + Math.random() * 3.6) * K * (0.6 + size / 28));
    }
    cctx.globalAlpha = 1;
    return;
  }
  cctx.strokeStyle = col; cctx.fillStyle = col;
  cctx.lineWidth = size * K; cctx.lineCap = 'round'; cctx.lineJoin = 'round';
  if (st === 'glow') { cctx.shadowColor = col; cctx.shadowBlur = (size * 0.8 + 6) * K; }
  cctx.beginPath(); cctx.arc(b.x * K, b.y * K, size * K / 2, 0, 6.2832); cctx.fill();
  cctx.beginPath(); cctx.moveTo(a.x * K, a.y * K); cctx.lineTo(b.x * K, b.y * K); cctx.stroke();
  cctx.shadowBlur = 0; cctx.shadowColor = 'transparent';
  cctx.globalCompositeOperation = 'source-over';
}
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }

// Paint-bucket fill that stops at the outlines
function flood(px, py, hex) {
  px = Math.max(0, Math.min(RES - 1, px)); py = Math.max(0, Math.min(RES - 1, py));
  const w = RES, h = RES, img = cctx.getImageData(0, 0, w, h), d = img.data, ink = cur.inkData;
  const s = py * w + px;
  if (ink && ink[s * 4 + 3] >= 110) return false;                 // tapped on a line
  const tr = d[s * 4], tg = d[s * 4 + 1], tb = d[s * 4 + 2], ta = d[s * 4 + 3];
  const f = hexRgb(hex), fr = f[0], fg = f[1], fb = f[2];
  if (ta > 250 && Math.abs(tr - fr) + Math.abs(tg - fg) + Math.abs(tb - fb) < 12) return false;   // same colour already
  const blank = ta < 128;
  const match = i => {
    const o = i * 4, a = d[o + 3];
    if (blank) return a < 128;
    return a >= 128 && Math.abs(d[o] - tr) + Math.abs(d[o + 1] - tg) + Math.abs(d[o + 2] - tb) <= 96;
  };
  const paint = i => { const o = i * 4; d[o] = fr; d[o + 1] = fg; d[o + 2] = fb; d[o + 3] = 255; };
  const seen = new Uint8Array(w * h), stack = [s]; seen[s] = 1;
  const visit = n => {
    if (seen[n]) return; seen[n] = 1;
    if (ink && ink[n * 4 + 3] >= 110) { paint(n); return; }       // slide colour just under the line
    if (match(n)) stack.push(n); else paint(n);                   // soften the edge of other colours
  };
  while (stack.length) {
    const i = stack.pop(); paint(i);
    const x = i % w;
    if (x > 0) visit(i - 1);
    if (x < w - 1) visit(i + 1);
    if (i >= w) visit(i - w);
    if (i < w * (h - 1)) visit(i + w);
  }
  cctx.putImageData(img, 0, 0);
  return true;
}

// put a sticker on the picture
function stamp(p) {
  const r = STAMP[sizeI] * K;
  sctx.save(); sctx.setTransform(1, 0, 0, 1, 0, 0);
  sctx.translate(p.x * K, p.y * K); sctx.rotate((Math.random() - 0.5) * 0.4); sctx.scale(r, r);
  STK[stk](sctx); sctx.restore();
}
// change the background scene
function setScene(id) {
  cur.scene = id;
  bctx.setTransform(1, 0, 0, 1, 0, 0); bctx.clearRect(0, 0, RES, RES);
  if (id !== 'none') {
    bctx.save(); bctx.setTransform(K, 0, 0, K, 0, 0); SCENES[id](bctx); bctx.restore();
    bctx.setTransform(1, 0, 0, 1, 0, 0);
    if (cur.sil) bctx.drawImage(cur.sil, 0, 0);
  }
}

function setTool(tl) {
  tool = tl;
  document.querySelectorAll('#paintBar [data-tool]').forEach(b => b.classList.toggle('sel', b.dataset.tool === tl));
  $('palette').classList.toggle('on', tl !== 'sticker' && tl !== 'scene');
  $('stickers').classList.toggle('on', tl === 'sticker');
  $('scenes').classList.toggle('on', tl === 'scene');
  if (cur && cur.mode !== 'trace') {
    if (tl === 'sticker') $('tStep').textContent = t('pickSticker');
    else if (tl === 'scene') $('tStep').textContent = t('pickScene');
    else $('tStep').textContent = cur.mode === 'free' ? t('freeHint') : t('colourTime');
  }
}
document.querySelectorAll('#paintBar [data-tool]').forEach(b => b.onclick = () => setTool(b.dataset.tool));
$('pUndo').onclick = () => { const u = undo.pop(); if (u) u.c.putImageData(u.d, 0, 0); };
$('pClear').onclick = () => { if (!cur) return; cctx.clearRect(0, 0, RES, RES); sctx.clearRect(0, 0, RES, RES); undo = []; };
$('pDone').onclick = () => finish();

// colour palette
COLORS.forEach((c, i) => {
  const b = document.createElement('button'); b.className = 'sw' + (i === 0 ? ' sel' : ''); b.style.background = c;
  if (c === '#ffffff') b.style.borderColor = '#d9d3e6';
  b.onclick = () => {
    color = c; document.querySelectorAll('.sw').forEach(x => x.classList.toggle('sel', x === b));
    if (tool === 'eraser') setTool('brush');
  };
  $('palette').appendChild(b);
});
function lockBadge(n) {
  const l = document.createElement('span'); l.className = 'lock';
  l.innerHTML = '🔒<small>' + n + '★</small>'; return l;
}
function lockedMsg(n) { $('tStep').textContent = '🔒 ' + t('locked', n); }
// sizes, brush styles, sticker and scene pickers (rebuilt each time, because gifts open as stars grow)
function buildPickers() {
  const sz = $('sizes'); sz.innerHTML = '';
  SIZES.forEach((s, i) => {
    const b = document.createElement('button'); b.className = 'sz' + (i === sizeI ? ' sel' : '');
    const d = [8, 15, 24][i]; b.innerHTML = '<i style="width:' + d + 'px;height:' + d + 'px"></i>';
    b.onclick = () => { sizeI = i; document.querySelectorAll('.sz:not(.st)').forEach(x => x.classList.toggle('sel', x === b)); };
    sz.appendChild(b);
  });
  sz.appendChild(Object.assign(document.createElement('span'), { className: 'gap' }));
  if (!isOpen('brush', bstyle)) bstyle = 'normal';
  [['normal', '✏️'], ['rainbowb', '🌈'], ['glow', '🔆'], ['sparkle', '✨']].forEach(o => {
    const b = document.createElement('button'); b.className = 'sz st' + (o[0] === bstyle ? ' sel' : '');
    b.textContent = o[1]; b.setAttribute('aria-label', nm(o[0]));
    const need = needStars('brush', o[0]), open = isOpen('brush', o[0]);
    if (!open) b.appendChild(lockBadge(need));
    b.onclick = () => {
      if (!open) { lockedMsg(need); return; }
      bstyle = o[0]; document.querySelectorAll('.sz.st').forEach(x => x.classList.toggle('sel', x === b)); setTool('brush');
    };
    sz.appendChild(b);
  });
  const sp = $('stickers'); sp.innerHTML = '';
  if (!isOpen('sticker', stk)) stk = 'star';
  STICKERS.forEach(id => {
    const b = document.createElement('button'); b.className = 'pk' + (id === stk ? ' sel' : ''); b.setAttribute('aria-label', nm(id));
    const cv = mk(84), x = cv.getContext('2d'); x.translate(42, 42); x.scale(31, 31); STK[id](x); b.appendChild(cv);
    const need = needStars('sticker', id), open = isOpen('sticker', id);
    if (!open) b.appendChild(lockBadge(need));
    b.onclick = () => {
      if (!open) { lockedMsg(need); return; }
      stk = id; sp.querySelectorAll('.pk').forEach(q => q.classList.toggle('sel', q === b)); $('tStep').textContent = t('pickSticker');
    };
    sp.appendChild(b);
  });
  const cp = $('scenes'); cp.innerHTML = '';
  SCENE_IDS.forEach(id => {
    const b = document.createElement('button'); b.className = 'pk' + (cur && id === cur.scene ? ' sel' : ''); b.setAttribute('aria-label', nm(id));
    const cv = mk(108), x = cv.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, 108, 108); x.scale(108 / 320, 108 / 320); SCENES[id](x); b.appendChild(cv);
    const need = needStars('scene', id), open = isOpen('scene', id);
    if (!open) b.appendChild(lockBadge(need));
    b.onclick = () => {
      if (!open) { lockedMsg(need); return; }
      setScene(id); cp.querySelectorAll('.pk').forEach(q => q.classList.toggle('sel', q === b)); sfx.pop();
    };
    cp.appendChild(b);
  });
}

/* ------------------------------------------------------------------
   Finger input
------------------------------------------------------------------- */
function pos(e) {
  const r = stage.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * 320, y: (e.clientY - r.top) / r.height * 320 };
}
cGuide.addEventListener('pointerdown', e => {
  if (!cur || ptr !== null) return;
  e.preventDefault(); ptr = e.pointerId;
  try { cGuide.setPointerCapture(ptr); } catch (_) {}
  const p = pos(e);
  cur.painting = false;
  if (cur.mode === 'trace') {
    if (cur.lock) return;
    cur.strokes.push([p]); tracePoint(p);
    if (cur.nCov >= NEED * cur.samples.length) completeStep(false);
  } else if (tool === 'scene') {
    setTool('brush');                         // a tap on the picture goes back to the brush
  } else if (tool === 'sticker') {
    pushUndo(sctx); stamp(p); burst(p, 8); sfx.pop();
  } else if (tool === 'fill') {
    pushUndo();
    if (flood(Math.round(p.x * K), Math.round(p.y * K), color)) { cur.colors.add(color); burst(p, 8, color); }
    else undo.pop();
  } else {
    pushUndo(); cur.last = p; cur.painting = true; dab(p, p);
    if (tool === 'brush') { if (bstyle === 'rainbowb') { cur.colors.add('rainbow1'); cur.colors.add('rainbow2'); } else cur.colors.add(color); }
  }
});
cGuide.addEventListener('pointermove', e => {
  if (!cur || e.pointerId !== ptr) return;
  e.preventDefault();
  let evs = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (!evs || !evs.length) evs = [e];
  for (const ev of evs) {
    const p = pos(ev);
    if (cur.mode === 'trace') { if (!cur.lock) traceMove(p); }
    else if (cur.painting) { dab(cur.last, p); cur.last = p; }
  }
});
function endPtr(e) { if (e.pointerId !== ptr) return; ptr = null; if (cur) cur.painting = false; }
cGuide.addEventListener('pointerup', endPtr);
cGuide.addEventListener('pointercancel', endPtr);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => { if (!e.target.classList || !e.target.classList.contains('shot')) e.preventDefault(); });

/* ------------------------------------------------------------------
   Guide layer animation (dotted guide, moving hint dot, sparkles)
------------------------------------------------------------------- */
function burst(p, n, col) {
  const cols = ['#ffd23f', '#ff5d8f', '#2ec4b6', '#7b5cff'];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = 0.6 + Math.random() * 1.8;
    parts.push({ x: p.x, y: p.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 0.6, life: 1, c: col || cols[i % 4], r: 2 + Math.random() * 3 });
  }
}
function frame(now) {
  requestAnimationFrame(frame);
  if (!cur || !$('draw').classList.contains('on')) return;
  const g = gctx;
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, RES, RES);
  if (cur.quick && cur.mode === 'trace' && !cur.quick.failed) {              // Quick Draw clock
    const left = 1 - (now - cur.quick.t0) / cur.quick.limit;
    $('timerFill').style.width = Math.max(0, left * 100) + '%';
    $('timer').classList.toggle('low', left < 0.25);
    if (left <= 0) {
      cur.quick.failed = true; $('timer').classList.remove('on');
      $('tStep').textContent = t('timeUp');
    }
  }
  if (cur.mode === 'trace') {
    g.globalAlpha = 0.11; g.drawImage(cur.ghost, 0, 0); g.globalAlpha = 1;    // faint preview of the whole pal
    g.drawImage(cur.guide, 0, 0);                                             // dotted line for this step
    g.setTransform(K, 0, 0, K, 0, 0);
    const s = cur.samples, c = cur.cov;
    if (now < cur.hintUntil) {                                                // "Show me" - flash the whole shape
      g.fillStyle = 'rgba(255,93,143,.8)';
      for (let i = 0; i < s.length; i++) { g.beginPath(); g.arc(s[i].x, s[i].y, 3.2, 0, 6.2832); g.fill(); }
    }
    g.fillStyle = '#22c58b';                                                  // the part already traced
    for (let i = 0; i < s.length; i++) if (c[i]) { g.beginPath(); g.arc(s[i].x, s[i].y, 3.3, 0, 6.2832); g.fill(); }
    g.strokeStyle = 'rgba(43,36,64,.3)'; g.lineWidth = 3; g.lineCap = 'round'; g.lineJoin = 'round';
    for (const st of cur.strokes) { g.beginPath(); g.moveTo(st[0].x, st[0].y); for (let i = 1; i < st.length; i++) g.lineTo(st[i].x, st[i].y); g.stroke(); }
    if (!cur.lock && ptr === null) {                                          // moving dot shows where to draw
      const unc = []; for (let i = 0; i < s.length; i++) if (!c[i]) unc.push(s[i]);
      if (unc.length) {
        const idx = Math.floor(now / 40) % (unc.length + 14);
        if (idx < unc.length) {
          const q = unc[idx];
          g.beginPath(); g.arc(q.x, q.y, 9, 0, 6.2832); g.fillStyle = 'rgba(255,93,143,.92)'; g.fill();
          g.lineWidth = 3; g.strokeStyle = '#fff'; g.stroke();
          g.font = '22px sans-serif'; g.fillText('👆', q.x - 2, q.y + 30);
        }
      }
    }
  } else g.setTransform(K, 0, 0, K, 0, 0);
  for (let i = parts.length - 1; i >= 0; i--) {                               // sparkles
    const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.life -= 0.028;
    if (p.life <= 0) { parts.splice(i, 1); continue; }
    g.globalAlpha = p.life; g.fillStyle = p.c; g.beginPath(); g.arc(p.x, p.y, p.r, 0, 6.2832); g.fill();
  }
  g.globalAlpha = 1;
}
requestAnimationFrame(frame);

/* ------------------------------------------------------------------
   Finish: stars, gifts and celebration
------------------------------------------------------------------- */
let picBlob = null;
function compose() {
  const c = mk(RES), x = c.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, RES, RES);
  x.drawImage(cBg, 0, 0); x.drawImage(cColor, 0, 0); x.drawImage(cInk, 0, 0); x.drawImage(cStick, 0, 0);
  return c;
}
function small(comp) { const c = mk(400), x = c.getContext('2d'); x.drawImage(comp, 0, 0, 400, 400); return c.toDataURL('image/jpeg', 0.82); }
function finish() {
  if (!cur || cur.mode === 'trace') return;
  const comp = compose();
  picBlob = null;
  try { comp.toBlob(b => { picBlob = b; }, 'image/png'); } catch (e) {}
  $('pImg').src = comp.toDataURL('image/png');
  const stars = $('pStars').children;
  for (const s of stars) s.className = '';
  let n = 0; const msgs = []; $('pGift').textContent = '';
  if (cur.mode === 'paint') {
    const d = cctx.getImageData(0, 0, RES, RES).data; let filled = 0;
    for (let i = 3; i < d.length; i += 16) if (d[i] > 40) filled++;
    const coverage = filled / (d.length / 16);
    const acc = cur.accN ? cur.accSum / cur.accN : 0;
    n = 1; msgs.push(t('m_traced'));
    if (cur.crown) msgs.unshift(t('m_trophy') + ' 🏆');
    if (acc >= 0.5 && cur.skips <= 1) { n++; msgs.push(t('m_neat')); }
    if (coverage >= 0.1 && cur.colors.size >= 2) { n++; msgs.push(t('m_colours')); }
    const id = cur.ch.id, before = totalStars();
    save.stars[id] = Math.max(save.stars[id] || 0, n);
    const after = totalStars(), gifts = UNLOCKS.filter(u => u.at > before && u.at <= after);
    if (gifts.length) $('pGift').textContent = '🎁 ' + t('unlocked') + ': ' + gifts.map(giftName).join(', ');
    try { save.thumbs[id] = small(comp); } catch (e) {}
    persist();
    $('pTitle').textContent = n === 3 ? t('amazing') : t('didIt');
    $('pStars').style.display = '';
    $('pMsg').textContent = msgs.join(', ') + '! ' + (n < 3 ? (cur.colors.size < 2 ? t('moreColours') : t('tryAgain')) : '');
    $('pNext').textContent = t('next') + ' ➡️';
  } else {
    try {                                         // keep free drawings in My Gallery (newest first, 12 at most)
      save.album = save.album.filter(a => a.ts !== cur.ts);
      save.album.unshift({ src: small(comp), ts: cur.ts }); save.album = save.album.slice(0, 12);
    } catch (e) {}
    persist();
    $('pTitle').textContent = t('lovely');
    $('pStars').style.display = 'none';
    $('pMsg').textContent = t('saveMsg');
    $('pNext').textContent = t('keep');
  }
  $('party').classList.add('on');
  sfx.win(); confetti();
  for (let i = 0; i < n; i++) setTimeout(() => { stars[i].className = 'y'; sfx.star(i); }, 700 + i * 380);
}
$('pSave').onclick = () => sharePic(picBlob);
$('pNext').onclick = () => {
  if (!cur || cur.mode === 'free') { $('party').classList.remove('on'); return; }
  const i = CHARS.indexOf(cur.ch); startChar(CHARS[(i + 1) % CHARS.length]);
};
$('pHome').onclick = showHome;
$('bBack').onclick = () => {
  const busy = cur && (cur.mode === 'trace' ? cur.step > 0 : undo.length > 0);
  if (!busy || window.confirm(t('leave'))) showHome();
};

function confetti() {
  const c = $('confetti'), x = c.getContext('2d');
  const W = c.width = window.innerWidth, H = c.height = window.innerHeight;
  c.style.display = 'block';
  const cols = ['#ff5d8f', '#ffd23f', '#2ec4b6', '#7b5cff', '#5ac8fa', '#ff9f1c'];
  const ps = [];
  for (let i = 0; i < 130; i++) ps.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, vx: (Math.random() - 0.5) * 3,
    vy: 2 + Math.random() * 4, w: 6 + Math.random() * 7, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.3, c: cols[i % cols.length] });
  const t0 = performance.now();
  (function tick(now) {
    x.clearRect(0, 0, W, H);
    for (const p of ps) {
      p.x += p.vx; p.y += p.vy; p.r += p.vr;
      x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.w / 2, -p.w / 4, p.w, p.w / 2); x.restore();
    }
    if (now - t0 < 3800) requestAnimationFrame(tick); else { x.clearRect(0, 0, W, H); c.style.display = 'none'; }
  })(t0);
}

/* ------------------------------------------------------------------
   Start
------------------------------------------------------------------- */
showMute();
applyLang();
showHome();
})();
</script>
