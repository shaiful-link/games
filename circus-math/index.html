<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#cfeaf6">
<title>Circus Math Show</title>
<style>html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one phone-width column; a big-top stage card held by the mood character, answers below, sticky action footer. */
:root{
  --sky:#cfeaf6; --paper:#fffdf7; --ink:#1d2a4d; --soft:#5b6787; --line:#c9d6e6;
  --red:#e23b3b; --sun:#ffc531; --good:#1f9d63; --bad:#d9552b; --accent:#19a99b; --on-accent:#ffffff;
  --stripe:#ffffff; --shadow:rgba(29,42,77,.16); --chip:#eef4fb;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky:#131a33; --paper:#1f2847; --ink:#f3f1e7; --soft:#aab3d0; --line:#3a4670;
  --red:#ff6b6b; --sun:#ffd04a; --good:#4fd494; --bad:#ff8a5c; --stripe:#2a345b; --shadow:rgba(0,0,0,.4); --chip:#2a345b; color-scheme:dark } }
:root[data-theme="dark"]{
  --sky:#131a33; --paper:#1f2847; --ink:#f3f1e7; --soft:#aab3d0; --line:#3a4670;
  --red:#ff6b6b; --sun:#ffd04a; --good:#4fd494; --bad:#ff8a5c; --stripe:#2a345b; --shadow:rgba(0,0,0,.4); --chip:#2a345b; color-scheme:dark }
body[data-c="jojo"]{--accent:#19a99b} body[data-c="bibi"]{--accent:#e2557f} body[data-c="mimi"]{--accent:#5a8f3c}
body[data-c="raja"]{--accent:#3558c9} body[data-c="leo"]{--accent:#d9731a} body[data-c="fifi"]{--accent:#2e9a55}
*{box-sizing:border-box}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:17px;font-weight:600;line-height:1.35;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-block:10px 110px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.seg{display:flex;background:var(--paper);border-radius:999px;padding:3px;box-shadow:0 2px 0 var(--shadow)}
.seg button{padding:6px 12px;border-radius:999px;font-weight:800;font-size:14px;color:var(--soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.ib{width:42px;height:42px;border-radius:50%;background:var(--paper);box-shadow:0 2px 0 var(--shadow);font-size:19px;display:grid;place-items:center}
.ib.off{opacity:.45}
.tent{position:relative;border-radius:26px 26px 18px 18px;padding:26px 16px 18px;text-align:center;
  background:repeating-linear-gradient(90deg,var(--red) 0 34px,var(--stripe) 34px 68px);box-shadow:0 5px 0 var(--shadow);overflow:hidden}
.tent::before{content:"";position:absolute;left:0;right:0;top:0;height:16px;background:radial-gradient(circle at 17px 0,var(--sun) 15px,transparent 16px) 0 0/34px 16px repeat-x}
.tent h1{font-family:var(--display);font-weight:800;font-size:34px;line-height:1;margin:0;display:inline-block;background:var(--paper);padding:10px 18px 8px;border-radius:16px;border:3px solid var(--ink);text-wrap:balance}
.tent p{margin:8px 0 0;display:inline-block;background:var(--ink);color:var(--paper);padding:3px 12px;border-radius:999px;font-size:14px}
h2{font-family:var(--display);font-weight:800;font-size:22px;line-height:1.1;margin:4px 0 0;text-wrap:balance}
.l1,.l2{display:block}.l2{font-size:.82em;color:var(--soft);font-weight:600}
.chars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.charcard{background:var(--paper);border-radius:18px;padding:8px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;border:3px solid transparent;box-shadow:0 3px 0 var(--shadow);min-width:0}
.charcard.sel{border-color:var(--accent);background:var(--chip)}
.charcard b{font-family:var(--display);font-size:16px;line-height:1}
.charcard small{font-size:12.5px;color:var(--soft);text-align:center;line-height:1.1}
.ch{width:84px;height:98px;display:block;transform-origin:50% 90%}
.ch svg{width:100%;height:100%;overflow:visible;display:block}
.ch img{width:84px;height:84px;border-radius:50%;object-fit:cover;border:4px solid var(--accent);margin-top:10px;background:var(--paper)}
.ch .mh,.ch .ms{display:none}
.ch[data-mood="happy"] .mi,.ch[data-mood="sad"] .mi{display:none}
.ch[data-mood="happy"] .mh{display:inline}.ch[data-mood="sad"] .ms{display:inline}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes wob{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes sway{50%{transform:rotate(3deg) translateX(2px)}}
@keyframes tall{50%{transform:scaleY(1.04)}}
@keyframes huff{50%{transform:scale(1.03,.97)}}
@keyframes peek{0%,60%,100%{transform:translateY(4px)}75%{transform:translateY(-3px)}}
@keyframes jump{0%{transform:translateY(0) rotate(0)}35%{transform:translateY(-34px) rotate(180deg)}70%{transform:translateY(0) rotate(360deg)}85%{transform:translateY(-8px) rotate(360deg)}100%{transform:translateY(0) rotate(360deg)}}
@keyframes boing{0%,100%{transform:scale(1)}20%{transform:scale(1.2,.75)}45%{transform:scale(.85,1.25) translateY(-24px)}70%{transform:scale(1.1,.9)}}
@keyframes clap{0%,100%{transform:rotate(0)}20%,60%{transform:rotate(-7deg) translateY(-6px)}40%,80%{transform:rotate(7deg) translateY(-6px)}}
@keyframes rise{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.12)}}
@keyframes flip{0%{transform:rotateY(0)}50%{transform:rotateY(180deg) translateY(-14px)}100%{transform:rotateY(360deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-16px)}55%{transform:translateY(0)}75%{transform:translateY(-8px)}}
@keyframes shake{20%,60%{transform:translateX(-6px) rotate(-3deg)}40%,80%{transform:translateX(6px) rotate(3deg)}}
.ch[data-c="jojo"]{animation:bob 1.6s ease-in-out infinite}.ch[data-c="bibi"]{animation:wob 1.3s ease-in-out infinite}
.ch[data-c="mimi"]{animation:sway 2.6s ease-in-out infinite}.ch[data-c="raja"]{animation:tall 2.2s ease-in-out infinite}
.ch[data-c="leo"]{animation:huff 1.9s ease-in-out infinite}.ch[data-c="fifi"]{animation:peek 2.8s ease-in-out infinite}
.ch[data-mood="happy"][data-c="jojo"]{animation:jump .9s ease-out}.ch[data-mood="happy"][data-c="bibi"]{animation:boing .9s ease-out}
.ch[data-mood="happy"][data-c="mimi"]{animation:clap 1s ease-in-out}.ch[data-mood="happy"][data-c="raja"]{animation:rise .9s ease-out}
.ch[data-mood="happy"][data-c="leo"]{animation:flip .9s ease-in-out}.ch[data-mood="happy"][data-c="fifi"]{animation:hop .9s ease-out}
.ch[data-mood="sad"]{animation:shake .5s ease-in-out}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;padding:10px 16px;border-radius:16px;font-family:var(--display);font-weight:800;font-size:20px;line-height:1.05;
  background:var(--paper);box-shadow:0 4px 0 var(--shadow);text-align:center}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
.btn.primary{background:var(--accent);color:var(--on-accent)}.btn.primary .l2{color:var(--on-accent);opacity:.85}
.btn.sun{background:var(--sun);color:#1d2a4d}.btn.sun .l2{color:#1d2a4d;opacity:.75}
.btn.small{min-height:44px;font-size:16px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.list{display:flex;flex-direction:column;gap:10px}
.act{background:var(--paper);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 var(--shadow)}
.act .hd{display:flex;align-items:center;gap:10px}
.act .ic{font-size:28px;width:46px;height:46px;border-radius:14px;background:var(--chip);display:grid;place-items:center;flex:none}
.act .nm{font-family:var(--display);font-weight:800;font-size:19px;line-height:1.1;min-width:0}
.lvs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv{background:var(--chip);border-radius:12px;padding:7px 4px;font-weight:800;font-size:14px;display:flex;flex-direction:column;align-items:center;line-height:1.15;border:2px solid var(--line)}
.lv .st{font-size:13px;letter-spacing:1px}
.lv.lock{opacity:.5}
.paper{background:var(--paper);border-radius:18px;padding:12px 14px;display:flex;align-items:center;gap:12px;box-shadow:0 3px 0 var(--shadow);text-align:left;width:100%}
.paper .mk{font-family:var(--display);font-size:20px;background:var(--sun);color:#1d2a4d;border-radius:12px;padding:6px 10px;flex:none;line-height:1;text-align:center}
.paper .mk small{display:block;font-size:11px;font-family:var(--body)}
.paper .nm{min-width:0;flex:1}.paper .nm b{font-family:var(--display);font-size:18px;display:block;line-height:1.1}.paper .nm span{font-size:13.5px;color:var(--soft)}
.bar{display:flex;align-items:center;gap:8px}
.dots{flex:1;display:flex;gap:4px;min-width:0}
.dots i{flex:1;height:10px;border-radius:5px;background:var(--paper);max-width:26px}
.dots i.ok{background:var(--good)}.dots i.no{background:var(--bad)}.dots i.cur{background:var(--sun)}.dots i.done{background:var(--soft)}
.count{font-weight:800;font-size:14px;color:var(--soft);white-space:nowrap}
.stage{position:relative;padding-top:58px}
.stage .who{position:absolute;left:8px;top:0;z-index:2;border-radius:20px}
.stage .who .ch{width:76px;height:88px}.stage .who .ch img{width:70px;height:70px}
.say{position:absolute;left:96px;top:14px;background:var(--ink);color:var(--paper);font-size:14px;padding:5px 12px;border-radius:14px 14px 14px 2px;max-width:calc(100% - 110px)}
.card{background:var(--paper);border-radius:20px;border:3px solid var(--ink);padding:34px 14px 14px;box-shadow:0 5px 0 var(--shadow);display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center}
.q{font-size:19px;font-weight:800;text-wrap:balance;max-width:100%}
.big{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.1;font-variant-numeric:tabular-nums}
.sub{font-size:16px;font-weight:800;text-align:center}
.vis{max-width:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.ans{display:flex;flex-direction:column;gap:12px;align-items:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.opts.one{grid-template-columns:1fr}
.opt{min-height:60px;border-radius:18px;background:var(--paper);box-shadow:0 4px 0 var(--shadow);font-family:var(--display);font-weight:800;font-size:23px;padding:8px 10px;line-height:1.1;border:3px solid transparent;font-variant-numeric:tabular-nums}
.opt.txt{font-size:16.5px;font-family:var(--body)}
.opt.right{background:var(--good);color:#fff}.opt.wrong{background:var(--bad);color:#fff}.opt.picked{border-color:var(--ink)}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px;font-family:var(--display);font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;line-height:1.2}
.eq.sm{font-size:21px}
.blank{min-width:58px;height:50px;padding:0 8px;border-radius:12px;border:3px dashed var(--line);background:var(--chip);display:inline-grid;place-items:center}
.blank.on{border:3px solid var(--accent)}.blank.right{border:3px solid var(--good);color:var(--good)}.blank.wrong{border:3px solid var(--bad);color:var(--bad)}
.padw{width:100%;display:flex;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;width:100%;max-width:340px}
.pad button{height:50px;border-radius:14px;background:var(--paper);box-shadow:0 3px 0 var(--shadow);font-family:var(--display);font-weight:800;font-size:24px}
.pad button:active{transform:translateY(2px)}
.pad .del{grid-column:span 5;height:40px;font-size:16px;background:var(--chip)}
.colsum{display:inline-grid;gap:4px;font-family:var(--display);font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;justify-items:center;align-items:center}
.colsum .cell{width:38px;height:44px;display:grid;place-items:center}
.colsum .dot{width:12px}
.colsum .rule{grid-column:1/-1;height:4px;background:var(--ink);width:100%;border-radius:2px}
.colsum .box{border:3px dashed var(--line);border-radius:10px;background:var(--chip)}
.colsum .box.on{border:3px solid var(--accent)}.colsum .box.right{border:3px solid var(--good);color:var(--good)}.colsum .box.wrong{border:3px solid var(--bad);color:var(--bad)}
.tray{min-height:54px;width:100%;border:3px dashed var(--line);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;background:var(--chip)}
.tray.right{border:3px solid var(--good)}.tray.wrong{border:3px solid var(--bad)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{padding:8px 13px;border-radius:12px;background:var(--paper);box-shadow:0 3px 0 var(--shadow);font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.tile.used{visibility:hidden}.tray .tile{background:var(--sun);color:#1d2a4d}
.pile,.basket,.plate{word-break:break-all;overflow-wrap:anywhere}
.pile{width:100%;display:flex;flex-wrap:wrap;gap:2px;justify-content:center;font-size:24px;min-height:34px;line-height:1.1}
.baskets{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.basket{min-width:74px;min-height:74px;max-width:112px;border-radius:14px 14px 26px 26px;border:3px solid var(--accent);background:var(--paper);padding:5px;display:flex;flex-wrap:wrap;gap:0;align-content:flex-start;justify-content:center;font-size:19px;line-height:1.05;position:relative}
.basket em{position:absolute;right:-6px;top:-10px;background:var(--ink);color:var(--paper);font-style:normal;font-size:13px;border-radius:999px;min-width:24px;padding:1px 5px;text-align:center}
.money{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center}
.coin{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;line-height:1;text-align:center;border:3px double #7a6a3a;color:#3a3210;background:#e7d48a}
.coin.s{background:#d9dde3;border-color:#6d7480;color:#2b3038;width:40px;height:40px}
.note{width:86px;height:42px;border-radius:6px;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:17px;color:#fff;border:2px solid rgba(0,0,0,.25);box-shadow:inset 0 0 0 3px rgba(255,255,255,.3)}
.n1{background:#3e7ed0}.n5{background:#3a9a56}.n10{background:#d64545}.n20{background:#e08a1e}.n50{background:#1f9aa0}
.blocks{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-end;justify-content:center}
.b100{width:50px;height:50px;background:var(--accent);background-image:linear-gradient(var(--paper) 1px,transparent 1px),linear-gradient(90deg,var(--paper) 1px,transparent 1px);background-size:5px 5px;border:1px solid var(--ink)}
.b10{width:7px;height:50px;background:var(--sun);background-image:linear-gradient(var(--ink) 1px,transparent 1px);background-size:5px 5px;border:1px solid var(--ink)}
.b1{width:7px;height:7px;background:var(--red);border:1px solid var(--ink)}
.ones{display:grid;grid-template-columns:repeat(3,7px);gap:3px}
.frame{border:2px solid var(--line);border-radius:12px;padding:8px}
.tbl{border-collapse:collapse;font-size:16px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{border:2px solid var(--line);padding:5px 10px;text-align:center}.tbl th{background:var(--chip)}
.scroll{max-width:100%;overflow-x:auto}
.plates{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.plate{min-width:58px;border-radius:999px;border:3px solid var(--line);background:var(--chip);padding:6px 8px;font-size:18px;line-height:1.1;max-width:120px}
.shop{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.item{display:flex;flex-direction:column;align-items:center;font-size:40px;line-height:1.1}
.item span{font-size:15px;font-weight:800;background:var(--sun);color:#1d2a4d;padding:2px 9px;border-radius:4px 10px 10px 4px}
svg text{font-family:var(--body);font-weight:800;fill:var(--ink)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--sky);border-top:2px solid var(--line);z-index:5}
.foot .in{max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.fb{border-radius:14px;padding:9px 12px;font-size:15.5px;background:var(--paper);border:3px solid var(--line)}
.fb.good{border-color:var(--good)}.fb.bad{border-color:var(--bad)}
.fb b{font-family:var(--display);font-size:18px}
.res{background:var(--paper);border-radius:22px;border:3px solid var(--ink);padding:18px 14px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 5px 0 var(--shadow)}
.res .score{font-family:var(--display);font-weight:800;font-size:54px;line-height:1}
.res .stars{font-size:38px;letter-spacing:4px}
.sticker{font-size:54px;line-height:1}
.sticks{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sticks div{aspect-ratio:1;border-radius:16px;background:var(--paper);display:grid;place-items:center;font-size:34px;box-shadow:0 3px 0 var(--shadow)}
.sticks div.no{background:var(--chip);box-shadow:none;border:2px dashed var(--line);color:var(--soft);font-size:22px}
.panel{background:var(--paper);border-radius:18px;padding:12px 14px;box-shadow:0 3px 0 var(--shadow);display:flex;flex-direction:column;gap:8px}
.panel h3{font-family:var(--display);font-size:18px;margin:0;line-height:1.1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--chip);border-radius:12px;padding:8px 4px;text-align:center;font-size:12.5px;color:var(--soft);line-height:1.15}
.stats b{display:block;font-family:var(--display);font-size:24px;color:var(--ink);line-height:1.1}
.meter{display:grid;grid-template-columns:minmax(0,1fr) 92px 44px;gap:8px;align-items:center;font-size:14.5px}
.meter .tr{height:10px;border-radius:5px;background:var(--chip);overflow:hidden}.meter .tr i{display:block;height:100%;background:var(--good);border-radius:5px}
.meter .tr i.mid{background:var(--sun)}.meter .tr i.low{background:var(--bad)}
.meter span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.hist{font-size:14px;width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.hist td{padding:5px 4px;border-top:1px solid var(--line)}.hist td:last-child{text-align:right;font-weight:800}
.note-t{font-size:13.5px;color:var(--soft)}
.rev{text-align:left;font-size:14.5px;border-top:1px solid var(--line);padding-top:6px;width:100%}
.rev b{color:var(--good)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.pop{animation:pop .3s ease-out}@keyframes pop{0%{transform:scale(.9);opacity:.4}100%{transform:scale(1);opacity:1}}
.modal{position:fixed;inset:0;background:rgba(10,14,30,.6);z-index:20;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--sky);border-radius:22px;padding:14px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:12px;max-height:90%;overflow:auto}
.picrow{display:flex;align-items:center;gap:8px;font-size:14.5px}.picrow .ch{width:44px;height:52px;animation:none}.picrow .ch img{width:40px;height:40px;margin-top:6px;border-width:2px}
.picrow span{flex:1;min-width:0}.picrow label,.picrow button{background:var(--chip);border-radius:10px;padding:6px 10px;font-weight:800;font-size:13.5px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.ch,.pop,.confetti i{animation:none!important}}
.tent .yrseg{display:inline-flex;margin-top:12px;border:3px solid var(--ink);box-shadow:none}
.tent .yrseg button{font-family:var(--display);font-size:17px;padding:5px 12px;color:var(--ink);white-space:nowrap}
.tent .yrseg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.emo{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:22px;line-height:1.2}

<script>
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const rm=c=>'RM'+(c/100).toFixed(2);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

/* ---------- saved state (this phone only) ---------- */
const KEY='circusMath.v1';
const S={year:2,lang:'both',c:'jojo',snd:true,mus:true,best:{},stickers:[],hist:[],sk:{},weak:[],pics:{},unlock:false};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o)Object.assign(S,o)}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- language: Bahasa Melayu is the main language, English is second ---------- */
const t=(en,bm)=>({en,bm});
function tx(o){if(o==null)return'';if(typeof o!=='object')return String(o);
  if(S.lang==='en')return o.en;if(S.lang==='bm')return o.bm;
  return o.en===o.bm?o.bm:'<span class="l1">'+o.bm+'</span><span class="l2">'+o.en+'</span>'}
function ts(o){if(typeof o!=='object')return String(o);if(S.lang==='en')return o.en;if(S.lang==='bm')return o.bm;return o.en===o.bm?o.bm:o.bm+' / '+o.en}
const T=(en,bm)=>tx({en,bm}), Ts=(en,bm)=>ts({en,bm});
const qLang=()=>S.lang==='both'?pick(['bm','bm','en']):S.lang;

const EN1=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const EN10=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
const BM1=['sifar','satu','dua','tiga','empat','lima','enam','tujuh','lapan','sembilan'];
function wordsEN(n){if(n>=1000){const th=Math.floor(n/1000),r=n%1000;return wordsEN(th)+' thousand'+(r?(r<100?' and ':' ')+wordsEN(r):'')}if(n<20)return EN1[n];if(n<100)return EN10[Math.floor(n/10)]+(n%10?'-'+EN1[n%10]:'');
  return EN1[Math.floor(n/100)]+' hundred'+(n%100?' and '+wordsEN(n%100):'')}
function wordsBM(n){if(n>=1000){const th=Math.floor(n/1000),r=n%1000;return(th===1?'seribu':wordsBM(th)+' ribu')+(r?' '+wordsBM(r):'')}if(n<10)return BM1[n];if(n===10)return'sepuluh';if(n===11)return'sebelas';if(n<20)return BM1[n-10]+' belas';
  if(n<100)return BM1[Math.floor(n/10)]+' puluh'+(n%10?' '+BM1[n%10]:'');
  const h=Math.floor(n/100);return(h===1?'seratus':BM1[h]+' ratus')+(n%100?' '+wordsBM(n%100):'')}
const words=(n,l)=>l==='bm'?wordsBM(n):wordsEN(n);
function moneyWords(c,l){const r=Math.floor(c/100),s=c%100;
  if(l==='bm')return(r?wordsBM(r)+' ringgit':'')+(r&&s?' ':'')+(s?wordsBM(s)+' sen':'');
  return(r?wordsEN(r)+' ringgit':'')+(r&&s?' and ':'')+(s?wordsEN(s)+' sen':'')}
function timeWords(h,m,l){if(l==='bm')return'pukul '+wordsBM(h)+(m?' '+wordsBM(m)+' minit':'');
  return m?wordsEN(m)+' minutes past '+wordsEN(h):wordsEN(h)+" o'clock"}
const hm=(h,m)=>h+':'+String(m).padStart(2,'0');

/* ---------- sound: every noise is made in code, no audio files ---------- */
const AU={ctx:null,timer:null,step:0,next:0,quiet:false};
function actx(){if(!AU.ctx){try{const C=window.AudioContext||window.webkitAudioContext;AU.ctx=new C()}catch(e){return null}}
  if(AU.ctx.state==='suspended')AU.ctx.resume().catch(()=>{});return AU.ctx}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,at,d,o){o=o||{};const c=AU.ctx;if(!c)return;const t0=(o.abs!=null?o.abs:c.currentTime+at),os=c.createOscillator(),g=c.createGain();
  os.type=o.type||'sine';os.frequency.setValueAtTime(f,t0);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t0+d);
  const v=o.g||.16;g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.015);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  os.connect(g);g.connect(c.destination);os.start(t0);os.stop(t0+d+.03)}
function noise(at,d,v){const c=AU.ctx;if(!c)return;const n=Math.floor(c.sampleRate*d),b=c.createBuffer(1,n,c.sampleRate),a=b.getChannelData(0);
  for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=c.createBufferSource(),g=c.createGain();s.buffer=b;g.gain.value=v||.08;s.connect(g);g.connect(c.destination);s.start(c.currentTime+at)}
const seq=(ms,gap,d,o)=>ms.forEach((m,i)=>tone(mf(m),i*gap,d,o));
const SFX={
  jojo:{ok(){seq([84,88,91,96],.07,.22,{type:'triangle'});[1000,1250,1000,1300,1100].forEach((f,i)=>tone(f,.34+i*.06,.05,{g:.09}))},no(){seq([76,72],.16,.25,{type:'triangle',g:.1})}},
  bibi:{ok(){tone(180,0,.32,{to:560,g:.2});tone(233,.36,.08,{type:'square',g:.07});tone(233,.48,.1,{type:'square',g:.07})},no(){tone(420,0,.35,{to:190,g:.14})}},
  mimi:{ok(){seq([79,84,88,91],.13,.9,{g:.12})},no(){seq([72,69],.2,.5,{g:.09})}},
  raja:{ok(){noise(0,.22,.06);seq([67,72,76],.11,.14,{type:'sawtooth',g:.07});tone(mf(79),.33,.45,{type:'sawtooth',g:.08})},no(){seq([55,52],.18,.3,{type:'sawtooth',g:.05})}},
  leo:{ok(){tone(98,0,.13,{type:'sawtooth',to:80,g:.09});tone(480,.2,.28,{to:1350,g:.16})},no(){tone(92,0,.4,{type:'sawtooth',to:66,g:.08})}},
  fifi:{ok(){[0,.09,.18].forEach(a=>tone(1500,a,.06,{to:1900,g:.1}));seq([72,76,79],.1,.2,{type:'triangle',g:.1})},no(){tone(900,0,.2,{to:680,g:.08})}}
};
function sfx(kind){if(!S.snd||!actx())return;
  if(kind==='tap')return tone(660,0,.05,{type:'triangle',g:.06});
  if(kind==='pop')return tone(520,0,.09,{to:780,g:.09});
  if(kind==='win'){SFX[S.c].ok();seq([72,76,79,84,88],.1,.3,{type:'triangle',g:.1});return}
  (SFX[S.c][kind]||SFX[S.c].ok)()}
const MUS={
  jojo:{bpm:132,w:'triangle',p:[72,0,76,79,0,76,72,0,74,0,77,81,0,77,74,0],b:[48,53]},
  bibi:{bpm:120,w:'square',p:[60,64,0,67,0,64,60,0,62,65,0,69,0,65,62,0],b:[36,41]},
  mimi:{bpm:84,w:'sine',p:[76,0,79,0,84,0,79,0,74,0,77,0,81,0,77,0],b:[48,53]},
  raja:{bpm:104,w:'sawtooth',p:[67,67,0,72,0,0,76,0,74,74,0,71,0,0,67,0],b:[43,43]},
  leo:{bpm:92,w:'triangle',p:[60,0,0,67,0,63,0,0,60,0,0,65,0,62,0,0],b:[36,41]},
  fifi:{bpm:100,w:'triangle',p:[79,0,0,0,76,0,0,0,81,0,0,0,77,0,74,0],b:[48,50]}
};
/* music plays on menus and result screens only; it stops while a question is on screen so she can focus */
function music(){if(!S.mus||!S.snd||AU.quiet||!actx()){clearInterval(AU.timer);AU.timer=null;return}
  if(AU.timer)return;
  AU.step=0;AU.next=AU.ctx.currentTime+.1;
  AU.timer=setInterval(()=>{const c=AU.ctx,m=MUS[S.c],sd=60/m.bpm/2;if(c.state!=='running')return;
    if(AU.next<c.currentTime)AU.next=c.currentTime+.05;
    while(AU.next<c.currentTime+.3){const i=AU.step%16,n=m.p[i],gv=m.w==='square'||m.w==='sawtooth'?.014:.03;
      if(n)tone(mf(n),0,sd*1.6,{type:m.w,g:gv,abs:AU.next});
      if(i%8===0)tone(mf(m.b[(AU.step>>3)%2]),0,sd*3,{type:'sine',g:.045,abs:AU.next});
      AU.step++;AU.next+=sd}},90)}
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend().catch(()=>{});else if(S.snd)AU.ctx.resume().catch(()=>{})});

const CH=id=>CHARS.find(c=>c.id===id)||CHARS[0];
function charHTML(id,mood){const c=CH(id),inner=S.pics[id]?`<img alt="${c.name}" src="${S.pics[id]}">`:`<svg viewBox="-4 -4 128 148" role="img" aria-label="${c.name}">${c.svg}</svg>`;
  return`<span class="ch" data-c="${id}" data-mood="${mood||'idle'}">${inner}</span>`}
function setMood(m,ms){const e=$('.stage .ch')||$('.res .ch');if(!e)return;e.dataset.mood='idle';void e.offsetWidth;e.dataset.mood=m;
  clearTimeout(setMood.t);setMood.t=setTimeout(()=>{if(e.isConnected)e.dataset.mood='idle'},ms||1000)}
function confetti(n){const box=el('div','confetti');const cols=['#e23b3b','#ffc531','#19a99b','#3558c9','#e2557f','#7ac74f'];
  for(let i=0;i<(n||60);i++){const p=el('i');p.style.left=R(0,100)+'%';p.style.background=pick(cols);p.style.animationDuration=(R(14,30)/10)+'s';p.style.animationDelay=(R(0,8)/10)+'s';box.appendChild(p)}
  document.body.appendChild(box);setTimeout(()=>box.remove(),4200)}
/* ---------- pictures used inside questions ---------- */
function vBlocks(n){const h=Math.floor(n/100),te=Math.floor(n%100/10),o=n%10;
  return'<div class="blocks frame">'+'<span class="b100"></span>'.repeat(h)+'<span class="b10"></span>'.repeat(te)+(o?'<span class="ones">'+'<span class="b1"></span>'.repeat(o)+'</span>':'')+'</div>'}
function vClock(h,m){let s='<svg class="clock" viewBox="0 0 200 200" width="170" height="170"><circle cx="100" cy="100" r="94" fill="var(--paper)" stroke="var(--ink)" stroke-width="6"/>';
  for(let i=1;i<=12;i++){const a=i*Math.PI/6;s+=`<text x="${(100+72*Math.sin(a)).toFixed(1)}" y="${(100-72*Math.cos(a)+7).toFixed(1)}" text-anchor="middle" font-size="20">${i}</text>`}
  for(let i=0;i<60;i++){const a=i*Math.PI/30,r1=i%5?88:84;s+=`<line x1="${(100+r1*Math.sin(a)).toFixed(1)}" y1="${(100-r1*Math.cos(a)).toFixed(1)}" x2="${(100+92*Math.sin(a)).toFixed(1)}" y2="${(100-92*Math.cos(a)).toFixed(1)}" stroke="var(--ink)" stroke-width="${i%5?1:3}"/>`}
  const ha=(h%12+m/60)*Math.PI/6,ma=m*Math.PI/30;
  s+=`<line x1="100" y1="100" x2="${(100+44*Math.sin(ha)).toFixed(1)}" y2="${(100-44*Math.cos(ha)).toFixed(1)}" stroke="var(--red)" stroke-width="8" stroke-linecap="round"/>`;
  s+=`<line x1="100" y1="100" x2="${(100+66*Math.sin(ma)).toFixed(1)}" y2="${(100-66*Math.cos(ma)).toFixed(1)}" stroke="var(--accent)" stroke-width="5" stroke-linecap="round"/><circle cx="100" cy="100" r="6" fill="var(--ink)"/></svg>`;return s}
function vRuler(objs,max){max=max||15;const u=20,x0=14,W=x0*2+max*u,top=objs.length*30+6;
  let s=`<svg viewBox="0 0 ${W} ${top+44}" width="${W}" style="max-width:100%;height:auto">`;
  objs.forEach((o,i)=>{const y=6+i*30;s+=`<rect x="${x0+o.from*u}" y="${y}" width="${(o.to-o.from)*u}" height="22" rx="8" fill="${o.col}" stroke="var(--ink)" stroke-width="2"/><text x="${x0+o.from*u+(o.to-o.from)*u/2}" y="${y+16}" text-anchor="middle" font-size="13" style="fill:#1d2a4d">${o.e}</text>`});
  s+=`<rect x="4" y="${top}" width="${W-8}" height="36" rx="4" fill="var(--sun)" stroke="var(--ink)" stroke-width="2"/>`;
  for(let i=0;i<=max;i++){s+=`<line x1="${x0+i*u}" y1="${top}" x2="${x0+i*u}" y2="${top+12}" stroke="#1d2a4d" stroke-width="2"/><text x="${x0+i*u}" y="${top+27}" text-anchor="middle" font-size="11" style="fill:#1d2a4d">${i}</text>`}

const W={};

W.tiles=(p,host,api)=>{const ans=p.answer.map(String),tray=el('div','tray'),bank=el('div','bank'),placed=[];

function startShow(act,L){const sk=shuffle(skillsOf(act)),weak=shuffle(S.weak.filter(k=>G[k]&&G[k].act===act)).slice(0,3),list=[];
  for(let i=0;list.length<10-weak.length;i++)list.push(sk[i%sk.length]);

function part(){const q=SH.qs[SH.i],p=q.parts[SH.pi],host=$('#ans');host.innerHTML='';SH.tries=0;SH.lock=false;
  if(p.text)host.appendChild(el('div',p.big?'big':'sub',tx(p.text)));

  footin.innerHTML=p.type==='choice'?'':`<button class="btn primary" id="bOK" type="button">${Ts('Check','Semak')}</button>`;
  if(SH.mode==='t'&&p.type!=='choice')$('#bOK').textContent=ts(t('Next','Seterusnya'));const b=$('#bOK');if(b)b.onclick=submit}

function say(o){const s=$('#say');if(!s)return;s.innerHTML=ts(o);s.hidden=false;clearTimeout(say.t);say.t=setTimeout(()=>{if(s.isConnected)s.hidden=true},1500)}
function submit(){if(SH.lock)return;const q=SH.qs[SH.i],p=q.parts[SH.pi],r=SH.w.check();
  if(r===null){say(t('Finish your answer first.','Lengkapkan jawapan dahulu.'));return}
  if(SH.mode==='t'){SH.lock=true;sfx('pop');if(r)SH.okParts++;else SH.clean=false;setTimeout(advance,280);return}
  if(r){SH.lock=true;SH.okParts++;sfx('ok');setMood('happy');say(pick(PRAISE));fb('good','<b>'+ts(pick(PRAISE))+'</b>');setTimeout(advance,1150);return}
  SH.clean=false;SH.tries++;sfx('no');setMood('sad',600);
  if(SH.tries<2){say(t('Try again!','Cuba lagi!'));SH.w.reset();fb('bad','<b>'+Ts('Hint','Petunjuk')+'</b><br>'+tx(q.hint||t('Read the question again slowly.','Baca soalan sekali lagi perlahan-lahan.')),'');
    if(p.type!=='choice'){footin.insertAdjacentHTML('beforeend',`<button class="btn primary" id="bOK" type="button">${Ts('Check','Semak')}</button>`);$('#bOK').onclick=submit}}
  else{SH.lock=true;SH.w.reveal();fb('bad','<b>'+Ts('The answer is','Jawapannya ialah')+':</b> '+p.ans,Ts('Next','Seterusnya'))}}
function advance(){if(!SH)return;const q=SH.qs[SH.i];if(!q)return;const p=q.parts[SH.pi];SH.done.push(p);SH.pi++;
  if(SH.pi<q.parts.length){if(SH.mode==='p'){const d=$('#doneParts');if(d)d.insertAdjacentHTML('beforeend','<div class="sub" style="color:var(--good)">✓ '+(p.text?ts(p.text)+': ':'')+p.ans+'</div>')}part();return}
  const ok=SH.clean,st=S.sk[q.skill]||(S.sk[q.skill]={n:0,r:0});st.n++;if(ok)st.r++;
  if(ok)S.weak=S.weak.filter(k=>k!==q.skill);else if(!S.weak.includes(q.skill)){S.weak.push(q.skill);if(S.weak.length>14)S.weak.shift()}
  SH.res.push({ok,got:SH.mode==='t'?Math.round(q.marks*SH.okParts/q.parts.length):0});save();SH.i++;nextQ()}
function quitAsk(){const m=el('div','modal',`<div class="box"><h2>${T('Stop this show?','Berhenti sekarang?')}</h2><div class="row"><button class="btn" id="mNo" type="button">${Ts('Keep playing','Teruskan')}</button><button class="btn primary" id="mYes" type="button">${Ts('Stop','Berhenti')}</button></div></div>`);
  document.body.appendChild(m);$('#mNo',m).onclick=()=>m.remove();$('#mYes',m).onclick=()=>{m.remove();home()}}
function pickChar(){const m=el('div','modal',`<div class="box"><h2>${T('How do you feel now?','Apa perasaan kamu sekarang?')}</h2><div class="chars">${CHARS.map(c=>`<button type="button" class="charcard${c.id===S.c?' sel':''}" data-c="${c.id}">${charHTML(c.id)}<b>${c.name}</b><small>${ts(c.mood)}</small></button>`).join('')}</div></div>`);
  document.body.appendChild(m);m.onclick=e=>{const b=e.target.closest('.charcard');if(b){S.c=b.dataset.c;save();applyChar();music();$('#bWho').innerHTML=charHTML(S.c);sfx('ok');setMood('happy')}m.remove()}}

function finish(){const n=SH.qs.length,right=SH.res.filter(r=>r.ok).length;
  if(SH.mode==='p'){const stars=right>=9?3:right>=7?2:right>=5?1:0,key=SH.act+SH.L;S.best[key]=Math.max(S.best[key]||0,stars);let st=null;
    if(right>=7){st=STICKERS.find(s=>!S.stickers.includes(s));if(st)S.stickers.push(st)}
    S.hist.push({d:today(),m:'p',a:SH.act,L:SH.L,s:right,t:n});S.hist=S.hist.slice(-60);save();const a=SH.act,L=SH.L,nextOpen=L<3&&stars>=2;
    screen(`<div class="res pop">${charHTML(S.c,'happy')}<div class="stars">${starStr(stars)}</div><div class="score">${right} / ${n}</div>
      <div class="q">${right>=9?T('What a show!','Persembahan yang hebat!'):right>=7?T('Well done!','Syabas!'):right>=5?T('Good try! Play again to get more stars.','Cubaan yang baik! Main lagi untuk dapat lebih bintang.'):T('Keep practising. You can do it!','Teruskan berlatih. Kamu boleh!')}</div>
      ${st?`<div class="sticker">${st}</div><div class="sub">${T('New sticker!','Pelekat baharu!')}</div>`:''}</div>
      ${nextOpen?`<button class="btn sun" id="bUp" type="button">${Ts('Go to level','Ke tahap')} ${L+1} ➜</button>`:''}
      <button class="btn primary" id="bAgain" type="button">${Ts('Play again','Main lagi')}</button><div class="row"><button class="btn small" id="bActs" type="button">${Ts('Other acts','Babak lain')}</button><button class="btn small" id="bHome" type="button">${Ts('Home','Laman utama')}</button></div>`);
    sfx(right>=5?'win':'no');if(right>=9)confetti(80);else if(right>=7)confetti(30);
    $('#bAgain').onclick=()=>startShow(a,L);$('#bActs').onclick=acts;$('#bHome').onclick=home;if(nextOpen)$('#bUp').onclick=()=>startShow(a,L+1);return}
  const p=SH.paper,got=SH.res.reduce((x,r)=>x+r.got,0),pct=Math.round(got/p.total*100);
  S.hist.push({d:today(),m:'t',a:p.id,s:got,t:p.total});S.hist=S.hist.slice(-60);save();
  const wrong=SH.qs.map((q,i)=>({q,i})).filter(x=>!SH.res[x.i].ok);
  screen(`<div class="res pop">${charHTML(S.c,'happy')}<div class="sub">${ts(p.name)}</div><div class="score">${got} / ${p.total}</div><div class="sub">${pct}%</div>
    <div class="q">${pct>=80?T('Excellent work!','Kerja yang cemerlang!'):pct>=60?T('Good work!','Kerja yang baik!'):T('Keep practising. You can do it!','Teruskan berlatih. Kamu boleh!')}</div></div>
    ${wrong.length?`<div class="panel"><h3>${Ts('Look at these again','Lihat semula soalan ini')}</h3>${wrong.map(x=>`<div class="rev">${x.i+1}. ${ts(x.q.text)}${x.q.big!=null?' <span style="white-space:nowrap">'+x.q.big+'</span>':''}${x.q.sub?' ('+ts(x.q.sub)+')':''}<br><b>${x.q.parts.map(pp=>pp.ans).join(' → ')}</b></div>`).join('')}</div>`:''}
    <div class="row"><button class="btn small" id="bT" type="button">${Ts('Other tests','Ujian lain')}</button><button class="btn small primary" id="bHome" type="button">${Ts('Home','Laman utama')}</button></div>`);
  sfx(pct>=50?'win':'no');if(pct>=80)confetti(80);$('#bT').onclick=tests;$('#bHome').onclick=home}

function stickers(){screen(head(T('My stickers','Pelekat saya'))+`<p class="note-t">${T('Get 7 or more right in a practice show to win a sticker.','Jawab 7 atau lebih dengan betul dalam latihan untuk dapat pelekat.')}</p><div class="sticks">${STICKERS.map(s=>S.stickers.includes(s)?`<div>${s}</div>`:'<div class="no">?</div>').join('')}</div>`);onBack(home)}

function parent(){const shows=S.hist.filter(h=>h.m==='p'),testsH=S.hist.filter(h=>h.m==='t'),tot=Object.values(S.sk).reduce((a,s)=>({n:a.n+s.n,r:a.r+s.r}),{n:0,r:0});
  const perAct=actsNow().map(a=>{const s=skillsOf(a.id).reduce((x,k)=>{const v=S.sk[k];return v?{n:x.n+v.n,r:x.r+v.r}:x},{n:0,r:0});return{a,s}});
  const weak=Object.keys(S.sk).filter(k=>G[k]&&S.sk[k].n>=3&&S.sk[k].r/S.sk[k].n<.7).sort((x,y)=>S.sk[x].r/S.sk[x].n-S.sk[y].r/S.sk[y].n).slice(0,6);
  const nm=h=>h.m==='t'?ts((PAPERS.find(p=>p.id===h.a)||{name:h.a}).name):ts((ALLACTS.find(a=>a.id===h.a)||{name:h.a}).name)+' · '+Ts('Level','Tahap')+' '+h.L;
  screen(head(T('For parents','Untuk ibu bapa'))+`
   <div class="stats"><div><b>${shows.length}</b>${Ts('practice shows','latihan')}</div><div><b>${tot.n}</b>${Ts('questions','soalan')}</div><div><b>${tot.n?Math.round(tot.r/tot.n*100)+'%':'–'}</b>${Ts('right first try','betul kali pertama')}</div></div>
   <div class="panel"><h3>${Ts('Score by topic','Skor mengikut topik')} · ${S.lang==='en'?'Year':'Tahun'} ${S.year}</h3>${perAct.map(({a,s})=>{const pc=s.n?Math.round(s.r/s.n*100):0;return`<div class="meter"><span>${a.ic} ${ts(a.name)}</span><span class="tr"><i class="${pc>=80?'':pc>=60?'mid':'low'}" style="width:${pc}%"></i></span><span>${s.n?pc+'%':'–'}</span></div>`}).join('')}</div>
   <div class="panel"><h3>${Ts('Needs more practice','Perlu lebih latihan')}</h3>${weak.length?weak.map(k=>`<div class="meter"><span>${ts(G[k].name)}</span><span class="tr"><i class="low" style="width:${Math.round(S.sk[k].r/S.sk[k].n*100)}%"></i></span><span>${S.sk[k].r}/${S.sk[k].n}</span></div>`).join(''):`<span class="note-t">${T('Nothing yet. Weak spots show here after a few shows, and come back more often in practice.','Belum ada. Topik yang lemah akan dipaparkan di sini selepas beberapa latihan, dan akan diulang lebih kerap.')}</span>`}</div>
   <div class="panel"><h3>${Ts('Recent results','Keputusan terkini')}</h3>${S.hist.length?'<table class="hist">'+S.hist.slice(-10).reverse().map(h=>`<tr><td>${h.d.slice(5)}</td><td>${h.m==='t'?'📝':'🎪'} ${nm(h)}</td><td>${h.s}/${h.t}</td></tr>`).join('')+'</table>':`<span class="note-t">${T('No shows played yet.','Belum ada latihan dimainkan.')}</span>`}</div>
   <div class="panel"><h3>${Ts('Settings','Tetapan')}</h3>
     <button class="btn small" id="bUnl" type="button">${S.unlock?'🔓 '+Ts('All levels are open','Semua tahap dibuka'):'🔒 '+Ts('Open all levels','Buka semua tahap')}</button>
     <span class="note-t">${T('Character pictures: you can replace a drawing with a photo from this phone. The picture stays on this phone only.','Gambar watak: anda boleh menggantikan lukisan dengan gambar dari telefon ini. Gambar disimpan dalam telefon ini sahaja.')}</span>
     ${CHARS.map(c=>`<div class="picrow">${charHTML(c.id)}<span>${c.name} · ${ts(c.mood)}</span>${S.pics[c.id]?`<button type="button" data-rm="${c.id}">${Ts('Remove','Buang')}</button>`:''}<label>${Ts('Picture','Gambar')}<input id="pic_${c.id}" type="file" accept="image/*" data-pic="${c.id}" hidden></label></div>`).join('')}
     <button class="btn small" id="bReset" type="button">🗑 ${Ts('Clear all progress','Padam semua rekod')}</button></div>`);
  onBack(home);$('#bUnl').onclick=()=>{S.unlock=!S.unlock;save();parent()};
  let armed=false;$('#bReset').onclick=e=>{if(!armed){armed=true;e.currentTarget.textContent='⚠ '+Ts('Tap again to clear everything','Tekan sekali lagi untuk padam semua');return}
    Object.assign(S,{best:{},stickers:[],hist:[],sk:{},weak:[]});save();parent()};
  app.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{delete S.pics[b.dataset.rm];save();parent()});
  app.querySelectorAll('[data-pic]').forEach(inp=>inp.onchange=()=>{const f=inp.files&&inp.files[0];if(!f)return;const rd=new FileReader();
    rd.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=220,s=Math.min(im.width,im.height);c.width=c.height=z;
      c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);S.pics[inp.dataset.pic]=c.toDataURL('image/jpeg',.82);save();parent()};im.src=rd.result};rd.readAsDataURL(f)})}

document.addEventListener('pointerdown',function once(){document.removeEventListener('pointerdown',once);if(actx())music()},{once:true});
home();
</script>

</body>
