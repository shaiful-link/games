<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#6c3eea"><title>Circus & Monster Art Studio</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:linear-gradient(140deg,#f4eaff,#e5f8ff);color:#25213a}header{background:#6c3eea;color:white;text-align:center;padding:15px 10px}h1{font-size:23px;margin:0}header p{margin:4px;font-size:13px}.wrap{max-width:850px;margin:auto;padding:12px}.panel{background:white;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 5px 18px #3b21651a}.tabs,.characters,.tools,.colors,.actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}button{font:inherit;border:0;border-radius:12px;padding:10px 13px;background:#eee8fc;color:#33265c;font-weight:700;cursor:pointer;touch-action:manipulation}button.active{background:#6c3eea;color:white}button:focus-visible{outline:3px solid orange}.character{min-width:100px}.character small{display:block;font-size:12px;font-weight:400}.canvas-wrap{position:relative;width:100%;max-width:620px;margin:auto;aspect-ratio:1;background:white;border:3px solid #ddd1ff;border-radius:16px;overflow:hidden;touch-action:none}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.colors button{width:36px;height:36px;border-radius:50%;padding:0;border:3px solid #eee}.colors button.active{outline:3px solid #333}.info{text-align:center;font-size:14px;color:#5b5273}.actions button{background:#e7f5ff}.actions .primary{background:#6c3eea;color:white}.stars{text-align:center;font-size:22px;color:#ffb700;min-height:30px}.hide{display:none}footer{text-align:center;font-size:12px;color:#746c87;padding:18px}input[type=range]{width:110px;vertical-align:middle}</style></head><body><header><h1>🎨 Circus & Monster Art Studio</h1><p>Trace • Color • Create • Save</p></header><main class="wrap"><section class="panel"><div class="tabs"><button id="circusTab" class="active" onclick="setCategory('circus')">🎪 Circus Friends</button><button id="monsterTab" onclick="setCategory('monster')">👾 Monster Friends</button></div><p class="info">Pick a character to start drawing!</p><div id="characters" class="characters"></div></section><section class="panel"><div id="stepText" class="info" aria-live="polite"></div><div class="canvas-wrap"><canvas id="guide" width="700" height="700"></canvas><canvas id="paint" width="700" height="700"></canvas></div><div class="stars" id="stars"></div><div class="actions" style="margin-top:10px"><button onclick="prevStep()">◀ Previous</button><button class="primary" onclick="nextStep()">Next Step ▶</button><button onclick="finish()">⭐ Finished!</button></div></section><section class="panel"><div class="tools"><button id="penTool" class="active" onclick="setTool('pen')">✏️ Draw</button><button id="eraserTool" onclick="setTool('eraser')">🧽 Eraser</button><button id="fillTool" onclick="setTool('fill')">🪣 Color Area</button><label>Size <input id="size" type="range" min="3" max="45" value="9" aria-label="Brush size"></label></div><div id="colors" class="colors" style="margin:15px 0"></div><div class="actions"><button onclick="undo()">↶ Undo</button><button onclick="clearPaint()">🗑 Clear</button><button class="primary" onclick="savePng()">⬇ Save Picture</button></div></section></main><footer>Made for little artists 💜 Original circus and monster designs. No account needed.</footer><script>
const C=document.getElementById('paint'),P=C.getContext('2d',{willReadFrequently:true}),G=document.getElementById('guide'),X=G.getContext('2d');const S=700;let category='circus',chosen=0,step=0,tool='pen',color='#e8469a',drawing=false,last=null,history=[];const palette=['#e8469a','#ffbf32','#4fc4e8','#7954e8','#56bf72','#f76b46','#ffffff','#222222','#a36a40'];
// Original geometric characters; each shape is a progressively revealed drawing step.
const chars={circus:[{name:'Pippa',emoji:'🎀',desc:'Jolly jester',shapes:[['hat',350,175],['face',350,340],['eyes',350,340],['smile',350,340],['body',350,535]]},{name:'Jolly',emoji:'🐰',desc:'Long-ear friend',shapes:[['ears',350,200],['face',350,335],['eyes',350,335],['nose',350,335],['body',350,535]]},{name:'Dottie',emoji:'🤡',desc:'Happy clown',shapes:[['hair',350,260],['face',350,340],['eyes',350,340],['nose',350,340],['body',350,535]]}],monster:[{name:'Fuzzy',emoji:'💙',desc:'Fluffy buddy',shapes:[['fur',350,340],['eyes',350,340],['smile',350,340],['arms',350,490],['feet',350,560]]},{name:'Mimi',emoji:'💗',desc:'Heart monster',shapes:[['heart',350,340],['eyes',350,340],['smile',350,340],['arms',350,490],['feet',350,560]]},{name:'Naptime',emoji:'🐱',desc:'Sleepy kitty',shapes:[['cat',350,335],['eyes',350,335],['nose',350,335],['body',350,530],['tail',350,530]]}]};
function pathShape(type,x,y){X.beginPath();switch(type){case'face':X.ellipse(x,y,135,145,0,0,Math.PI*2);break;case'eyes':X.ellipse(x-50,y-25,13,23,0,0,Math.PI*2);X.moveTo(x+63,y-25);X.ellipse(x+50,y-25,13,23,0,0,Math.PI*2);break;case'smile':X.arc(x,y+12,65,0.15,Math.PI-0.15);break;case'nose':X.arc(x,y+24,13,0,Math.PI*2);break;case'body':X.moveTo(x-100,y+100);X.lineTo(x-115,y-70);X.quadraticCurveTo(x,y-140,x+115,y-70);X.lineTo(x+100,y+100);X.closePath();break;case'hat':X.moveTo(x-135,y+95);X.lineTo(x-145,y-55);X.lineTo(x-45,y+10);X.lineTo(x,y-110);X.lineTo(x+45,y+10);X.lineTo(x+145,y-55);X.lineTo(x+135,y+95);X.stroke();for(let a of [-145,0,145]){X.beginPath();X.arc(x+a,y+(a===0?-110:-55),22,0,Math.PI*2);X.stroke()}return;case'ears':for(let a of [-70,70]){X.moveTo(x+a-35,y+120);X.quadraticCurveTo(x+a-60,y-190,x+a,y-175);X.quadraticCurveTo(x+a+65,y-160,x+a+35,y+120)}break;case'hair':for(let a=-2;a<=2;a++){X.moveTo(x+a*57,y+35);X.arc(x+a*57,y-10,58,0,Math.PI*2)}break;case'fur':for(let i=0;i<22;i++){let a=i*Math.PI/11,r=145;X.lineTo(x+Math.cos(a)*(r+(i%2?20:0)),y+Math.sin(a)*(r+(i%2?20:0)))}X.closePath();break;case'heart':X.moveTo(x,y+135);X.bezierCurveTo(x-300,y-40,x-150,y-190,x,y-70);X.bezierCurveTo(x+150,y-190,x+300,y-40,x,y+135);break;case'cat':X.moveTo(x-125,y-30);X.lineTo(x-145,y-180);X.lineTo(x-40,y-125);X.quadraticCurveTo(x,y-150,x+40,y-125);X.lineTo(x+145,y-180);X.lineTo(x+125,y-30);X.arc(x,y+10,135,-0.3,Math.PI+0.3);break;case'arms':for(let a of [-1,1]){X.moveTo(x+a*115,y-75);X.lineTo(x+a*205,y+25);X.lineTo(x+a*175,y+55)}break;case'feet':for(let a of [-1,1]){X.moveTo(x+a*70,y-80);X.lineTo(x+a*70,y+55);X.lineTo(x+a*125,y+55)}break;case'tail':X.moveTo(x+105,y+80);X.bezierCurveTo(x+230,y+30,x+220,y-140,x+150,y-105);break;default:return}X.stroke()}
function renderGuide(){X.clearRect(0,0,S,S);X.fillStyle='white';X.fillRect(0,0,S,S);X.lineWidth=9;X.lineCap='round';X.lineJoin='round';const sh=chars[category][chosen].shapes;for(let i=0;i<=step;i++){X.setLineDash(i===step?[13,15]:[]);X.strokeStyle=i===step?'#ad8de6':'#d7cde5';pathShape(...sh[i]);}X.setLineDash([]);document.getElementById('stepText').textContent=`${chars[category][chosen].name} — Step ${step+1} of ${sh.length}: Trace the dotted lines!`}
function renderChars(){const area=document.getElementById('characters');area.innerHTML='';chars[category].forEach((c,i)=>{let b=document.createElement('button');b.className='character'+(i===chosen?' active':'');b.innerHTML=`<span style="font-size:26px">${c.emoji}</span><br>${c.name}<small>${c.desc}</small>`;b.onclick=()=>{chosen=i;step=0;clearPaint();renderChars();renderGuide()};area.appendChild(b)})}function setCategory(c){category=c;chosen=0;step=0;document.getElementById('circusTab').classList.toggle('active',c==='circus');document.getElementById('monsterTab').classList.toggle('active',c==='monster');clearPaint();renderChars();renderGuide()}function nextStep(){if(step<chars[category][chosen].shapes.length-1){step++;renderGuide()}else finish()}function prevStep(){step=Math.max(0,step-1);renderGuide()}function finish(){document.getElementById('stars').textContent='⭐⭐⭐ Fantastic drawing! 🎉'}function setTool(t){tool=t;for(let v of ['pen','eraser','fill'])document.getElementById(v+'Tool').classList.toggle('active',v===t)}const colors=document.getElementById('colors');palette.forEach(v=>{let b=document.createElement('button');b.style.background=v;b.title=v;b.setAttribute('aria-label','Choose '+v);b.onclick=()=>{color=v;document.querySelectorAll('.colors button').forEach(z=>z.classList.remove('active'));b.classList.add('active')};if(v===color)b.classList.add('active');colors.appendChild(b)});function checkpoint(){history.push(P.getImageData(0,0,S,S));if(history.length>15)history.shift()}function undo(){if(history.length)P.putImageData(history.pop(),0,0)}function clearPaint(){checkpoint();P.clearRect(0,0,S,S);document.getElementById('stars').textContent=''}function coords(e){let r=C.getBoundingClientRect();return{x:(e.clientX-r.left)*S/r.width,y:(e.clientY-r.top)*S/r.height}}function dot(pt){P.beginPath();P.arc(pt.x,pt.y,+document.getElementById('size').value/2,0,Math.PI*2);P.fill()}function stroke(a,b){P.beginPath();P.moveTo(a.x,a.y);P.lineTo(b.x,b.y);P.stroke()}function setupBrush(){P.globalCompositeOperation=tool==='eraser'?'destination-out':'source-over';P.strokeStyle=color;P.fillStyle=color;P.lineWidth=+document.getElementById('size').value;P.lineCap='round';P.lineJoin='round'}C.addEventListener('pointerdown',e=>{e.preventDefault();C.setPointerCapture(e.pointerId);checkpoint();let p=coords(e);if(tool==='fill'){flood(p);return}drawing=true;last=p;setupBrush();dot(p)});C.addEventListener('pointermove',e=>{if(!drawing)return;e.preventDefault();let p=coords(e);setupBrush();stroke(last,p);last=p});function stop(){drawing=false;last=null;P.globalCompositeOperation='source-over'}C.addEventListener('pointerup',stop);C.addEventListener('pointercancel',stop);
// Flood fill applies to the user's drawing layer only, leaving the dotted guide intact.
function flood(p){let x=Math.max(0,Math.min(699,Math.floor(p.x))),y=Math.max(0,Math.min(699,Math.floor(p.y))),img=P.getImageData(0,0,S,S),d=img.data,idx=(y*S+x)*4,old=[...d.slice(idx,idx+4)];let rgb=color.match(/\w\w/g).map(h=>parseInt(h,16)),replacement=[...rgb,255];if(old.every((v,i)=>v===replacement[i]))return;let stack=[y*S+x],seen=new Uint8Array(S*S),n=0;while(stack.length&&n<490000){let z=stack.pop();if(seen[z])continue;seen[z]=1;let k=z*4;if(d[k]!==old[0]||d[k+1]!==old[1]||d[k+2]!==old[2]||d[k+3]!==old[3])continue;d.set(replacement,k);n++;let xx=z%S,yy=(z/S)|0;if(xx>0)stack.push(z-1);if(xx<S-1)stack.push(z+1);if(yy>0)stack.push(z-S);if(yy<S-1)stack.push(z+S)}P.putImageData(img,0,0)}function savePng(){let out=document.createElement('canvas');out.width=out.height=S;let ctx=out.getContext('2d');ctx.drawImage(G,0,0);ctx.drawImage(C,0,0);let a=document.createElement('a');a.href=out.toDataURL('image/png');a.download=chars[category][chosen].name+'-art.png';document.body.appendChild(a);a.click();a.remove()}renderChars();renderGuide();</script></body></html>
