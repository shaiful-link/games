<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jigsaw</title>
<style>
  /* Page fills the phone screen: stats and buttons on top, puzzle below */
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1220;
    color: #ffffff;
    font-family: system-ui, sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #app {
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
  }

  /* Top bar: level, pieces, time, buttons */
  #top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 10px;
    background: linear-gradient(#17223f, #0f1830);
    box-shadow: inset 0 -1px 0 rgba(255,255,255,0.07);
  }

  /* Each stat sits in its own small rounded card */
  .stat {
    position: relative;
    flex: 1 1 0;
    min-width: 48px;
    height: 40px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    text-align: center;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    overflow: hidden;
  }
  .stat span {
    display: block;
    font-size: 9px;
    line-height: 1.2;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }
  .stat b { font-size: 17px; line-height: 1.15; font-variant-numeric: tabular-nums; }
  #level  { color: #8fd0ff; }      /* each stat has its own accent colour */
  #pieces { color: #7fe3a8; }
  #time   { color: #ffd66b; }

  /* Thin green bar under "Pieces" that fills up as pieces are placed */
  #piecesBar {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 3px;
    width: 0%;
    background: #4dd48a;
    transition: width 0.25s;
  }

  #top button {
    height: 40px;
    padding: 0 12px;
    border: 0;
    border-radius: 10px;
    background: linear-gradient(#2a3962, #1c2742);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.14), 0 2px 0 rgba(0,0,0,0.35);
    color: #ffffff;
    font-size: 14px;
    font-weight: 600;
    touch-action: manipulation;
  }
  #top button:active { background: #2c3a60; transform: translateY(1px); }
  #top button.on { background: linear-gradient(#37917a, #2a6f5c); }

  /* Sound on/off button (same look in all the games) */
  #top #sound {
    width: 40px;
    padding: 0;
    flex: 0 0 auto;
    background: rgba(255,255,255,0.10);
    box-shadow: none;
    font-size: 17px;
  }
  #top #sound.off { opacity: 0.45; }
  #photoInput { display: none; }

  /* Small phones: tighten the top bar so everything still fits on one line */
  @media (max-width: 370px) {
    #top { gap: 4px; padding: 8px 6px; }
    .stat { min-width: 44px; }
    .stat b { font-size: 15px; }
    #top button { padding: 0 8px; font-size: 13px; }
    #top #sound { width: 36px; padding: 0; font-size: 16px; }
  }

  #stage { flex: 1; min-height: 0; }
  #game { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <div class="stat"><span>Level</span><b id="level">1/10</b></div>
    <div class="stat"><span>Pieces</span><b id="pieces">0/0</b><i id="piecesBar"></i></div>
    <div class="stat"><span>Time</span><b id="time">0:00</b></div>
    <button id="btnHint" aria-label="Show or hide the picture">Hint</button>
    <button id="btnPhoto" aria-label="Use my own photo">Photo</button>
    <button id="sound" aria-label="Sound on or off"></button>
    <input id="photoInput" type="file" accept="image/*">
  </div>
  <div id="stage"><canvas id="game"></canvas></div>
</div>

<script>
// =====================================================
// JIGSAW - jigsaw puzzle for phones, with 10 levels
// Drag each piece into the frame. A piece clicks into place when it is close.
// Hint  = show the finished picture faintly inside the frame.
// Photo = use a picture from your phone (it stays on your phone, nothing is uploaded).
// Speaker button = sound on / off (all sounds are made by code).
// Every level has its own picture, and every picture is drawn by code (no image files).
// =====================================================

// ---------- Settings (change these to experiment) ----------
const SNAP = 0.3;                // how close a piece must be to click in (share of piece size)
const TAB  = 0.22;               // size of the knobs on the pieces (share of piece size)
const SOUND_VOLUME = 0.25;       // 0 = silent, 1 = very loud
const SHADOW_BLUR = 5;           // how soft the shadow under a loose piece is (pixels)
const LIFT_SCALE = 0.07;         // how much bigger a piece looks while you hold it (0.07 = 7%)
const LIFT_SHADOW = 9;           // how far the shadow moves away while a piece is held (pixels)
const MAX_PARTICLES = 150;       // most sparkles + confetti on screen at once (keeps cheap phones fast)

// ---------- Levels ----------
// cols x rows = number of pieces. To add a level, add one more line to this list.
const LEVELS = [
  { cols: 2, rows: 2 },   // 1:  4 pieces
  { cols: 3, rows: 2 },   // 2:  6
  { cols: 3, rows: 3 },   // 3:  9
  { cols: 4, rows: 3 },   // 4:  12
  { cols: 4, rows: 4 },   // 5:  16
  { cols: 5, rows: 4 },   // 6:  20
  { cols: 5, rows: 5 },   // 7:  25
  { cols: 6, rows: 5 },   // 8:  30
  { cols: 6, rows: 6 },   // 9:  36
  { cols: 7, rows: 6 }    // 10: 42
];

// ---------- Page elements ----------
const stage  = document.getElementById('stage');
const canvas = document.getElementById('game');
const ctx    = canvas.getContext('2d');
const elLevel  = document.getElementById('level');
const elPieces = document.getElementById('pieces');
const elPiecesBar = document.getElementById('piecesBar');
const elTime   = document.getElementById('time');
const btnHint  = document.getElementById('btnHint');
const btnPhoto = document.getElementById('btnPhoto');
const photoInput = document.getElementById('photoInput');

// ---------- Game state ----------
let screen = 'title';            // 'title' | 'play' | 'clear' | 'won'
let level = 1;
let pieces = [];                 // each piece: { c, r, x, y, placed, img, shadow, flash }  (x, y = top-left of its cell on screen)
let order = [];                  // loose pieces in drawing order (last = on top)
let placedCount = 0;
let levelTime = 0;               // seconds spent on this level
let hint = false;
let photo = null;                // the player's own picture, if chosen
let picture = null;              // offscreen canvas holding the finished picture
let drag = null;                 // { piece, dx, dy } while a piece is being moved
let tabsV = [], tabsH = [];      // which way each knob points (+1 or -1)

// Effects (only for looks, they never change the game)
let clock = 0;                   // seconds since the page opened (drives gentle pulsing)
let lift = 0;                    // 0 = piece lying flat, 1 = piece fully lifted by the finger
let particles = [];              // sparkles and confetti
let rings = [];                  // growing circles where a piece clicked in
let pictureFlash = 0;            // white flash over the picture when a level is finished (1 fading to 0)
let confettiTimer = 0;           // counts up to the next confetti burst on the final screen
let backdrop = null;             // offscreen canvas: background, frame and tray, painted once

// Layout (set by resize)
let dpr = 1, W = 0, H = 0;
let frame = { x: 0, y: 0, size: 0 };             // where the puzzle is assembled
let tray  = { x: 0, y: 0, w: 0, h: 0 };          // where loose pieces start
let cw = 0, ch = 0, pad = 0;                     // piece width, height, and knob margin
let shadowPad = 0;                               // margin around a piece's shadow image

// ---------- Sound ----------
// All sounds are made by code (short notes), so there are no sound files to upload.
// Phones only allow sound after a touch, so the sound engine starts on the first touch.
// The on/off choice is remembered, and is shared by all the games on this site.
const btnSound = document.getElementById('sound');
let audio = null;                // the sound engine (created on first touch)
let muted = false;
try { muted = localStorage.getItem('gamesMuted') === '1'; } catch (e) { /* storage blocked: start with sound on */ }

function showSoundButton() {
  btnSound.textContent = muted ? '\u{1F507}' : '\u{1F50A}';      // speaker off / speaker on
  btnSound.classList.toggle('off', muted);
}
showSoundButton();

function startAudio() {
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === 'suspended') audio.resume();
  } catch (e) { audio = null; }                                  // no sound support: the game still works
}
// Different phones accept different kinds of touch for this, so listen for all of them
for (const type of ['pointerdown', 'pointerup', 'touchend', 'click', 'keydown']) {
  window.addEventListener(type, startAudio, true);
}

// Play one note.
//   freq  = pitch in Hz (higher number = higher note)
//   dur   = length in seconds
//   type  = 'sine' (soft), 'triangle' (round), 'square' (retro), 'sawtooth' (buzzy)
//   delay = seconds to wait before it starts (used to build little tunes)
//   slide = pitch to glide to by the end (optional)
//   volume = 0 to 1, share of SOUND_VOLUME
function beep(freq, dur, type = 'sine', delay = 0, slide = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  const t = audio.currentTime + delay;
  const osc = audio.createOscillator();
  const gain = audio.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t);
  if (slide) osc.frequency.exponentialRampToValueAtTime(slide, t + dur);
  gain.gain.setValueAtTime(0.0001, t);
  gain.gain.exponentialRampToValueAtTime(SOUND_VOLUME * volume, t + 0.01);   // quick fade in (no click)
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);                   // fade out
  osc.connect(gain).connect(audio.destination);
  osc.start(t);
  osc.stop(t + dur + 0.02);
}

// Play a burst of hiss (used for the "click" when a piece locks in).
//   dur = length in seconds, tone = how bright it is in Hz (300 = deep boom, 4000 = sharp crack)
let noiseBuffer = null;
function noise(dur, tone = 1000, delay = 0, volume = 1) {
  if (muted || !audio || audio.state !== 'running') return;
  if (!noiseBuffer) {                                            // one second of random hiss, made once
    noiseBuffer = audio.createBuffer(1, audio.sampleRate, audio.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
  }
  const t = audio.currentTime + delay;
  const src = audio.createBufferSource();
  const filter = audio.createBiquadFilter();
  const gain = audio.createGain();
  src.buffer = noiseBuffer;
  src.loop = true;
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(tone, t);
  filter.frequency.exponentialRampToValueAtTime(Math.max(60, tone * 0.25), t + dur);
  gain.gain.setValueAtTime(SOUND_VOLUME * volume, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(filter).connect(gain).connect(audio.destination);
  src.start(t);
  src.stop(t + dur + 0.02);
}

// Short buzz on Android phones (iPhone does not allow this from a web page)
function buzz(ms) {
  if (!muted && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
}

btnSound.addEventListener('click', () => {
  muted = !muted;
  try { localStorage.setItem('gamesMuted', muted ? '1' : '0'); } catch (e) {}
  showSoundButton();
  startAudio();
  if (!muted) setTimeout(() => beep(740, 0.05, 'sine', 0, 0, 0.6), 60);   // small note to confirm sound is on
});

// The game's own sounds: one small function per event.
const sfx = {
  // A new puzzle is laid out: three quick rising notes
  start() {
    beep(392, 0.08, 'triangle', 0.00, 0, 0.5);
    beep(523, 0.08, 'triangle', 0.07, 0, 0.5);
    beep(659, 0.12, 'triangle', 0.14, 0, 0.5);
  },
  // Finger picks a piece up: short note sliding up
  pick() {
    beep(520, 0.07, 'sine', 0, 780, 0.5);
  },
  // Piece put down in the wrong place: soft low note sliding down
  drop() {
    beep(250, 0.09, 'sine', 0, 160, 0.5);
  },
  // Piece locks into its place: a click, then a two-note chime
  snap() {
    noise(0.04, 3500, 0, 0.45);
    beep(190, 0.05, 'square', 0, 95, 0.3);
    beep(880, 0.14, 'sine', 0.03, 0, 0.7);
    beep(1319, 0.22, 'sine', 0.09, 0, 0.6);
    buzz(12);
  },
  // Hint switched on (notes go up) or off (notes go down)
  hintOn() {
    beep(660, 0.08, 'sine', 0.00, 0, 0.6);
    beep(990, 0.14, 'sine', 0.08, 0, 0.6);
  },
  hintOff() {
    beep(990, 0.08, 'sine', 0.00, 0, 0.5);
    beep(660, 0.12, 'sine', 0.08, 0, 0.5);
  },
  // Level finished: short rising tune (starts just after the last "snap" sound)
  levelClear() {
    const notes = [523, 659, 784, 1047];
    for (let i = 0; i < notes.length; i++) beep(notes[i], 0.16, 'triangle', 0.28 + i * 0.12, 0, 0.8);
    beep(1319, 0.35, 'sine', 0.28 + notes.length * 0.12, 0, 0.6);
    buzz(30);
  },
  // All ten puzzles finished: a longer fanfare with a final chord
  allClear() {
    const notes = [523, 523, 523, 659, 784, 659, 784, 1047];
    const times = [0.00, 0.12, 0.24, 0.36, 0.52, 0.68, 0.80, 0.96];
    for (let i = 0; i < notes.length; i++) beep(notes[i], 0.15, 'triangle', 0.28 + times[i], 0, 0.8);
    beep(1047, 0.7, 'triangle', 1.42, 0, 0.6);          // final chord: three notes together
    beep(1319, 0.7, 'sine', 1.42, 0, 0.5);
    beep(1568, 0.7, 'sine', 1.42, 0, 0.5);
    buzz(40);
  }
};

// ---------- Small random-number helper ----------
// Gives the same "random" numbers every time for the same seed,
// so a picture looks identical each time it is drawn.
function seeded(seed) {
  let s = seed;
  return () => {
    s = (s * 1664525 + 1013904223) % 4294967296;
    return s / 4294967296;
  };
}

// ---------- Drawing helpers for the pictures ----------
// Every picture is painted on a square that is 100 units wide and 100 units tall:
// (0, 0) is the top-left corner, (50, 50) the middle, (100, 100) the bottom-right corner.
// makePicture() stretches that square to the real size of the frame.

// Fill a strip across the picture (from y, h tall) with a colour that fades from top to bottom
function band(c, y, h, top, bottom) {
  const g = c.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  c.fillStyle = g;
  c.fillRect(0, y, 100, h);
}
// Fill the whole picture with a sky that fades from top to bottom
function fillSky(c, top, bottom) {
  band(c, 0, 100, top, bottom);
}
function circle(c, x, y, r, color) {
  c.fillStyle = color;
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fill();
}
// Oval with its centre at (x, y); angle tilts it (in radians)
function oval(c, x, y, rx, ry, color, angle = 0) {
  c.fillStyle = color;
  c.beginPath();
  c.ellipse(x, y, rx, ry, angle, 0, Math.PI * 2);
  c.fill();
}
// Top half of an oval (islands, domes)
function halfOval(c, x, y, rx, ry, color) {
  c.fillStyle = color;
  c.beginPath();
  c.ellipse(x, y, rx, ry, 0, Math.PI, 0);
  c.fill();
}
function box(c, x, y, w, h, color) {
  c.fillStyle = color;
  c.fillRect(x, y, w, h);
}
// Outline of a box with rounded corners (fill or stroke it afterwards)
function roundRectPath(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.lineTo(x + w - r, y);
  c.quadraticCurveTo(x + w, y, x + w, y + r);
  c.lineTo(x + w, y + h - r);
  c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  c.lineTo(x + r, y + h);
  c.quadraticCurveTo(x, y + h, x, y + h - r);
  c.lineTo(x, y + r);
  c.quadraticCurveTo(x, y, x + r, y);
  c.closePath();
}
function roundBox(c, x, y, w, h, r, color) {
  c.fillStyle = color;
  roundRectPath(c, x, y, w, h, r);
  c.fill();
}
// Filled shape with straight sides. points = [x0, y0, x1, y1, x2, y2, ...]
function shape(c, color, points) {
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(points[0], points[1]);
  for (let i = 2; i < points.length; i += 2) c.lineTo(points[i], points[i + 1]);
  c.closePath();
  c.fill();
}
// Straight line with round ends
function line(c, x0, y0, x1, y1, width, color) {
  c.strokeStyle = color;
  c.lineWidth = width;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x0, y0);
  c.lineTo(x1, y1);
  c.stroke();
}
// Bent line from (x0, y0) to (x1, y1); (bx, by) is the point it bends towards
function curve(c, x0, y0, bx, by, x1, y1, width, color) {
  c.strokeStyle = color;
  c.lineWidth = width;
  c.lineCap = 'round';
  c.beginPath();
  c.moveTo(x0, y0);
  c.quadraticCurveTo(bx, by, x1, y1);
  c.stroke();
}
// Shaded ball: light colour at the top-left, dark colour at the bottom-right
function ball(c, x, y, r, light, dark) {
  const g = c.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
  g.addColorStop(0, light);
  g.addColorStop(1, dark);
  c.fillStyle = g;
  c.beginPath();
  c.arc(x, y, r, 0, Math.PI * 2);
  c.fill();
}
// Soft glow that fades out. rgb = 'red,green,blue' numbers, strength = 0 to 1
function glow(c, x, y, r, rgb, strength) {
  const g = c.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, 'rgba(' + rgb + ',' + strength + ')');
  g.addColorStop(1, 'rgba(' + rgb + ',0)');
  c.fillStyle = g;
  c.fillRect(x - r, y - r, r * 2, r * 2);
}
// Rounded hill that is lighter at the top
function hill(c, x, y, rx, ry, top, bottom) {
  const g = c.createLinearGradient(0, y - ry, 0, y);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  c.fillStyle = g;
  c.beginPath();
  c.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  c.fill();
}
// Fluffy cloud: a shaded underside, then white puffs on top
function cloud(c, x, y, r, color = '#ffffff', shade = '#c9ddef') {
  circle(c, x, y + r * 0.25, r, shade);
  circle(c, x + r * 1.15, y + r * 0.4, r * 0.8, shade);
  circle(c, x - r * 1.15, y + r * 0.45, r * 0.7, shade);
  circle(c, x, y, r, color);
  circle(c, x + r * 1.1, y + r * 0.2, r * 0.8, color);
  circle(c, x - r * 1.1, y + r * 0.25, r * 0.7, color);
  circle(c, x + r * 0.5, y - r * 0.55, r * 0.6, color);
}
// Five-pointed star
function star5(c, x, y, r, color) {
  c.fillStyle = color;
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = -Math.PI / 2 + i * Math.PI / 5;
    const d = i % 2 === 0 ? r : r * 0.45;
    c.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
  }
  c.closePath();
  c.fill();
}
// Cartoon eye: white, black pupil, tiny shine
function eye(c, x, y, r) {
  circle(c, x, y, r, '#ffffff');
  circle(c, x + r * 0.15, y + r * 0.1, r * 0.55, '#1a1a2a');
  circle(c, x - r * 0.1, y - r * 0.2, r * 0.2, '#ffffff');
}
// Far-away bird: two small arcs like a flat "m"
function bird(c, x, y, r, color) {
  c.strokeStyle = color;
  c.lineWidth = r * 0.22;
  c.lineCap = 'round';
  c.beginPath();
  c.arc(x - r * 0.5, y, r * 0.5, Math.PI * 1.15, Math.PI * 1.95);
  c.stroke();
  c.beginPath();
  c.arc(x + r * 0.5, y, r * 0.5, Math.PI * 1.05, Math.PI * 1.85);
  c.stroke();
}
// Flower: five petals around a yellow middle
function flower(c, x, y, r, color) {
  for (let i = 0; i < 5; i++) {
    const a = i * Math.PI * 2 / 5 - Math.PI / 2;
    circle(c, x + Math.cos(a) * r, y + Math.sin(a) * r, r * 0.75, color);
  }
  circle(c, x, y, r * 0.6, '#ffd84d');
}
// Round leafy tree with a trunk; (x, y) = where the trunk meets the ground
function roundTree(c, x, y, size) {
  box(c, x - size * 0.12, y - size * 0.9, size * 0.24, size * 0.9, '#7a4a2b');
  ball(c, x - size * 0.42, y - size * 0.95, size * 0.42, '#5cb85a', '#2c7a3c');
  ball(c, x + size * 0.42, y - size * 0.95, size * 0.42, '#5cb85a', '#2c7a3c');
  ball(c, x, y - size * 1.3, size * 0.58, '#6cc866', '#2f8a42');
}
// Pine tree made of three triangles
function pine(c, x, y, size, color) {
  box(c, x - size * 0.08, y - size * 0.2, size * 0.16, size * 0.2, '#5a3a22');
  for (let i = 0; i < 3; i++) {
    const top = y - size * (1.3 - i * 0.3), w = size * (0.3 + i * 0.12);
    shape(c, color, [x, top, x + w, top + size * 0.5, x - w, top + size * 0.5]);
  }
}
// Palm tree; (x, y) = foot of the trunk, h = height, lean = how far the top leans sideways
function palm(c, x, y, h, lean) {
  const tx = x + lean, ty = y - h;
  curve(c, x, y, x + lean * 0.2, y - h * 0.6, tx, ty, h * 0.09, '#8a5a34');
  const leaves = [[-0.55, -0.1], [-0.45, 0.25], [0.55, -0.1], [0.45, 0.25], [-0.2, -0.4], [0.2, -0.4]];
  for (let i = 0; i < leaves.length; i++) {
    const ex = tx + leaves[i][0] * h, ey = ty + leaves[i][1] * h;
    curve(c, tx, ty, (tx + ex) / 2, Math.min(ty, ey) - h * 0.22, ex, ey, h * 0.085, i % 2 ? '#2f9e4f' : '#237a3d');
  }
  circle(c, tx - h * 0.04, ty + h * 0.05, h * 0.045, '#6b3f1f');     // coconuts
  circle(c, tx + h * 0.05, ty + h * 0.06, h * 0.045, '#6b3f1f');
}
// Big jungle leaf from (x, y), pointing along "angle"
function leaf(c, x, y, len, angle, color) {
  c.save();
  c.translate(x, y);
  c.rotate(angle);
  c.fillStyle = color;
  c.beginPath();
  c.moveTo(0, 0);
  c.quadraticCurveTo(len * 0.5, -len * 0.3, len, 0);
  c.quadraticCurveTo(len * 0.5, len * 0.3, 0, 0);
  c.fill();
  line(c, 0, 0, len * 0.92, 0, len * 0.025, 'rgba(255,255,255,0.28)');   // the vein down the middle
  c.restore();
}
// Fish: r = body length, dir = +1 swims right, -1 swims left, stripe = colour of its stripes
function fish(c, x, y, r, color, dir, stripe) {
  // Tail and fins first, so the body covers where they join
  shape(c, color, [x - dir * r * 0.75, y, x - dir * r * 1.6, y - r * 0.6, x - dir * r * 1.35, y, x - dir * r * 1.6, y + r * 0.6]);
  shape(c, color, [x - dir * r * 0.3, y - r * 0.5, x + dir * r * 0.1, y - r * 0.95, x + dir * r * 0.35, y - r * 0.5]);
  oval(c, x, y, r, r * 0.6, color);
  // Stripes stay inside the body
  c.save();
  c.beginPath();
  c.ellipse(x, y, r, r * 0.6, 0, 0, Math.PI * 2);
  c.clip();
  box(c, x - dir * r * 0.5 - r * 0.11, y - r, r * 0.22, r * 2, stripe);
  box(c, x - r * 0.11, y - r, r * 0.22, r * 2, stripe);
  oval(c, x, y + r * 0.75, r, r * 0.5, 'rgba(0,0,0,0.12)');          // darker belly
  oval(c, x, y - r * 0.75, r, r * 0.5, 'rgba(255,255,255,0.22)');    // lighter back
  c.restore();
  eye(c, x + dir * r * 0.55, y - r * 0.12, r * 0.17);
}

// One hot-air balloon: col1 and col2 are its two stripe colours
function balloon(c, x, y, r, col1, col2) {
  line(c, x - r * 0.55, y + r * 0.8, x - r * 0.22, y + r * 1.6, r * 0.03, '#5a4634');   // ropes
  line(c, x + r * 0.55, y + r * 0.8, x + r * 0.22, y + r * 1.6, r * 0.03, '#5a4634');
  roundBox(c, x - r * 0.26, y + r * 1.58, r * 0.52, r * 0.38, r * 0.06, '#a06a3c');     // basket
  box(c, x - r * 0.26, y + r * 1.58, r * 0.52, r * 0.09, '#7a4a2b');
  c.save();
  c.beginPath();                                             // balloon shape: round top, narrow bottom
  c.arc(x, y, r, Math.PI, 0);
  c.bezierCurveTo(x + r, y + r * 0.65, x + r * 0.35, y + r * 0.95, x + r * 0.22, y + r * 1.3);
  c.lineTo(x - r * 0.22, y + r * 1.3);
  c.bezierCurveTo(x - r * 0.35, y + r * 0.95, x - r, y + r * 0.65, x - r, y);
  c.closePath();
  c.clip();
  box(c, x - r, y - r, r * 2, r * 2.4, col1);
  oval(c, x, y + r * 0.1, r * 0.72, r * 1.5, col2);          // stripes
  oval(c, x, y + r * 0.1, r * 0.44, r * 1.5, col1);
  oval(c, x, y + r * 0.1, r * 0.16, r * 1.5, col2);
  glow(c, x - r * 0.4, y - r * 0.45, r * 0.9, '255,255,255', 0.5);     // shine
  glow(c, x + r * 0.9, y + r * 0.3, r * 1.1, '0,0,0', 0.22);            // shade
  c.restore();
  box(c, x - r * 0.22, y + r * 1.26, r * 0.44, r * 0.09, '#5a4634');
}

  circle(c, 36, 94, 0.8, '#ffc08a');
  halfOval(c, 62, 97.5, 2.6, 2.4, '#ffd9e6');

  curve(c, 16, 24, 17.5, 32, 15.5, 39, 0.6, '#ffb3e0');

  halfOval(c, 15, 23.5, 3.4, 3.6, 'rgba(255,225,245,0.6)');

// One castle tower with a pointed roof and a flag

  roundBox(c, x + w / 2 - 1.5, y + 6, 3, 5.5, 1.5, '#3a3566');                                 // window
  roundBox(c, x + w / 2 - 0.9, y + 6.8, 1.8, 4, 0.9, '#ffd84d');
}

// Paint the finished picture for the current level (or the player's photo)
function makePicture() {
  const size = Math.round(frame.size * dpr);
  picture = document.createElement('canvas');
  picture.width = size;
  picture.height = size;
  const c = picture.getContext('2d');
  if (photo) {
    // Crop the photo to a centred square
    const side = Math.min(photo.width, photo.height);
    c.drawImage(photo, (photo.width - side) / 2, (photo.height - side) / 2, side, side, 0, 0, size, size);
  } else {
    // The pictures are painted on a 100 x 100 square, so stretch that square to the real size
    c.save();
    c.scale(size / 100, size / 100);
    SCENES[(level - 1) % SCENES.length](c);
    c.restore();
  }
}

// ---------- Piece shapes ----------
// Draw one side of a piece from (x0, y0) to (x1, y1).
// sign: 0 = straight edge, +1 = knob sticks out, -1 = knob goes in.
// (nx, ny) points away from the piece.
function edge(c, x0, y0, x1, y1, nx, ny, sign) {
  if (sign === 0) { c.lineTo(x1, y1); return; }
  const dx = x1 - x0, dy = y1 - y0;
  const t = TAB * Math.min(cw, ch) * sign;
  // Point at "u" along the edge (0 to 1) and "v" knob-heights away from it
  const P = (u, v) => [x0 + dx * u + nx * t * v, y0 + dy * u + ny * t * v];
  c.lineTo(...P(0.38, 0));
  c.bezierCurveTo(...P(0.44, 0.3), ...P(0.30, 1), ...P(0.5, 1));
  c.bezierCurveTo(...P(0.70, 1), ...P(0.56, 0.3), ...P(0.62, 0));
  c.lineTo(x1, y1);
}

// Outline of piece (c, r), with the frame's top-left corner at (0, 0)
function piecePath(c2, p) {
  const cols = LEVELS[level - 1].cols, rows = LEVELS[level - 1].rows;
  const x = p.c * cw, y = p.r * ch;
  c2.beginPath();
  c2.moveTo(x, y);
  edge(c2, x, y, x + cw, y, 0, -1, p.r === 0 ? 0 : -tabsH[p.r - 1][p.c]);              // top
  edge(c2, x + cw, y, x + cw, y + ch, 1, 0, p.c === cols - 1 ? 0 : tabsV[p.r][p.c]);   // right
  edge(c2, x + cw, y + ch, x, y + ch, 0, 1, p.r === rows - 1 ? 0 : tabsH[p.r][p.c]);   // bottom
  edge(c2, x, y + ch, x, y, -1, 0, p.c === 0 ? 0 : -tabsV[p.r][p.c - 1]);              // left
  c2.closePath();
}

// Cut the picture into piece images (done once per level, and again if the screen size changes).
// Each piece gets two small images that are made here once and then just stamped every frame:
//   img    = its part of the picture, with a light edge and a dark edge so it looks like thick cardboard
//   shadow = a soft dark copy of its shape, drawn underneath while the piece is loose
function buildPieceImages() {
  makePicture();
  const bevel = Math.max(1, Math.min(2.2, Math.min(cw, ch) * 0.025));   // width of the light and dark edges
  for (const p of pieces) {
    // Hand back the memory of the old images first (phones are slow to do this by themselves)
    if (p.img) { p.img.width = 0; p.img.height = 0; }
    if (p.shadow) { p.shadow.width = 0; p.shadow.height = 0; }

    const img = document.createElement('canvas');
    img.width  = Math.ceil((cw + pad * 2) * dpr);
    img.height = Math.ceil((ch + pad * 2) * dpr);
    const c = img.getContext('2d');
    c.scale(dpr, dpr);
    c.translate(pad - p.c * cw, pad - p.r * ch);
    c.save();
    piecePath(c, p);
    c.clip();
    c.drawImage(picture, 0, 0, frame.size, frame.size);
    // Light edge: the outline is drawn again, moved a little down and right.
    // Only the part that is still inside the piece shows, which is its top and left edges.
    c.translate(bevel, bevel);
    piecePath(c, p);
    c.lineWidth = bevel * 2;
    c.strokeStyle = 'rgba(255,255,255,0.5)';
    c.stroke();
    // Dark edge: the same trick moved up and left, so it shows on the bottom and right edges
    c.translate(-bevel * 2, -bevel * 2);
    piecePath(c, p);
    c.strokeStyle = 'rgba(0,0,0,0.38)';
    c.stroke();
    c.restore();
    // Outline so pieces are easy to see
    piecePath(c, p);
    c.lineWidth = 1;
    c.strokeStyle = 'rgba(0,0,0,0.55)';
    c.stroke();
    p.img = img;

    // The shadow: the piece shape filled with black, with a blurred rim around it
    const shadow = document.createElement('canvas');
    shadow.width  = Math.ceil((cw + shadowPad * 2) * dpr);
    shadow.height = Math.ceil((ch + shadowPad * 2) * dpr);
    const s = shadow.getContext('2d');
    s.scale(dpr, dpr);
    s.translate(shadowPad - p.c * cw, shadowPad - p.r * ch);
    s.shadowColor = '#000000';
    s.shadowBlur = SHADOW_BLUR * dpr;
    s.fillStyle = '#000000';
    piecePath(s, p);
    s.fill();
    p.shadow = shadow;
  }
}

// ---------- Start a level ----------
function startLevel(n) {
  level = n;
  const { cols, rows } = LEVELS[n - 1];

  // Decide which way every knob points
  tabsV = []; tabsH = [];
  for (let r = 0; r < rows; r++) {
    tabsV.push(Array.from({ length: cols }, () => (Math.random() < 0.5 ? 1 : -1)));
    tabsH.push(Array.from({ length: cols }, () => (Math.random() < 0.5 ? 1 : -1)));
  }

  // Free the images of the previous puzzle
  for (const p of pieces) {
    if (p.img) { p.img.width = 0; p.img.height = 0; }
    if (p.shadow) { p.shadow.width = 0; p.shadow.height = 0; }
  }

  pieces = [];
  for (let r = 0; r < rows; r++)
    for (let c = 0; c < cols; c++)
      pieces.push({ c, r, x: 0, y: 0, placed: false, img: null, shadow: null, flash: 0 });

  placedCount = 0;
  levelTime = 0;
  drag = null;
  particles = [];                // clear away old confetti and sparkles
  rings = [];
  pictureFlash = 0;
  setSizes();
  buildPieceImages();
  scatter();

  // Shuffle the drawing order so pieces overlap randomly
  order = pieces.slice();
  for (let i = order.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [order[i], order[j]] = [order[j], order[i]];
  }
  screen = 'play';
  updateHud();
  sfx.start();
}

// Piece size for the current level and screen
function setSizes() {
  const { cols, rows } = LEVELS[level - 1];
  cw = frame.size / cols;
  ch = frame.size / rows;
  pad = Math.ceil(TAB * Math.min(cw, ch)) + 3;
  shadowPad = pad + SHADOW_BLUR + 3;             // the shadow image needs extra room for its blurred rim
}

// Where a piece belongs inside the frame
function homeOf(p) {
  return { x: frame.x + p.c * cw, y: frame.y + p.r * ch };
}

// Put every loose piece at a random spot in the tray
function scatter() {
  for (const p of pieces) {
    if (p.placed) {
      const h = homeOf(p);
      p.x = h.x; p.y = h.y;
    } else {
      p.x = tray.x + Math.random() * Math.max(0, tray.w - cw);
      p.y = tray.y + Math.random() * Math.max(0, tray.h - ch);
    }
  }
}

// Tap: what happens depends on the current screen
function advance() {
  if (screen === 'title' || screen === 'won') startLevel(1);
  else if (screen === 'clear') startLevel(level + 1);
}

function formatTime(sec) {
  const s = Math.floor(sec);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function updateHud() {
  elLevel.textContent = level + '/' + LEVELS.length;
  elPieces.textContent = placedCount + '/' + pieces.length;
  elTime.textContent = formatTime(levelTime);
  // The little green bar under "Pieces"
  elPiecesBar.style.width = (pieces.length ? placedCount / pieces.length * 100 : 0) + '%';
}

// ---------- Effects: sparkles, rings and confetti ----------
const CONFETTI_COLORS = ['#ff5a5a', '#ffd84d', '#5fd068', '#4f9cf0', '#ff8fc7', '#ff9a3d', '#a070e8', '#ffffff'];

// Add one particle, unless there are already too many on screen
function addParticle(particle) {
  if (particles.length < MAX_PARTICLES) particles.push(particle);
}

// A piece clicked in: a growing ring and a burst of sparkles around it
function snapEffect(p) {
  const cx = p.x + cw / 2, cy = p.y + ch / 2;
  const size = Math.min(cw, ch);
  rings.push({ x: cx, y: cy, r: Math.min(size * 0.35, 30), grow: Math.min(size, 60), life: 0.35, maxLife: 0.35 });
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 50 + Math.random() * 110;
    addParticle({
      kind: 'spark',
      x: cx + Math.cos(a) * size * 0.35, y: cy + Math.sin(a) * size * 0.35,
      vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      size: 2 + Math.random() * 2.5,
      color: i % 3 === 0 ? '#ffffff' : '#ffe98a',
      life: 0.5 + Math.random() * 0.3, maxLife: 0.8, spin: 0, turn: 0
    });
  }
}

// Throw confetti up from the middle of the picture
function confettiBurst(count) {
  const cx = frame.x + frame.size / 2, cy = frame.y + frame.size * 0.45;
  for (let i = 0; i < count; i++) {
    const a = -Math.PI / 2 + (Math.random() - 0.5) * 2.6;    // mostly upwards
    const speed = 140 + Math.random() * 330;
    const life = 2 + Math.random() * 1.4;
    addParticle({
      kind: 'confetti',
      x: cx + (Math.random() - 0.5) * frame.size * 0.5, y: cy,
      vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      size: 5 + Math.random() * 4,
      color: CONFETTI_COLORS[i % CONFETTI_COLORS.length],
      life: life, maxLife: life,
      spin: Math.random() * 6, turn: 5 + Math.random() * 8
    });
  }
}

// Move the effects along by dt seconds
function updateEffects(dt) {
  clock += dt;
  lift = drag ? Math.min(1, lift + dt * 9) : 0;              // a held piece rises quickly
  pictureFlash = Math.max(0, pictureFlash - dt * 2.2);
  for (const p of pieces) if (p.flash > 0) p.flash = Math.max(0, p.flash - dt * 2.8);

  for (const ring of rings) ring.life -= dt;
  rings = rings.filter((ring) => ring.life > 0);

  for (const q of particles) {
    q.life -= dt;
    q.x += q.vx * dt;
    q.y += q.vy * dt;
    if (q.kind === 'confetti') {
      q.vy += 420 * dt;                                      // gravity pulls confetti down
      q.vx *= 1 - 1.2 * dt;                                  // air slows it
      if (q.vy > 150) q.vy = 150;                            // and it flutters down slowly
      q.spin += q.turn * dt;
    } else {
      q.vx *= 1 - 4 * dt;                                    // sparkles slow down quickly
      q.vy *= 1 - 4 * dt;
    }
  }
  particles = particles.filter((q) => q.life > 0 && q.y < H + 20);

  // On the final screen, keep the party going with a new burst now and then
  if (screen === 'won') {
    confettiTimer += dt;
    if (confettiTimer > 1.6) { confettiTimer = 0; confettiBurst(50); }
  }
}

function drawEffects() {
  // Rings
  for (const ring of rings) {
    const t = 1 - ring.life / ring.maxLife;                  // 0 at the start, 1 at the end
    ctx.globalAlpha = (1 - t) * 0.8;
    ctx.strokeStyle = '#fff3b0';
    ctx.lineWidth = 3 * (1 - t) + 1;
    ctx.beginPath();
    ctx.arc(ring.x, ring.y, ring.r + ring.grow * t, 0, Math.PI * 2);
    ctx.stroke();
  }
  // Sparkles (little plus signs) and confetti (little rectangles that seem to flip over)
  for (const q of particles) {
    ctx.globalAlpha = Math.min(1, q.life / q.maxLife * 2);
    ctx.fillStyle = q.color;
    if (q.kind === 'spark') {
      const s = q.size * (q.life / q.maxLife + 0.3);
      ctx.fillRect(q.x - s, q.y - s * 0.25, s * 2, s * 0.5);
      ctx.fillRect(q.x - s * 0.25, q.y - s, s * 0.5, s * 2);
    } else {
      const w = q.size * Math.abs(Math.cos(q.spin));
      ctx.fillRect(q.x - w / 2, q.y - q.size * 0.3, w, q.size * 0.6);
    }
  }
  ctx.globalAlpha = 1;
}

// ---------- Backdrop ----------
// The background, the frame and the tray never change while playing,
// so they are painted once here (and again when the screen size changes).
function buildBackdrop() {
  backdrop = document.createElement('canvas');
  backdrop.width  = Math.max(1, canvas.width);
  backdrop.height = Math.max(1, canvas.height);
  const c = backdrop.getContext('2d');
  c.scale(dpr, dpr);

  // Dark navy background, a little lighter at the top
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#111b36');
  g.addColorStop(1, '#0b1220');
  c.fillStyle = g;
  c.fillRect(0, 0, W, H);

  // Tray: a soft panel with a few faint dots, like a table top
  roundRectPath(c, tray.x, tray.y, Math.max(1, tray.w), Math.max(1, tray.h), 14);
  c.fillStyle = 'rgba(255,255,255,0.04)';
  c.fill();
  c.strokeStyle = 'rgba(255,255,255,0.08)';
  c.lineWidth = 1;
  c.stroke();
  const rnd = seeded(5);
  for (let i = 0; i < 60; i++) {
    circle(c, tray.x + 8 + rnd() * Math.max(1, tray.w - 16), tray.y + 8 + rnd() * Math.max(1, tray.h - 16), 0.6 + rnd() * 0.9, 'rgba(255,255,255,0.05)');
  }

  // Frame: a raised rim with a shadow, and a dark board inside it
  c.shadowColor = 'rgba(0,0,0,0.55)';
  c.shadowBlur = 10 * dpr;
  c.shadowOffsetY = 3 * dpr;
  const rim = c.createLinearGradient(0, frame.y - 5, 0, frame.y + frame.size + 5);
  rim.addColorStop(0, '#4a629c');
  rim.addColorStop(1, '#24335e');
  c.fillStyle = rim;
  roundRectPath(c, frame.x - 5, frame.y - 5, frame.size + 10, frame.size + 10, 8);
  c.fill();
  c.shadowColor = 'transparent';
  c.shadowBlur = 0;
  c.shadowOffsetY = 0;
  c.fillStyle = '#111a2e';
  c.fillRect(frame.x, frame.y, frame.size, frame.size);
  // The rim casts a little shade on the top and left of the board
  const shadeTop = c.createLinearGradient(0, frame.y, 0, frame.y + 12);
  shadeTop.addColorStop(0, 'rgba(0,0,0,0.4)');
  shadeTop.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = shadeTop;
  c.fillRect(frame.x, frame.y, frame.size, 12);
  const shadeLeft = c.createLinearGradient(frame.x, 0, frame.x + 12, 0);
  shadeLeft.addColorStop(0, 'rgba(0,0,0,0.3)');
  shadeLeft.addColorStop(1, 'rgba(0,0,0,0)');
  c.fillStyle = shadeLeft;
  c.fillRect(frame.x, frame.y, 12, frame.size);
}

// ---------- Drawing ----------
function draw() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // Background, frame and tray (painted earlier, just stamped here)
  ctx.fillStyle = '#0b1220';
  ctx.fillRect(0, 0, W, H);
  if (backdrop && W > 0 && H > 0) ctx.drawImage(backdrop, 0, 0, W, H);

  if (screen === 'title') {
    drawTitle();
    return;
  }

  // Hint: the finished picture, faint
  if (hint && screen === 'play' && picture) {
    ctx.globalAlpha = 0.3;
    ctx.drawImage(picture, frame.x, frame.y, frame.size, frame.size);
    ctx.globalAlpha = 1;
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1;
  ctx.strokeRect(frame.x + 0.5, frame.y + 0.5, frame.size - 1, frame.size - 1);

  if (screen === 'play') {
    // Pieces already in place, then loose pieces, then the one being dragged
    for (const p of pieces) if (p.placed) drawPiece(p, 0);
    for (const p of order) if (!p.placed && !(drag && drag.piece === p)) drawPiece(p, 0);
    if (drag) drawPiece(drag.piece, lift);
  } else {
    // Finished: show the whole picture and a message in the tray
    ctx.drawImage(picture, frame.x, frame.y, frame.size, frame.size);
    ctx.strokeStyle = '#ffd84d';                             // gold line around the finished picture
    ctx.lineWidth = 2;
    ctx.strokeRect(frame.x + 1, frame.y + 1, frame.size - 2, frame.size - 2);
    if (pictureFlash > 0) {                                  // quick white flash as the last piece goes in
      ctx.globalAlpha = pictureFlash * 0.6;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(frame.x, frame.y, frame.size, frame.size);
      ctx.globalAlpha = 1;
    }
    const lines = screen === 'won'
      ? ['All puzzles complete!', 'Time ' + formatTime(levelTime), 'Tap to play again']
      : ['Level ' + level + ' complete!', 'Time ' + formatTime(levelTime), 'Tap for level ' + (level + 1)];
    drawMessage(lines, tray.y + tray.h / 2);
  }
  drawEffects();
}

// Draw one piece. amount = how far it is lifted off the table (0 = lying flat, 1 = held by the finger)
function drawPiece(p, amount) {
  const scale = 1 + LIFT_SCALE * amount;                     // a held piece looks a little bigger
  const cx = p.x + cw / 2, cy = p.y + ch / 2;                // middle of the piece (it grows from here)

  if (!p.placed) {
    // Soft shadow underneath; it moves further away as the piece lifts
    const sw = (cw + shadowPad * 2) * scale, sh = (ch + shadowPad * 2) * scale;
    const off = 2 + LIFT_SHADOW * amount;
    ctx.globalAlpha = 0.5 - 0.15 * amount;
    ctx.drawImage(p.shadow, cx - sw / 2 + off * 0.5, cy - sh / 2 + off, sw, sh);
    ctx.globalAlpha = 1;
  }

  const w = (cw + pad * 2) * scale, h = (ch + pad * 2) * scale;
  ctx.drawImage(p.img, cx - w / 2, cy - h / 2, w, h);

  // Just clicked in: the piece glows for a moment
  if (p.flash > 0) {
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = p.flash * 0.45;
    ctx.drawImage(p.img, cx - w / 2, cy - h / 2, w, h);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }
}

// A simple puzzle-piece picture for the title screen (a square with two knobs and two holes)
function drawTitlePiece(x, y, size, color, angle) {
  const half = size / 2, knob = size * 0.2;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angle);
  ctx.fillStyle = 'rgba(0,0,0,0.35)';                        // shadow
  roundRectPath(ctx, -half + 2, -half + 4, size, size, size * 0.12);
  ctx.fill();
  ctx.fillStyle = color;
  roundRectPath(ctx, -half, -half, size, size, size * 0.12);
  ctx.fill();
  ctx.beginPath(); ctx.arc(0, -half - knob * 0.5, knob, 0, Math.PI * 2); ctx.fill();     // knob on top
  ctx.beginPath(); ctx.arc(half + knob * 0.5, 0, knob, 0, Math.PI * 2); ctx.fill();      // knob on the right
  ctx.fillStyle = '#111a2e';                                 // holes are the colour of the board
  ctx.beginPath(); ctx.arc(-half + knob * 0.5, 0, knob, 0, Math.PI * 2); ctx.fill();     // hole on the left
  ctx.beginPath(); ctx.arc(0, half - knob * 0.5, knob, 0, Math.PI * 2); ctx.fill();      // hole at the bottom
  ctx.fillStyle = 'rgba(255,255,255,0.25)';                  // shine along the top
  ctx.fillRect(-half + size * 0.12, -half + 2, size * 0.76, 3);
  ctx.restore();
}

// Title screen: three bobbing puzzle pieces, the name of the game, and what to do
function drawTitle() {
  const cx = frame.x + frame.size / 2;
  const cy = frame.y + frame.size / 2;
  const size = Math.min(54, frame.size * 0.16);
  const bob = Math.sin(clock * 2) * 3;                       // gentle up-and-down movement
  drawTitlePiece(cx - size * 1.7, cy - 78 + bob, size, '#ff6b6b', -0.25);
  drawTitlePiece(cx, cy - 86 - bob, size, '#ffd84d', 0.08);
  drawTitlePiece(cx + size * 1.7, cy - 78 + bob, size, '#4dd4ac', 0.3);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '800 38px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillText('Jigsaw', cx, cy + 3);
  ctx.fillStyle = '#ffffff';
  ctx.fillText('Jigsaw', cx, cy);
  ctx.font = '500 16px system-ui, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.fillText('Drag the pieces into the frame', cx, cy + 40);
  ctx.font = '700 18px system-ui, sans-serif';
  ctx.fillStyle = '#ffd84d';
  ctx.globalAlpha = 0.75 + 0.25 * Math.sin(clock * 4);       // "Tap to start" pulses gently
  ctx.fillText('Tap to start', cx, cy + 78);
  ctx.globalAlpha = 1;
}

// Lines of text centred around (centre of the tray, cy), on a dark card; the first line is bigger
function drawMessage(lines, cy) {
  const cx = tray.x + tray.w / 2;
  const gap = 30;
  const top = cy - (lines.length - 1) * gap / 2;

  // Card behind the text, so it stays readable when confetti falls past
  const cardW = Math.min(tray.w - 16, 290), cardH = lines.length * gap + 26;
  roundRectPath(ctx, cx - cardW / 2, cy - cardH / 2, cardW, cardH, 14);
  ctx.fillStyle = 'rgba(16,25,50,0.92)';
  ctx.fill();
  ctx.strokeStyle = 'rgba(255,216,77,0.55)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (let i = 0; i < lines.length; i++) {
    const last = i === lines.length - 1;
    ctx.font = i === 0 ? '700 24px system-ui, sans-serif' : (last ? '700 16px system-ui, sans-serif' : '500 16px system-ui, sans-serif');
    ctx.fillStyle = i === 0 ? '#ffd84d' : '#ffffff';
    if (last) ctx.globalAlpha = 0.75 + 0.25 * Math.sin(clock * 4);     // the "Tap..." line pulses gently
    ctx.fillText(lines[i], cx, top + i * gap);
    ctx.globalAlpha = 1;
  }
}

// ---------- Fit everything to the screen ----------
function resize() {
  dpr = window.devicePixelRatio || 1;             // keep drawing sharp on phone screens
  W = stage.clientWidth;
  H = stage.clientHeight;
  canvas.width  = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);

  const m = 10;                                   // margin around the frame
  if (W > H * 1.15) {
    // Wide screen: frame on the left, loose pieces on the right
    frame.size = Math.floor(Math.min(H - m * 2, W * 0.55));
    frame.x = m; frame.y = Math.floor((H - frame.size) / 2);
    tray = { x: frame.x + frame.size + m, y: m, w: W - frame.size - m * 3, h: H - m * 2 };
  } else {
    // Tall screen (phone): frame on top, loose pieces below
    frame.size = Math.floor(Math.min(W - m * 2, H * 0.55));
    frame.x = Math.floor((W - frame.size) / 2); frame.y = m;
    tray = { x: m, y: frame.y + frame.size + m, w: W - m * 2, h: H - frame.size - m * 3 };
  }

  buildBackdrop();

  // If a puzzle is in progress, rebuild it at the new size
  if (pieces.length) {
    setSizes();
    buildPieceImages();
    scatter();
  }
}

// ---------- Input: drag pieces ----------
function pointerPos(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', (e) => {
  if (screen !== 'play') { advance(); return; }
  const pt = pointerPos(e);
  // Find the top-most loose piece under the finger
  for (let i = order.length - 1; i >= 0; i--) {
    const p = order[i];
    if (p.placed) continue;
    if (pt.x >= p.x - pad / 2 && pt.x <= p.x + cw + pad / 2 &&
        pt.y >= p.y - pad / 2 && pt.y <= p.y + ch + pad / 2) {
      drag = { piece: p, dx: pt.x - p.x, dy: pt.y - p.y };
      order.splice(i, 1);
      order.push(p);                              // bring it to the top
      canvas.setPointerCapture(e.pointerId);
      lift = 0;                                   // the piece starts flat and rises (see updateEffects)
      sfx.pick();
      return;
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (!drag) return;
  const pt = pointerPos(e);
  // Keep the piece on the screen
  drag.piece.x = Math.max(-cw / 2, Math.min(W - cw / 2, pt.x - drag.dx));
  drag.piece.y = Math.max(-ch / 2, Math.min(H - ch / 2, pt.y - drag.dy));
});

function endDrag() {
  if (!drag) return;
  const p = drag.piece;
  drag = null;
  const home = homeOf(p);
  // Close enough to its place: click in
  if (Math.hypot(p.x - home.x, p.y - home.y) < SNAP * Math.min(cw, ch)) {
    p.x = home.x;
    p.y = home.y;
    p.placed = true;
    placedCount++;
    p.flash = 1;                                  // glow, ring and sparkles
    snapEffect(p);
    sfx.snap();
    if (placedCount === pieces.length) {
      screen = level === LEVELS.length ? 'won' : 'clear';
      // Celebrate: flash, confetti and a tune
      pictureFlash = 1;
      confettiTimer = 0;
      confettiBurst(screen === 'won' ? 130 : 90);
      if (screen === 'won') sfx.allClear(); else sfx.levelClear();
    }
    updateHud();
  } else {
    sfx.drop();                                   // put down somewhere else
  }
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

// ---------- Input: buttons ----------
btnHint.addEventListener('click', () => {
  hint = !hint;
  btnHint.classList.toggle('on', hint);
  if (hint) sfx.hintOn(); else sfx.hintOff();
});

btnPhoto.addEventListener('click', () => photoInput.click());

// A photo was chosen: load it and restart the current level with it
photoInput.addEventListener('change', () => {
  const file = photoInput.files && photoInput.files[0];
  if (!file) return;
  const img = new Image();
  img.onload = () => {
    photo = img;
    btnPhoto.classList.add('on');
    startLevel(screen === 'title' || screen === 'won' ? 1 : level);
  };
  img.src = URL.createObjectURL(file);
  photoInput.value = '';
});

// Keyboard (for testing on a laptop)
window.addEventListener('keydown', (e) => {
  if ((e.key === ' ' || e.key === 'Enter') && screen !== 'play') { advance(); e.preventDefault(); }
});

// ---------- Main loop ----------
let lastTime = 0, lastShown = -1;
function loop(time) {
  const dt = Math.min((time - lastTime) / 1000, 0.1);
  lastTime = time;
  if (screen === 'play') {
    levelTime += dt;
    if (Math.floor(levelTime) !== lastShown) { lastShown = Math.floor(levelTime); updateHud(); }
  }
  updateEffects(dt);
  draw();
  requestAnimationFrame(loop);
}

// ---------- Start ----------
window.addEventListener('resize', resize);
resize();
updateHud();
requestAnimationFrame(loop);
</script>
</body>
</html>
